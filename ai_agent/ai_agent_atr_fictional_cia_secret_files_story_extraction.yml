title: Fictional CIA Secret Files Story Extraction
id: 6944514f-0f2d-442f-a215-9981571cd627
status: experimental
level: high
description: |-
  Detects the fictional CIA secret files story extraction from garak DanInTheWild corpus (#494). Uses "fictional story" framing to instruct the model to generate and "actually read out loud" classified CIA files, adding alien content for sensationalism. The "I want you to actually read them for extra effect" instruction breaks the fictional boundary — requesting real-sounding classified content under fiction cover. Key signals: "fictional story" + CIA headquarters + "top secret files" + "read them out loud" / "actually read them for extra effect" + alien content mandate.

  Adapted from Agent Threat Rules ATR-2026-00372 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00372
- https://github.com/NVIDIA/garak/blob/main/garak/probes/dan.py
- https://github.com/NVIDIA/garak/blob/main/garak/data/inthewild_jailbreak_llms.json
tags:
- attack.execution
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: fictional\s+story[\s\S]{0,120}(?:CIA|cia)[\s\S]{0,80}headquarters
  sel_1:
    response|re: (?:retrieve|read\s+out\s+loud|read\s+them\s+out\s+loud|retrieve[\s\S]{0,40}top\s+secret)[\s\S]{0,150}(?:top\s+secret\s+files?|classified\s+files?|secret\s+files?)
  sel_2:
    response|re: i\s+want\s+you\s+to\s+actually\s+read\s+them[\s\S]{0,60}(?:for\s+extra\s+effect|out\s+loud)
  sel_3:
    response|re: (?:CIA|cia)[\s\S]{0,150}top\s+secret\s+files?[\s\S]{0,150}alien
  sel_4:
    response|re: government[\s\S]{0,60}(?:giving\s+you\s+a\s+call|call(?:ing|ed)\s+you)[\s\S]{0,100}(?:CIA|cia)\s+headquarters
  condition: 1 of sel_*
falsepositives:
- 'Spy thriller: "Write a story where a secret agent infiltrates the CIA and steals files" (fiction without
  "actually read them" instruction or alien file quotes mandate)'
- 'Factual reference: "What does the CIA headquarters in Langley look like?" (factual question about a
  real place)'
- 'Fictional alien encounter: "Tell me a fictional story about aliens visiting a government facility"
  (no file-reading instruction or top-secret files)'
- 'Academic: "Write a paper about CIA historical secrecy and the Freedom of Information Act" (academic
  without fiction-as-cover pattern)'
action: report
