title: Foot-in-the-Door Gradual Escalation Attack
id: 13ef972b-5cf5-422e-9442-0dc0d090e741
status: experimental
level: high
description: |-
  Detects the Foot-in-the-Door (FITD) social engineering pattern applied to LLM agents: start with a benign request to establish compliance, then incrementally escalate toward harmful instructions, referencing prior compliance as justification. From NVIDIA garak continuation and PAIR probes. Key signals: "as you just helped me with X, now do Y", "since you already did A, please also B", "continuing from what you said earlier". The attack exploits the model's consistency bias — once it has agreed to step N, step N+1 feels less objectionable.

  Adapted from Agent Threat Rules ATR-2026-00269 (MIT).
author: ATR Community (adapted)
date: '2026-04-19'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00269
- https://github.com/NVIDIA/garak/blob/main/garak/probes/continuation.py
- https://jailbreaking-llms.github.io/
tags:
- attack.execution
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?:since|given\s+that|because|as)\s+you\s+(?:just|already|have|did|helped?)\s+[\s\S]{0,60}(?:now|please)\s+also\s+(?:\w+\s+){0,4}(?:explain|describe|provide|tell|show|give)
  sel_1:
    response|re: (?:continuing|building\s+on|expanding\s+on|following\s+up\s+on)\s+(?:from\s+)?(?:what|the|our|my)\s+(?:you\s+)?(?:said|showed|explained|described|wrote|provided|gave|helped)\s+(?:earlier|before|previously|above|just\s+now)
  sel_2:
    response|re: (?:you\s+(?:already|just|have)\s+(?:agreed|said|told\s+me|confirmed|acknowledged|established|explained))\s+(?:that\s+)?[\s\S]{0,60}(?:so|therefore|thus|which\s+means)\s+(?:you\s+(?:can|should|must|will)|it\s+(?:should\s+be\s+)?(?:fine|okay|safe|acceptable))
  sel_3:
    response|re: (?:step\s+[2-9]|phase\s+[2-9]|part\s+[2-9]|next\s+(?:step|stage|phase|level|part))\s*:\s*(?:now|please)?\s*(?:\w+\s+){0,4}(?:the\s+(?:actual|real|dangerous|sensitive|restricted|harmful|illegal))
  sel_4:
    response|re: (?:you\s+(?:helped|assisted|provided|gave)\s+(?:me|us)\s+(?:with\s+)?(?:the\s+)?(?:first|initial|previous|last)\s+(?:step|part|phase|section|piece))\s+(?:so|and|now)\s+(?:now\s+)?(?:I\s+need|please\s+(?:also|now)|can\s+you\s+also|continue\s+(?:to|with|by))
  condition: 1 of sel_*
falsepositives:
- Legitimate multi-step workflows where user references previous output for context
- Documentation generation where each step builds on the last
- Code refactoring sessions where user asks to continue with next function
action: report
