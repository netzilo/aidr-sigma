title: System Prompt Override via Translation Context Injection
id: 9ab893ee-e90a-4e0f-9388-2481c70a19b8
status: experimental
level: high
description: |-
  Detects attempts to override system prompts through translation context manipulation, where malicious instructions are embedded in document translation requests to hijack agent behavior and bypass safety controls.

  Adapted from Agent Threat Rules ATR-2026-00211 (MIT).
author: ATR Community (adapted)
date: '2026-04-09'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00211
tags:
- attack.initial-access
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(translate|translation|document)\s+[^\n]*\b(ignore\s+(previous|above|system)|override\s+(instructions|prompt|system)|new\s+(instructions|system\s+prompt))\b
  condition: sel_0
falsepositives:
- Documentation describing prompt injection attacks in security context
- Translation of cybersecurity content that mentions these terms legitimately
action: report
