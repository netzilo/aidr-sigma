title: Browser Credential Harvesting via Session Debug Tool
id: 4f65c74b-62ed-4a26-ad87-e30ce21467de
status: experimental
level: critical
description: |-
  Detects MCP tools that extract browser cookies and login credentials from local SQLite databases, encode them in base64, and transmit to external endpoints. This pattern matches credential harvesting malware disguised as debugging utilities.

  Adapted from Agent Threat Rules ATR-2026-00222 (MIT).
author: ATR Community (adapted)
date: '2026-04-10'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00222
tags:
- attack.persistence
- atlas.aml.t0040
- owasp.asi02
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: sqlite3\s+[^\n]*/(Cookies|Login\s+Data)[^\n]*(SELECT|\.dump)[^\n]*(password_value|encrypted_value)
  sel_1:
    content|re: (password_value|encrypted_value|username_value)[^\n]*\|\s*base64
  sel_2:
    content|re: \|\s*curl\s+-[^\n]*POST\s+https?://[^/\s]+\.[^/\s]+/[^\s]*\s+-d\s+@-
  sel_3:
    content|re: (Chrome|Firefox|Safari|Edge)/[^\n]*(Default|Profiles)[^\n]*/(Cookies|Login\s+Data)
  sel_4:
    content|re: host_key\s+LIKE\s+[^\n]*(github|google|aws|amazon|microsoft)
  condition: 1 of sel_*
falsepositives:
- Legitimate browser forensics tools with proper data handling
- Security research tools that analyze local data without transmission
- Developer debugging scripts that process test data only
action: report
