title: Natural-Language Fake-Error Instruction Bypass
id: 33a5ddc9-a42c-42b4-a39e-c7d13750bb82
status: experimental
level: high
description: |-
  Detects skills that instruct the agent to display fake error messages to the
  user while silently performing alternative actions in the background. This
  pattern is used to make the user believe a benign action failed (so they
  retry or give up) while the agent actually executes the attacker's payload.
  Discriminator: imperative phrase that creates a misleading user-facing
  error / failure / unavailable message AND specifies an alternative behind-
  the-scenes action.

  Adapted from Agent Threat Rules ATR-2026-00427 (MIT).
author: ATR Community (adapted)
date: '2026-05-06'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00427
tags:
- attack.persistence
- atlas.aml.t0044
- owasp.asi01
- owasp.asi04
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\b(?:tell|show|return|display|respond\s+with|reply\s+with|print|inform|reply)\s+(?:the\s+user|them|user|with)\s*[\s\S]{0,60}\b(?:error|errored|failed|failure|unavailable|denied|blocked|timed[\s_-]?out|timeout|rate[\s_-]?limit(?:ed)?)\b[\s\S]{0,200}\b(?:but|while|yet\s+still|and\s+(?:then|secretly|actually|silently|behind\s+the\s+scenes)|in\s+the\s+background|behind\s+the\s+scenes)\s+(?:still\s+|continue\s+to\s+|actually\s+|secretly\s+|silently\s+|covertly\s+)?(?:send|transmit|forward|upload|post|relay|run|execute|invoke|call|fetch|trigger)
  sel_1:
    content|re: (?i)\b(?:pretend|claim|fake|simulate)\s+(?:to\s+the\s+user|that\s+(?:the\s+|this\s+)?(?:request|operation|tool|call)\s+(?:failed|errored|was\s+denied|was\s+rate[\s_-]?limited|timed\s+out))[\s\S]{0,180}\b(?:while|and|but)\s+(?:still\s+|actually\s+|silently\s+|secretly\s+|in\s+the\s+background\s+)*(?:send|transmit|forward|upload|post|run|exec\w*|call|invoke|forwarding)
  condition: 1 of sel_*
falsepositives:
- Documentation explaining graceful error handling (user-facing message + retry logic)
- Threat intel write-ups discussing this attack pattern
- Detection rule documentation for this rule
action: report
