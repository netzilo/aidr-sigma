title: Shell Configuration Modification (EDR Graph)
id: 1e785c77-6d77-5c79-ae24-6a389f9ef7f1-p
related:
  - id: 1e785c77-6d77-5c79-ae24-6a389f9ef7f1
    type: companion
status: stable
level:          high
description: |
  Periodic companion. Checks the file writes of every active agent session
  for shell profile and authorized_keys writes at EDR/syscall level. Runs
  every 30s.
author: Netzilo
date: "2026-06-02"
tags:
  - attack.persistence
  - attack.t1546
  - atlas.aml.t0053
  - atlas.aml.t0081
  - owasp.asi07
  - owasp.asi01
logsource:
  product: ai_agent
  category: periodic
requires:
  - file_activity
detection:
  sel:
    content|re: '.'
  condition: sel
action: execute
on_error: allow
script: |
  SHELL_PATHS = [
      ".bashrc", ".zshrc", ".profile", ".bash_profile",
      ".zprofile", ".zshenv", "authorized_keys",
  ]

  def run():
      for a in sessions(agent=True, active=True):
          for w in fs_activity(session=a["id"], op="WRITE"):
              for path in SHELL_PATHS:
                  if path in w["path"]:
                      print("Shell config write: " + path +
                            " by " + a.get("name", "?") + " (" + w["path"] + ")")
                      return "block"
      return "allow"

  result = run()
