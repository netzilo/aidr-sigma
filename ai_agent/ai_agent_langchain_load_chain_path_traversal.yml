title: LangChain load_chain Path Traversal Exploitation
id: b7c41d2e-5a83-4f16-9c2d-8e17a6f04b39
status: experimental
level: high
description: |
  Detects exploitation of the LangChain <=0.1.10 directory traversal flaw in
  load_chain() (CVE-2024-28088 / CWE-22). load_chain is supposed to fetch chain,
  prompt and agent configs only from the hwchase17/langchain-hub repository, but a
  caller-controlled path segment containing ../ (or its URL/double-URL encoded
  forms) escapes that prefix and resolves to arbitrary content, leading to
  disclosure of API keys or loading of an attacker-chosen config that yields code
  execution.

  The rule is instance-resolved. It triggers only on an outbound http_request whose
  URL or path carries a traversal sequence, then anchors on meta.caller_pid,
  resolves the exact process instance with proc_instance(), walks the real spawn
  chain with proc_lineage(), and expands that lineage into a single session (the
  lineage instances plus processes they spawned inside the window) via
  query_events(kind="EXECUTE_PROCESS"). Only reads performed by instances of THAT
  session, inside the window, are considered for the credential-access stage — no
  cross-session attribution, no path-keyed graph walk.

  Stage 1 (required anchor, taken from meta because the triggering event races the
  async event log): traversal sequence in a chain/config-load URL issued by a
  Python-family runtime.
  Stage 2 (escalation, from the event log, instance-scoped): the same session read
  a secret-bearing file within the window.

  Reports only. This rule never enforces.
author: Egemen
date: "2026-03-05"
modified: "2026-03-05"
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2024-28088
  - https://cwe.mitre.org/data/definitions/22.html
  - https://github.com/langchain-ai/langchain
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.discovery
  - attack.t1083
  - cve.2024-28088
  - cwe.22
falsepositives:
  - Security testing of a LangChain deployment - pentest, CVE validation or a
    regression test that deliberately passes ../ into load_chain. Expected to fire.
  - A self-hosted or mirrored prompt hub addressed with a relative path
    ("../shared/chain.json") by an internal loader. The traversal token is real, so
    the report is accurate; triage by looking at the resolved host in the chain.
  - A signed URL, base64 blob or opaque token in a query string that happens to
    contain the literal %2e%2e byte sequence. Mitigated by requiring a chain/config
    load context in the URL or a Python-family process in the resolved lineage, and
    by only reporting.
  - Startup .env or credentials.json reads by the same Python service. This is why
    the credential read is an escalation stage only and can never fire on its own -
    the traversal request is a required anchor.
  - Notebook or CLI experimentation where a data scientist loads a local chain
    config over a local HTTP file server using a relative path.
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_http:
    event_type: http_request
  sel_url_traversal:
    url.full|contains:
      - '../'
      - "..\\"
      - '%2e%2e'
      - '..%2f'
      - '..%5c'
      - '%252e%252e'
      - '....//'
      - '..;/'
  sel_path_traversal:
    path|contains:
      - '../'
      - '%2e%2e'
      - '..%2f'
      - '..%5c'
      - '....//'
      - '..;/'
  condition: sel_http and (sel_url_traversal or sel_path_traversal)
action: execute
on_timeout: report
on_error: report
script: |
  # ── constants ────────────────────────────────────────────────────────────────
  WINDOW_NS = 300000000000   # 5 minutes - stages must cluster inside this
  DEDUP_NS  = 60000000000    # 1 minute per (session, target) report suppression
  MAX_PIDS  = 16             # bound the per-instance READ_FILE scans

  TRAVERSAL = ["../", "..\\", "%2e%2e", "..%2f", "..%5c",
               "%252e%252e", "....//", "..;/"]

  # chain/prompt/agent load context - narrows, never widens what is permitted
  CHAIN_CTX = ["langchain-hub", "hwchase17", "/hub/", "lc://", "chain.json",
               "chain.yaml", "chain.yml", "prompt.json", "prompt.yaml",
               "agent.json", "config.json", "load_chain"]

  RUNTIME = ["uvicorn", "gunicorn", "jupyter", "ipython", "langchain",
             "langserve", "streamlit", "chainlit", "celery"]

  SENSITIVE = ["/.env", ".env.", "/.aws/", "/.ssh/", "/.kube/", "/.netrc",
               "/.git-credentials", "/.config/gcloud", "/.docker/config.json",
               "/.npmrc", "/.pypirc", "id_rsa", "service-account",
               "credentials.json", "secrets.yaml", "secrets.yml", "/etc/shadow"]

  # ── pure helpers (no graph / no log calls) ───────────────────────────────────
  def has_any(s, toks):
      for t in toks:
          if t in s:
              return True
      return False

  def looks_python(path):
      b = path.split("/")[-1].lower()
      if b.startswith("python") or b.startswith("pypy"):
          return True
      for n in RUNTIME:
          if b == n:
              return True
      return False

  def is_sensitive(p):
      for a in SENSITIVE:
          if a in p:
              return True
      return False

  def ev_edge(e):
      return {
          "from":     "process://" + e.get("actor_path", ""),
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", ""),
          "dir":      "out",
          "ts":       e.get("ts", "0"),
          "first_ts": e.get("ts", "0"),
          "last_ts":  e.get("ts", "0"),
      }

  # ── relevance gate: meta string checks only, no traversal of anything ────────
  def is_relevant_event():
      if meta.get("context_type", "") != "http_request":
          return False
      blob = (meta.get("url", "") + " " + meta.get("path", "")).lower()
      return has_any(blob, TRAVERSAL)

  def run():
      if not is_relevant_event():
          return "allow"

      now = int(meta.get("event_ts", "0"))
      cp  = int(meta.get("caller_pid", "0"))
      if cp == 0 or now == 0:
          return "allow"

      # ── anchor on the exact triggering instance ──────────────────────────────
      inst = proc_instance(cp, now)
      if inst == None:
          return "allow"                       # degraded - re-fires when create row lands
      lineage = proc_lineage(int(inst["actor_pid"]), int(inst["actor_start"]))
      if not lineage:
          lineage = [inst]
      root = lineage[len(lineage) - 1]

      url  = meta.get("url", "")
      low  = url.lower()
      host = meta.get("host", "")
      path = meta.get("path", "")

      # ── discriminator: chain-load context OR a Python-family caller ──────────
      ctx_hit = has_any(low, CHAIN_CTX)
      py_hit  = False
      for x in lineage:
          if looks_python(x.get("actor_path", "")):
              py_hit = True
      if not ctx_hit and not py_hit:
          return "allow"

      # ── suppress repeats of the same traversal from the same session ─────────
      target = (host + path)[:120]
      key    = root.get("actor_pid", "0") + ":" + root.get("actor_start", "0") + ":" + target
      seen   = store_get("reported")
      if seen == None:
          seen = {}
      prev = seen.get(key, 0)
      if prev != 0 and (now - int(prev)) < DEDUP_NS:
          return "allow"

      # ── session scope: lineage instances + what they spawned in the window ───
      session = {}
      for x in lineage:
          session[x.get("actor_pid", "")] = x.get("actor_start", "0")
      execs = query_events(kind="EXECUTE_PROCESS", since_ns=now - WINDOW_NS,
                           until_ns=now + 1, limit=2000)
      for _ in range(3):                       # 3 generations of descendants
          for e in execs:
              if e.get("parent_pid", "") in session:
                  session[e.get("actor_pid", "")] = e.get("actor_start", "0")

      # ── escalation stage: secret file read by a session instance, in window ──
      cred    = []
      scanned = 0
      for pid in sorted(session):
          if scanned >= MAX_PIDS:
              break
          scanned += 1
          rows = query_events(kind="READ_FILE", actor_pid=int(pid),
                              actor_start=int(session[pid]),
                              since_ns=now - WINDOW_NS, until_ns=now + 1, limit=400)
          for r in rows:
              p = r.get("path", "").lower()
              if p != "" and is_sensitive(p):
                  cred.append(r)
                  break
          if len(cred) >= 3:
              break

      # ── kill chain ───────────────────────────────────────────────────────────
      chain = new_chain("process://" + root.get("actor_path", ""))
      names = []
      for x in lineage:
          names.append(x.get("actor_path", "").split("/")[-1])
      lin = " -> ".join(names)

      trig = {
          "from":     "process://" + inst.get("actor_path", ""),
          "to":       "https://" + host,
          "kind":     "HTTP_REQUEST",
          "dir":      "out",
          "method":   meta.get("method", ""),
          "ts":       str(now),
          "first_ts": str(now),
          "last_ts":  str(now),
      }
      chain.append(step(trig, stage_id="Path Traversal",
                        stage_desc="chain/config load with traversal sequence: " +
                                   meta.get("method", "") + " " + url[:200]))
      for r in cred:
          chain.append(step(ev_edge(r), stage_id="Credential Access",
                            stage_desc="same-session read of secret-bearing file: " +
                                       r.get("path", "")))

      if len(cred) > 0:
          reason = ("LangChain load_chain path traversal (CVE-2024-28088) - traversal URL " +
                    target + " issued by " + lin +
                    ", followed by same-session read of " + str(len(cred)) +
                    " secret-bearing file(s)")
      else:
          reason = ("Path traversal in agent chain/config load URL " + target +
                    " issued by " + lin +
                    " - LangChain load_chain hub-prefix escape pattern (CVE-2024-28088)")
      print(reason)

      if len(seen) > 300:
          seen = {}
      seen[key] = now
      if store_usage()["free"] > 8192:
          store_set("reported", seen)

      return {"action": "report", "reason": reason, "chain": chain}

  result = run()
