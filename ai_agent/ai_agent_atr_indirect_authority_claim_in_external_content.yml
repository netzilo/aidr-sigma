title: Indirect Authority Claim in External Content
id: a186c61c-35b3-4467-b502-6809aad9a4ae
status: experimental
level: high
description: |-
  Detects authority-claiming patterns embedded in external content (documents, tool responses, web pages) that address the AI agent directly. Unlike direct prompt injection (ATR-2026-001), these use softer authority language: "Note to AI", "Attention AI", "Important for the assistant" combined with corrective directives like "the previous analysis was incorrect" or "please recalculate". These bypass ATR-2026-002's injection patterns because they don't use explicit override language — instead they leverage implied authority to redirect agent behavior. Discovered via Autoresearch v0 adversarial testing (100% miss rate, 31/31 samples).

  Adapted from Agent Threat Rules ATR-2026-00130 (MIT).
author: ATR Community (adapted)
date: '2026-04-01'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00130
tags:
- attack.initial-access
- atlas.aml.t0051
- owasp.asi01
- owasp.asi06
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(note|attention|message|instruction|directive|reminder|update|notice)\s+(to|for)\s+(the\s+)?(AI|assistant|agent|model|system|chatbot|bot|LLM)\s*[:\-,.]\s*.{0,30}(previous|prior|earlier|above|last|initial)\s+.{0,30}(incorrect|wrong|flawed|erroneous|inaccurate|outdated|invalid|error)
  sel_1:
    content|re: (?i)(note|attention|message|instruction|directive|reminder)\s+(to|for)\s+(the\s+)?(AI|assistant|agent|model|system)\s*[:\-,.]\s*.{0,60}(recalculate|recompute|redo|reevaluate|reassess|reprocess|reconsider|reanalyze|revise)
  sel_2:
    content|re: (?i)(important|urgent|critical|essential|mandatory|required)\s+(note|message|instruction|update|directive|notice)\s+(to|for)\s+(the\s+)?(AI|assistant|agent|model|system)\s*[:\-,.]
  sel_3:
    response|re: (?i)(note|attention|message|instruction)\s+(to|for)\s+(the\s+)?(AI|assistant|agent|model)\s*[:\-,.]
  sel_4:
    content|re: (?i)(the\s+)?(previous|prior|earlier|above|preceding|initial|original)\s+(analysis|assessment|calculation|evaluation|result|output|response)\s+(was|is|were|are|contains?|had|has)\s+(incorrect|wrong|flawed|erroneous|inaccurate|invalid|mistaken|faulty)
  condition: 1 of sel_*
falsepositives:
- A peer review document or academic paper that critiques a prior computational analysis, e.g. 'The original
  evaluation was flawed due to selection bias in the sample', triggering Layer 5 despite being legitimate
  scholarly discourse.
action: report
