title: PALChain Arbitrary Code Execution (LangChain)
id: b7e4c1f2-9a3d-4e58-8c61-3f0a2d5b7e94
status: experimental
level: high
description: |
  Detects the execution stage of the LangChain PALChain arbitrary-code-execution
  vulnerability (CVE-2023-36258, LangChain <= 0.0.199), where LLM-generated text is
  handed to Python `exec()` inside PALChain and becomes attacker-controlled code.

  The only observable the engine emits for this threat is `execute_process`, so the
  rule is session-keyed: the triggering session is the spawned interpreter, its
  `lineage()` is the true spawn chain, and *prior* stages are read from the event
  log with `events(kind="SPAWNED")` scoped strictly to that lineage plus the
  sessions it spawned in-window. Nothing is ever attributed across sessions, and
  the triggering event itself is taken from `meta` (never re-looked-up in the
  log).

  Two mutually exclusive anchors, both high specificity:
    A. Inline interpreter code execution — the spawned command line names a Python
       interpreter AND contains a dynamic-execution primitive (exec/eval/compile/
       __import__) AND a dangerous capability marker (os.system, os.popen,
       subprocess.*, pty.spawn, socket.socket, base64.b64decode, urllib/requests,
       shutil.rmtree, /bin/sh, curl/wget/nc). This is the PAL payload shape.
    B. Python-hosted shell escape — a Python interpreter is present in *this*
       session's lineage AND the spawned command is a reverse shell or
       download-and-run payload (/dev/tcp/, curl|wget piped to a shell,
       base64 -d piped to a shell, nc -e, interactive shell).

  Supporting session stages (inline interpreter exec, shell spawn, network tool)
  are added to the kill chain only when they occurred in the same session within
  the clustering window and before the trigger.

  No ATLAS technique was verified for this behaviour, so no `atlas.` tag is claimed
  rather than inventing an identifier. The upstream advisory maps to OWASP Web Top 10
  A03:2021 (Injection) / A04:2021; the closest verified OWASP-LLM identifiers for an
  agent executing model-derived code are LLM05 and LLM06, tagged below.
author: Tanya
date: "2026-06-01"
modified: "2026-06-01"
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2023-36258
  - https://attack.mitre.org/techniques/T1059/006/
tags:
  - attack.execution
  - attack.t1059.006
  - owasp.llm05
  - owasp.llm06
falsepositives:
  - "pip / setuptools legacy build shim: `python -c 'import sys, setuptools, tokenize; ... exec(compile(...))'`. It carries a dynamic-exec primitive but no dangerous capability marker (no os.system / subprocess / socket / network tool), so anchor A does not fire."
  - "Developer or notebook one-liners such as `python -c 'import subprocess; subprocess.run([\"ls\"])'` — capability marker present but no dynamic-exec primitive, so anchor A does not fire."
  - "Security research, CVE-2023-36258 reproduction harnesses and red-team test suites deliberately running PAL payloads. These are genuine true positives of the pattern; the rule is report-only so the exercise is not interrupted, and the kill chain names the operator's own lineage."
  - "Provisioning tooling (Ansible/Fabric-style bootstraps) that base64-decodes and execs a Python payload on the local host. Reported, not blocked; the emitted lineage makes the automation parent obvious to the analyst."
  - "Container/CI entrypoints that legitimately pipe a fetched installer into a shell. Anchor B additionally requires a Python interpreter in the same session lineage, which excludes plain shell CI steps; when a Python build driver is present the event is reported for review only."
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
detection:
  sel_exec:
    event_type: execute_process
  sel_code_markers:
    content|re:
      - '(?i)\bexec\s*\('
      - '(?i)\beval\s*\('
      - '(?i)\bcompile\s*\('
      - '__import__\s*\('
      - '(?i)\bos\.(?:system|popen)\s*\('
      - '(?i)\bsubprocess\.(?:Popen|run|call|check_output|check_call)\s*\('
      - '(?i)\bpty\.spawn\s*\('
      - '(?i)\bsocket\.socket\s*\('
      - '(?i)/dev/tcp/'
      - '(?i)\bbase64\b[^\n]{0,64}--?d(?:ecode)?\b'
      - '(?i)\b(?:curl|wget)\b'
      - '(?i)\bnc(?:at)?\b'
      - '(?i)\b(?:ba|z|k)?sh\b\s+-i\b'
  condition: sel_exec and sel_code_markers
action: execute
on_timeout: allow
on_error: allow
script: |
  # LangChain PALChain (CVE-2023-36258) arbitrary code execution.
  # Session-keyed: the triggering session IS the spawned interpreter; its
  # lineage() is the true spawn chain; prior stages come from the event log,
  # scoped to that one lineage and the sessions it spawned in-window.
  # Trigger data comes from meta, prior stages from the log.

  WINDOW_NS = 300000000000   # 5 minutes - stage clustering window
  EXEC_ROWS = 600            # single SPAWNED log pass (newest-first)
  MAX_PRIOR = 40             # candidate prior rows examined

  INTERP_RE = r"(?i)\b(?:python[0-9.]*|pypy[0-9.]*)\b"

  DYNAMIC_RE = [
      r"(?i)\bexec\s*\(",
      r"(?i)\beval\s*\(",
      r"(?i)\bcompile\s*\(",
      r"__import__\s*\(",
  ]

  CAPABILITY_RE = [
      r"(?i)\bos\.system\s*\(",
      r"(?i)\bos\.popen\s*\(",
      r"(?i)\bsubprocess\.(?:Popen|run|call|check_output|check_call)\s*\(",
      r"(?i)\bpty\.spawn\s*\(",
      r"(?i)\bsocket\.socket\s*\(",
      r"(?i)\bbase64\.b64decode\s*\(",
      r"(?i)\burllib\.request\b",
      r"(?i)\brequests\.(?:get|post|put)\s*\(",
      r"(?i)\bshutil\.rmtree\s*\(",
      r"(?i)\bos\.(?:remove|unlink)\s*\(",
      r"(?i)/bin/(?:sh|bash|zsh)\b",
      r"(?i)\b(?:curl|wget|nc|ncat)\b",
  ]

  PAYLOAD_RE = [
      r"(?i)/dev/tcp/",
      r"(?i)\b(?:curl|wget)\b[^\n]{0,200}\|\s*(?:ba|z|k)?sh\b",
      r"(?i)\bbase64\b[^\n]{0,64}--?d(?:ecode)?\b[^\n]{0,200}\|\s*(?:ba|z|k)?sh\b",
      r"(?i)\bnc(?:at)?\b[^\n]{0,80}\s-[a-z]{0,6}e\b",
      r"(?i)\b(?:ba|z|k)?sh\b\s+-i\b",
  ]

  PRIOR_LABELS = [
      ["Inline Interpreter Exec", r"(?i)\b(?:python[0-9.]*|pypy[0-9.]*)\b[^\n]{0,400}\s-c\s"],
      ["Shell Spawn",            r"(?i)\b(?:ba|z|k)?sh\b\s+-c\s"],
      ["Network Tool",           r"(?i)\b(?:curl|wget|nc|ncat)\b"],
  ]

  def first_match(pats, s):
      for p in pats:
          m = re.find(p, s)
          if m != None:
              return m
      return None

  def is_python_path(p):
      if p == "":
          return False
      if re.find(r"(?i)(?:^|/)python[0-9.]*$", p) != None:
          return True
      if re.find(r"(?i)(?:^|/)pypy[0-9.]*$", p) != None:
          return True
      return False

  def short(s, n):
      if len(s) > n:
          return s[:n] + "..."
      return s

  def ev_edge(e):
      # A SPAWNED row is keyed by the child: from = spawner, to = child.
      t = e.get("ts", "0")
      frm = e.get("session_id", "")
      if e.get("kind", "") == "SPAWNED":
          frm = e.get("parent_session", "")
      return {
          "from":     frm,
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", ""),
          "dir":      "out",
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
      }

  def sess_edge(x):
      # SPAWNED edge for a session dict (parent -> session, at first_seen).
      t = x.get("first_seen", "0")
      return {
          "from":     x.get("parent", ""),
          "to":       x.get("id", ""),
          "kind":     "SPAWNED",
          "dir":      "out",
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
      }

  def run():
      # 1. relevance gate - pure string work on meta, no graph/log access
      if meta.get("context_type", "") != "execute_process":
          return "allow"
      cmd = meta.get("content", "")
      if cmd == "":
          return "allow"

      interp  = re.find(INTERP_RE, cmd) != None
      dynamic = first_match(DYNAMIC_RE, cmd)
      capab   = first_match(CAPABILITY_RE, cmd)
      payload = first_match(PAYLOAD_RE, cmd)

      anchor_a = interp and dynamic != None and capab != None
      if not anchor_a and payload == None:
          return "allow"

      # 2. session attribution - the triggering session is the spawned process
      if meta.get("session", "") == "":
          return "allow"
      ets = int(meta.get("event_ts", "0"))
      if ets == 0:
          return "allow"
      inst = session()
      if inst == None:
          return "allow"                      # degraded - re-fires when the session lands
      lineage_ = lineage(inst["id"])
      if len(lineage_) == 0:
          return "allow"

      # 3. scope: lineage sessions + sessions they spawned in-window
      scope = {}
      for x in lineage_:
          scope[x.get("id", "")] = True

      since = ets - WINDOW_NS
      if since < 0:
          since = 0
      exec_rows = events(kind="SPAWNED", since_ns=since,
                         until_ns=ets, limit=EXEC_ROWS)
      for i in range(2):                      # two passes: rows are newest-first
          for e in exec_rows:
              if e.get("parent_session", "") in scope:
                  scope[e.get("session_id", "")] = True

      # the interpreter host is an ANCESTOR of the trigger (never the trigger itself)
      py_host = None
      py_host_edge = None
      for x in lineage_[1:]:
          if is_python_path(x.get("path", "")):
              py_host = x
              py_host_edge = sess_edge(x)
              break
      if py_host == None:
          for e in exec_rows:
              sid = e.get("session_id", "")
              if sid in scope and sid != inst["id"]:
                  if is_python_path(e.get("program", "")):
                      py_host = e
                      py_host_edge = ev_edge(e)
                      break

      # anchor B requires a Python interpreter host in THIS scope
      if not anchor_a and py_host == None:
          return "allow"

      # 4. kill chain, rooted at the lineage root (the agent)
      root  = lineage_[-1]
      chain = new_chain(root["id"])
      stages = []

      if py_host != None:
          chain.append(step(py_host_edge, stage_id="Interpreter Host",
                            stage_desc="python interpreter in scope: " +
                                       py_host.get("path", py_host.get("program", "?")) +
                                       " (session " + py_host.get("id", py_host.get("session_id", "?")) + ")"))
          stages.append("python host")

      seen  = {}
      count = 0
      total = len(exec_rows)
      for i in range(total):
          if count >= MAX_PRIOR:
              break
          e = exec_rows[total - 1 - i]        # oldest-first, chronological chain
          sid = e.get("session_id", "")
          if sid not in scope or sid == inst["id"]:
              continue                        # the trigger stage is taken from meta
          c = e.get("cmdline", "")
          if c == "":
              continue
          ts = int(e.get("ts", "0"))
          if ts < since or ts > ets:
              continue
          count = count + 1
          for pair in PRIOR_LABELS:
              if pair[0] in seen:
                  continue
              if re.find(pair[1], c) != None:
                  seen[pair[0]] = True
                  chain.append(step(ev_edge(e), stage_id=pair[0],
                                    stage_desc=e.get("program", "?") +
                                               " ran: " + short(c, 200)))
                  stages.append(pair[0])

      # 5. trigger stage - taken from meta, never re-queried from the log
      trig = {
          "from":     inst.get("parent", ""),
          "to":       inst["id"],
          "kind":     "SPAWNED",
          "dir":      "out",
          "ts":       str(ets),
          "first_ts": str(ets),
          "last_ts":  str(ets),
          "cmdline":  short(cmd, 400),
      }
      if anchor_a:
          desc = ("inline interpreter code execution - dynamic=" + short(dynamic, 40) +
                  " capability=" + short(capab, 60))
          stages.append("inline code exec")
      else:
          desc = "python-hosted shell escape payload - " + short(payload, 80)
          stages.append("shell escape payload")
      chain.append(step(trig, stage_id="PAL Code Execution",
                        stage_desc=desc + " | cmd: " + short(cmd, 200)))

      names = []
      for x in lineage_:
          p = x.get("path", "")
          names.append(p.split("/")[-1])
      attribution = "resolved"
      if len(lineage_) < 2:
          attribution = "degraded"

      reason = ("PALChain-style arbitrary code execution (CVE-2023-36258 pattern): " +
                ", ".join(stages) +
                " | lineage: " + " -> ".join(names) +
                " | attribution: " + attribution +
                " | cmd: " + short(cmd, 200))
      print(reason)
      return {"action": "report", "reason": reason, "chain": chain}

  result = run()
