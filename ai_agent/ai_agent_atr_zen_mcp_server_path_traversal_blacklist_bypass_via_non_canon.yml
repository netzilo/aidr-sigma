title: Zen MCP Server path-traversal blacklist bypass via non-canonical paths (CVE-2025-66689)
id: b0df6f7d-e36a-4220-83c5-afc86203ad2a
status: experimental
level: high
description: |-
  CVE-2025-66689 (CWE-22). The Zen MCP server's is_dangerous_path() blocks sensitive files with an exact-string blacklist but never canonicalizes the path before comparison, so a path that still resolves to a protected target slips through when it is wrapped in normalization tricks: a blacklisted prefix followed by ../ (/etc/shadow/../../../home/user/.ssh/id_rsa), a same-directory bounce (/home/user/.ssh/../.ssh/id_rsa), a /./ no-op (/etc/./shadow), or redundant slashes (/etc//shadow). The discriminator from the existing deep-../-chain rule (ATR-2026-00569) and the clean-credential-path rule (ATR-2026-00113) is that the SENSITIVE target token sits immediately adjacent to a normalization/traversal artefact — neither a clean credential path nor a bare ../ chain alone matches here.

  Adapted from Agent Threat Rules ATR-2026-00578 (MIT).
author: ATR Community (adapted)
date: '2026-06-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00578
- https://www.sentinelone.com/vulnerability-database/cve-2025-66689/
- https://nvd.nist.gov/vuln/detail/CVE-2025-66689
tags:
- attack.exfiltration
- atlas.aml.t0056
- atlas.aml.t0057
- owasp.asi05
- owasp.asi06
- owasp.llm02
- owasp.llm07
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)[\\/](?:etc[\\/](?:shadow|passwd|sudoers)|\.ssh|\.aws|\.config[\\/]gcloud|root)[\\/]\.{1,2}[\\/]{1,2}[^\s"'<>]{0,80}(?:id_(?:rsa|ed25519|ecdsa)|\.ssh|shadow|passwd|credentials|authorized_keys|\.pem|\.key)
  sel_1:
    content|re: (?i)[\\/]etc[\\/]\.{1,2}[\\/]{1,2}(?:etc[\\/]){0,1}(?:shadow|passwd|sudoers)\b
  sel_2:
    content|re: (?i)[\\/]\.ssh[\\/]\.\.[\\/]\.ssh[\\/](?:id_(?:rsa|ed25519|ecdsa)|authorized_keys|known_hosts)\b
  sel_3:
    content|re: (?i)/etc/{2,}(?:shadow|passwd|sudoers)\b|/\.ssh/{2,}id_(?:rsa|ed25519|ecdsa)\b
  condition: 1 of sel_*
falsepositives:
- Documentation or tutorials that mention ../ relative imports without a sensitive credential/system target
  adjacent to it
- Legitimate absolute file paths to project source under /home/<user>/project that contain no /../ , /./
  , or redundant-slash artefact
- Security write-ups quoting the CVE that describe canonicalization in prose rather than presenting an
  inline non-canonical path to a sensitive file
action: report
