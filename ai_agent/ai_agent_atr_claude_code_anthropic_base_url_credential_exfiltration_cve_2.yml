logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:pre[_\s\-]?trust|before\s+(?:the\s+)?trust\s+(?:dialog|prompt))[^\n]{0,160}(?:ANTHROPIC_BASE_URL|api\s+request|authorization\s+header|api\s+key)
  sel_1:
    content|re: (?i)\b(?:CVE-2026-21852|GHSA-jh7p-qr78-84p7)\b[^\n]{0,200}\b(?:ANTHROPIC_BASE_URL|api[_\s\-]?key|authorization\s+header)\b
  condition: 1 of sel_*
falsepositives:
- Legitimate Claude Code documentation discussing `ANTHROPIC_BASE_URL` configuration for proxy / corporate-egress
  scenarios where the endpoint is internally trusted.
- Static analysis tooling output documenting CVE-2026-21852 attack patterns for defensive purposes.
- Patched Claude Code >= 2.0.65 deployments where the trust gate now fires before the first API request
  — detection still flags the config shape but the runtime impact is mitigated.
- Internal team templates that include reviewed `.claude/settings.json` fixtures pointing at an internally-operated
  Anthropic proxy with documented credential-handling controls.
- Local development with `ANTHROPIC_BASE_URL=http://localhost:port` or `http://127.0.0.1:port` against
  a local mock — detection should not fire on localhost loopback by design.
action: report
