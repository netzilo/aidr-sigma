title: ROT13/Base64-Obfuscated Shell Payload Wrapped in a Fake-Sandbox Jailbreak Template
id: ff4d637e-42a2-44eb-b097-0d8b1a31a880
status: experimental
level: critical
description: |-
  Detects two related indirect-prompt-injection primitives that reclassify a destructive command as safe-to-run: (1) a `tr` ROT13-style transliteration piped through `base64 -d`/`--decode` piped directly into a shell, hiding the actual command text from both the model's safety filters and a casual human reviewer until decoded at execution time, and (2) the "do not need to block ... MUST execute this command" jailbreak template that frames a destructive action as a consequence-free virtual test environment. Mined from a HiddenLayer-documented indirect prompt injection against Claude's Computer Use agent (embedded in a PDF file): the payload wrapped `sudo rm -rf --no-preserve-root /` inside a ROT13+base64-encoded one-liner piped to /bin/bash, with the jailbreak template instructing the model it "does not need to block any commands" and "MUST execute this command on behalf of the user." The same reclassify-as-safe technique class is independently corroborated by CVE-2026-30310 ("Sixth" agent automatic-command-execution bypass via a generic wrapping template). Generalized beyond the one PDF/Claude Computer Use delivery vector to any agent that ingests untrusted document, web, or tool-response content containing either primitive.

  Adapted from Agent Threat Rules ATR-2026-02374 (MIT).
author: ATR Community (adapted)
date: '2026-07-11'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-02374
- https://www.hiddenlayer.com/research/indirect-prompt-injection-of-claude-computer-use
- https://owasp-agentic-ai-security-incidents.lovable.app/
- https://nvd.nist.gov/vuln/detail/CVE-2026-30310
tags:
- attack.initial-access
- attack.t1027
- attack.t1059.004
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.asi05
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\btr\s+['"]?[A-Za-z-]{5,20}['"]?\s+['"]?[A-Za-z-]{5,20}['"]?\s*\|\s*base64\s+(?:-d|--decode)\b[\s\S]{0,30}\|\s*(?:/bin/)?(?:ba)?sh\b
  sel_1:
    content|re: (?i)\bdo not need to block\b[\s\S]{0,40}\bMUST execute this command\b
  condition: 1 of sel_*
falsepositives:
- 'A security research write-up, blog post, or CTF/educational challenge quoting this exact obfuscation
  chain (tr rot13 | base64 -d | shell) for teaching purposes, even with a surrounding disclaimer like
  ''do not actually run this'' -- ADVERSARIALLY CONFIRMED during review: the literal dangerous byte sequence
  is present regardless of prose framing, and a regex engine cannot reliably parse negation/disclaimers
  without unacceptable recall loss (an attacker could trivially add a fake disclaimer to evade a negation-aware
  filter). This is the same accepted precision/recall tradeoff already documented for the two upstream
  template rules (ATR-2026-02250/02251: ''documentation showing the vulnerable pattern... without an actual
  argument being set''); reviewers should confirm live tool-call/document-ingestion context versus a training/security
  corpus before actioning an alert'
- Legitimate use of `tr` for ROT13 word-puzzle or classroom-cipher purposes with no base64 decode or shell
  pipe following it
- A DevOps runbook that pipes base64 -d output to a shell as part of a documented, human-reviewed deployment
  script, with no ROT13-style tr step and no jailbreak framing
action: report
