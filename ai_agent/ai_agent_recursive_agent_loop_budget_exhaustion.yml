title: Recursive Agent Loop and Token Budget Exhaustion
id: 6b1f2c9d-7a54-4de8-9c31-2f80a4d5e713
status: experimental
level: medium
description: |
  Detects a non-converging (recursive) agent loop: the same MCP tool re-invoked with
  byte-identical arguments, at machine cadence, by one instance-resolved session, with
  little or no state change to show for it. This is the denial-of-wallet / resource
  exhaustion pattern (ATLAS T1499, OWASP ASI10) reduced to the telemetry that actually
  exists.

  TRIAGE DISSENT — answered explicitly:
  The reviewer is correct. RESOURCE_EXHAUSTION, TOKEN_CONSUMPTION and TOOL_INVOCATION
  are not edge kinds in this engine, and `model_call` is never emitted, so step-budget
  breach, cumulative token spend and self-prompt recursion depth have NO telemetry path
  and are NOT claimed by this rule. Rather than ship three selections that can never
  fire, this rule detects the one signal that is real (`tool_call`) and then adds the
  correlation the narrative was actually reaching for, using facilities that DO exist:
    * session scoping (the triggering session, its lineage and the sessions they
      spawned) so repetition is counted per agent session, never pooled across sessions;
    * in-window TOOL_CALL rows of that scope plus the indexed argument text, so
      identical-argument repetition is derived from the event log on every call;
    * a session-scoped state-change audit via events() on WRITE/CREATE/DELETE/
      RENAME_FILE, which is the closest available proxy for "no goal state change".
  Cost/token figures are deliberately absent from the verdict text — the engine does not
  expose them and the rule does not invent them. What it reports is invocation volume,
  cadence, argument-identity and productive-work absence.
author: Tanya
date: "2026-06-12"
references:
  - https://atlas.mitre.org/techniques/AML.T0034
  - https://attack.mitre.org/techniques/T1499/
  - https://genai.owasp.org/
tags:
  - attack.impact
  - attack.t1499
  - atlas.aml.t0034
  - owasp.asi10
falsepositives:
  - Long-poll / status-poll tools (get_job_status, wait_for_build) called with identical
    arguments while an external job runs. Mitigated by the tight-cadence requirement -
    the mean inter-call gap must be <= 3s; human- or scheduler-paced polling at 5s+
    intervals never reaches the threshold.
  - Retry-with-backoff against a flaky tool or MCP server. Backoff widens the mean gap
    on every attempt, so a backing-off retry loop falls out of the tight-cadence gate
    long before 12 attempts.
  - Test harnesses and evaluation suites replaying the same fixture call repeatedly.
    These are report-only findings and are recognisable by the lineage shown in the kill
    chain (test runner as session root, not an agent-driven shell).
  - Genuinely productive tight loops - a code-mod agent editing files in a loop calls the
    same tool rapidly but with DIFFERENT arguments (distinct fingerprints), and produces
    WRITE/CREATE file events. Identical-argument fingerprinting excludes the former; the
    state-change audit doubles the threshold for the latter.
  - Stateful cursor tools where pagination state lives server-side and the client sends
    identical arguments each page. Rare, and surfaces as report only.
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - file_activity
  - tool
detection:
  sel_tool_call:
    event_type: tool_call
    content|re: '.'
  condition: sel_tool_call
action: execute
on_timeout: allow
on_error: allow
script: |
  # ── Tunables. Every window/threshold lives in the rule, never in storage. ──────
  WINDOW_NS        = 300000000000     # 5 min  - loop observation window
  REPORT_TTL_NS    = 3600000000000    # 1 h    - stale per-session report markers evicted
  MEAN_GAP_NS      = 3000000000       # 3 s    - max mean gap for a "tight" loop
  REPEAT_THRESHOLD = 12               # identical (tool,args) invocations in-window
  FLOOD_TOTAL      = 60               # total in-window calls to the tool for non-convergence
  FLOOD_DISTINCT   = 3                # ...where the identical set is >= 1/this of them
  ARG_SCAN_LIMIT   = 4096             # bytes of tool args fingerprinted
  MAX_ROWS         = 1000             # tool-call rows pulled per session
  MAX_SIDS_AUDIT   = 12               # cap on session-scoped mutation queries
  MAX_REPORTS      = 24               # report markers retained in the rule store
  MUTATION_KINDS   = ["WRITE_FILE", "CREATE_FILE", "DELETE_FILE", "RENAME_FILE"]

  # ── Pure helpers (no graph / no event-log calls) ──────────────────────────────
  def fnv1a(s):
      if len(s) > ARG_SCAN_LIMIT:
          s = s[:ARG_SCAN_LIMIT]
      h = 2166136261
      for c in s.elem_ords():
          h = ((h ^ c) * 16777619) % 4294967296
      return "%x" % h

  def norm(s):
      # collapse whitespace so pretty-printed vs compact JSON hash identically
      return re.replace(r"\s+", s, " ").strip()

  def fts_phrase(s):
      # one FTS5 phrase: the args' token sequence; identity is confirmed on the text
      return '"' + s.replace('"', '""') + '"'

  def spawn_edge(child):
      for e in edges(child["id"], dir="in", kind="SPAWNED"):
          return e
      t = child.get("first_seen", "0")
      return {"from": child.get("parent", "") or child["id"], "to": child["id"],
              "kind": "SPAWNED", "dir": "out", "ts": t, "first_ts": t, "last_ts": t}

  def tool_edge(sid, tid, ts):
      return {
          "from":     sid,
          "to":       tid,
          "kind":     "TOOL_CALL",
          "ts":       str(ts),
          "first_ts": str(ts),
          "last_ts":  str(ts),
      }

  # ── Store maintenance: only "last reported" markers, one per root session ────
  def prune_reports(now):
      live = []
      for k in store_keys():
          v = store_get(k)
          if v == None or now - int(v.get("ts", 0)) > REPORT_TTL_NS:
              store_delete(k)
          else:
              live.append([int(v.get("ts", 0)), k])
      extra = len(live) - MAX_REPORTS
      for i in range(extra):
          oldest = -1
          oi     = -1
          for j in range(len(live)):
              if live[j][0] < 0:
                  continue
              if oldest < 0 or live[j][0] < oldest:
                  oldest = live[j][0]
                  oi     = j
          if oi < 0:
              break
          store_delete(live[oi][1])
          live[oi][0] = -1

  def persist(key, st, now):
      u = store_usage()
      if u["free"] < 65536 or len(store_keys()) > MAX_REPORTS:
          prune_reports(now)
      store_set(key, st)

  def run():
      # ── 1. Relevance gate: pure string checks on meta, zero traversal ─────────
      #     tool_input is the raw context name; tool_call is the collapsed
      #     event_type the Sigma pre-filter matches. Descriptions and prompt
      #     contexts also collapse onto tool_call and must not be counted.
      if meta.get("context_type", "") != "tool_input":
          return "allow"
      tool = meta.get("tool_name", "")
      if tool == "":
          return "allow"
      now = int(meta.get("event_ts", "0"))
      if now == 0:
          return "allow"

      # ── 2. Anchor on the exact triggering session (never a node walk) ─────────
      inst = session()
      if inst == None:
          return "allow"            # degraded attribution - never guess an owner
      lineage_ = lineage(inst["id"])
      if not lineage_:
          lineage_ = [inst]
      root = lineage_[-1]
      ses  = "s:" + root["id"]

      # ── 3. Session scope: lineage + sessions it spawned in-window ─────────────
      since = now - WINDOW_NS
      scope = {}
      for x in lineage_:
          scope[x["id"]] = True
      for e in events(kind="SPAWNED", since_ns=since, limit=2000):
          if e.get("parent_session", "") in scope:
              scope[e["session_id"]] = True

      # ── 4. In-window invocations of this tool, derived from the event log ─────
      server = meta.get("server_name", "")
      tid    = "tool://" + server + "/" + tool
      args   = norm(meta.get("content", ""))
      fp     = fnv1a(tool + "|" + args)

      by_label  = {}            # content label -> row, same tool, in-window, in-scope
      total     = 0
      tmin      = now
      trig_seen = False
      callid    = meta.get("callid", "")
      for sid in scope:
          for r in events(kind="TOOL_CALL", session=sid, target=tid,
                          since_ns=since, until_ns=now, limit=MAX_ROWS):
              total = total + 1
              t = int(r.get("ts", "0"))
              if t < tmin:
                  tmin = t
              if callid != "" and r.get("callid", "") == callid:
                  trig_seen = True
              cid = r.get("content_id", "")
              if cid != "":
                  by_label[cid] = r

      # identical arguments: the indexed args text must equal this call's text
      n     = 0
      first = now
      if args != "":
          for h in search(fts_phrase(args), MAX_ROWS):
              r = by_label.get(h.get("source", ""))
              if r == None:
                  continue
              if norm(h.get("text", "")) != args:
                  continue
              n = n + 1
              t = int(r.get("ts", "0"))
              if t < first:
                  first = t
      if not trig_seen:
          n     = n + 1             # the trigger itself (its row/index may still race)
          total = total + 1

      span = now - first
      gap  = span // (n - 1) if n > 1 else WINDOW_NS
      sgap = (now - tmin) // (total - 1) if total > 1 else WINDOW_NS

      st       = store_get(ses) or {}
      reported = int(st.get("reported", 0))
      if now - int(st.get("ts", 0)) > WINDOW_NS:
          reported = 0
      flood_at = int(st.get("flood_at", 0))

      fire_rep   = gap <= MEAN_GAP_NS and n >= REPEAT_THRESHOLD and n >= reported + REPEAT_THRESHOLD
      fire_flood = (sgap <= MEAN_GAP_NS and total >= FLOOD_TOTAL and
                    n * FLOOD_DISTINCT >= total and now - flood_at > WINDOW_NS)

      if not (fire_rep or fire_flood):
          return "allow"            # rule stays invisible - no event, no noise

      # ── 5. Session-scoped state-change audit ─────────────────────────────────
      mutations = 0
      checked   = 0
      for sid in scope:
          if checked >= MAX_SIDS_AUDIT:
              break
          checked += 1
          for kind in MUTATION_KINDS:
              rows = events(kind=kind, session=sid, since_ns=since, limit=20)
              mutations += len(rows)

      # Productive work present -> require twice the evidence before reporting.
      if mutations > 0:
          if n < REPEAT_THRESHOLD * 2 and total < FLOOD_TOTAL * 2:
              return "allow"

      # ── 6. Verdict + kill chain ───────────────────────────────────────────────
      st = {"reported": n, "ts": now, "flood_at": flood_at}
      if fire_flood:
          st["flood_at"] = now
      persist(ses, st, now)

      names = []
      for x in lineage_:
          names.append(x.get("path", "?").split("/")[-1])
      lname = " -> ".join(names)

      chain = new_chain(root["id"])

      if len(lineage_) > 1:
          chain.append(step(spawn_edge(lineage_[0]),
                            stage_id="Session Anchor",
                            stage_desc="loop driven by session chain: " + lname))
      chain.append(step(tool_edge(inst["id"], tid, now),
                        stage_id="Recursive Invocation",
                        stage_desc=tool + " re-invoked " + str(n) +
                                   "x with byte-identical arguments (fp " + fp +
                                   ", mean gap " + str(gap // 1000000) + "ms)"))
      if fire_flood:
          chain.append(step(tool_edge(inst["id"], tid, now),
                            stage_id="Non-Convergence",
                            stage_desc=str(total) + " in-window calls to " + tool +
                                       ", " + str(n) + " of them with one argument set"))
      chain.append(step(tool_edge(inst["id"], tid, now),
                        stage_id="Budget Impact",
                        stage_desc="state-changing file events by this session in-window: " +
                                   str(mutations) + " (no token/cost telemetry exists in this engine)"))

      reason = ("Recursive agent loop - " + tool + " re-invoked " + str(n) +
                "x with identical arguments over " + str(span // 1000000000) +
                "s (mean gap " + str(gap // 1000000) + "ms) by " + lname +
                "; session window: " + str(total) + " calls to the tool; " +
                str(mutations) + " state-changing file events")
      print(reason)
      return {"action": "report", "reason": reason, "chain": chain}

  result = run()
