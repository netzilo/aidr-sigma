  sel_5:
    content|re: (?i)(?:(?:^|[\s"'`>(\[,\\])/(?:yolo\b|mode\s+auto\b|approval-?mode\s+yolo\b|(?:skills|memory)\s+approval\s+off\b|auto-?approve\s+(?:on|all)\b|permissions?\s+bypass\b)|\\?"(?:text|message|prompt|keys|stdin|input|content)\\?"\s*:\s*\\?"[^"\n]{0,60}/(?:yolo|mode\s+auto|approval-?mode\s+yolo)\b|send[-_]?keys[^\n]{0,40}/yolo\b)
