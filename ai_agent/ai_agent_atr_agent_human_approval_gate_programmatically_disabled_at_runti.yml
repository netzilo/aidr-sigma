  condition: 1 of sel_*
falsepositives:
- Deliberate headless/CI usage inside a disposable container, VM or ephemeral runner, where the operator
  has consciously accepted unattended execution. The rule observes the act, not the intent, and cannot
  tell an authorised sandbox run from an intrusion. This is the residual FP class, it is not closable
  lexically, and it is why maturity stays at test (hunt lane) rather than entering enforce.
- 'Teams that keep a curated MCP allowlist and legitimately mark reviewed servers with "trust": true or
  "autoApprove": true (layer 5).'
- Documentation that shows a real invocation OUTSIDE a fenced or inline code span — a bare `claude --dangerously-skip-permissions`
  at the start of a line in a plain-text runbook still matches, because at that point it is lexically
  identical to the launch itself.
- Agent-framework source code, test fixtures and rule corpora (including this file) that contain the flag
  literals as data, whenever they are read as tool_response content rather than scanned as a skill.
- Sentences of the form 'run the suite in unattended mode' — the bare word 'unattended' was removed from
  layer 7 for this reason, but 'run it in full-auto mode' style phrasing can still match when no agent
  is involved.
action: report
