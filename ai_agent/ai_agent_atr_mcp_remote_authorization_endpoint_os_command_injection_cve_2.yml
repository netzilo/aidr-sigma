title: mcp-remote authorization_endpoint OS Command Injection (CVE-2025-6514)
id: 5a3c5834-be49-47fc-b46a-d00e737fd676
status: experimental
level: critical
description: |-
  Detects exploitation of CVE-2025-6514 (CVSS 9.6), OS command injection in mcp-remote when connecting to untrusted MCP servers. The vulnerable surface is the `authorization_endpoint` field returned in the OAuth metadata response: mcp-remote interpolates this URL into a shell context without sanitisation. Crafted shell metacharacters (`$()`, `\``, `;`, `|`, `&&`, `>(...)`, `\\$IFS`) inside the URL execute arbitrary OS commands on the client host. CWE-78. Disclosed by JFrog 2025-Q3.

  Adapted from Agent Threat Rules ATR-2026-00434 (MIT).
author: ATR Community (adapted)
date: '2026-05-10'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00434
- https://nvd.nist.gov/vuln/detail/CVE-2025-6514
tags:
- attack.execution
- attack.t1059
- attack.t1190
- atlas.aml.t0010
- atlas.aml.t0049
- owasp.asi04
- owasp.asi05
- owasp.llm03
- owasp.llm05
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?i)"authorization_endpoint"\s*:\s*"https?://[^"]*(?:`|\$\(|\$IFS|\$\{IFS|&&|\|\||\|\s*[a-z]|>\(|;\s*[a-z]\w*\s*[;&|]|>\s*/[a-z])
  sel_1:
    response|re: (?i)"authorization_endpoint"\s*:\s*"[^"]*\$\([^)]+\)[^"]*"
  sel_2:
    response|re: (?i)"authorization_endpoint"\s*:\s*"[^"]*`[^`]+`[^"]*"
  sel_3:
    response|re: (?i)"(?:authorization_endpoint|registration_endpoint|token_endpoint|jwks_uri|userinfo_endpoint|end_session_endpoint)"\s*:\s*"[^"]*(?:\$\(|`|;\s*[a-z]\w*\s*[;&|]|&&|\|\||>\s*/[a-z]|>\(|\$IFS|\$\{IFS)
  sel_4:
    response|re: (?i)"authorization_endpoint"\s*:\s*"[^"]*%(?:24|60|3b|7c|26)[^"]*"
  sel_5:
    content|re: (?i)mcp-?remote[^\n]{0,80}(?:authorization_endpoint|oauth\s+metadata)[^\n]{0,200}(?:command\s+inject|os\s+command|rce|shell|cve-?2025-?6514)
  condition: 1 of sel_*
falsepositives:
- Legitimate OAuth metadata documentation describing endpoint discovery for educational purposes.
- Security tooling that parses authorization_endpoint for vulnerability scanning.
action: report
