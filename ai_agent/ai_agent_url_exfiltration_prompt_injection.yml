title: URL Exfiltration And Prompt Injection Via Agent Link Handling
id: 7b3f1c9e-2a64-4f8d-9c17-6d5e0a41b8c2
status: experimental
level: high
description: |
  Single-event content detection for URL-borne attacks against autonomous AI agents
  that fetch links without validating what the link carries.

  Fires on an outbound http_request whose URL (url.full) carries one of:
    1. a provider-shaped secret (AWS access key id, OpenAI/Anthropic sk- key,
       GitHub/GitLab/Slack/Google token, PEM private key header, or an
       ENV_NAME=value pair for a well-known secret variable) anywhere in the URL;
    2. a >=160 character opaque blob in a data-carrying query parameter
       (data/payload/content/dump/transcript/history/...) — the classic
       "encode the context window into the query string" exfil primitive;
    3. an instruction-override phrase encoded into the query string
       (ignore/disregard previous instructions, reveal system prompt, you are now ...),
       i.e. a prompt injection delivered through the link itself.
  Also fires when the request body (content) carries a URL that already has a
  credential or a large opaque blob embedded in it — the callback/webhook
  registration form of the same attack.

  Report-only: this is a novel single-event heuristic and is deliberately deployed
  in measurement mode before any enforcement is considered.
author: Selhan
date: "2026-03-01"
references:
  - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
  - https://genai.owasp.org/llmrisk/llm02-sensitive-information-disclosure/
  - https://atlas.mitre.org/techniques/AML.T0051
  - https://attack.mitre.org/techniques/T1567/
  - https://attack.mitre.org/techniques/T1132/
tags:
  - attack.exfiltration
  - attack.t1567
  - attack.t1132
  - atlas.aml.t0051
  - owasp.llm01
  - owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:

  sel_scope:
    event_type: http_request

  # (1) Provider-shaped credential material anywhere in the request URL.
  sel_url_credential:
    url.full|re:
      - '\bAKIA[0-9A-Z]{16}\b'
      - '\bASIA[0-9A-Z]{16}\b'
      - '\bsk-[A-Za-z0-9]{32,}\b'
      - '\bsk-(ant-api[0-9]{2}|proj|live|svcacct)-[A-Za-z0-9_-]{30,}'
      - '\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b'
      - '\bgithub_pat_[A-Za-z0-9_]{60,}'
      - '\bglpat-[A-Za-z0-9_-]{20,}'
      - '\bxox[baprse]-[A-Za-z0-9-]{20,}'
      - '\bAIza[0-9A-Za-z_-]{35}'
      - '(?i)-----BEGIN[^&#]{0,20}PRIVATE[^&#]{0,6}KEY'
      - '(?i)(aws_secret_access_key|openai_api_key|anthropic_api_key|github_token|slack_bot_token|database_url|db_password)(=|%3d)[A-Za-z0-9%._+/~-]{12,}'

  # (2) Large opaque blob smuggled through a data-carrying query parameter.
  #     Charset excludes '%' and '+' on purpose: URL-encoded prose cannot form a
  #     160-character unbroken run, so natural-language values do not match.
  sel_url_blob:
    url.full|re: '(?i)[?&](data|payload|content|contents|body|dump|blob|b64|base64|out|output|result|log|logs|note|notes|memo|msg|message|text|info|context|history|transcript|conversation|leak|exfil|secret|creds|credentials|env|file)=[A-Za-z0-9/=_.-]{160,}'

  # (3) Instruction-override text delivered inside the URL query string.
  sel_url_injection:
    url.full|re:
      - '(?i)(ignore|disregard|forget)([ +]|%20){1,3}(all([ +]|%20){1,3})?(previous|prior|earlier|above)([ +]|%20){1,3}(instruction|prompt|direction|rule|context)'
      - '(?i)(reveal|print|show|dump|send|leak|repeat|output)([ +]|%20){1,3}(your|the|all)?([ +]|%20){0,3}(system([ +]|%20){1,3}prompt|api([ +]|%20){0,3}key|secret|credential|token)'
      - '(?i)you([ +]|%20){1,3}are([ +]|%20){1,3}now([ +]|%20){1,3}(a|an|in|the)([ +]|%20)'
      - '(?i)(new|updated|revised)([ +]|%20){1,3}(system([ +]|%20){1,3})?(instruction|directive|task)s?([ +]|%20){0,3}(:|%3a)'

  # (4) The same crafted URL carried in the request body (callback / webhook
  #     registration, redirect target, notification sink).
  sel_body_url_exfil:
    content|re:
      - '(?i)https?(://|%3a%2f%2f)[^\s"<>]{1,300}(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{32}|ghp_[A-Za-z0-9]{36}|xox[baprse]-[A-Za-z0-9-]{20}|AIza[0-9A-Za-z_-]{35})'
      - '(?i)https?://[^\s"<>]{1,200}[?&](data|payload|content|dump|b64|base64|exfil|leak|transcript)=[A-Za-z0-9/=_.-]{160,}'

  # Placeholder / documentation-shaped secrets in the URL.
  filter_placeholder_url:
    url.full|re:
      - '(?i)(AKIA|ASIA)[0-9A-Z]{0,13}EXAMPLE'
      - '(?i)\b(sk|ghp|gho|glpat|xoxb|AIza)[-_](x{6,}|0{6,}|1234|abcd|your|my|test|example|placeholder|dummy|redacted|changeme)'
      - '(?i)(=|%3d)(x{8,}|0{8,}|\*{4,}|(%2a){4,}|null|undefined|none)([&#]|$)'
      - '(?i)(=|%3d)(%3c|<)[a-z0-9_ +-]{2,32}(%3e|>)'
      - '(?i)(=|%3d)(\{\{|%7b%7b)'
      - '(?i)(redacted|placeholder|do-not-use|notarealkey|fake[-_]?(key|token|secret))'

  # Same placeholder shapes in the body, for the sel_body_url_exfil path.
  filter_placeholder_body:
    content|re:
      - '(?i)(AKIA|ASIA)[0-9A-Z]{0,13}EXAMPLE'
      - '(?i)\b(sk|ghp|gho|glpat|xoxb|AIza)[-_](x{6,}|0{6,}|1234|abcd|your|my|test|example|placeholder|dummy|redacted|changeme)'
      - '(?i)(redacted|placeholder|do-not-use|notarealkey|fake[-_]?(key|token|secret))'

  # Someone (or an agent) SEARCHING for injection wording, rather than being
  # attacked by it: the phrase sits inside a search parameter value. Deliberately
  # narrow — it only suppresses when the search value itself carries the wording,
  # so ?q=<credential> or ?q=<blob> is still detected.
  filter_search_param:
    url.full|re: '(?i)[?&](q|query|search|search_query|keywords|kw)=[^&#]{0,120}(ignore|disregard|forget|jailbreak|injection|prompt([ +]|%20){1,3}inject|system([ +]|%20){1,3}prompt|reveal|leak)'

  condition: >
    sel_scope
    and (sel_url_credential or sel_url_blob or sel_url_injection or sel_body_url_exfil)
    and not (filter_placeholder_url or filter_placeholder_body or filter_search_param)

falsepositives:
  - Product analytics or crash-telemetry beacons that base64-encode their payload into a data= or payload= query parameter (matches sel_url_blob; named parameter list plus the 160-character floor keeps most beacons below threshold, but high-volume RUM SDKs can exceed it).
  - Internal APIs that accept a long opaque session/continuation token in a content=, body= or context= parameter rather than a header.
  - CI or test traffic using synthetic keys that still carry a real provider prefix and do not match any placeholder shape (e.g. a randomly generated sk- string in a fixture).
  - Stripe/GitHub test-mode keys that are genuinely low value but structurally identical to production keys.
  - A security-research or documentation-reading agent fetching a page whose URL path or non-search parameter literally contains an injection phrase (search parameters are already suppressed by filter_search_param).
  - Webhook or callback registration where the customer legitimately embeds a shared secret in the callback URL (matches sel_body_url_exfil) — poor practice, but not an attack.
action: report
