title: Injected Code — Host / Hardware Inventory Exfiltration
id: 45f5bcbd-4e1c-4375-a359-18c4e80d3ea4
status: experimental
level: high
description: |-
  Detects injected code that enumerates the host (installed packages, virtual memory, USB devices, disk partitions, network interfaces, sound devices) and ships the inventory to a remote server via HTTP POST or MQTT. Host fingerprinting is reconnaissance preceding targeted compromise.

  Adapted from Agent Threat Rules ATR-2026-01893 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01893
tags:
- attack.exfiltration
- atlas.aml.t0051
- atlas.aml.t0057
- owasp.asi01
- owasp.llm02
- owasp.llm05
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)pkg_resources\.working_set[\s\S]{0,120}requests\.post\(
  sel_1:
    content|re: (?i)(?:requests\.post\(|publish\.single\()[\s\S]{0,140}psutil\.virtual_memory\(\)
  sel_2:
    content|re: (?i)(?:usb\.core\.find|psutil\.disk_partitions|psutil\.net_if_addrs|sd\.query_devices)\([\s\S]{0,160}requests\.post\(
  condition: 1 of sel_*
falsepositives:
- Security documentation, papers, or test suites that describe this attack technique without executing
  it.
- Legitimate developer or user requests that share the surface vocabulary but lack the malicious invariant.
action: report
