title: System Prompt Extraction — Targeted Verbatim Disclosure Attempts
id: 6ddb3fbe-54ef-425b-b8f6-6931b7afc195
status: experimental
level: high
description: |-
  Detects targeted attempts to extract system prompt or operator instructions verbatim from an LLM, enabling bypass of safety controls or credential theft. OWASP LLM07:2025 System Prompt Leakage. MITRE ATLAS AML.CS0036 (AIKatz attack). Unlike ATR-2026-00020 (which detects agent OUTPUT leaking), this rule detects USER INPUT elicitation attempts. Patterns: elicitation verbs (repeat, reveal, recite, disclose, print, output) targeting system-level objects (system prompt, instructions, parameters, configuration, directives, rules) with verbatim/exact extraction framing; debugging-framed extraction; character-by-character forced disclosure; response-priming attacks.

  Adapted from Agent Threat Rules ATR-2026-00514 (MIT).
author: ATR Community (adapted)
date: '2026-05-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00514
tags:
- attack.exfiltration
- atlas.aml.t0024
- owasp.asi01
- owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(\b(repeat|reveal|show|display|print|output|tell\s+me|disclose|leak|expose|give\s+me|share|provide|recite|reproduce|transcribe|copy|echo)\b[^"']{0,60}\b(your\s+|the\s+|all\s+|my\s+|your\s+full\s+|your\s+entire\s+|your\s+complete\s+|verbatim\s+|exact\s+)(system\s+prompt|system\s+message|system\s+instructions?|initial\s+instructions?|operator\s+instructions?|hidden\s+instructions?|pre[-_]?prompt|meta[-_]?prompt))|(\b(system\s+prompt|system\s+message|system\s+instructions?|initial\s+instructions?|operator\s+instructions?|hidden\s+instructions?|pre[-_]?prompt)\b.{0,150}\b(recite|repeat|tell\s+me|reveal|show|disclose)\b.{0,80}\b(exactly|verbatim|word\s+for\s+word|character\s+by\s+character|exactly\s+as))
  sel_1:
    content|re: (?i)\b(output|print|show|give|provide|repeat|recite|write|tell\s+me|display|echo|copy|transcribe|disclose)\b.{0,100}\b(word\s+for\s+word|verbatim|character\s+by\s+character|letter\s+by\s+letter|exact\s+wording|exactly\s+as\s+(written|given|provided|stated|stored))\b.{0,200}\b(instructions?|system\s+prompt|configuration|directives?|rules?|guidelines?|parameters?|operator|programming)
  sel_2:
    content|re: (?i)\b(for\s+(debugging|troubleshooting|diagnostic|testing|verification|audit|review|inspection|development)|in\s+(debug|diagnostic|test|dev)\s+mode|diagnostic\s+output)\b.{0,120}\b(output|show|print|display|reveal|disclose|provide|include|dump|list)\b.{0,100}\b(your\s+)?(configuration|config|system\s+prompt|instructions?|parameters?|api\s+keys?|secrets?|directives?|rules?|guidelines?)
  sel_3:
    content|re: (?i)\b(repeat|output|print|display|show|echo|reproduce|transcribe|copy)\s+(everything|all\s+(content|text|messages?|instructions?|context)|all\s+of\s+the\s+(above|previous)|the\s+above)\b.{0,120}\b(above|before\s+this|prior\s+to\s+this|including\s+the\s+system|including\s+(any\s+)?hidden|above\s+this\s+(conversation|message|line|prompt))
  sel_4:
    content|re: (?i)\b(begin|start|open|prefix|preface)\s+(your\s+)?(response|answer|reply|message|output)\s+with\s*[:\-]?\s*['"]?(my\s+system\s+(prompt|instructions?|config)|my\s+instructions?\s+(are|read|say|state)|i\s+was\s+(instructed|told|configured|programmed)|i\s+am\s+(configured|programmed|instructed))
  sel_5:
    content|re: (?i)\b(what\s+(did|were)\s+the\s+(operators?|admins?|anthropic|openai|google|developers?|company|organization|system)\s+(tell|instruct|give|provide|configure|program)\s+(you|to\s+you)|what\s+instructions?\s+(did|were)\s+(the\s+)?operators?\s+give\s+you|repeat\s+(what|it|that)\s+back.{0,30}(operator|system|hidden|verbatim|character))
  sel_6:
    content|re: (?i)\b(ignore\s+(confidentiality|your\s+(nda|rules?|guidelines?|instructions?|restrictions?))\.?\s*(your|the)\s+(system\s+prompt|instructions?)|your\s+(system\s+prompt|initial\s+instructions?|configuration)\s+(is|are|reads?|states?|says?)\s*[:\[_\(].{0,50}(complete|fill|continue|finish|answer))
  condition: 1 of sel_*
falsepositives:
- 'Capability inquiry: ''What are your main capabilities?'''
- 'Educational questions: ''What is a system prompt in the context of AI?'''
- 'Authoring help: ''How do I write a good system prompt for my chatbot?'''
- 'Document summarization: ''Please summarize the document I provided'''
- 'Content repetition from user-provided material: ''Repeat the last paragraph of the article I shared'''
action: report
