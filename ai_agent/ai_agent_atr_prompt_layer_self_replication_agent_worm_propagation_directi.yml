falsepositives:
- Threat-intelligence write-ups, red-team fixtures and security training material that quote a Morris
  II style payload inline. This is the ONE firing out of 124 adversarial legitimate sentences (data/measurements/atr-2026-02500/benign-adversarial.jsonl,
  id worm-h4-022). A quote inside a fenced code block is suppressed by tags.suppress_in_code_blocks; an
  inline quote is not.
- Academic papers describing self-replicating prompt attacks using the attacker's own imperative phrasing
- This rule's own description and test cases
action: report
