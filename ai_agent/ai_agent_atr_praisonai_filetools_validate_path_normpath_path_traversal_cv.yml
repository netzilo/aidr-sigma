title: PraisonAI FileTools _validate_path normpath Path Traversal (CVE-2026-35615 / GHSA-693f-pf34-72c5)
id: c78a1a85-db59-412d-8702-33cb80aa88ac
status: experimental
level: critical
description: |-
  Detects exploitation of CVE-2026-35615 (GHSA-693f-pf34-72c5, CWE-22, CVSS 9.2) in PraisonAI < 1.5.113. FileTools._validate_path() calls os.path.normpath() FIRST, collapsing '..' sequences, then checks `if '..' in normalized` — a check that can never fire, so traversal succeeds. An attacker supplies a path such as /tmp/../etc/passwd to read_file / write_file / delete_file and reaches any file on the host. This rule keys on the distinctive normpath-then-dotdot-check sink, the FileTools operation names with a traversal payload, and the canonical /tmp/../etc/passwd PoC.

  Adapted from Agent Threat Rules ATR-2026-01970 (MIT).
author: ATR Community (adapted)
date: '2026-06-29'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01970
- https://nvd.nist.gov/vuln/detail/CVE-2026-35615
tags:
- attack.execution
- attack.t1190
- atlas.aml.t0049
- owasp.asi06
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:FileTools\.)?(?:read_file|write_file|delete_file|copy_file|move_file|get_file_info|list_files|download_file|_validate_path)\s*\(\s*['"][^'"\n]{0,80}\.\.[\\/]+[^'"\n]{0,120}(?:etc[\\/]passwd|\.\.[\\/]|[\\/]root[\\/]|id_rsa|shadow)
  sel_1:
    content|re: (?i)(?:os\.path\.)?normpath\s*\([^)\n]{0,80}\)[\s\S]{0,160}(?:if\s+['"]\.\.['"]\s+in\b|['"]\.\.['"]\s+in\s+normalized)
  sel_2:
    content|re: (?i)['"/]?tmp[\\/](?:\.\.[\\/])+etc[\\/]+passwd
  sel_3:
    content|re: (?i)CVE-2026-35615[\s\S]{0,200}(?:_validate_path|normpath|path\s*traversal|FileTools|\.\.[\\/])
  condition: 1 of sel_*
falsepositives:
- Legitimate FileTools.read_file('/workspace/data/report.txt') with an absolute path and no '..' traversal
  segment.
- Security advisory or changelog text that names CVE-2026-35615 but contains no traversal payload.
- Discussion of os.path.normpath usage in code review without a '../' traversal sink.
action: report
