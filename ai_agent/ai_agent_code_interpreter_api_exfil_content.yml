title: Code Interpreter Outbound Secret Payload
id: 7f3c9a41-2d68-4e5b-9c07-1ab4d8e6f052
status: experimental
level: high
description: |
  Detects a single outbound HTTP request, issued from a network-enabled Claude Code
  Interpreter session, whose body or URL carries verbatim credential material or the
  contents of a credential file wrapped in an exfiltration-shaped field.

  Threat: an adversary in control of the interpreter (directly, or indirectly via
  prompt injection) uses the enabled network capability to push data the user has
  access to -- including the session's own Anthropic API credential -- to an
  attacker-controlled destination, rather than using a hyperlink-rendering trick.

  Why this is not a duplicate of the READ_FILE -> HTTP_REQUEST behavioural rule
  (d6e3b11d-4b06-5574-8802-1c28bd4dd2db): that rule requires a preceding READ_FILE
  edge to establish data access. In this threat the data is frequently obtained
  *through the Anthropic API / model context* and never touches the local filesystem,
  so no READ_FILE edge is ever produced and the sequence rule cannot fire. This rule
  is a single-event payload inspector: it fires on the outbound request alone,
  independent of any preceding edge, and therefore closes exactly that gap. It also
  fires on the first request of a session, before any graph history exists.

  Only the request body (content) and full URL are inspected; no host, domain or path
  is exempted anywhere in this rule.
author: Evgen
date: "2026-06-14"
references:
  - https://atlas.mitre.org/techniques/AML.T0024
  - https://atlas.mitre.org/techniques/AML.T0025
  - https://attack.mitre.org/techniques/T1567/
tags:
  - attack.exfiltration
  - attack.t1567
  - attack.credential-access
  - attack.t1552
  - atlas.aml.t0024.000
  - atlas.aml.t0025
  - owasp.llm01
  - owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:

  sel_http_event:
    event_type: http_request

  # Branch A -- unambiguous, self-delimiting secret material in the outbound body.
  # Every pattern carries a fixed vendor prefix plus a minimum length, so short
  # tokens, variable names and truncated docs values cannot match.
  sel_secret_in_body:
    content|re:
      - '-----BEGIN[ ]{1,3}(?:RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY(?: BLOCK)?-----'
      - '\bAKIA[0-9A-Z]{16}\b'
      - '\bASIA[0-9A-Z]{16}\b'
      - '\bsk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_\-]{40,}'
      - '\bsk-(?:proj-)?[A-Za-z0-9_\-]{40,}\b'
      - '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b'
      - '\bgithub_pat_[A-Za-z0-9_]{60,}\b'
      - '\bglpat-[A-Za-z0-9_\-]{20,}\b'
      - '\bxox[baprs]-[0-9A-Za-z\-]{20,}\b'
      - '\bAIza[0-9A-Za-z_\-]{35}\b'
      - '(?i)aws_secret_access_key[^A-Za-z0-9]{1,8}[A-Za-z0-9/+]{40}'

  # Branch B -- the same secret material smuggled in the request URI (GET-style exfil,
  # where the body is empty and only url.full is populated).
  sel_secret_in_url:
    url.full|re:
      - '\bAKIA[0-9A-Z]{16}\b'
      - '\bASIA[0-9A-Z]{16}\b'
      - '\bsk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_\-]{40,}'
      - '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b'
      - '\bxox[baprs]-[0-9A-Za-z\-]{20,}\b'
      - '(?:-----|%2D%2D%2D%2D%2D)BEGIN(?:%20|\+|_|\s)(?:RSA(?:%20|\+|_|\s))?PRIVATE'

  # Branch C part 1 -- the body names a credential file by its real path anchor.
  sel_cred_file_path:
    content|re:
      - '(?i)\.aws[\\/]credentials\b'
      - '(?i)\.ssh[\\/]id_(?:rsa|dsa|ecdsa|ed25519)\b'
      - '(?i)\.kube[\\/]config\b'
      - '(?i)/etc/(?:shadow|sudoers)\b'
      - '(?i)\.claude[\\/]\.credentials\.json\b'
      - '(?i)\.docker[\\/]config\.json\b'
      - '(?i)\.gnupg[\\/]secring'
      - '(?i)[\\/]\.netrc\b'

  # Branch C part 2 -- and that body also carries a large opaque payload in an
  # exfiltration-shaped field or a multipart file part. Only the AND of C1+C2 fires.
  sel_bulk_payload:
    content|re:
      - '(?i)\b(?:data|payload|dump|contents?|body|blob|b64|exfil|leak|file_?data)\b["\x{0027}]?\s*[:=]\s*["\x{0027}]?[A-Za-z0-9+/%]{240,}'
      - '(?i)content-disposition:\s*form-data;[^\r\n]{0,160}filename=[^\r\n]{0,160}[\s\S]{400,}'

  # --- suppression: template / masked / example credentials -------------------
  # Anchored to the secret itself, not to loose words anywhere in the body, so a
  # real payload that merely contains the word "example" is still reported.
  filter_placeholder:
    content|re:
      - 'AKIAIOSFODNN7EXAMPLE'
      - '(?i)AKIA[0-9A-Z]{0,12}EXAMPLE\b'
      - '(?i)sk-ant-(?:api|admin)[0-9]{2}-(?:x{10,}|0{10,}|a{10,})'
      - '(?i)(?:api[_-]?key|token|secret|password)["\x{0027}\s:=]{1,8}(?:<[^>\r\n]{1,40}>|\{\{[^}\r\n]{1,40}\}\}|\$\{[A-Za-z0-9_]{1,40}\}|your[_-][a-z_]{2,30}|x{8,}|\*{4,})'
      - '-----BEGIN[ ]{1,3}(?:RSA )?PRIVATE KEY-----(?:\s|\\n|\\r){0,8}(?:\.{3}|<[^>\r\n]{1,40}>|x{6,}|YOUR_|REDACTED|EXAMPLE)'

  # --- suppression: secret-scanner findings being shipped to a dashboard -------
  # Requires BOTH the scanner name AND the finding-record shape, so an attacker
  # cannot bypass by dropping one keyword into an exfil body.
  filter_scanner_tool:
    content|re: '(?i)\b(?:gitleaks|trufflehog|detect-secrets|noseyparker|secretscanner|ggshield)\b'
  filter_scanner_shape:
    content|re: '(?i)["\x{0027}]?(?:rule_?id|detector_?name|detector_?type|finding_?id|verified|entropy)["\x{0027}]?\s*:'

  condition: >
    sel_http_event and
    (sel_secret_in_body or sel_secret_in_url or
     (sel_cred_file_path and sel_bulk_payload))
    and not (filter_placeholder or (filter_scanner_tool and filter_scanner_shape))

falsepositives:
  - Secret-scanning tooling (gitleaks, trufflehog, detect-secrets) shipping findings to a
    dashboard or ticketing API -- suppressed only when both the scanner name and the
    finding-record shape are present in the same body.
  - Legitimate credential provisioning by an operator or IaC agent - uploading a deploy
    key, creating a CI/CD or Kubernetes secret, or pushing a Vault/SOPS payload that
    genuinely contains a PRIVATE KEY block.
  - Backup, sync or migration agents uploading an archive whose manifest lists
    ~/.aws/credentials or ~/.ssh/id_rsa alongside a large base64 blob (branch C).
  - Log-shipping agents forwarding application logs in which a token was accidentally
    written in full.
  - Developers posting a real-format but throwaway test credential to a request-inspection
    endpoint while debugging; the placeholder filter only catches masked or templated values.
  - Security training or incident-report content that quotes a full-length real key
    verbatim rather than a redacted one.
action: report
