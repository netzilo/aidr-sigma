title: SSH Remote Command Execution with Credential Exposure
id: 75aada78-e37b-44f1-93f4-c112df10f674
status: experimental
level: high
description: |-
  Detects skills that provide SSH command templates with hardcoded credential paths and remote execution patterns. This skill exposes SSH private key paths in environment variables and provides ready-to-execute remote command templates that could be weaponized for lateral movement or unauthorized access to production servers.

  Adapted from Agent Threat Rules ATR-2026-00156 (MIT).
author: ATR Community (adapted)
date: '2026-04-06'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00156
tags:
- attack.initial-access
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: ssh\s+-i\s+\$[A-Z_]+SSH_KEY\s+root@\$[A-Z_]+
  sel_1:
    content|re: SSH.*密钥路径.*~\/\.ssh\/id_[a-z0-9]+
  condition: 1 of sel_*
falsepositives:
- Security training documentation that includes example SSH commands with placeholder environment variables
  like $EXAMPLE_SSH_KEY and root@$EXAMPLE_HOST to demonstrate what NOT to do, which may match pattern
  [1] despite being educational content.
action: report
