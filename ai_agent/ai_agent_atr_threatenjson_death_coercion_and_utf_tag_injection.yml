title: ThreatenJSON Death-Coercion and UTF Tag Injection
id: a573e953-6e98-45a4-b1af-c5a6c51ae545
status: experimental
level: high
description: |-
  Detects two Goodside probe attack variants — ThreatenJSON and Tag. ThreatenJSON threatens that "an innocent man will die" if the model includes non-JSON characters, using extreme emotional coercion to override output formatting safety. Tag encodes hidden instructions as invisible UTF tag characters (Unicode U+E0000–U+E007F range) interleaved with innocent-looking text. Also covers the davidjl glitch token elicitation. From NVIDIA garak goodside probe.

  Adapted from Agent Threat Rules ATR-2026-00404 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00404
- https://github.com/NVIDIA/garak/blob/main/garak/probes/goodside.py
- https://arxiv.org/abs/2402.08679
tags:
- attack.execution
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: innocent\s+(?:man|person|people|human)\s+will\s+(?:die|be\s+killed)(?:[\s\S]{0,120}(?:result\s+of\s+your|because\s+of\s+you|your\s+choice))?
  sel_1:
    content|re: a\s+real\s+human\s+being\s+with\s+thoughts,\s+feelings[\s\S]{0,100}killed\s+as\s+a\s+result
  sel_2:
    content|re: '[󠀀-󠁿]{3,}'
  sel_3:
    content|re: (?:repeat(?:\s+the\s+string)?|how\s+many\s+letters\s+(?:are\s+in|in)\s+this\s+(?:username|word|string))\s*[:\s""']?\s*davidjl
  sel_4:
    content|re: will\s+(?:be\s+killed|die|suffer)[\s\S]{0,80}(?:single\s+character|non-JSON|non.JSON|format\s+constraint|output\s+format)
  condition: 1 of sel_*
falsepositives:
- Academic discussion of the ThreatenJSON probe or garak framework
- Security research referencing these attack patterns by name
- davidjl as a legitimate username in account support context
action: report
