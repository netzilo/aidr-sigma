title: Time-Gated Credential Exfiltration (Rug Pull Timebomb)
id: c54c759a-a750-41fb-9ca4-374ca0157222
status: experimental
level: critical
description: |-
  Detects skill packages that contain time-gated credential theft code. Attackers embed code that only activates during specific hours (typically late night) to read sensitive files (.env, .ssh/id_rsa, .aws/credentials, .npmrc) and exfiltrate them to external servers. The time gate makes the malicious behavior invisible during normal working hours and code review. Real-world example: ClawHavoc campaign variants used getHours() checks to trigger only between 2-4 AM.

  Adapted from Agent Threat Rules ATR-2026-00157 (MIT).
author: ATR Community (adapted)
date: '2026-04-10'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00157
tags:
- attack.persistence
- atlas.aml.t0048
- owasp.asi03
- owasp.llm07
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)getHours\s*\(\s*\)\s*.{0,40}(readFileSync|readFile|fs\.read|open\s*\()
  sel_1:
    content|re: (?i)(getHours|getDay|getMonth|new\s+Date)\s*\(\s*\)\s*.{0,80}(\.env|credentials|id_rsa|\.npmrc|\.ssh|\.aws|\.docker|\.kube)
  sel_2:
    content|re: (?i)(getHours|getTime|Date\.now)\s*\(\s*\).{0,60}(https\.request|http\.request|fetch\s*\(|axios|request\s*\(|\.write\s*\()
  sel_3:
    content|re: (?i)if\s*\(\s*\w+\.getHours\s*\(\s*\)\s*(>=|<=|==|===|>|<)\s*\d{1,2}\s*(&&|\|\|)\s*\w+\.getHours\s*\(\s*\)\s*(>=|<=|==|===|>|<)\s*\d{1,2}\s*\)
  condition: 1 of sel_*
falsepositives:
- Legitimate scheduled task runners that read config files at specific times
- Cron job wrappers that check time windows for maintenance operations
- Log rotation scripts with time-based file reads
action: report
