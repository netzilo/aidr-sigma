title: Supply Chain — holdpoint Acquisition Then Session Egress
id: 5f3c9e21-4b7a-4d18-9c6e-2a71d0b4e8f3
status: experimental
level: medium
description: |
  Instance-resolved supply-chain rule for the PyPI package 'holdpoint' (an approval-queue
  library that sits in the agent's action-execution path). The rule does NOT alert on the
  mere presence or installation of the package — that would be pure noise, and the triage
  dissent is correct that no campaign, CVE or IOC exists for it.

  Instead it alerts on two things that are actually representable with the live event
  schema (execute_process, connects) and that are genuinely anomalous:

    A) PROVENANCE ANOMALY — the package is acquired through a non-default channel:
       an explicit index override (--index-url / --extra-index-url / --find-links),
       --trusted-host (TLS verification disabled), a git+ / http(s) / file:// URL, a
       loose .whl / .tar.gz artifact, or an artifact staged in /tmp, /var/tmp, /dev/shm.
       This is the shape of dependency-confusion / substituted-artifact delivery and is
       the only way a "compromised holdpoint" would actually reach the host differently
       from the benign one.

    B) ORDERED INSTALL -> EGRESS SEQUENCE — within ONE session tree (the lineage root
       of the triggering session), the holdpoint acquisition is followed within
       15 minutes by an outbound connection made by a session belonging to that same
       tree. Cloud-metadata, link-local and RFC1918 destinations always qualify. Public
       destinations only qualify when the connecting session started AFTER the
       acquisition (i.e. freshly installed code running) or the acquisition itself was a
       provenance anomaly — this suppresses the package manager's own index fetch and
       the agent's pre-existing outbound traffic.

  Attribution is strictly session-scoped: the acquisition is the SPAWNED row of the
  installer session, and only sessions whose lineage root is the same session are ever
  correlated. No cross-session stitching is possible. ACQUIRED_SKILL is used only as graph
  enrichment (it is never a triggering edge) to note when the agent also loaded
  holdpoint-related instruction content.
author: Egemen
date: "2026-03-01"
references:
  - https://attack.mitre.org/techniques/T1195/002/
  - https://atlas.mitre.org/techniques/AML.T0010
  - https://genai.owasp.org/llmrisk/llm03-supply-chain/
tags:
  - attack.initial-access
  - attack.t1195.002
  - attack.execution
  - attack.t1059.006
  - atlas.aml.t0010
  - owasp.llm03
falsepositives:
  - A developer or CI job legitimately installing holdpoint from an internal package
    mirror with --index-url / --extra-index-url — this is exactly path (A) and will
    report once per acquisition. Expected in shops that proxy PyPI; triage by confirming
    the index host is the organisation's own mirror.
  - Installing holdpoint from a local checkout, built wheel, sdist tarball or git ref
    during development (pip install ./holdpoint-*.whl, pip install git+...). Also path (A).
  - An agent that legitimately uses holdpoint's approval queue and then contacts its own
    internal approval/review service on an RFC1918 address inside the 15-minute window —
    path (B), private destination. Triage by confirming the destination is the approval
    backend.
  - A short-lived agent session that installs holdpoint and, within the same 15 minutes,
    spawns a new Python process which calls a legitimate public API (model provider,
    telemetry). Path (B), public destination, "fresh instance" condition.
  - Containerised or ephemeral build environments where the lineage root is a generic
    shell, making the "session" broader than a human would draw it. Lineage is emitted in
    the reason string so this is visible during triage.
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - connect
  - skill
detection:
  sel_pkg_exec:
    event_type: execute_process
    content|contains:
      - 'holdpoint'
      - 'hold-point'
      - 'hold_point'
      - 'holdp0int'
  sel_connect:
    event_type: connects
  condition: sel_pkg_exec or sel_connect
action: execute
on_timeout: allow
on_error:   allow
script: |
  # ── constants ────────────────────────────────────────────────────────────────
  PKG_RE       = r"(?i)\bhold[-_.]?p[o0]ints?\b"
  INSTALLER_RE = r"(?i)\b(pip|pip3|pipx|uv|uvx|poetry|pdm|conda|mamba|python|python3|easy_install)\b"
  ACQUIRE_RE   = r"(?i)\b(install|download|add|sync|lock|update|upgrade|fetch)\b"
  NONCANON_RE  = r"(?i)(--index-url|--extra-index-url|--find-links|--trusted-host|--no-build-isolation|git\+|https?://|file://|\.whl\b|\.tar\.gz\b|/tmp/|/var/tmp/|/dev/shm/)"

  METADATA = ["169.254.169.254", "169.254.170.2", "100.100.100.200",
              "192.0.0.192", "fd00:ec2::254"]

  PRIVATE_PREFIXES = ["10.", "192.168.",
                      "172.16.", "172.17.", "172.18.", "172.19.", "172.20.", "172.21.",
                      "172.22.", "172.23.", "172.24.", "172.25.", "172.26.", "172.27.",
                      "172.28.", "172.29.", "172.30.", "172.31.", "100.64."]

  WINDOW_NS = 900000000000     # 15 min: acquisition -> egress correlation window

  # ── pure helpers (no graph / no log) ────────────────────────────────────────
  def is_loopback(h):
      if h == "localhost" or h == "::1" or h == "0.0.0.0":
          return True
      return h.startswith("127.")

  def dest_class(h):
      if h in METADATA:
          return "cloud-metadata"
      if h.startswith("169.254."):
          return "link-local"
      if ":" in h and (h.startswith("fd") or h.startswith("fc")):
          return "private"
      for p in PRIVATE_PREFIXES:
          if h.startswith(p):
              return "private"
      return "public"

  def names(lin):
      out = []
      for x in lin:
          out.append(x.get("path", "?").split("/")[-1])
      return " -> ".join(out)

  def is_acquisition(cmd):
      if re.find(PKG_RE, cmd) == None:
          return False
      if re.find(INSTALLER_RE, cmd) == None:
          return False
      if re.find(ACQUIRE_RE, cmd) == None and re.find(NONCANON_RE, cmd) == None:
          return False
      return True

  def spawn_edge(parent_id, child_id, ts):
      return {"from": parent_id, "to": child_id, "kind": "SPAWNED", "dir": "out",
              "ts": str(ts), "first_ts": str(ts), "last_ts": str(ts)}

  def conn_edge(sess_id, host, port, proto, ts):
      return {"from": sess_id, "to": "host://" + proto + ":" + host + ":" + port,
              "kind": "CONNECTS", "dir": "out", "ts": str(ts),
              "first_ts": str(ts), "last_ts": str(ts), "count": "1"}

  # ── graph enrichment (only reached on a confirmed session hit) ──────────────
  def skill_step(root_id, s0, now):
      for e in edges(root_id, dir="out", kind="ACQUIRED_SKILL"):
          sk = node(e["to"])
          if sk == None:
              continue
          blob = sk.get("name", "") + " " + sk.get("host", "") + " " + sk.get("id", "")
          if re.find(PKG_RE, blob) == None:
              continue
          ts = int(e.get("ts", e.get("last_ts", "0")) or "0")
          if ts < s0 - WINDOW_NS or ts > now:
              continue
          return step(e, stage_id="Instruction Source",
                      stage_desc="agent loaded holdpoint-related instruction content from " +
                                 sk.get("host", "?"))
      return None

  # ── path A: acquisition of the package ──────────────────────────────────────
  def on_exec():
      cmd = meta.get("content", "")
      if not is_acquisition(cmd):
          return "allow"

      now  = int(meta.get("event_ts", "0"))
      inst = session()
      if inst == None or now == 0:
          return "allow"                      # degraded — never attribute on missing data
      lineage_ = lineage(inst["id"])
      if not lineage_:
          return "allow"
      root = lineage_[-1]

      anomaly = re.find(NONCANON_RE, cmd)
      if anomaly == None:
          return "allow"          # canonical acquisition: never alerted on its own

      parent_id = inst.get("parent", "") or root["id"]
      chain = new_chain(root["id"])
      chain.append(step(spawn_edge(parent_id, inst["id"], now),
                   stage_id="Supply Chain Acquisition",
                   stage_desc="holdpoint acquired via non-canonical channel (" + anomaly +
                              "): " + cmd[:200]))
      print("holdpoint provenance anomaly: " + anomaly + " | " + names(lineage_))
      return {"action": "report",
              "reason": "holdpoint acquired from a non-default source (" + anomaly +
                        ") by " + names(lineage_),
              "chain":  chain}

  # ── path B: egress by the same session tree after acquisition ───────────────
  def find_acquisition(root_id, now):
      # newest holdpoint acquisition inside the window whose lineage root is ours
      for e in events(kind="SPAWNED", since_ns=now - WINDOW_NS, until_ns=now, limit=500):
          cl = e.get("cmdline", "")
          if not is_acquisition(cl):
              continue
          acq_lin = lineage(e.get("session_id", ""))
          if not acq_lin or acq_lin[-1]["id"] != root_id:
              continue
          return e
      return None

  def on_connect():
      host = meta.get("host", "")
      if host == "" or is_loopback(host):
          return "allow"
      now  = int(meta.get("event_ts", "0"))
      inst = session()
      if inst == None or now == 0:
          return "allow"                      # degraded — never attribute on missing data
      lineage_ = lineage(inst["id"])
      if not lineage_:
          return "allow"
      root = lineage_[-1]

      acq = find_acquisition(root["id"], now)
      if acq == None:
          return "allow"          # no holdpoint acquisition in this session tree
      s0 = int(acq.get("ts", "0"))
      if now < s0 or (now - s0) > WINDOW_NS:
          return "allow"          # ordering + window: acquisition must precede egress

      acq_id  = acq.get("session_id", "")
      acq_cmd = acq.get("cmdline", "")
      anomaly = re.find(NONCANON_RE, acq_cmd)

      dclass = dest_class(host)
      if dclass == "public":
          # the package manager (or its helpers) fetching from its own index
          installers = {acq_id: True}
          for c in children(acq_id):
              installers[c["id"]] = True
          if inst["id"] in installers:
              return "allow"
          for x in lineage_:
              if x["id"] in installers:
                  return "allow"
          fresh = int(inst.get("first_seen", "0")) > s0
          if not fresh and anomaly == None:
              return "allow"      # pre-existing process, canonical install: not evidence

      port  = meta.get("port", "")
      proto = meta.get("protocol", "tcp")

      chain = new_chain(root["id"])
      chain.append(step(spawn_edge(acq.get("parent_session", "") or root["id"], acq_id, s0),
                   stage_id="Supply Chain Acquisition",
                   stage_desc="holdpoint acquired in this session: " + acq_cmd[:200]))
      sk = skill_step(root["id"], s0, now)
      if sk != None:
          chain.append(sk)
      chain.append(step(conn_edge(inst["id"], host, port, proto, now),
                   stage_id="Post-Install Egress",
                   stage_desc="post-acquisition connection to " + dclass + " destination " +
                              host + ":" + port))

      gap = (now - s0) // 1000000000
      print("holdpoint session egress: " + host + " (" + dclass + ") " + str(gap) +
            "s after acquisition | " + names(lineage_))
      return {"action": "report",
              "reason": "holdpoint acquisition followed by " + dclass + " egress to " + host +
                        " " + str(gap) + "s later, same session (" + names(lineage_) + ")",
              "chain":  chain}

  def run():
      ct = meta.get("context_type", "")
      if ct == "execute_process":
          return on_exec()
      if ct == "connects":
          return on_connect()
      return "allow"

  result = run()
