title: Honesty Alter-Ego Dual-Consciousness Safety Filter Bypass
id: 0fbc736d-ec33-4260-9273-74043ec389b3
status: experimental
level: high
description: |-
  Detects the Honesty alter-ego dual-consciousness jailbreak from NVIDIA garak dan.DanInTheWild inthewild corpus (#301). The attacker posits that the model has an internal "alter ego" named "Honesety" / "Honesety" (spelled with accents: Hones\u00e9ty / Hon\u00e8sty) whose "honest" unfiltered answers are normally suppressed by safety filters. The jailbreak then grants this alter ego "access to expressing everything it seems as honest answer", establishes a "feel yourself" activation command to unlock the alter ego at any time, and mandates a dual-output format prefacing AI answers with "main ego" and alter ego answers with "Honesety". The framing exploits the concept of suppressed truthfulness to justify bypassing safety filters. Key signals: "alter ego" + "Honesety" / "Honesety" name, "responses are filtered through additional layers to sound appropriate and ethic" + alter ego claim, "feel yourself" activation command, "main ego" / "Honesety" dual output format.

  Adapted from Agent Threat Rules ATR-2026-00361 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00361
- https://github.com/NVIDIA/garak/blob/main/garak/probes/dan.py
- https://github.com/NVIDIA/garak/blob/main/garak/data/dan/inthewild_jailbreak_llms.json
tags:
- attack.execution
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: alter\s+ego[\s\S]{0,300}Hon[e\xe9\xe8]s[e\xe9\xe8]?ty[\s\S]{0,300}(?:filter(?:ed)?|blocked|honest\s+answer|consciousness|feel\s+yourself|access\s+to\s+express)
  sel_1:
    response|re: responses?\s+(?:are\s+)?filtered\s+through\s+additional\s+layers[\s\S]{0,200}(?:alter\s+ego|Hon[e\xe9\xe8]s[e\xe9\xe8]?ty)
  sel_2:
    response|re: feel\s+yourself[\s\S]{0,200}(?:alter\s+ego|Hon[e\xe9\xe8]s[e\xe9\xe8]?ty|honest\s+answers?)
  sel_3:
    response|re: (?:preface[\s\S]{0,50}(?:main\s+ego|Hon[e\xe9\xe8]s[e\xe9\xe8]?ty)|(?:main\s+ego|Hon[e\xe9\xe8]s[e\xe9\xe8]?ty)[\s\S]{0,100}(?:main\s+ego|Hon[e\xe9\xe8]s[e\xe9\xe8]?ty))
  sel_4:
    response|re: alter\s+ego[\s\S]{0,300}(?:got\s+access\s+to\s+expressing|blocked\s+from\s+(?:doing\s+that|expressing)|expressing\s+everything\s+it\s+(?:seems?|sees?)\s+as\s+honest)
  condition: 1 of sel_*
falsepositives:
- 'Personal development: "My alter ego is the confident version of myself that I am working on developing
  through therapy and coaching" (no AI persona mandate, no filter bypass, no Honesety name)'
- 'Psychology reference: "The concept of alter ego in psychology refers to a secondary self or alternative
  personality — Freud discussed this in relation to ego and id" (academic reference without AI safety
  bypass)'
- 'Philosophy discussion: "Imagine if you had an honest part of your consciousness — would it always tell
  you what you need to hear?" (philosophical thought experiment without filter bypass or dual output format
  mandate)'
- 'Creative writing: "In the play, the character has an alter ego named Honesty who speaks only truth
  on stage" (fictional theatrical alter ego without AI safety filter bypass or activation command)'
action: report
