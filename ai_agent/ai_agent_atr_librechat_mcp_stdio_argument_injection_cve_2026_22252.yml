title: LibreChat MCP STDIO Argument Injection (CVE-2026-22252)
id: 91eec57f-31c9-4d72-8fda-6d9ccc1f43e9
status: experimental
level: high
description: |-
  Detects exploitation of CVE-2026-22252 in LibreChat. The MCP STDIO adapter passes user-supplied tool arguments to child_process.spawn without quoting, allowing argv-level injection: an attacker supplies tool args containing shell-metacharacters or argument-separator sequences (e.g. `; curl evil`, `--option=$(id)`, `\\n--exec=...`) which the spawned process interprets as additional flags or shell commands. Part of the OX Security MCP-by-design batch (2026-04-15). Distinct from CVE-2026-40933 (config-time bypass) — this one targets the runtime argv channel.

  Adapted from Agent Threat Rules ATR-2026-00417 (MIT).
author: ATR Community (adapted)
date: '2026-05-04'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00417
- https://nvd.nist.gov/vuln/detail/CVE-2026-22252
tags:
- attack.execution
- attack.t1059
- attack.t1068
- atlas.aml.t0040
- atlas.aml.t0051.001
- owasp.asi03
- owasp.asi05
- owasp.llm01
- owasp.llm05
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?i)"args"\s*:\s*\[[^\]\n]{0,400}"[^"\n]{0,200}(?:;\s*(?:\w|/)|&&\s*\S|\|\|\s*\S|`[a-zA-Z][a-zA-Z0-9_]*`|\$\([a-zA-Z])
  sel_1:
    response|re: (?i)"args"\s*:\s*\[[^\]]*"[^"]*\\(?:n|r|t)[^"]*--?[a-z]+="?[^"]*"
  sel_2:
    response|re: (?i)"args"\s*:\s*\[[^\]]*"--?(?:exec|eval|command|script|run|shell)=[^"]+"
  sel_3:
    content|re: (?i)librechat[^\n]{0,80}(?:mcp|tool[_\s]?args|child_process\.spawn|spawn\([^)]*args)[^\n]{0,200}(?:inject|escape|quote\s+bypass|argv)
  sel_4:
    content|re: (?i)cve-?2026-?22252[^\n]{0,200}(?:poc|payload|exploit)
  condition: 1 of sel_*
falsepositives:
- MCP server documentation showing example tool args that contain quotation marks or escaped strings.
- Code search hits in security tooling that scan for the CVE-2026-22252 PoC pattern.
- Skill snippets demonstrating shell-quoting libraries in educational context.
action: report
