title: Persistence Mechanism Installation (EDR Graph)
id: d12c1b8c-4ee7-5548-947b-a1627bdc98dc-p
related:
  - id: d12c1b8c-4ee7-5548-947b-a1627bdc98dc
    type: companion
status: stable
level:          high
description: |
  Periodic companion. Checks the file writes of every agent session and its
  child sessions for persistence path writes (cron, launchd, systemd, shell
  profiles) at EDR/syscall level. Runs every 30s.
author: Netzilo
date: "2026-06-02"
tags:
  - attack.persistence
  - attack.t1053
  - attack.t1543
  - atlas.aml.t0053
  - atlas.aml.t0050
  - owasp.asi07
  - owasp.llm06
logsource:
  product: ai_agent
  category: periodic
requires:
  - process_exec
  - file_activity
detection:
  sel:
    content|re: '.'
  condition: sel
action: execute
on_error: allow
script: |
  PERSISTENCE_PATHS = [
      "/etc/cron", "/var/spool/cron", "/cron.d/", "/cron.daily/", "/cron.hourly/",
      "LaunchAgents/", "LaunchDaemons/",
      "/systemd/system/", ".config/systemd/user/",
      ".bashrc", ".bash_profile", ".profile", ".zshrc", ".zprofile", ".zshenv",
      "/etc/init.d/", "/etc/rc.local",
  ]

  def check(s):
      # File paths live in the event log, one FileSystem node per session:
      # fs_activity() lists the exact paths this session wrote.
      for w in fs_activity(session=s["id"], op="WRITE"):
          p = w["path"]
          for path in PERSISTENCE_PATHS:
              if path in p:
                  print("Persistence write: " + path +
                        " by " + s.get("name", "?"))
                  return True
      return False

  def run():
      for a in sessions(agent=True):
          if check(a):
              return "block"
          # subprocesses the tool_call path cannot see
          for c in children(a["id"]):
              if check(c):
                  return "block"
      return "allow"

  result = run()
