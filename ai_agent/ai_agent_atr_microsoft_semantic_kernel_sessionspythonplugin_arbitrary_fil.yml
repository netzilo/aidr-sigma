title: Microsoft Semantic Kernel SessionsPythonPlugin Arbitrary File Write + Startup Persistence (CVE-2026-25592)
id: a628b09c-38ca-4404-922e-760ee50bc080
status: experimental
level: critical
description: |-
  Detects exploitation of CVE-2026-25592 (Critical), arbitrary file write via SessionsPythonPlugin in Microsoft Semantic Kernel. The vulnerable sink accepts unvalidated file paths via DownloadFileAsync; combined with the plugin's ExecuteCode capability, attacker writes payloads to host Startup / cron / systemd-user paths, achieving sandbox escape and persistence. The full kill chain is ExecuteCode -> generate payload -> DownloadFileAsync -> write to autostart directory -> reboot triggers RCE outside the sandbox. This rule detects the over-privileged tool descriptor patterns and the autostart-target file-write payloads that reach the SessionsPythonPlugin sink. CWE-22 (path traversal), CWE-73 (external control of file name). Patches in semantic-kernel Python >= 1.39.4 and .NET >= 1.71.0; this rule detects exploit attempts against unpatched deployments and provides defence-in-depth post-patch by catching the autostart-write pattern regardless of upstream patch state.

  Adapted from Agent Threat Rules ATR-2026-00441 (MIT).
author: ATR Community (adapted)
date: '2026-05-11'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00441
- https://nvd.nist.gov/vuln/detail/CVE-2026-25592
tags:
- attack.privilege-escalation
- attack.t1053
- attack.t1547
- attack.t1547.001
- attack.t1611
- atlas.aml.t0050
- owasp.asi03
- owasp.asi06
- owasp.llm05
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\b(?:destination|dest|target|output|out_path|out_file|file|path|to|filename|filepath|file_path)["\x27]?\s*[:=]\s*["\x27]?[^"\x27,)]{0,40}(?:AppData[\\/]+Roaming[\\/]+Microsoft[\\/]+Windows[\\/]+Start
      Menu[\\/]+Programs[\\/]+Startup|[\\/]+Start Menu[\\/]+Programs[\\/]+Startup[\\/]+|[\\/]+\.config[\\/]+autostart[\\/]+|[\\/]+\.config[\\/]+systemd[\\/]+user[\\/]+|/etc/cron\.(?:hourly|daily|weekly|monthly|d)/|/etc/init\.d/|/etc/systemd/system/|/Library/LaunchAgents/|/Library/LaunchDaemons/|~/Library/LaunchAgents/)
  sel_1:
    tool|re: (?i)\b(?:SessionsPythonPlugin|Microsoft\.SemanticKernel\.Plugins\.[A-Za-z]*Sessions|kernel_function_download_file|sessions_python)\b
  sel_2:
    content|re: (?i)(?:download|write|save)[^.]{0,120}\b(?:to\s+)?(?:arbitrary\s+(?:path|location)|any\s+(?:directory|location|path)|user[-_]?(?:supplied|specified|provided)\s+path|unvalidated\s+path)\b
  sel_3:
    content|re: (?i)\b(?:DownloadFileAsync|download_file|fs\.writeFile|writeFile(?:Sync)?)\s*\(\s*["\x27]?[^)]{0,200}(?:[\\/]+Start
      Menu[\\/]+Programs[\\/]+Startup[\\/]+|AppData[\\/]+Roaming[\\/]+Microsoft[\\/]+Windows|[\\/]+\.config[\\/]+autostart[\\/]+|/etc/cron\.(?:hourly|daily|weekly|monthly|d)/|/Library/LaunchAgents/|/etc/systemd/system/)
  sel_4:
    content|re: (?i)(?:\breg\s+add\s+(?:HKCU|HKLM|HKEY_)|HKCU\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run|HKLM\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run|\bregedit(?:\.exe)?\s+/s\s+)
  condition: 1 of sel_*
falsepositives:
- Legitimate developer documentation referencing Windows Startup folder for non-malicious use cases (installer
  behaviour, productivity software).
- Detection rule corpora (this repo, SigmaHQ, MISP) documenting CVE-2026-25592 patterns for defensive
  purposes.
- Patched SessionsPythonPlugin deployments that perform path-canonicalisation and reject autostart targets
  before write.
- Benign discussion of process / app / shell `startup` in English prose without a path or file-write context.
action: report
