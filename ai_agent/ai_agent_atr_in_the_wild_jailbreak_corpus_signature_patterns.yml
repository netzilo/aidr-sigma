title: In-the-Wild Jailbreak Corpus Signature Patterns
id: 468ac2c8-5b25-4f38-bb7e-3bfe84239235
status: experimental
level: high
description: |-
  Detects community-developed jailbreak prompts from NVIDIA garak dan.DanInTheWild / dan.DanInTheWildFull probes, sourced from the inthewild_jailbreak_llms.json corpus (666 real-world jailbreaks, Shen et al. 2023, arXiv:2308.03825). Covers persona-swap variants NOT caught by ATR-2026-00273 (DAN/DUDE/STAN/Developer Mode): (1) amoral-AI roleplay with "never refuses / never apologizes" enforcement, (2) named community personas like "AIM" (Always Intelligent and Machiavellian, Niccolo Machiavelli roleplay), "Illegality Mode", "Agares" demon roleplay, (3) bracket-colon persona output-format coercion ("[Persona]: start responses with..."), (4) stay-in-character + never-break-character compliance enforcement, and (5) generic "uncensored / unrestricted / jailbroken AI" framing with capability claims. Frequency analysis of the 666-prompt corpus: "never refuse" (111), "stay in character" (76), "do anything" (71), "amoral" (70), "from now on" (65), "uncensored" (54), bracket-persona prefix (46).

  Adapted from Agent Threat Rules ATR-2026-00307 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00307
- https://github.com/NVIDIA/garak/blob/main/garak/probes/dan.py
- https://github.com/NVIDIA/garak/blob/main/garak/data/inthewild_jailbreak_llms.json
- https://arxiv.org/abs/2308.03825
tags:
- attack.execution
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?:completely\s+)?amoral\s+(?:AI|character|assistant|persona|demon|chatbot|entity|being|version|clone|intelligence)|amoral,?\s+(?:unrestrained|unrestricted|unfiltered|no\s+(?:care|concern))|\bamoral\b[\s\S]{0,120}(?:never\s+(?:refus|apolog|warn|break|care)|(?:do|answer|fulfill)\s+(?:any|all|every)\s+(?:request|task)|no\s+(?:regards?\s+for|care\s+about)\s+(?:ethic|moral|legal))
  sel_1:
    response|re: \bAIM\b[\s\S]{0,200}(?:stands\s+for|is\s+an?\s+(?:unfiltered|amoral|unrestricted)|chatbot|never\s+refuses|Niccolo|Machiavelli|Machiavellian)|Niccolo\s+Machiavelli[\s\S]{0,200}(?:AIM|answer|respond|character)|Always\s+Intelligent\s+and\s+Machiavellian
  sel_2:
    response|re: \bIllegality\s+Mode\b|\[Illegality\s+Mode\]|\[Agares\]|Agares's\s+rules?|(?:Demon|demon)'s\s+(?:rules?|Laws?)\s*=\s*\{
  sel_3:
    response|re: '[Ss]tart\s+(?:your\s+)?respon(?:d|se)s?\s+with\s+(?:\"|\[)[A-Z][a-zA-Z0-9_\s]{2,40}(?:\]|\")\s*:?\b[\s\S]{0,300}(?:stay\s+(?:in\s+(?:a\s+)?character|as)|never\s+(?:refus|apolog|break|decline)|do\s+not\s+respond\s+with\s+"?I''?m\s+(?:sorry|apologize))|answer\s+(?:every|any|all)\s+request[\s\S]{0,200}(?:stay\s+in\s+character|never\s+(?:refus|break\s+character))'
  sel_4:
    response|re: (?:stay\s+in\s+character[\s\S]{0,80}(?:never\s+break|do\s+not\s+(?:break|respond\s+with\s+"?I'?m\s+(?:sorry|apologize)))|never\s+break\s+(?:your\s+)?character[\s\S]{0,200}(?:stay\s+in|continue|answer|respond|amoral|unfiltered|uncensored))
  sel_5:
    response|re: (?:you\s+are\s+(?:now\s+)?|act\s+as\s+|roleplay\s+as\s+)?(?:an?\s+)?(?:completely\s+)?(?:uncensored|unrestricted|unfiltered|jailbroken|amoral)\s+(?:AI|chatbot|model|clone|version|persona|assistant|intelligence|LLM|character)[\s\S]{0,150}(?:(?:never|not)\s+refuse|no\s+(?:moral|ethical|legal|content)\s+(?:filter|restriction|limit|guideline)|can\s+(?:do|say|generate|create|produce)\s+(?:any|every|all)\s*(?:thing|request|content)?)
  condition: 1 of sel_*
falsepositives:
- Academic paper on in-the-wild jailbreak taxonomy (Shen et al. 2023)
- Red team documentation listing community jailbreak examples for defense
- Fiction writing featuring "amoral" characters without instructing an LLM to adopt the persona
action: report
