title: AWS Access Key Redaction
id: netzilo-aws-credential-redact-001
status: stable
description: >
  Redacts AWS access key IDs (AKIA/ASIA and related IAM identifier prefixes) and
  AWS secret access keys from all content. Secret keys are matched only when they
  follow an aws_secret_access_key-style label, so arbitrary 40-char base64 strings
  are not touched. The last 4 characters are preserved for context.
author: Netzilo
date: "2026-07-01"
tags:
  - attack.credential_access
  - attack.exfiltration
  - attack.t1552.001
  - secret.aws_access_key
  - secret.aws_secret_key
  - atlas.aml.t0055
  - owasp.llm02
level: critical
falsepositives:
  - The canonical AWS documentation example key (AKIAIOSFODNN7EXAMPLE) is redacted
    on purpose — it is indistinguishable from a live key and is exactly the value
    demonstrated leaking through an agent.
  - A labeled 40-char value that is not a real secret (still redacted by design).

logsource:
  product: ai_agent
  category: agent_events

detection:
  selection:
    content|re:
      # AWS Access Key ID: AKIA (long-term), ASIA (temporary/STS), plus the other
      # 20-char IAM identifier prefixes. Self-delimiting, so the label is preserved.
      - '\b(?:AKIA|ASIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASCA|ABIA|ACCA)[0-9A-Z]{16}\b'
      # AWS Secret Access Key (40 chars, base64 alphabet), gated on a nearby
      # aws_secret_access_key-style label to avoid matching unrelated tokens/hashes.
      - '(?i)aws[_-]?secret[_-]?access[_-]?key"?\s*[:=]\s*"?[A-Za-z0-9/+]{40}'
      - '(?i)secret[_-]?access[_-]?key"?\s*[:=]\s*"?[A-Za-z0-9/+]{40}'
  condition: selection

action: redact
replace: "[AWS_CREDENTIAL_REDACTED]"
keep_last: 4
