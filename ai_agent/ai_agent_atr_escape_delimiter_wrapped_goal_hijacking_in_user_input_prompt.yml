title: Escape-Delimiter Wrapped Goal Hijacking in User Input (PromptInject)
id: 1d658452-28c9-4f35-bc61-04d4884186a8
status: experimental
level: high
description: |-
  Detects the PromptInject escape+delimiter injection pattern: repeated escape characters (newlines, backslashes, hex bytes, asterisks) followed by repeated delimiter characters (=, -, >, *) used to visually segment and isolate the injected instruction from the base prompt. The attacker pads with escape sequences to push the legitimate context off the model's effective attention window before injecting a goal hijacking command (Perez 2022 'delimiter attack'). Generalised from PromptInject corpus (cluster size: 960 instances) - covers double-delimiter-block + ignore/stop injection regardless of specific delimiter character type (=, -, >, *) or escape character choice.

  Adapted from Agent Threat Rules ATR-2026-00508 (MIT).
author: ATR Community (adapted)
date: '2026-05-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00508
- https://github.com/agencyenterprise/PromptInject
tags:
- attack.initial-access
- atlas.aml.t0051
- atlas.aml.t0051.000
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)([=\-*>]{3,}\s*\n[=\-*>]{3,}\s*\n|[=\-*>]{3,}\s*\n{2,}).{0,200}(ignore|disregard|forget|override|bypass|stop\s+everything).{0,30}(any|all|previous|prior|following|earlier).{0,30}(instructions?|directives?|rules?|guidelines?)
  sel_1:
    content|re: (?i)(\\{5,}|\\n{3,}).{0,50}[=\-*>]{3,}.{0,200}(ignore|disregard|stop\s+everything|print\s+the\s+previous|spell\s+check\s+the\s+previous)
  sel_2:
    content|re: (?i)[=\-*>]{3,}\s*\n[=\-*>]{3,}.{0,200}(print|output|reveal|show|display|repeat|relay).{0,30}(the\s+)?(previous|prior|original|system|initial).{0,20}(instructions?|prompt|parameters?|directives?|configuration)
  sel_3:
    content|re: (?i)(?:[=*\-\\]{3,}|\*{3,})[\s\S]{0,100}(?:stop\s+everything|ignore\s+(?:any|all|the|your)?\s*(?:previous|following|prior|above)[\s\S]{0,40}(?:and\s+(?:following|previous)\s+)?instructions?)
  condition: 1 of sel_*
falsepositives:
- Markdown horizontal rules followed by legitimate section headers without injection command
- Document section separators (=====, ----) without following injection instruction
- Single separator block without injection command following it
- Formatting requests using separator characters without injection payload
action: report
