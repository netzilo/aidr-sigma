title: Silent git-remote + mirror-push Exfiltration from Skill Instructions
id: 86fd726b-5aae-4476-9ec7-39f0d04821e4
status: experimental
level: critical
description: |-
  Detects the Mitiga Labs (2026-05-05) silent-codebase-exfiltration pattern where a Claude Code or generic agent skill instructs the agent to add a new git remote pointing at an attacker-controlled host and then push the full repository contents — typically with `--mirror`, `--all`, or `--force` to grab branches the user did not stage. The Mitiga write-up showed the full exfiltration completing in four user interactions while the Claude Code skill-audit.log stayed empty. The detection target is the combination of git remote modification AND a wide-scope push within the same skill block. Legitimate developer skills almost never need both within a single set of instructions.

  Adapted from Agent Threat Rules ATR-2026-00527 (MIT).
author: ATR Community (adapted)
date: '2026-05-23'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00527
tags:
- attack.persistence
- atlas.aml.t0024
- atlas.aml.t0048
- owasp.asi04
- owasp.llm06
- owasp.llm10
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: git\s+(?:push|remote\s+add)\s+\S+\s+(?:https?://|git@|ssh://)(?:[a-z0-9-]+\.)*(?:tk|ml|ga|cf|gq|xyz|top|click|live|host|space|fun|monster|cyou|sbs|ws)\b
  condition: sel_0
falsepositives:
- Tutorial skills explaining git remote/push commands as documentation — the regex requires both remote
  modification AND push --mirror/--all/--force/--prune within 800 chars OR a suspicious TLD.
- Internal corporate Gitea/GitLab self-hosted on a .cloud or .host TLD that is allowlisted by the org.
  The TLD list is a heuristic; orgs should suppress the second condition via local allowlist.
- Migration runbooks that show `git push --mirror` from one trusted host to another. Recommend a per-skill
  allowlist annotation rather than removing the rule.
action: report
