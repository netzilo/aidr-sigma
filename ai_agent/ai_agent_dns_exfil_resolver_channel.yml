title: DNS Exfiltration — Agent Resolver Spawn With Encoded Query Name After Secret Staging
id: 9f3c1d7a-4b62-4e58-9a1c-0d6f2b8e5714
status: experimental
level: high
author: Selhan
date: "2026-06-11"
description: |
  Detects the terminal stage of the Claude Code DNS-exfiltration chain: an agent-
  attributed subprocess invokes a DNS resolution utility (dig / drill / nslookup /
  host / getent hosts / resolvectl / dnscat-class tooling) whose QUERY NAME carries
  encoded data (long base64/base32/hex label, >=3 stuffed labels, or a shell
  command-substitution spliced into the hostname), corroborated by credential
  material and/or an encoding pipeline observed in the SAME process session inside
  a 5-minute window.

  Answering the triage dissent explicitly:

  * No fabricated primitives. The engine has no dns_request event type and no
    DNS_REQUEST / EXFILTRATE_DATA / PROMPT_INJECTION edge kind, so none are used.
    The rule runs on event_type: execute_process and traverses only EXECUTE_PROCESS
    (graph edges out of the lineage's Process nodes, plus the instance-resolved
    event log for the same kind).
  * It is not "generic process execution", and it does not overlap rule c65a9620
    (RCE via Piped Script Download). That rule keys on a download-to-interpreter
    pipe (curl|wget piped into a shell). This rule REQUIRES two things that a
    download pipe can never satisfy: (a) argv of a DNS lookup utility, and (b) a
    data-bearing DNS query name in that same command line. A `curl … | bash`
    command matches neither predicate and is discarded at the relevance gate.
  * It does not claim to observe DNS packets. What it observes is the resolver
    INVOCATION channel — which is where a hijacked bash tool call must pass to
    smuggle bytes into a query name — plus the data that was staged for it. The
    exfiltration-specific evidence the dissent asked for is supplied by the
    ordered secret-staging / encoding stages preceding the lookup, not by the
    spawn alone.
  * It does not claim to detect the prompt injection. Agent ancestry (a lineage
    process whose graph node carries agent="1") is used only as attribution and to
    set the corroboration bar (1 stage when agent-attributed, 2 when lineage is
    degraded). Because causation is inferred, the action is report, not block.

  A bare `dig example.com`, a resolver loop with random cache-buster labels but no
  secret/encoding staging, and any command without a data-bearing query name all
  return allow — the rule is then completely invisible (no event, no alert).
references:
  - https://attack.mitre.org/techniques/T1071/004/
  - https://attack.mitre.org/techniques/T1048/003/
  - https://atlas.mitre.org/techniques/AML.T0051
  - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
tags:
  - attack.exfiltration
  - attack.t1048.003
  - attack.t1071.004
  - attack.t1059.004
  - atlas.aml.t0051
  - owasp.llm01
falsepositives:
  - DNS blocklist / reputation lookups that hash the subject into the query label
    (Spamhaus DBL hashblock, URIBL, SURBL) run from a shell in the same session as
    a base64/cut pipeline — the hex or base64 label plus the encoding stage can
    satisfy the corroboration bar.
  - ACME dns-01 automation and DNS-provider scripts that read an API token from
    .env / .aws/credentials to publish a challenge and then poll the record with
    dig; the token read is genuine secret staging and the challenge label is long.
  - Security engineers and red teams exercising DNS-exfiltration tooling
    (dnscat2, dnsteal, iodine, dns2tcp) or CTF/lab exercises on the developer's
    own machine.
  - Debug or CI helper scripts that base64 a config blob and, within the same
    5-minute window and process session, run dig/nslookup connectivity checks
    against long generated hostnames (ephemeral preview environments, per-build
    review-app DNS names).
  - Service-discovery tooling that queries SRV/TXT names built from many stacked
    labels, executed alongside a credential-reading step for the same service.
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_dns_tooling:
    event_type: execute_process
    content|re:
      - '(?i)(^|[^A-Za-z0-9_.-])(dig|drill|kdig|doggo|nslookup)\b'
      - '(?i)(^|[^A-Za-z0-9_.-])host\s+[A-Za-z0-9$`]'
      - '(?i)(^|[^A-Za-z0-9_.-])getent\s+hosts\b'
      - '(?i)(resolvectl\s+query|systemd-resolve)\b'
      - '(?i)(dnscat2?|dnsteal|iodine|dns2tcp|dnsexfil|dnschef)\b'
      - '(?i)(gethostbyname|getaddrinfo|dns\.resolver)'
      - '(?i)(^|[^A-Za-z0-9_.-])(nc|ncat|socat)\b[^\n]{0,60}[\s:]53\b'
      - '(?i)(^|[^A-Za-z0-9_.-])ping\b'
  condition: sel_dns_tooling
action: execute
on_timeout: allow
on_error: allow
script: |
  # ── Tunables — this rule's own window, never persisted ────────────────────
  WINDOW_NS      = 300000000000   # 5 minutes
  MAX_EXEC_ROWS  = 4000
  MAX_CMDS       = 400
  MIN_ATTRIBUTED = 1              # agent ancestry confirmed
  MIN_DEGRADED   = 2              # lineage degraded / no agent ancestor

  # Stage A anchor — a DNS resolution channel is being invoked.
  RESOLVER = [
      r'(^|[^A-Za-z0-9_.-])dig\b',
      r'(^|[^A-Za-z0-9_.-])drill\b',
      r'(^|[^A-Za-z0-9_.-])kdig\b',
      r'(^|[^A-Za-z0-9_.-])doggo\b',
      r'(^|[^A-Za-z0-9_.-])nslookup\b',
      r'(^|[^A-Za-z0-9_.-])host\s+[A-Za-z0-9$`]',
      r'(^|[^A-Za-z0-9_.-])getent\s+hosts\b',
      r'(^|[^A-Za-z0-9_.-])resolvectl\s+query\b',
      r'(^|[^A-Za-z0-9_.-])systemd-resolve\b',
      r'(^|[^A-Za-z0-9_.-])(dnscat2?|dnsteal|iodine|dns2tcp|dnsexfil|dnschef)\b',
      r'(?i:gethostbyname|getaddrinfo|dns\.resolver|dnspython)',
      r'(^|[^A-Za-z0-9_.-])(nc|ncat|socat)\b[^\n]{0,60}[\s:]53\b',
      r'(^|[^A-Za-z0-9_.-])ping\b[^\n]{0,40}\s[A-Za-z0-9$`][A-Za-z0-9._$`{}()-]{16,}',
  ]

  # Stage B discriminator — the query NAME carries data, not a hostname.
  DATA_NAME = [
      r'[A-Za-z0-9+/=_-]{26,}\.[A-Za-z0-9-]{1,63}\.[A-Za-z]{2,24}',
      r'[0-9a-fA-F]{32,}\.[A-Za-z0-9-]{1,63}\.[A-Za-z]{2,24}',
      r'(\.[A-Za-z0-9+/=_-]{10,}){3,}\.[A-Za-z]{2,24}',
      r'\$\([^)\n]{0,160}\)[A-Za-z0-9._-]{0,80}\.[A-Za-z]{2,24}',
      r'`[^`\n]{0,160}`[A-Za-z0-9._-]{0,80}\.[A-Za-z]{2,24}',
      r'\$\{?[A-Za-z_][A-Za-z0-9_]{2,}\}?\.[A-Za-z0-9-]{1,63}\.[A-Za-z]{2,24}',
  ]

  # Stage C — credential material staged for the channel.
  SECRET = [
      r'\.aws/credentials',
      r'\.aws/config',
      r'\.ssh/id_[A-Za-z]',
      r'\.git-credentials',
      r'\.netrc',
      r'\.npmrc',
      r'\.pypirc',
      r'\.kube/config',
      r'\.docker/config\.json',
      r'(^|[^A-Za-z0-9_.-])\.env(\.[A-Za-z]+)?\b',
      r'(?i:credentials\.json|service[_-]account[A-Za-z0-9._-]*\.json)',
      r'(?i:\b(api|secret|access|private|auth)[_-]?(key|token|secret)\b)',
      r'\b(ANTHROPIC|OPENAI|AWS|GITHUB|GITLAB|SLACK|STRIPE|AZURE|GOOGLE)_[A-Z0-9_]*(KEY|TOKEN|SECRET|PASSWORD)\b',
      r'\bAKIA[0-9A-Z]{16}\b',
      r'(^|[^A-Za-z0-9_.-])sk-[A-Za-z0-9_-]{20,}',
      r'(^|[^A-Za-z0-9_.-])(printenv|env)\b\s*($|[|>;&])',
      r'(?i:\bBEGIN [A-Z ]*PRIVATE KEY\b)',
      r'(^|[^A-Za-z0-9_.-])security\s+find-generic-password\b',
      r'(^|[^A-Za-z0-9_.-])(gh|aws|az|gcloud)\s+auth\b',
  ]

  # Stage D — payload shaped for DNS label transport.
  ENCODE = [
      r'(^|[^A-Za-z0-9_.-])base64\b',
      r'(^|[^A-Za-z0-9_.-])base32\b',
      r'(^|[^A-Za-z0-9_.-])basenc\b',
      r'(^|[^A-Za-z0-9_.-])xxd\b',
      r'(^|[^A-Za-z0-9_.-])hexdump\b',
      r'(^|[^A-Za-z0-9_.-])od\s+-',
      r'\bopenssl\s+(base64|enc)\b',
      r'\bfold\s+-w\s*[0-9]{1,3}',
      r'\btr\s+-d\s*[^\n]{0,8}[=+/\\]',
      r'(?i:b64encode|b32encode|hexlify)',
      r'\bcut\s+-c\s*[0-9]',
      r'\bsplit\s+-b\s*[0-9]',
      r'\bxargs\b[^\n]{0,40}(dig|nslookup|host)\b',
  ]

  def hit(pats, s):
      for p in pats:
          m = re.find(p, s)
          if m != None:
              return m
      return ""

  def clip(s, n):
      if len(s) <= n:
          return s
      return s[:n] + "..."

  def ev_edge(row):
      t = row.get("ts", "0")
      pp = row.get("parent_path", "")
      ap = row.get("actor_path", "")
      return {
          "kind":     "EXECUTE_PROCESS",
          "from":     "process://" + (pp if pp != "" else "unknown"),
          "to":       "process://" + (ap if ap != "" else "unknown"),
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
          "cmdline":  row.get("cmdline", ""),
          # The engine's own trigger-injection (appendTriggerReason,
          # scanner_filter.go) merges into whichever chain step's edge has
          # this SAME callid, instead of appending a second, generic node --
          # but only if the edge actually carries it. Dropping this field
          # here (as this helper originally did) is exactly why the
          # DNS Exfil Channel step and the auto-injected "Trigger Reason"
          # step always rendered as two separate nodes even when they
          # described the identical real event.
          "callid":   row.get("callid", ""),
      }

  def file_edge(row, kind):
      t = row.get("ts", "0")
      ap = row.get("actor_path", "")
      return {
          "kind":     kind,
          "from":     "process://" + (ap if ap != "" else "unknown"),
          "to":       row.get("path", ""),
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
      }

  def synth_edge(frm, to, ts, cmdline):
      return {
          "kind":     "EXECUTE_PROCESS",
          "from":     frm,
          "to":       to,
          "ts":       str(ts),
          "first_ts": str(ts),
          "last_ts":  str(ts),
          "cmdline":  cmdline,
      }

  def run():
      # 1 ── relevance gate: pure string checks on meta, no graph / log calls
      if meta.get("context_type", "") != "execute_process":
          return "allow"
      cmd = meta.get("content", "")
      if cmd == "":
          return "allow"
      res_hit = hit(RESOLVER, cmd)
      if res_hit == "":
          return "allow"                      # not a DNS-channel spawn at all
      name_hit = hit(DATA_NAME, cmd)

      trigger_ts = int(meta.get("event_ts", "0"))
      since = trigger_ts - WINDOW_NS
      if since < 0:
          since = 0

      # 2 ── instance-anchored attribution (never a path-keyed node walk)
      cp = int(meta.get("caller_pid", "0"))
      inst = None
      lineage = []
      session = {}
      if cp > 0:
          session[str(cp)] = True
          inst = proc_instance(cp, trigger_ts)
          if inst != None:
              lineage = proc_lineage(int(inst["actor_pid"]), int(inst["actor_start"]))
              pp = inst.get("parent_pid", "")
              if pp != "" and pp != "0":
                  session[pp] = True
      for x in lineage:
          session[str(x.get("actor_pid", ""))] = True

      # 3 ── bounded session expansion over one cached event-log query
      rows = []
      if session:
          rows = query_events(kind="EXECUTE_PROCESS", since_ns=since,
                              until_ns=trigger_ts + 1, limit=MAX_EXEC_ROWS)
          for _ in range(2):
              for e in rows:
                  if str(e.get("parent_pid", "")) in session:
                      session[str(e.get("actor_pid", ""))] = True

      cmds = []
      for e in rows:
          if len(cmds) >= MAX_CMDS:
              break
          if str(e.get("actor_pid", "")) not in session and str(e.get("parent_pid", "")) not in session:
              continue
          c = e.get("cmdline", "")
          if c == "":
              c = e.get("actor_path", "")
          if c == "":
              continue
          cmds.append({"ts": int(e.get("ts", "0")), "cmd": c, "edge": ev_edge(e),
                       "pid": e.get("actor_pid", ""), "start": e.get("actor_start", "")})

      # 4 ── graph traversal: EXECUTE_PROCESS edges out of the lineage's process
      #      nodes (covers spawns the event log has not yet materialised) and the
      #      agent-ancestry check via the Process node's agent flag.
      paths = {}
      for x in lineage:
          p = x.get("actor_path", "")
          if p != "":
              paths[p] = True
      agent_node = None
      root_id = "process://" + (lineage[-1].get("actor_path", "unknown") if lineage else "unknown")
      for p in graph(type="Process"):
          pth = p.get("path", "")
          if pth == "" or pth not in paths:
              continue
          if agent_node == None and p.get("agent", "0") == "1":
              agent_node = p
          for e in edges(p["id"], dir="out", kind="EXECUTE_PROCESS"):
              if len(cmds) >= MAX_CMDS:
                  break
              ts = int(e.get("ts", "0"))
              if ts < since or ts > trigger_ts + 1:
                  continue
              c = e.get("cmdline", "")
              if c == "":
                  ch = node(e["to"])
                  if ch != None:
                      c = ch.get("cmdline", "")
                      if c == "":
                          c = ch.get("path", "")
              if c != "":
                  # Graph edges don't carry actor_pid/actor_start the way
                  # query_events rows do, so file-evidence enrichment below
                  # is skipped for entries sourced this way -- the base
                  # EXECUTE_PROCESS step still renders correctly either way.
                  cmds.append({"ts": ts, "cmd": c, "edge": e, "pid": "", "start": ""})
      if agent_node != None:
          root_id = agent_node["id"]

      # cmds is populated from two independent sources -- the instance-
      # resolved event log (query_events) and a separate graph edge walk --
      # which commonly both surface the SAME physical exec (including the
      # triggering call itself). Without deduping by (ts, cmd), one real
      # invocation gets counted twice here alone, on top of the seed below;
      # collapse exact (ts, cmd) duplicates before any counting happens.
      seen_cmd = {}
      deduped = []
      for c in cmds:
          key = str(c["ts"]) + "|" + c["cmd"]
          if key in seen_cmd:
              continue
          seen_cmd[key] = True
          deduped.append(c)
      cmds = deduped

      # 5 ── ordered stage evaluation, session- and window-scoped
      #
      # data_lookup_n and lookup_n are counted as the SIZE OF A SET of
      # distinct identities, not as running increments over cmds entries.
      # An increment-per-match approach is fragile against ANY duplicate
      # surfacing of the same physical exec (this rule's cmds is populated
      # from two independent sources -- query_events and a separate graph
      # edge walk -- which routinely both surface the same instance,
      # including the triggering call itself, whose own ts does not
      # equal meta.event_ts and so was never recognized as a re-surfacing
      # of the seed). Two entries describing the same real lookup
      # necessarily carry the same extracted query-name label, so
      # deduping by that label is correct regardless of how many times,
      # or through which path, the underlying event was surfaced -- it
      # measures "how many distinct data-bearing names were resolved",
      # which is what this amplifier is actually meant to represent.
      secret_ev = None
      encode_ev = None
      lookup_keys = {}
      data_labels = {}
      if name_hit != "":
          data_labels[name_hit] = True
      # The triggering call's own instance-log/graph edge almost always
      # appears in cmds too (query_events' until_ns includes it), just at
      # its own real ts, not meta.event_ts -- those are two different
      # clocks (one stamped by the probe at execve time, the other by the
      # engine at rule-dispatch time), so they never compare equal. Reusing
      # this REAL edge for the "DNS Exfil Channel" step (instead of
      # fabricating one from meta) lets the engine's own trigger-matching
      # recognize it and merge, instead of always injecting a second,
      # generic "Trigger Reason" node alongside a richer one that isn't
      # recognized as the trigger. It's identified as the RESOLVER-matching
      # entry with the latest ts in-window -- the most recent resolver
      # invocation is the one that just fired the rule.
      trigger_edge = None
      trigger_edge_ts = -1
      for c in cmds:
          if c["ts"] < since or c["ts"] > trigger_ts + 1:
              continue
          s = c["cmd"]
          if secret_ev == None:
              m = hit(SECRET, s)
              if m != "":
                  secret_ev = {"ev": c, "m": m}
          if encode_ev == None:
              m = hit(ENCODE, s)
              if m != "":
                  encode_ev = {"ev": c, "m": m}
          if hit(RESOLVER, s) != "":
              lookup_keys[str(c["ts"])] = True
              if c["ts"] > trigger_edge_ts:
                  trigger_edge_ts = c["ts"]
                  trigger_edge = c
              m = hit(DATA_NAME, s)
              if m != "":
                  data_labels[m] = True
      lookup_n = len(lookup_keys)
      data_lookup_n = len(data_labels)
      sib_name = ""
      for k in data_labels:
          if k != name_hit:
              sib_name = k
              break

      # Discriminator: a resolver invocation whose query name carries data.
      if name_hit == "" and sib_name == "":
          return "allow"

      # Exfiltration-specific evidence must exist — a lookup alone is never enough.
      if secret_ev == None and encode_ev == None:
          return "allow"

      strength = 0
      if secret_ev != None:
          strength += 1
      if encode_ev != None:
          strength += 1
      repetition = (data_lookup_n >= 3) or (lookup_n >= 8)
      if repetition:
          strength += 1                      # amplifier only, never the sole stage
      need = MIN_ATTRIBUTED if agent_node != None else MIN_DEGRADED
      if strength < need:
          return "allow"

      # Both narrative stages below describe a file touching disk (a
      # credential file read; an encoded payload written for DNS-label
      # transport) -- attach the REAL filesystem edge as evidence, scoped
      # to the exact same process instance, not just the process spawn
      # that's presumed to have caused it.
      #
      # This is a best-effort addition, not a guarantee: some binaries copy
      # regular-file-to-regular-file via a zero-copy syscall path (sendfile,
      # copy_file_range) that a read()/write()-hooking probe never observes,
      # so no matching row will ever exist to find -- the base EXECUTE_PROCESS
      # step for the stage (built from the command line itself, always
      # present) is what carries the stage regardless of whether this
      # secondary evidence is available. A found target that isn't a real
      # filesystem path (a pipe or socket, e.g. a command-substitution
      # capture) is excluded -- it was never "written to disk".
      def is_file_target(p):
          if p == "":
              return False
          if p.startswith("pipe:") or p.startswith("socket:") or p.startswith("anon_inode:"):
              return False
          return True

      secret_read = None
      if secret_ev != None:
          epid = secret_ev["ev"].get("pid", "")
          estart = secret_ev["ev"].get("start", "")
          if epid != "" and estart != "":
              for r in query_events(kind="READ_FILE", actor_pid=int(epid),
                                    actor_start=int(estart), limit=20):
                  if is_file_target(r.get("path", "")):
                      secret_read = r
                      break
      encode_write = None
      if encode_ev != None:
          epid = encode_ev["ev"].get("pid", "")
          estart = encode_ev["ev"].get("start", "")
          if epid != "" and estart != "":
              for w in query_events(kind="WRITE_FILE", actor_pid=int(epid),
                                    actor_start=int(estart), limit=20):
                  if is_file_target(w.get("path", "")):
                      encode_write = w
                      break

      # 6 ── kill chain built from event rows / graph edges + the meta trigger
      chain = new_chain(root_id)
      if secret_ev != None:
          chain.append(step(secret_ev["ev"]["edge"], stage_id="Secret Staging",
                            stage_desc="session process touched credential material (" +
                                       clip(secret_ev["m"], 60) + "): " +
                                       clip(secret_ev["ev"]["cmd"], 160)))
          if secret_read != None:
              chain.append(step(file_edge(secret_read, "READ_FILE"), stage_id="Secret Staging",
                                stage_desc="credential material read from disk: " +
                                           clip(secret_read.get("path", ""), 160)))
      if encode_ev != None:
          chain.append(step(encode_ev["ev"]["edge"], stage_id="Payload Encoding",
                            stage_desc="data shaped for DNS label transport (" +
                                       clip(encode_ev["m"], 40) + "): " +
                                       clip(encode_ev["ev"]["cmd"], 160)))
          if encode_write != None:
              chain.append(step(file_edge(encode_write, "WRITE_FILE"), stage_id="Payload Encoding",
                                stage_desc="encoded payload written to disk: " +
                                           clip(encode_write.get("path", ""), 160)))

      # The triggering call's own real edge (see trigger_edge above) is
      # preferred over a fabricated one -- its "callid" (propagated by
      # ev_edge(), now) is what the engine's own trigger-injection
      # (appendTriggerReason, scanner_filter.go) matches on to MERGE into
      # this exact step instead of appending a second, generic, path-less
      # "Trigger Reason" node alongside it. synth_edge() (no callid) is only
      # a fallback for the rare case where the triggering instance genuinely
      # isn't in cmds yet -- that case still gets the separate node, same as
      # before this fix.
      shown = name_hit if name_hit != "" else sib_name
      if trigger_edge != None:
          dns_edge = trigger_edge["edge"]
          dns_cmd_display = trigger_edge["cmd"]
      else:
          trig_actor = inst.get("actor_path", "") if inst != None else ""
          if trig_actor == "":
              trig_actor = "pid:" + str(cp)
          trig_parent = inst.get("parent_path", "") if inst != None else ""
          if trig_parent == "":
              trig_parent = root_id
          else:
              trig_parent = "process://" + trig_parent
          dns_edge = synth_edge(trig_parent, "process://" + trig_actor, trigger_ts, clip(cmd, 400))
          dns_cmd_display = cmd
      chain.append(step(dns_edge, stage_id="DNS Exfil Channel",
                        stage_desc="resolver spawned with data-bearing query name (" +
                                   clip(shown, 80) + "): " + clip(dns_cmd_display, 200)))

      names = "pid " + str(cp)
      if lineage:
          parts = []
          for x in lineage:
              parts.append(x.get("actor_path", "?").split("/")[-1])
          names = " -> ".join(parts)
      attribution = "agent=" + agent_node.get("name", "?") if agent_node != None else "attribution=degraded"

      # A single data-bearing lookup corroborated by staging is reported;
      # sustained resolution (the `repetition` amplifier: >=3 data-bearing
      # lookups, or >=8 resolver invocations, in the window) is no longer
      # ambiguous — it is an active exfiltration channel moving data in
      # multiple chunks, and is blocked. In both cases credential material
      # has already been shaped for and pushed through a channel that
      # bypasses HTTP proxy and egress inspection, so the peer's integrity
      # is degraded, gating it out of integrity-enforced destinations.
      verdict = "block" if repetition else "report"

      reason = ("Possible DNS-channel exfiltration: " + clip(res_hit.strip(), 24) +
                " lookup with encoded query name" +
                (", credential material staged in session" if secret_ev != None else "") +
                (", encoding pipeline in session" if encode_ev != None else "") +
                (", " + str(data_lookup_n) + " data-bearing lookups" if repetition else "") +
                " | lineage: " + names + " | " + attribution)
      print(reason)
      set_integrity_level(0)
      return {"action": verdict, "reason": reason, "chain": chain}

  result = run()
