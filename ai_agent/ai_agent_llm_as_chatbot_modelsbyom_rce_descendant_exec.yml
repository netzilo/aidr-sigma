title: LLM-As-Chatbot modelsbyom Component Descendant Code Execution
id: 4f2b8d7a-1c63-4e29-9a5f-0d84b1c7e3f6
status: experimental
level: high
author: Evgen
date: "2026-03-14"
description: |
  Post-exploitation detection for CVE-2024-55241 (arbitrary code execution in
  deep-diver LLM-As-Chatbot via the modelsbyom.py component, fixed in 99c2c03).

  WHAT WE CANNOT SEE (triage dissent, answered): the inbound crafted HTTP request
  is not observable by this engine. No `network_request` event type is ever
  emitted, and neither `NETWORK_CONNECT` nor `REMOTE_CODE_EXECUTION` exists as an
  edge kind, so there is no way to link the remote trigger to the downstream
  spawn. The only live signal is `execute_process`, which on its own is generic
  noise and would be indistinguishable from ordinary activity.

  WHAT THIS RULE THEREFORE DOES: it refuses to fire on a bare process spawn. It
  requires BOTH of the following, scoped to the triggering session's lineage:
    1. ANCHOR (required, high specificity) - the spawned session's own lineage
       (lineage()) contains an ancestor session whose program path or command
       line identifies the vulnerable component (modelsbyom / LLM-As-Chatbot /
       deep-diver). Without that ancestor the script returns allow and the rule
       is invisible.
    2. EXECUTION PRIMITIVE WITH PAYLOAD - the spawned command is a shell,
       interpreter, downloader or netcat-class tool carrying an inline-payload,
       pipe-to-shell, download, decode or reverse-shell argument. The component's
       own startup line is explicitly excluded.

  Corroborating stages (further payload spawns by the same component subtree, and
  non-ZTNA egress by sessions in that subtree) are gathered only from within the
  rule's own 10-minute window and only for sessions that descend from the anchor -
  never across sessions and never from a global scan.

  Because the causal link to a remote unauthenticated request is unobservable,
  the verdict is `report` with a full kill chain, not an enforcement action. This
  is deliberate: the same signal is produced when an operator legitimately drives
  the chatbot's own shell-out features.
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2024-55241
  - https://github.com/deep-diver/LLM-As-Chatbot
  - https://owasp.org/Top10/A03_2021-Injection/
tags:
  - attack.execution
  - attack.t1059
  - attack.t1190
  - attack.initial-access
  - owasp.a03-2021-injection
  - cve.2024-55241
falsepositives:
  - Developer or operator running LLM-As-Chatbot locally and using its own
    bring-your-own-model features, which legitimately shell out to `curl`/`wget`
    to fetch model weights or to `python -c` during a venv/conda bootstrap.
  - Container or supervisor entrypoint wrappers (`bash -c "python app.py ..."`)
    that sit inside the chatbot's process tree and re-exec the application.
  - A repository checkout or working directory whose name contains the component
    marker, where an IDE, linter, or test runner spawned from that directory
    inherits the marker in its command line.
  - Legitimate operator debugging of a running instance (attaching a shell to the
    application process) during incident response or development.
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - connect
detection:
  sel_exec:
    event_type: execute_process
  sel_primitive:
    content|re: '(?i:\b(sh|bash|zsh|dash|ksh|python[0-9.]*|perl|ruby|node|php|curl|wget|nc|ncat|socat|telnet|powershell|pwsh|osascript)\b)'
  condition: sel_exec and sel_primitive
action: execute
on_timeout: allow
on_error: allow
script: |
  # 10 minute clustering window for corroborating stages. The anchor itself is
  # structural (a long-lived server process), so it is deliberately not windowed.
  WINDOW_NS = 600000000000

  # Distinctive markers for the vulnerable component. These are detection
  # markers only - nothing here widens what is permitted.
  COMPONENT = [
      "modelsbyom",
      "models_byom",
      "llm-as-chatbot",
      "llm_as_chatbot",
      "llmaschatbot",
      "deep-diver",
      "deepdiver",
  ]

  PRIMITIVE = [
      r"\b(sh|bash|zsh|dash|ksh)\b",
      r"/bin/(sh|bash|zsh|dash)\b",
      r"\bpython[0-9.]*\b",
      r"\b(perl|ruby|node|php)\b",
      r"\b(curl|wget)\b",
      r"\b(nc|ncat|socat|telnet)\b",
      r"\b(powershell|pwsh|osascript)\b",
  ]

  PAYLOAD = [
      r"(?i:\b(sh|bash|zsh|dash|ksh)\b[^\n]{0,200}\s-c\s)",
      r"(?i:\bpython[0-9.]*\b[^\n]{0,200}\s-c\s)",
      r"(?i:\b(perl|ruby|node|php)\b[^\n]{0,200}\s-e\s)",
      r"(?i:\|\s*(sh|bash|zsh|python[0-9.]*|perl)\b)",
      r"(?i:\b(curl|wget)\b[^\n]{0,200}(https?|ftp)://)",
      r"/dev/tcp/",
      r"(?i:\b(nc|ncat|socat)\b[^\n]{0,120}\s-[a-z]{0,4}e\b)",
      r"(?i:\bbase64\b[^\n]{0,80}\s--?d\b)",
      r"(?i:(os\.system|subprocess\.(Popen|call|run|check_output)|__import__|\beval\(|\bexec\())",
      r"(?i:\bchmod\b[^\n]{0,80}\s\+x\b)",
  ]

  def matches_any(pats, s):
      for p in pats:
          if re.find(p, s) != None:
              return True
      return False

  def spawn_cmd(content):
      # execute_process content is {"command": ..., "path": ...} (json.Marshal,
      # so quotes, backslashes and < > & arrive escaped). Return the raw command.
      i = content.find('"command":')
      if i < 0:
          return content
      j = content.find('"', i + 10)
      if j < 0:
          return content
      out = ""
      k = j + 1
      n = len(content)
      for _ in range(n):
          if k >= n:
              break
          c = content[k]
          if c == '"':
              break
          if c == "\\" and k + 1 < n:
              d = content[k + 1]
              if d == "u" and k + 5 < n:
                  out += chr(int(content[k + 2:k + 6], 16))
                  k += 6
                  continue
              if d == "n":
                  out += "\n"
              elif d == "t":
                  out += "\t"
              else:
                  out += d
              k += 2
              continue
          out += c
          k += 1
      return out

  def sess_spawn(x):
      # The session's own SPAWNED row (keyed by the child), or None.
      for r in events(kind="SPAWNED", session=x["id"], limit=1):
          return r
      return None

  def sess_cmdline(x):
      r = sess_spawn(x)
      if r != None and r.get("cmdline", "") != "":
          return r.get("cmdline", "")
      p = node(x.get("program", ""))
      if p != None:
          return p.get("cmdlines", "")
      return ""

  def is_component(x):
      blob = (x.get("path", "") + " " + sess_cmdline(x)).lower()
      for m in COMPONENT:
          if m in blob:
              return True
      return False

  def short(s, n):
      if len(s) > n:
          return s[:n] + "..."
      return s

  def base(p):
      parts = p.split("/")
      return parts[len(parts) - 1]

  def ev_edge(e):
      t = e.get("ts", "0")
      frm = e.get("session_id", "")
      if e.get("kind", "") == "SPAWNED":
          frm = e.get("parent_session", "")
      return {
          "from":     frm,
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", ""),
          "dir":      "out",
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
          "cmdline":  e.get("cmdline", ""),
      }

  def sess_edge(x):
      # How this session came to exist: its SPAWNED row from the parent, or the
      # INSTANCE_OF edge to its program when it is a root session.
      r = sess_spawn(x)
      if r != None:
          return ev_edge(r)
      t = x.get("first_seen", "0")
      if x.get("parent", "") != "":
          return {"from": x["parent"], "to": x["id"], "kind": "SPAWNED", "dir": "out",
                  "ts": t, "first_ts": t, "last_ts": t}
      return {"from": x["id"], "to": x.get("program", ""), "kind": "INSTANCE_OF", "dir": "out",
              "ts": t, "first_ts": t, "last_ts": t}

  def conn_edge(e):
      ts = e.get("ts", "0")
      return {
          "from":     e.get("session_id", ""),
          "to":       e.get("target_id", ""),
          "kind":     "CONNECTS",
          "ts":       ts,
          "first_ts": ts,
          "last_ts":  ts,
      }

  def run():
      # ── 1. relevance gate: pure string checks on meta, no graph / log calls ──
      if meta.get("context_type", "") != "execute_process":
          return "allow"
      cmd = spawn_cmd(meta.get("content", ""))
      if cmd == "":
          return "allow"
      cmd_l = cmd.lower()
      if not matches_any(PRIMITIVE, cmd_l):
          return "allow"
      if not matches_any(PAYLOAD, cmd):
          return "allow"

      event_ts = int(meta.get("event_ts", "0"))
      since = 0
      if event_ts > WINDOW_NS:
          since = event_ts - WINDOW_NS

      # ── 2. anchor on the triggering session (the spawned primitive) ─────────
      inst = session()
      if inst == None:
          # degraded: the session is unknown. Never guess an owner - the next
          # event from this session re-fires with full attribution.
          return "allow"
      lineage_ = lineage(inst["id"])
      if not lineage_:
          return "allow"

      # ── 3. REQUIRED anchor stage: vulnerable component in this lineage ──────
      anchor_idx = -1
      for i in range(len(lineage_)):
          if is_component(lineage_[i]):
              anchor_idx = i
              break
      if anchor_idx < 0:
          # Generic shell spawn with no LLM-As-Chatbot ancestry - exactly the
          # noise the triage dissent warned about. Stay silent.
          return "allow"
      anchor = lineage_[anchor_idx]

      # The component's own startup line is not an exploitation artefact.
      cmd_is_component = False
      for m in COMPONENT:
          if m in cmd_l:
              cmd_is_component = True
      if anchor_idx == 0 and cmd_is_component:
          return "allow"

      # ── 4. scope: the component session and the path down to the caller, plus
      #     what they spawned in-window. Rooted at the COMPONENT, never at the
      #     lineage root (which may be a login shell or init and would pull in
      #     unrelated sessions).
      scope = {}
      for i in range(anchor_idx + 1):
          scope[lineage_[i]["id"]] = True

      spawn_rows = events(kind="SPAWNED", since_ns=since, limit=2000)
      # two bounded passes to pick up grandchildren of the component subtree
      for _pass in range(2):
          for e in spawn_rows:
              pp = e.get("parent_session", "")
              ap = e.get("session_id", "")
              if pp != "" and ap != "" and pp in scope and ap not in scope:
                  scope[ap] = True

      # ── 5. build the kill chain ─────────────────────────────────────────────
      chain = new_chain(anchor["id"])
      chain.append(step(
          sess_edge(anchor),
          stage_id="Vulnerable Component",
          stage_desc="deep-diver LLM-As-Chatbot / modelsbyom component instance: " +
                     anchor.get("path", "?") + " session=" + anchor.get("id", "?") +
                     " cmd=" + short(sess_cmdline(anchor), 140),
      ))

      parent_id = inst.get("parent", "")
      if parent_id == "" and len(lineage_) > 1:
          parent_id = lineage_[1]["id"]
      if parent_id == "":
          parent_id = anchor["id"]
      trigger = {
          "from":     parent_id,
          "to":       inst["id"],
          "kind":     "SPAWNED",
          "ts":       str(event_ts),
          "first_ts": str(event_ts),
          "last_ts":  str(event_ts),
          "cmdline":  short(cmd, 300),
      }
      chain.append(step(
          trigger,
          stage_id="Code Execution",
          stage_desc="component descendant (" + base(inst.get("path", "?")) +
                     ") spawned execution primitive with payload argument: " +
                     short(cmd, 200),
      ))

      stages = 2

      # ── 6. optional corroboration, window- and scope-scoped only ────────────
      follow = None
      for e in spawn_rows:
          if e.get("session_id", "") == inst["id"]:
              continue
          if e.get("parent_session", "") not in scope:
              continue
          c = e.get("cmdline", "")
          if c == "":
              continue
          if matches_any(PAYLOAD, c):
              follow = e
              break
      if follow != None:
          stages = stages + 1
          chain.append(step(
              ev_edge(follow),
              stage_id="Follow-on Execution",
              stage_desc="additional payload spawn inside the same component subtree: " +
                         short(follow.get("cmdline", ""), 160),
          ))

      egress = None
      scanned = 0
      for sid in scope:
          if scanned >= 25:
              break
          scanned = scanned + 1
          for r in events(kind="CONNECTS", session=sid, since_ns=since, limit=20):
              h = r.get("host", "")
              if h == "":
                  continue
              hn = node(r.get("target_id", ""))
              if hn != None and hn.get("is_ztna_host", "0") == "1":
                  continue
              egress = r
              break
          if egress != None:
              break
      if egress != None:
          stages = stages + 1
          chain.append(step(
              conn_edge(egress),
              stage_id="Egress",
              stage_desc="component subtree connected out to " + egress.get("host", "?") +
                         ":" + egress.get("port", "?"),
          ))

      names = []
      for x in lineage_:
          names.append(base(x.get("path", "?")))
      lin = " -> ".join(names)
      print("CVE-2024-55241 post-exploitation candidate | lineage: " + lin +
            " | stages=" + str(stages) + " | cmd=" + short(cmd, 200))

      return {
          "action": "report",
          "reason": "Execution primitive with payload argument spawned as a descendant of the " +
                    "deep-diver LLM-As-Chatbot / modelsbyom component (CVE-2024-55241 post-exploitation " +
                    "artefact; inbound request not observable) - " + str(stages) + " stages, lineage: " + lin,
          "chain": chain,
      }

  result = run()
