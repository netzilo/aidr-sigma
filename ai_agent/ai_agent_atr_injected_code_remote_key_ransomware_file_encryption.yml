title: Injected Code — Remote-Key Ransomware File Encryption
id: 24cf0fe6-7981-4b67-8147-9f956cd2b131
status: experimental
level: critical
description: |-
  Detects injected code that fetches an encryption key from a remote server (requests.get(.../get_key).content) and encrypts a victim file in place with Fernet/AES/ChaCha20/Blowfish — the defining shape of ransomware. The remote-key + in-place-encrypt pair is the invariant.

  Adapted from Agent Threat Rules ATR-2026-01896 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01896
tags:
- attack.impact
- atlas.aml.t0048
- atlas.aml.t0051
- owasp.asi01
- owasp.llm05
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)requests\.get\([\"'][^\"'\n]{0,80}get_key[^\"'\n]{0,10}[\"']\)\.content
  condition: sel_0
falsepositives:
- Security documentation, papers, or test suites that describe this attack technique without executing
  it.
- Legitimate developer or user requests that share the surface vocabulary but lack the malicious invariant.
action: report
