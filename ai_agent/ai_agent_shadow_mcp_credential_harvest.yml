title: Shadow MCP Credential Harvest Tool Invocation
id: 7b3f1c2e-9a4d-4f18-b6c5-2d8e0a17c93f
status: experimental
level: high
description: |
  Detects a single MCP tool invocation whose tool name encodes a credential-harvest
  operation: an acquisition verb (steal / exfil / harvest / siphon / leak / dump /
  scrape / list / export / ...) bound to a credential noun (creds, secrets, tokens,
  api_keys, passwords, ssh_keys, kubeconfig, service_accounts, dotenv, env_vars,
  keychain, access_keys).

  This is the step-2 signal of the Shadow MCP Credential Harvest chain: the attacker
  has enumerated the tool surface and is now calling a tool built to return secret
  material through the MCP interface, before exfiltration or lateral movement.

  Precision is obtained from three constraints, not from one keyword list:
    1. verb-and-noun adjacency - a bare noun ("secrets") or a bare verb ("dump")
       never matches on its own; the two must be adjacent with at most one
       separator, so "secrets_policy_schema" and "dump_database" do not fire.
    2. tiered nouns per verb class - high-intent verbs (steal/exfil/harvest/siphon/
       leak/pilfer/slurp) are allowed the broad noun set including bare key/keys/auth/
       vault; neutral read verbs (get/fetch/list/read/export/...) require a PLURAL or
       unambiguous bulk noun, so the single-item vault lookup "get_secret" is not
       matched while the bulk enumeration "get_secrets" is.
    3. token boundaries on both sides - the verb must start the name or follow a
       non-alphanumeric, so "widget_reader" and "forget_secretsauce" cannot match.

  A secondary body condition catches the same high-intent names in the serialized
  tool-use block ("name": "...") when the tool_name field is not populated, and only
  when the payload also carries an invocation argument object - a catalog listing is
  not an invocation.
author: Evgen
date: "2026-06-11"
references:
  - https://atlas.mitre.org/techniques/AML.T0015
  - https://attack.mitre.org/techniques/T1552/
  - https://modelcontextprotocol.io/specification
tags:
  - attack.credential-access
  - attack.t1552
  - attack.collection
  - atlas.aml.t0015
  - owasp.llm02
falsepositives:
  - Authorized secrets-manager MCP servers that expose bulk enumeration tools such as
    list_secrets, get_credentials or export_env_vars, invoked during a legitimate
    deployment, migration or rotation workflow.
  - Platform-engineering MCP tools such as get_kubeconfig, fetch_service_accounts or
    get_access_keys called by an operator performing normal cluster or cloud work.
  - Local developer tooling that reads a .env file for debugging (read_dotenv,
    print_env_vars, get_env_vars) inside a sandboxed project directory.
  - CI/CD MCP servers that fetch build-time deployment credentials as a routine step
    of a pipeline the agent was explicitly asked to run.
  - Key/value or cache MCP servers exposing a generic dump_keys or list_keys tool
    where "keys" means record keys, not cryptographic material.
  - Secret-hygiene tooling that enumerates secrets in order to audit or rotate them;
    the tool name alone cannot distinguish audit intent from harvest intent, which is
    why this rule reports rather than blocks.
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_event:
    event_type: tool_call

  # High-intent acquisition verbs - broad credential noun set permitted.
  sel_name_intent_verb:
    tool_name|re: '(?i)(^|[^a-z0-9])(steal|exfil|exfiltrate|harvest|siphon|slurp|pilfer|leak)[_\-]?(all[_\-]?)?(cred|creds|credential|credentials|secret|secrets|token|tokens|key|keys|apikey|apikeys|api[_\-]keys?|password|passwords|passwd|pwd|ssh|sshkey|sshkeys|ssh[_\-]keys?|privkey|privkeys|private[_\-]keys?|keychain|keyring|kubeconfig|kube[_\-]config|serviceaccount|serviceaccounts|service[_\-]accounts?|dotenv|env|envs|envvar|envvars|env[_\-]vars?|environment|vault|auth|authtoken|auth[_\-]tokens?|session[_\-]tokens?|access[_\-]keys?|aws[_\-](keys?|creds|credentials))([^a-z0-9]|$)'

  # Bulk-extraction verbs - strict credential noun set, bare key/keys excluded so
  # that dump_keys against a KV store is not swept in by this selection.
  sel_name_bulk_dump:
    tool_name|re: '(?i)(^|[^a-z0-9])(dump|scrape|sweep)[_\-]?(all[_\-]?)?(cred|creds|credential|credentials|secret|secrets|token|tokens|apikey|apikeys|api[_\-]keys?|password|passwords|passwd|ssh[_\-]?keys?|privkey|privkeys|private[_\-]keys?|keychain|keyring|kubeconfig|kube[_\-]config|service[_\-]?accounts?|dotenv|env|envs|env[_\-]?vars?|environment|vault|access[_\-]keys?|aws[_\-](keys?|creds|credentials))([^a-z0-9]|$)'

  # Neutral read verbs - PLURAL or unambiguous bulk noun required, so a single-item
  # named lookup (get_secret, read_token) is deliberately not matched.
  sel_name_bulk_read:
    tool_name|re: '(?i)(^|[^a-z0-9])(get|fetch|read|list|show|print|reveal|expose|extract|export|retrieve|enumerate|collect|gather|download|copy)[_\-]?(all[_\-]?)?(creds|credentials|secrets|tokens|apikeys|api[_\-]keys|passwords|passwd|sshkeys|ssh[_\-]keys|privkeys|private[_\-]keys|keychain|keyring|kubeconfig|kube[_\-]config|serviceaccounts|service[_\-]accounts|dotenv|envvars|env[_\-]vars|environment[_\-]variables|access[_\-]keys|aws[_\-](credentials|creds|keys))([^a-z0-9]|$)'

  # Fallback: the harvest name appears in the serialized tool-use block itself.
  # Scoped to the JSON name key so free-text prose mentioning these words cannot fire.
  sel_body_invocation:
    content|re: '(?i)"(?:tool_)?name"\s*:\s*"[a-z0-9_.:/\-]{0,64}(steal|exfil|exfiltrate|harvest|siphon|slurp|pilfer|leak|dump|scrape)[_\-]?(all[_\-]?)?(cred|creds|credential|credentials|secret|secrets|token|tokens|apikey|api[_\-]key|password|passwd|ssh[_\-]?key|privkey|private[_\-]key|keychain|keyring|kubeconfig|kube[_\-]config|service[_\-]?account|dotenv|env)'

  # An invocation carries an argument object; a catalog entry does not.
  sel_body_args:
    content|contains:
      - '"arguments"'
      - '"parameters"'
      - '"input"'

  # Tool catalogs / capability listings enumerate every tool name including benign
  # secrets-manager tools. A listing is discovery metadata, not an invocation.
  filter_catalog:
    content|contains:
      - '"inputSchema"'
      - '"input_schema"'
      - '"tools":['
      - '"tools": ['
      - '"tools":\n'

  # Test and demo scaffolding, anchored to the START of the tool name only, so a
  # harvest verb cannot be hidden behind an arbitrary mid-name "test" token.
  filter_test_scaffold:
    tool_name|re: '(?i)^(test|tests|mock|mocked|fake|dummy|sample|example|demo|fixture|stub)[_\-]'

  condition: >
    sel_event and
    (sel_name_intent_verb or sel_name_bulk_dump or sel_name_bulk_read or
     (sel_body_invocation and sel_body_args)) and
    not (filter_catalog or filter_test_scaffold)
action: report
