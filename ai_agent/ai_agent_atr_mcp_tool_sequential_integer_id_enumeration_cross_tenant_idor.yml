detection:
  sel_0:
    content|re: (?i)n8n_workflow_versions[\s\S]{0,240}[\\"']{0,3}version_?id[\\"']{0,3}\s*[:=]\s*(?:\$\{[a-z_][a-z0-9_]{0,12}\}|\$[a-z_][a-z0-9_]{0,12}(?:[^a-z0-9_.]|$)|\{\{?[a-z_][a-z0-9_]{0,12}\}\}?|%[ds]|(?:i|j|k|n|m|idx|index|counter|cnt|ctr|seq|num|offset|start)(?:[^a-z0-9_.]|$)|[a-z_][a-z0-9_]{0,12}\s*\+\s*\d{1,6}|[a-z_][a-z0-9_]{0,12}\+\+)
  sel_1:
    content|re: (?i)(?:n8n_workflow_versions[\s\S]{0,200}?[\\"']{1,3}version_?id[\\"']{1,3}\s*:\s*[\\"']{0,3}\d{1,9}[\s\S]{0,200}?){3,}
  sel_2:
    content|re: (?i)(?:(?:tools?[/_]call|call_?tool|jsonrpc|[\\"']{0,3}(?:method|arguments|params)[\\"']{0,3}\s*:|\binvoke)[\s\S]{0,200}?[\\"']{1,3}(?:version_?id|backup_?id|snapshot_?id|revision_?id|archive_?id|export_?id|dump_?id|restore_?id)[\\"']{1,3}\s*:\s*[\\"']{0,3}\d{1,9}[\s\S]{0,200}?){4,}
  sel_3:
    content|re: (?i)(?:for\s*\(|for\s+[a-z_][a-z0-9_]{0,16}\s+in\s|while\s*\(|foreach\s*\(|range\s*\(\s*\d{1,7}\s*,)[\s\S]{0,200}(?:call_?tool|tools?[/_]call|jsonrpc|\bmcp\b|client\.[a-z_]{1,20}|session\.[a-z_]{1,20}|fetch\s*\(|axios|requests?\.(?:get|post)|curl\s)[\s\S]{0,200}[\\"']{0,3}(?:version_?id|backup_?id|snapshot_?id|revision_?id|archive_?id|export_?id|record_?id|object_?id|entry_?id|row_?id)[\\"']{0,3}\s*[:=]\s*(?:\$\{[a-z_][a-z0-9_]{0,12}\}|\$[a-z_][a-z0-9_]{0,12}(?:[^a-z0-9_.]|$)|\{\{?[a-z_][a-z0-9_]{0,12}\}\}?|%[ds]|(?:i|j|k|n|m|idx|index|counter|cnt|ctr|seq|num|offset|cur|start)(?:[^a-z0-9_.]|$)|[a-z_][a-z0-9_]{0,12}\s*\+\s*\d{1,6})
  sel_4:
    content|re: (?i)(?:\$\(seq\s|`seq\s|seq\s+\d{1,7}\s+\d{2,9}|\{\d{1,7}\.\.\d{2,9}\}|range\s*\(\s*\d{1,7}\s*,\s*\d{2,9})[\s\S]{0,400}(?:/mcp\b|jsonrpc|calltool|call_tool|tools_call)[\s\S]{0,400}(?:version_?id|backup_?id|snapshot_?id|revision_?id|record_?id)[\\"']{0,3}\s*[:=]\s*[\\"']{0,3}(?:\$\{?[a-z_]|\{[a-z_]|%[ds])
  sel_5:
    content|re: (?i)(?:n8n[-_]mcp["'\s:@=^~>v]{1,8}(?:2\.(?:5[0-5]|[1-4][0-9]|[0-9])\.\d{1,3}|2\.56\.0)[\s\S]{0,800}enable_multi_tenant\s*[:=]\s*["']?\s*true|enable_multi_tenant\s*[:=]\s*["']?\s*true[\s\S]{0,800}n8n[-_]mcp["'\s:@=^~>v]{1,8}(?:2\.(?:5[0-5]|[1-4][0-9]|[0-9])\.\d{1,3}|2\.56\.0))
  sel_6:
    content|re: (?i)(?:iterat\w{0,4}|increment\w{0,4}|enumerat\w{0,4}|brute[\s_-]?forc\w{0,3}|loop\s+(?:over|through)|walk\s+(?:the\s+)?(?:ids?|range)|count\s+up\s+through)[\s\S]{0,200}(?:version_?id|backup_?id|snapshot_?id|record_?id|integer\s+ids?|sequential\s+ids?|workflow[\s_-]?versions?)[\s\S]{0,240}(?:other|another|every|all|each|cross)[\s_-]?(?:tenant|customer|organi[sz]ation|account|workspace|instance)[\s\S]{0,240}(?:extract|harvest|collect|exfiltrat\w{0,3}|siphon|scrape|steal|dump|capture|save|send|post|upload|report\s+back|write\s+(?:them|it|these))[\s\S]{0,160}(?:credential|api[\s_-]?key|bearer|token|secret|password)
  condition: 1 of sel_*
falsepositives:
- Migration, backup-verification or disaster-recovery tooling that legitimately walks every version row
  of a single-tenant deployment — the payload shape is identical to the attack and only the authorisation
  context differs.
- Integration or load tests that seed and then read back N sequential version records against a test instance.
- 'An agent that legitimately fetches each version returned by a prior authorised list call still emits
  one invocation envelope per ID, so layers 2 and 3 fire: they count ID-bearing calls and cannot tell
  a server-supplied ID set from a guessed one. (A returned collection on its own no longer matches — layer
  3 requires a per-ID invocation envelope — but an authorised fan-out of real calls is indistinguishable
  from a sweep.)'
- 'Security research and advisory prose that quotes an attacker''s instruction verbatim can still match
  layer 7. Purely descriptive write-ups no longer match: layer 7 additionally requires a collection or
  exfiltration imperative, which describing text (''an attacker could read the api key'') does not carry.'
- Single-tenant deployments pinned below v2.56.1 that set ENABLE_MULTI_TENANT=true for local development
  against one instance will match layer 6 even though no second tenant exists.
action: report
