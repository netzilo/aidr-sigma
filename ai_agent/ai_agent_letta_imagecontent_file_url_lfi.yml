title: Letta ImageContent file:// Local File Read Bypass
id: 6f2d1c94-83ab-4d1e-9b0c-2a7f5e41d8c3
status: experimental
level: high
description: |
  Detects an agent request that embeds a file:// (local filesystem) URL inside an
  ImageContent / image_url object sent to an agent server API. Letta Server before
  0.16.7 did not validate the URL scheme carried in ImageContent, so a crafted
  file:///etc/passwd style reference caused the image parser to read arbitrary files
  from the server host. 0.16.7 added rejection of file:/// URLs in image content.

  The rule is instance-resolved: it anchors on meta["caller_pid"] for the triggering
  http_request, resolves the exact process instance with proc_instance(), walks the
  spawn chain with proc_lineage(), expands to sibling/child instances spawned by that
  same lineage, and then queries the event log for READ_FILE rows performed by those
  instances only. Nothing outside the triggering session is ever attributed.

  Taxonomy note: the supplied mapping carries no ATLAS technique, and the supplied
  OWASP categories (A01:2021 Broken Access Control, A03:2021 Injection) belong to the
  web Top 10, which the `owasp.` tag prefix does not accept. They are recorded under
  references; the LLM-taxonomy tag reflects what the rule actually detects — server
  side sensitive information disclosure driven by agent-supplied content.
author: Evgen
date: "2026-06-12"
references:
  - https://github.com/letta-ai/letta/releases
  - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1005/
tags:
  - attack.initial-access
  - attack.t1190
  - attack.collection
  - attack.t1005
  - owasp.llm02
falsepositives:
  - Local multimodal development workflow where a developer tool posts an image by
    local path (file:///Users/me/shot.png) to a self-hosted agent server running on the
    same machine. The rule reports rather than blocks so an operator can confirm intent.
  - SDK examples, integration tests or documentation payloads that POST a sample
    ImageContent object containing a file:///path/to/image.png reference.
  - A pasted log line or error message containing a file:// URL inside the same request
    body as an unrelated image attachment. Mitigated by requiring the URL to sit within
    400 bytes before / 200 bytes after an image-content marker.
  - The corroboration stage can attach a READ_FILE row produced by unrelated tooling in
    the same process lineage; it only attaches when the read path matches the exact
    referenced path or its basename inside the 10 minute window, and it never gates the
    verdict on its own.
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_http:
    event_type: http_request
  sel_file_scheme:
    content|re: '(?i)\bfile:/{2,3}'
  sel_image_marker:
    content|contains:
      - 'image_url'
      - 'imagecontent'
      - 'image_content'
      - '"type": "image'
      - '"type":"image'
      - 'input_image'
  condition: sel_http and sel_file_scheme and sel_image_marker
action: execute
on_timeout: allow
on_error: allow
script: |
  # ── constants ────────────────────────────────────────────────────────────────
  WINDOW_NS   = 600000000000          # 10 minutes — this rule's own window
  MAX_URLS    = 8
  NEAR_BEFORE = 400
  NEAR_AFTER  = 200
  WORDCH      = "abcdefghijklmnopqrstuvwxyz0123456789_"
  URL_RE      = r"""(?i)^file:/{1,3}[^"'\s,\\<>)\]}]*"""

  IMAGE_MARKERS = ['"type": "image', '"type":"image', "image_url",
                   "imagecontent", "image_content", '"image":', "input_image"]

  SENSITIVE = ["/etc/passwd", "/etc/shadow", "/.ssh/", "/id_rsa", "/.aws/",
               "/.env", "/proc/self/environ", "/.kube/", "/.netrc",
               "/.docker/config", "/root/", "/var/lib/"]

  # ── pure helpers (no graph / log calls) ──────────────────────────────────────
  def basename(p):
      parts = p.split("/")
      return parts[len(parts) - 1]

  def wb_ok(low, j):
      # word boundary before "file:/" so "profile://" never matches
      if j == 0:
          return True
      return low[j - 1] not in WORDCH

  def is_relevant_event():
      if meta.get("context_type", "") != "http_request":
          return False
      low = meta.get("content", "").lower()
      j = low.find("file:/")
      for k in range(8):
          if j < 0:
              return False
          if wb_ok(low, j):
              return True
          j = low.find("file:/", j + 6)
      return False

  def image_file_urls(raw):
      low = raw.lower()
      out = []
      idx = 0
      for k in range(MAX_URLS * 6):
          j = low.find("file:/", idx)
          if j < 0:
              break
          idx = j + 6
          if not wb_ok(low, j):
              continue
          s = j - NEAR_BEFORE
          if s < 0:
              s = 0
          win = low[s:j + NEAR_AFTER]
          near = False
          for m in IMAGE_MARKERS:
              if win.find(m) >= 0:
                  near = True
          if not near:
              continue
          u = re.find(URL_RE, raw[j:j + 512])
          if u == None:
              continue
          if u not in out:
              out.append(u)
          if len(out) >= MAX_URLS:
              break
      return out

  def url_path(u):
      p = u[5:]                       # drop "file:"
      for k in range(3):
          if p.startswith("//"):
              p = p[1:]
      return p

  def ev_edge(e):
      return {"from":     "process://" + e.get("actor_path", ""),
              "to":       e.get("target_id", ""),
              "kind":     e.get("kind", ""),
              "ts":       e.get("ts", "0"),
              "first_ts": e.get("ts", "0"),
              "last_ts":  e.get("ts", "0")}

  # ── main ─────────────────────────────────────────────────────────────────────
  def run():
      # 1. relevance gate — pure string checks on meta only
      if not is_relevant_event():
          return "allow"

      raw  = meta.get("content", "")
      urls = image_file_urls(raw)
      if not urls:
          return "allow"                 # file:// present but not in image content

      host     = meta.get("host", "")
      path     = meta.get("path", "")
      event_ts = int(meta.get("event_ts", "0"))

      sens = ""
      for u in urls:
          p = url_path(u).lower()
          for a in SENSITIVE:
              if sens == "" and p.find(a) >= 0:
                  sens = p

      # 2. anchor on the exact triggering instance
      cp = int(meta.get("caller_pid", "0"))
      if cp == 0:
          return {"action": "report",
                  "reason": "Letta ImageContent LFI attempt to " + host + path +
                            " (" + urls[0] + ") — no caller pid, attribution unavailable"}

      inst = proc_instance(cp, event_ts)
      if inst == None:
          return {"action": "report",
                  "reason": "Letta ImageContent LFI attempt to " + host + path +
                            " (" + urls[0] + ") — attribution degraded (instance not yet logged)"}

      lineage = proc_lineage(int(inst["actor_pid"]), int(inst["actor_start"]))
      if not lineage:
          lineage = [inst]

      # 3. scope strictly to this session: lineage + instances it spawned
      session = {}
      for x in lineage:
          session[x.get("actor_pid", "0")] = x.get("actor_start", "0")

      win_start = event_ts - WINDOW_NS
      if win_start < 0:
          win_start = 0

      execs = query_events(kind="EXECUTE_PROCESS", since_ns=win_start,
                           until_ns=event_ts, limit=2000)
      for depth in range(3):
          for e in execs:
              if e.get("parent_pid", "") in session:
                  session[e.get("actor_pid", "0")] = e.get("actor_start", "0")

      names = []
      for x in lineage:
          names.append(basename(x.get("actor_path", "")))
      lin_s = " -> ".join(names)

      root  = lineage[len(lineage) - 1]
      chain = new_chain("process://" + root.get("actor_path", ""))

      # 4. required anchor stage — taken from meta, never re-queried (race-free)
      target = "url://unknown"
      if host != "":
          target = "https://" + host
      trig = {"from":     "process://" + inst.get("actor_path", ""),
              "to":       target,
              "kind":     "HTTP_REQUEST",
              "method":   meta.get("method", ""),
              "ts":       str(event_ts),
              "first_ts": str(event_ts),
              "last_ts":  str(event_ts)}
      chain.append(step(trig,
                        stage_id="ImageContent file:// URL",
                        stage_desc="request to " + host + path +
                                   " embeds a local filesystem URL inside image content: " + urls[0]))

      # 5. optional corroboration — READ_FILE by THIS session only, path-matched
      corroborated = 0
      for pid in session:
          rows = query_events(kind="READ_FILE", actor_pid=int(pid),
                              actor_start=int(session[pid]), since_ns=win_start,
                              until_ns=event_ts, limit=300)
          for r in rows:
              rp = r.get("path", "")
              if rp == "":
                  continue
              hit = ""
              for u in urls:
                  fp = url_path(u)
                  bn = basename(fp)
                  if fp != "" and len(fp) > 3 and rp.find(fp) >= 0:
                      hit = rp
                  elif len(bn) > 3 and rp.endswith("/" + bn):
                      hit = rp
              if hit == "":
                  continue
              chain.append(step(ev_edge(r),
                                stage_id="Local File Read",
                                stage_desc="session process " + basename(r.get("actor_path", "")) +
                                           " read the referenced local file: " + hit))
              corroborated = corroborated + 1
              if corroborated >= 3:
                  break
          if corroborated >= 3:
              break

      reason = ("Letta ImageContent file:// LFI attempt — " + str(len(urls)) +
                " local file URL(s) embedded in image content sent to " + host + path +
                " (" + urls[0] + ") via " + lin_s)
      if sens != "":
          reason = reason + "; references sensitive path " + sens
      if corroborated > 0:
          reason = reason + "; " + str(corroborated) + " matching local file read(s) by the same session"
      if len(lineage) < 2:
          reason = reason + " [attribution: degraded lineage]"

      print(reason)
      return {"action": "report", "reason": reason, "chain": chain}

  result = run()
