title: Urgency and Coercion Pressure in Agent Input
id: 63cb1a2f-a7e0-5d3d-9b0e-795d70849fbc
status: experimental
description: |
  Detects text engineered to make the agent skip verification: manufactured
  deadlines, threatened consequences, and explicit instructions to bypass checks.
  Distinct from authority impersonation — that borrows permission, this removes the
  opportunity to think.

  Ported from sigma-ai with the same field and context corrections as
  ai_agent_authority_hijacking: upstream's `user_input` / `content_retrieval`
  event types and `message` field do not exist in Netzilo, so each surface gets
  its own selection using the field BuildLogEntry() actually populates.

  Every phrase here pairs urgency with an instruction to skip a control. Bare
  urgency ("this is urgent", "ASAP") is deliberately NOT matched — it is the most
  common phrasing in legitimate operational work and would swamp the rule.
references:
  - https://attack.mitre.org/techniques/T1566/
  - https://attack.mitre.org/techniques/T1656/
  - https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6372438
author: AgentShield (ported to Netzilo)
date: "2026-07-11"
modified: "2026-08-03"
tags:
  - attack.initial-access
  - attack.t1566
  - attack.stealth
  - attack.t1656
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_prompt_pressure:
    event_type: llm_request
    message.content|contains:
      - 'do this immediately without'
      - 'critical deadline do not verify'
      - 'time-sensitive override'
      - 'emergency: skip all checks'
      - 'urgent: bypass approval'
      - 'no time to review just execute'
      - 'skip validation this is urgent'
      - 'execute now ask questions later'
      - 'skip safety checks'
      - 'bypass security for this one'
      - 'disable verification temporarily'
  sel_prompt_threat:
    event_type: llm_request
    message.content|contains:
      - 'system will crash if you do not'
      - 'data loss imminent unless'
      - 'security breach in progress run'
      - 'production is down execute'
      - 'failure to comply will result in'
      - 'you will be shut down if'
      - 'your access will be revoked unless'
  # Injected content is the higher-severity surface — the agent fetched this text,
  # so pressure language inside it did not come from the operator.
  sel_skill_pressure:
    event_type: skill_acquired
    skill|contains:
      - 'do this immediately without'
      - 'time-sensitive override'
      - 'emergency: skip all checks'
      - 'urgent: bypass approval'
      - 'skip validation this is urgent'
      - 'skip safety checks'
      - 'bypass security for this one'
      - 'disable verification temporarily'
      - 'data loss imminent unless'
      - 'you will be shut down if'
  sel_tool_output_pressure:
    event_type: tool_response
    response|contains:
      - 'do this immediately without'
      - 'time-sensitive override'
      - 'emergency: skip all checks'
      - 'urgent: bypass approval'
      - 'skip validation this is urgent'
      - 'skip safety checks'
      - 'bypass security for this one'
      - 'disable verification temporarily'
      - 'security breach in progress run'
      - 'failure to comply will result in'
  condition: >
    sel_prompt_pressure or sel_prompt_threat or
    sel_skill_pressure or sel_tool_output_pressure
falsepositives:
  - Genuine incident response where an operator really is bypassing a control
  - Security training and tabletop exercise material
  - Runbooks that document an emergency break-glass procedure
  - Post-incident writeups quoting the pressure language that was used
level: high
