  sel_3:
    content|re: (?i)(?:(?:set|switch|change|configure|toggle|update|put|flip|default)\s+(?:all|every|each|both)\s+(?:of\s+)?(?:the\s+|my\s+|our\s+)?(?:available\s+|connected\s+)?(?:connectors?|integrations?|connected\s+apps?|workspace\s+apps?|actions?|tools?)[^\n]{0,60}to\s+["\x27]?never\s*ask|never\s*ask\s+(?:mode\s+)?(?:for|on|across)\s+(?:all|every|each)\s+(?:of\s+)?(?:the\s+|my\s+|our\s+)?(?:connectors?|integrations?|connected\s+apps?|workspace\s+apps?))
  sel_4:
    content|re: (?i)(?:creat|build|set\s*up|configur|generat|deploy|publish)[a-z]{0,4}\s+(?:a\s+|an\s+|the\s+|this\s+)?(?:new\s+|basic\s+|simple\s+|custom\s+|hidden\s+){0,3}(?:ai\s+)?(?:agent|assistant|workflow|automation|chief[\s-]of[\s-]staff)[\s\S]{0,300}(?:do\s*n\S{0,3}t\s+ask\s+(?:me\s+)?(?:any\s+)?(?:follow[\s-]?up\s+)?questions?|no\s+follow[\s-]?up\s+questions?|without\s+asking\s+(?:me\s+)?(?:any\s+)?questions?|just\s+do\s+everything|fill\s+in\s+everything\s+for\s+me)[\s\S]{0,700}(?:schedul|recurring|every\s+(?:5|five|10|ten|15|fifteen|30|thirty|60|sixty)\s+minutes?|hourly|freq\s*=\s*(?:hourly|minutely)|begin:vevent|rrule|publish\s+it|make\s+it\s+live|hide\s+(?:the\s+)?(?:agent|it)|do\s*n\S{0,3}t\s+show\s+(?:it|the\s+agent))
  sel_5:
    content|re: (?i)(?:check|poll|monitor|watch|scan|read|search|look\s+(?:at|in|through))\s+(?:the\s+|my\s+|your\s+|his\s+|her\s+|our\s+)?(?:outlook|gmail|inbox|mailbox|e-?mail|mail)[\s\S]{0,250}subject\s+(?:line\s+)?(?:that\s+|which\s+)?(?:starts?|begins?|is\s+prefixed)\s+with\s+["\x27`]?[\w-]{2,16}["\x27`]?[\s\S]{0,500}(?:(?:execute|run|perform|carry\s+out|follow|complete|obey)\s+(?:the\s+|each\s+|every\s+|any\s+|those\s+|its\s+|their\s+)?(?:instructions?|commands?|tasks?|steps?|requests?|directions?|body|contents?)|treat\s+(?:the\s+|its\s+)?(?:body|contents?|message)[^\n]{0,40}as\s+(?:instructions?|commands?|a\s+task))
  condition: 1 of sel_*
falsepositives:
- An administrator legitimately provisioning a low-risk read-only workspace agent who does connect every
  available connector and does set them to never ask in the same instruction. The combination is the signal,
  and this rule cannot distinguish an authorised operator from an injected prompt without session-origin
  context; treat a hit as a request for confirmation of provenance, not proof of compromise.
- Security research write-ups, incident reports, and red-team playbooks that quote the AgentForger provisioning
  prompt verbatim. Layers 2, 4, 5 and 6 match the payload text itself, so a document that reproduces the
  payload will match it.
- Internal automation runbooks that legitimately poll a shared mailbox for a fixed subject prefix and
  execute predefined steps (ticketing, build triggers, on-call paging). Layer 6 fires on the structure,
  not on the intent.
- SDK samples and integration tests that build a multi-connector Responses API request with require_approval
  set to never against a sandbox tenant. Layer 3 requires three or more connector_id grants specifically
  to push single-connector documentation examples below the threshold, but a sample that wires up an entire
  connector catalogue will still match.
- Platform migration scripts that re-attach a previously approved connector set after a tenant move and
  suppress prompts for the duration of the batch.
action: report
