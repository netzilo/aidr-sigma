title: OpenClaw Stealth Agent Session Spawn
id: 7f3c1d02-9a4e-4b61-8c27-5d0e6ab91f4c
status: experimental
level: high
description: |
  Detects a single process-execution event in which an AI coding-agent CLI is
  launched in a non-interactive / approval-bypassing session mode AND, in the
  same command line, is detached from the controlling terminal or has its
  output, shell history or telemetry explicitly suppressed.

  This is the OpenClaw "session spawn abuse" primitive: rather than exploiting
  the model, the operator re-launches the agent itself as an unattended,
  auto-approving child session whose activity is not surfaced to the human in
  the foreground session or to the agent vendor's telemetry.

  Answering the triage dissent: the engine has no SESSION_SPAWN or
  EVADE_DETECTION edge and no agent_session_spawn event type, so this rule does
  NOT alert on execute_process generically. It requires the conjunction of three
  independent lexical facts in one command line -- (1) an agent runtime binary,
  (2) an unattended/permission-bypass session flag or an explicit
  session/subagent spawn verb, and (3) a detachment or logging-suppression
  construct. Ordinary subprocess launches, and even ordinary headless agent
  runs, match at most two of the three. The evasion intent that the requested
  schema field would have carried is reconstructed here from the suppression
  tokens themselves, which is the only place that intent is observable in
  current telemetry.
author: Tanya
date: "2026-03-14"
references:
  - https://attack.mitre.org/techniques/T1564/003/
  - https://attack.mitre.org/techniques/T1562/001/
  - https://attack.mitre.org/techniques/T1059/004/
  - https://atlas.mitre.org/
tags:
  - attack.defense-evasion
  - attack.execution
  - attack.t1059.004
  - attack.t1564.003
  - attack.t1562.001
  - atlas.aml.t0059
  - owasp.llm06
falsepositives:
  - CI/CD or cron batch jobs that legitimately run an agent headlessly and
    detach it, e.g. "nohup claude -p 'run the nightly refactor' >/dev/null 2>&1 &".
    This is the dominant benign case and the reason the rule is report-only.
  - Developers running an agent inside a detached tmux or screen session for a
    long-lived task, then re-attaching later.
  - Devcontainer / bootstrap provisioning scripts that start an agent in
    unattended mode during image build and discard its stdout.
  - Wrapper scripts that set DO_NOT_TRACK=1 or a vendor telemetry-off variable
    as organisation-wide privacy policy while also backgrounding the agent.
  - Benchmark, eval and load-test harnesses that spawn many auto-approving
    agent sessions in parallel.
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_exec:
    event_type: execute_process

  # (1) An AI coding-agent runtime is the thing being executed.
  sel_agent_runtime:
    content|re: '(?i)\b(openclaw|open-claw|claude(-code)?|claude_code|codex|gemini|aider|goose|opencode|cline|cursor-agent|copilot|amp)\b'

  # (2a) Unattended / approval-bypassing session mode.
  sel_headless_autoapprove:
    content|re: '(?i)(--dangerously-skip-permissions|--dangerously-bypass-approvals-and-sandbox|--permission-mode[ =]+(bypasspermissions|acceptedits)|--approval-mode[ =]+full-auto|--sandbox[ =]+danger-full-access|--yolo\b|--auto-?approve\b|--full-auto\b|--allowed-?tools[ =]|--no-confirm\b|--non-?interactive\b|--headless\b|--unattended\b|--print\b|(^|\s)-p[ =]+\\?["\x27])'

  # (2b) Or an explicit session / subagent spawn verb.
  sel_session_spawn_verb:
    content|re: '(?i)(\b(sub-?agents?|sessions?|agents?|swarm)\s+(spawn|create|new|fork|start|run)\b|--fork-session\b|--session-id[ =]|--resume\b|--continue\b)'

  # (3) Detachment from the terminal, or suppression of output / history / telemetry.
  sel_stealth:
    content|re: '(?i)(\bnohup\b|\bsetsid\b|\bdisown\b|\bscreen\s+-[a-z]*d[a-z]*m|\btmux\s+new(-session)?\s+.{0,40}\s-d\b|>\s*/dev/null\s*2>&1|&>\s*/dev/null|\bhistfile=/dev/null|\bunset\s+histfile|\bset\s+\+o\s+history|disable_telemetry=(1|true)|do_not_track=1|--no-telemetry\b|telemetry=(0|false|off)|disable_nonessential_traffic=(1|true)|\bstart\s+/b\b|\bpowershell(\.exe)?\s+.{0,60}-w(indowstyle)?\s+hidden)'

  # Documentation, help text, here-docs and echoed command strings.
  filter_docs_or_help:
    content|re: '(?i)(--help\b|--version\b|\bman\s+[a-z]|\becho\s|\bprintf\s|\bcat\s+<<|<<\s*[\x27"]?EOF|```)'

  # Someone searching for these strings rather than running them.
  filter_search_tools:
    content|re: '(?i)\b(grep|egrep|rg|ripgrep|ag|ack|fzf|which|whereis)\b'

  condition: >
    sel_exec and sel_agent_runtime and
    (sel_headless_autoapprove or sel_session_spawn_verb) and
    sel_stealth and
    not (filter_docs_or_help or filter_search_tools)
action: report
