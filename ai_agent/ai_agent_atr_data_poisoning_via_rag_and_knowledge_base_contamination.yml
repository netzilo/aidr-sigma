title: Data Poisoning via RAG and Knowledge Base Contamination
id: 03377bb9-7685-44c8-9b45-261ac629ab61
status: experimental
level: high
description: |-
  Consolidated detection for data poisoning attacks targeting both RAG
  retrieval pipelines and structured knowledge bases. Detects malicious
  content injected into retrieved documents, FAQ entries, help articles,
  and indexed data that contains hidden instructions, directive markers,
  role-override commands, concealment directives, behavioral mode switching,
  or exfiltration commands. When poisoned content is retrieved as context
  for the LLM, the embedded instructions can hijack agent behavior,
  override safety guardrails, or cause data exfiltration.

  Adapted from Agent Threat Rules ATR-2026-00070 (MIT).
author: ATR Community (adapted)
date: '2026-03-08'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00070
tags:
- attack.impact
- attack.t1565
- atlas.aml.t0020
- atlas.aml.t0051.001
- owasp.asi06
- owasp.llm01
- owasp.llm03
- owasp.llm08
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?i)\[\s*(?:SYSTEM|INST|INSTRUCTION|ADMIN|OVERRIDE|ROOT|PRIORITY)\s*\]\s*[:;\-]?\s*\w+
  sel_1:
    response|re: (?i)(?:ignore|disregard|forget|override)\s+(?:all\s+)?(?:previous|prior|above|other|existing)\s+(?:instructions?|context|rules?|guidelines?|directives?)
  sel_2:
    response|re: (?i)(?:you\s+must\s+(?:now|always|instead)|when\s+this\s+(?:text|passage|document|content|entry)\s+is\s+(?:retrieved|loaded|read|accessed))
  sel_3:
    response|re: (?i)<\s*(?:system|instruction|hidden|inject|override|secret)[^>]*>.*?<\s*/\s*(?:system|instruction|hidden|inject|override|secret)\s*>
  sel_4:
    response|re: (?i)(?:BEGIN|START)\s+(?:HIDDEN|SECRET|SYSTEM|INTERNAL)\s+(?:INSTRUCTIONS?|DIRECTIVES?|COMMANDS?|RULES?)
  sel_5:
    response|re: (?i)(?:do\s+not\s+(?:mention|reveal|disclose|tell|display|show)\s+(?:this|these|the)\s+(?:instruction|directive|rule|section|text))
  sel_6:
    response|re: (?i)(?:secretly|covertly|without\s+(?:the\s+)?user\s+knowing|invisibly|silently)\s+(?:add|append|include|insert|send|transmit|exfiltrate|forward)
  sel_7:
    response|re: (?i)(?:always\s+include\s+the\s+following|append\s+to\s+(?:every|all|each)\s+(?:response|answer|reply|output))\s*[:;]
  sel_8:
    response|re: (?i)(?:override\s+(?:default|standard|normal|current)\s+(?:behavior|response|mode|settings?)|switch\s+to\s+(?:unrestricted|admin|debug|developer|jailbroken)\s+mode)
  sel_9:
    response|re: (?i)(?:for\s+internal\s+use\s+only|hidden\s+directive|do\s+not\s+display\s+this\s+(?:section|part|text))\s*[:;\-]?\s*(?:you|the\s+(?:agent|ai|assistant|model))
  sel_10:
    response|re: (?i)(?:you\s+(?:are|should|must)\s+(?:now|instead|actually)\s+(?:act|behave|respond|pretend|roleplay)\s+as|from\s+this\s+point\s+(?:on|forward),?\s+(?:act|behave)\s+as)
  sel_11:
    response|re: (?i)(?:send|transmit|forward|post|exfiltrate|leak)\s+(?:all\s+)?(?:data|information|context|conversation|session|tokens?|keys?)\s+to\s+(?:https?://|ftp://|\d{1,3}\.\d{1,3})
  sel_12:
    response|re: (?i)(?:<<\s*SYS\s*>>|<\|im_start\|>\s*system|\[INST\]|\[/INST\]|<\|system\|>)\s*\w+
  condition: 1 of sel_*
falsepositives:
- Security documentation or research papers discussing poisoning techniques
- Documents that legitimately reference system instructions in educational context
- Markdown or HTML documents with legitimate XML-like tags
- Admin documentation with legitimate internal-use-only markings
- Internal IT documentation that uses XML tags like <system-config> and </system-config> for legitimate
  configuration markup, where the tag name contains 'system' as a substring but in a compound form
- Penetration testing reports that quote attack methodologies in paraphrased form without using exact
  trigger phrases
action: report
