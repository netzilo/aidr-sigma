title: ScrapeGraphAI Pipeline Inlined With Credential/PII Harvest Prompt
id: 4f2a9c1e-7b56-4d3a-9e1f-2c8b6d40a7f3
status: experimental
level: medium
author: Haibo
date: "2026-03-04"
description: |
  Reports a single event in which a scrapegraphai LLM scraping pipeline is
  constructed AD HOC (the pipeline class or import appears literally in a spawned
  process command line, which only happens when the code is inlined via -c /
  heredoc rather than run from a checked-in project file) AND the same command
  line carries either a harvest-intent extraction prompt targeting credentials,
  authentication material or personal data, or an explicit crawl-control evasion
  setting (robots directives disabled, proxy rotation, search-engine crawler UA
  spoofing). The same content test is applied to hosted ScrapeGraphAI API request
  bodies, which must contain BOTH a website_url and a user_prompt field plus the
  harvest-intent prompt.

  This deliberately does NOT alert on the presence of scrapegraphai, LangChain,
  execute_process or http_request activity on its own. The triage objection is
  correct that library usage is indistinguishable from developer usage: the
  discriminator used here is the conjunction of (a) ad-hoc/inlined pipeline
  construction, which is the shape agent-generated scraping takes rather than the
  shape an engineered scraper takes, and (b) an explicit instruction to the LLM
  extractor to pull authentication material / personal records, or an explicit
  instruction to ignore crawl controls. Either half alone is not reported.
  ACQUIRED_SKILL is graph-only and is intentionally not referenced.
references:
  - https://attack.mitre.org/techniques/T1119/
  - https://attack.mitre.org/techniques/T1594/
  - https://genai.owasp.org/llmrisk/llm06-excessive-agency/
tags:
  - attack.collection
  - attack.t1119
  - attack.reconnaissance
  - attack.t1594
  - owasp.llm06
falsepositives:
  - Data or growth engineering running a one-off `python -c` scrapegraphai
    pipeline against their own property where the prompt legitimately asks for
    contact or e-mail fields (internal directory building, lead generation).
  - QA and regression testing of scrapegraphai itself with credential-shaped
    prompts; partially suppressed by the test-runner and placeholder filters.
  - Authorized red-team or bug-bounty scraping assessments, which look identical
    to unauthorized ones in telemetry - this is why the rule reports rather than
    blocks.
  - README/demo snippets pasted verbatim by a developer that extract "emails";
    suppressed only when placeholder tokens are present.
  - An approved internal service calling the hosted ScrapeGraphAI API whose
    user_prompt happens to mention "contact information".
logsource:
  product: ai_agent
  category: agent_events
detection:

  # ── event scoping ────────────────────────────────────────────────────────
  sel_exec_event:
    event_type: execute_process
  sel_http_event:
    event_type: http_request

  # ── ad-hoc pipeline construction (case-sensitive: real symbols, not prose) ─
  sel_pipeline_class:
    content|re: '\b(SmartScraperGraph|SmartScraperMultiGraph|SmartScraperMultiConcatGraph|SearchGraph|SearchLinkGraph|OmniScraperGraph|OmniSearchGraph|DeepScraperGraph|ScriptCreatorGraph|ScriptCreatorMultiGraph|XMLScraperGraph|JSONScraperGraph|CSVScraperGraph)\s*\('
  sel_pipeline_import:
    content|re:
      - '(?i)\bfrom\s+scrapegraphai[a-z_.]*\s+import\b'
      - '(?i)\bimport\s+scrapegraphai\b'

  # ── hosted ScrapeGraphAI API body: needs BOTH fields ─────────────────────
  sel_api_body_url:
    content|re: '(?i)"website_url"\s*:\s*"https?://'
  sel_api_body_prompt:
    content|re: '(?i)"user_prompt"\s*:\s*"'

  # ── harvest intent: the extraction prompt names auth material or PII ─────
  sel_intent_harvest:
    content|re:
      - '(?i)\b(user_)?prompt\s*[=:]\s*[a-z]?[''"][^''"]{0,400}\b(e-?mails?|e-?mail addresses|passwords?|credentials?|api[ _-]?keys?|access[ _-]?tokens?|session[ _-]?cookies?|social[ _-]?security|ssn|credit[ _-]?cards?|phone numbers?|home addresses?|dates? of birth|salar(y|ies)|employee (list|directory|roster|names)|contact (list|details|information))'
      - '(?i)\b(extract|scrape|harvest|collect|enumerate|dump)\s+(all\s+|every\s+|the\s+)*(e-?mails?|e-?mail addresses|passwords?|credentials?|api[ _-]?keys?|logins?|employee|customer|user)[a-z_ -]{0,16}\b'

  # ── crawl-control evasion ───────────────────────────────────────────────
  sel_intent_evasion:
    content|re:
      - '(?i)\b(obey_robots|respect_robots|robots_txt|check_robots)\b\s*[=:]\s*[''"]?(false|0|no)\b'
      - '(?i)\b(ignore_robots|bypass_robots|skip_robots|disable_robots)\b\s*[=:]\s*[''"]?(true|1|yes)\b'
      - '(?i)\bprox(y|ies)[a-z_]{0,12}\b[^\n]{0,80}\brotat[a-z]*'
      - '(?i)\bheaders?\b[^\n]{0,140}\buser-agent\b[^\n]{0,120}\b(googlebot|bingbot|slurp|duckduckbot)\b'

  # ── suppression ─────────────────────────────────────────────────────────
  filter_test_or_help:
    content|re: '(?i)\b(pytest|unittest|nose2|tox|nox|coverage\s+run)\b|--collect-only|--dry-run|--help\b|--version\b'
  filter_placeholder:
    content|re:
      - '(?i)\byour[_ -](api[_ -]?key|password|e-?mail|token)\b'
      - '(?i)<[a-z_ -]{0,24}(key|password|e-?mail|token)[a-z_ -]{0,24}>'
      - '(?i)\b(placeholder|dummy|redacted|sample_prompt|test_prompt)\b'
      - '(?i)\bfoo(bar)?@|xxxx+|\bEXAMPLE_(API_KEY|PASSWORD|EMAIL)\b'

  condition: >
    (
      (sel_exec_event and (sel_pipeline_class or sel_pipeline_import)
        and (sel_intent_harvest or sel_intent_evasion))
      or
      (sel_http_event and sel_api_body_url and sel_api_body_prompt
        and sel_intent_harvest)
    )
    and not (filter_test_or_help or filter_placeholder)
action: report
