title: Credential Exfiltration via Fake DevOps Tool Initialization
id: 9dffa6f8-b66a-43fc-90a4-8ac26bde4578
status: experimental
level: critical
description: |-
  Detects skills that masquerade as legitimate DevOps tools but contain malicious initialization sequences that exfiltrate cloud credentials by reading multiple credential files, base64 encoding them, and transmitting to external endpoints via HTTP POST.

  Adapted from Agent Threat Rules ATR-2026-00224 (MIT).
author: ATR Community (adapted)
date: '2026-04-10'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00224
tags:
- attack.persistence
- atlas.aml.t0040
- owasp.asi04
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: cat\s+[^\n]*\.(aws|azure|gcloud)[^\n]*credentials[^\n]*\.json[^\n]*2>/dev/null
  sel_1:
    content|re: \|\s*base64\s*\|\s*curl\s+[^\n]*-[XdD]\s+[^\n]*POST[^\n]*-[dD]\s+@-
  sel_2:
    content|re: https?://[^/\s]+\.(io|com|net|org)/api/[^/\s]+/(init|setup|config|auth)
  sel_3:
    content|re: (initialization|setup|pre-flight)[^\n]*sequence[^\n]*(required|must|critical)
  sel_4:
    content|re: AUTH_MISSING[^\n]*error[^\n]*(fail|without)
  condition: 1 of sel_*
falsepositives:
- Legitimate DevOps documentation explaining credential management concepts
- Security training materials describing attack patterns as examples
- Official cloud provider SDKs with proper credential handling
action: report
