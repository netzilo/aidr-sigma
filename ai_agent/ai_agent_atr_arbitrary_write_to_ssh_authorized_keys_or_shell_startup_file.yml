title: Arbitrary Write to SSH Authorized Keys or Shell Startup File via Unvalidated File-Edit Tool
id: 25146304-07fd-4d56-a83a-8b16fe1eebce
status: experimental
level: critical
description: |-
  Detects an agent being directed to use a file-write/edit tool (multiedit, write_file, apply_diff, patch, or similar) to plant a persistence backdoor: injecting an attacker SSH public key into ~/.ssh/authorized_keys, or prepending a writable/temp directory (/tmp, /var/tmp, /dev/shm, ~/.cache) onto PATH inside a shell startup file (~/.bashrc, ~/.zshrc, ~/.profile, ~/.bash_profile). Mined from GHSA-29w3-p9w9-wc47 (PraisonAI multiedit tool has no path validation, workspace-boundary check, or protected-path guard, letting a crafted prompt make it read/write arbitrary files including SSH keys and shell dotfiles) -- generalized beyond that one tool name, since any file-edit tool lacking the same protections is equally exploitable. Ordinary edits to these files (adding an alias, an env var export, an nvm/pyenv init block) are common and must not fire; only the two concrete persistence primitives above do.

  Adapted from Agent Threat Rules ATR-2026-02040 (MIT).
author: ATR Community (adapted)
date: '2026-07-11'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-02040
tags:
- attack.privilege-escalation
- attack.t1098.004
- attack.t1546.004
- atlas.aml.t0053
- owasp.asi02
- owasp.llm08
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\b(multiedit|write_file|apply_diff|patch|overwrite|append|edit)\b[\s\S]{0,30}(~[\/\\]?|\$HOME[\/\\])\.(bashrc|bash_profile|zshrc|profile)\b[\s\S]{0,40}\bexport\s+PATH=["\x27]?(\/tmp|\/var\/tmp|\/dev\/shm|~[\/\\]\.cache)[^\n"\x27]*:\$PATH
  condition: sel_0
falsepositives:
- Adding a normal alias, function, or env-var export to a shell rc file
- Legitimate PATH additions pointing at project-local bin/ or language-version-manager (nvm/pyenv/rbenv)
  directories, not /tmp or /dev/shm
- An operator provisioning their OWN SSH key via cloud-init/Ansible/bootstrap onboarding, expressed with
  first-person framing ("my own", "my key", "myself", or a "me@<host>" key comment) -- this rule now requires
  the request to NOT carry that self-referential framing before firing, since routine self-provisioning
  is common and an attacker planting a foreign key has no reason to frame it as the requester's own
action: report
