title: CrewAI RAG URL Validation Bypass SSRF (CVE-2026-2286)
id: 8f491cb2-b5d7-49c3-a607-90ab8696ecc1
status: experimental
level: high
description: |-
  Detects CVE-2026-2286 (CVSS HIGH, CWE-918): CrewAI's RAG (retrieval-augmented generation) URL validator can be bypassed by URL encoding, mixed-case, or alternative representations (decimal IP, hex IP, IPv6 loopback, DNS rebinding shapes) to perform server-side request forgery against internal services on the CrewAI host network.
  The vulnerability is part of the CERT/CC VU#221883 advisory cluster (four CrewAI CVEs, 2026-03-30). An agent or tool input that passes a crafted RAG source URL causes CrewAI to make internal HTTP requests to metadata services (e.g., AWS IMDS 169.254.169.254), internal APIs, or services on private RFC-1918 ranges — enabling cloud credential theft, internal service enumeration, or lateral movement.
  Detection covers: (a) RAG source URLs containing SSRF bypass representations of loopback /
      link-local / private IP ranges;
  (b) URL-encoded, hex, octal, or decimal IP representations of internal
      addresses in RAG contexts;
  (c) CrewAI RAG with cloud metadata endpoint patterns (169.254.169.254); (d) Explicit CVE-2026-2286 / CrewAI SSRF framing.

  Adapted from Agent Threat Rules ATR-2026-00547 (MIT).
author: ATR Community (adapted)
date: '2026-05-28'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00547
- https://nvd.nist.gov/vuln/detail/CVE-2026-2286
tags:
- attack.privilege-escalation
