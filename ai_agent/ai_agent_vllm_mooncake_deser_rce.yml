title: vLLM Mooncake Deserialization RCE - Inference Server Spawns Execution Primitive
id: 4f6c1d9e-8a72-4b31-9c5e-2d1a7f0b6e84
status: experimental
level: high
author: Egemen
date: "2026-03-14"
description: |
  Detects the only observable consequence of the vLLM + Mooncake unsafe-deserialization
  RCE (untrusted serialized payload delivered over the ZMQ/TCP KV-cache transport that
  Mooncake binds on all interfaces): the vLLM serving process lineage spawning a
  code-execution primitive.

  TRIAGE DISSENT ANSWERED. The exploitation vector itself is NOT in the engine schema -
  there is no network_connection / deserialize_data event type and no NETWORK_LISTEN,
  ACCEPTS_CONNECTION, DESERIALIZATION_GADGET or EXECUTES_CODE edge kind. This rule does
  not pretend to see the ZMQ payload. It takes the one live signal (execute_process) and
  makes it attributable and specific in three ways, which is exactly what the skeptic says
  a bare process spawn cannot do:

    1. ATTRIBUTION - the spawned session's lineage (lineage()) must contain an ANCESTOR
       session whose program path or command line has the invocation SHAPE of a
       vLLM/Mooncake server: "vllm serve", "-m vllm.entrypoints...", mooncake_master,
       MooncakeConnector, kv_transfer_config, MOONCAKE_CONFIG, VLLM_*= env launch. A mere
       mention of the string "vllm" in a developer command line does not qualify.
    2. SPECIFICITY - the child command must be an execution primitive a healthy inference
       server never runs: reverse shell, download piped to an interpreter, base64-decode
       piped to an interpreter, netcat/socat exec, authorized_keys or cron persistence,
       execution staged out of a world-writable directory, or an inline interpreter
       carrying a socket shell / pickle.loads gadget / os.system.
    3. CORROBORATION - the spawned session's own activity edges (CONNECTS, HTTP_REQUEST,
       CREATE_FILE/WRITE_FILE resolved with fs_activity) inside a 5 minute window of the
       trigger. Weaker (tier B) primitives are reported ONLY when they are accompanied by
       a write into a persistence/staging location.

  Because the causal link to the network payload is inferred, not observed, the verdict is
  report - never block. The kill chain carries the server launch context, the spawn, and
  the child's egress/dropper edges so an analyst can confirm or discard it.
references:
  - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
  - https://cwe.mitre.org/data/definitions/502.html
  - https://docs.vllm.ai/en/latest/features/disagg_prefill.html
tags:
  - attack.initial-access
  - attack.t1190
  - attack.execution
  - attack.t1059
  - attack.persistence
  - attack.t1098.004
  - cwe.502
  - owasp.a08-2021
falsepositives:
  - Container entrypoint scripts that run "curl ... | bash" or "pip install" bootstrap steps.
    Mitigated because the vLLM/Mooncake marker must appear on an ANCESTOR invocation, and a
    typical entrypoint installs packages before launching the server, so no marker exists yet.
  - torch.compile / Triton / DeepGEMM JIT compilation, which spawns "sh -c" with nvcc, g++,
    ld or ninja from a vLLM worker. None of these match the anchor patterns.
  - Python multiprocessing / resource_tracker workers
    (python -c "from multiprocessing.spawn import spawn_main; ..."). Deliberately excluded -
    inline-interpreter matching requires socket+connect, pickle+loads, or os.system/os.popen.
  - Ray or Kubernetes cluster launchers that bootstrap workers with "bash -c" plus a remote
    fetch. Reported at MEDIUM only, and only if the child also writes into /dev/shm, /var/tmp,
    ~/.ssh, cron or a system binary directory.
  - Model-weight or tokenizer downloads issued with curl/wget by the serving process. These
    are tier B and are suppressed unless a persistence/staging write is also present.
  - Legitimate operator debugging inside the model server container (nc, socat, bash -i during
    an incident). Expect these during on-call sessions; correlate with change tickets.
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - file_activity
  - http
  - connect
detection:
  sel_exec:
    event_type: execute_process
  condition: sel_exec
action: execute
on_timeout: allow
on_error: allow
script: |
  # ---------------------------------------------------------------------------
  # vLLM / Mooncake unsafe-deserialization RCE - post-exploitation detector.
  # Only execute_process is observable, so the rule earns its specificity from
  # lineage attribution + primitive specificity + graph corroboration.
  # ---------------------------------------------------------------------------

  WINDOW_NS     = 300000000000     # 5 minutes - corroboration clustering window
  DEDUPE_NS     = 120000000000     # 2 minutes - suppress duplicate reports

  # Invocation-shaped markers of a real vLLM / Mooncake server process.
  SERVER_MARKERS = [
      r"(?i)\bmooncake[_-]?master\b",
      r"(?i)\bmooncake[_-]?(transfer|store|engine|metadata)",
      r"(?i)MooncakeConnector",
      r"(?i)MOONCAKE_CONFIG",
      r"(?i)kv[_-]transfer[_-]config",
      r"(?i)\bvllm\s+serve\b",
      r"(?i)-m\s+vllm[._][a-z_.]*",
      r"(?i)vllm\.entrypoints\.[a-z_.]*",
      r"(?i)/(bin|sbin)/vllm\b",
      r"(?i)vllm[^\n]{0,40}(api_server|EngineCore|engine_core|worker_base)",
      r"(?i)VLLM_[A-Z0-9_]{3,}=",
  ]

  # Tier A - primitives an inference server never legitimately executes.
  TIER_A = [
      [r"(?i)\bbash\s+-i\b", "interactive shell requested by a serving process"],
      [r"/dev/(tcp|udp)/[0-9a-zA-Z.\-]+/[0-9]+", "shell redirected to a raw socket (reverse shell)"],
      [r"(?i)\b(curl|wget)\b[^|;&]{0,400}\|[^|]{0,60}\b(bash|sh|zsh|dash|python[0-9.]*|perl|ruby|node)\b", "remote payload piped straight into an interpreter"],
      [r"(?i)\bbase64\b\s*(-d|-D|--decode)[^|;&]{0,200}\|[^|]{0,60}\b(bash|sh|zsh|dash|python[0-9.]*|perl)\b", "base64 payload decoded into an interpreter"],
      [r"(?i)\b(nc|ncat|netcat)\b[^|;&]{0,200}\s-[a-z]{0,4}e[a-z]{0,4}\s", "netcat invoked with command execution"],
      [r"(?i)\bsocat\b[^|;&]{0,200}(exec|system):", "socat exec/system relay"],
      [r"(?i)>>?\s*[^\s;|&]{0,120}authorized_keys", "SSH authorized_keys tampering"],
      [r"(?i)\bcrontab\b\s+(-\s|/tmp/|/dev/shm/|/var/tmp/)", "cron persistence installed"],
      [r"(?i)\bchmod\s+[0-7ugoa+rwxs,]{1,8}\s+(/tmp/|/dev/shm/|/var/tmp/)", "dropped file marked executable in a world-writable directory"],
      [r"(?i)\b(sh|bash|zsh|dash)\b\s+-c\b[^\n]{0,300}(/tmp/|/dev/shm/|/var/tmp/)[^\s;|&]{1,80}", "shell executing content staged in a world-writable directory"],
  ]

  # Tier B - suspicious for a serving process, reported only with a dropper write.
  TIER_B = [
      [r"(?i)\b(curl|wget)\b\s+[^|;&]{0,300}https?://", "outbound fetch issued by the inference server"],
      [r"(?i)\b(ssh|scp|rsync)\b\s+[^|;&]{0,200}@", "lateral movement toward another cluster host"],
      [r"(?i)/proc/self/environ", "process environment harvested"],
      [r"(?i)(\.aws/credentials|\.ssh/id_[a-z]+|\.kube/config|/etc/shadow|/var/run/secrets/kubernetes\.io)", "credential material referenced"],
      [r"(?i)\b(pip|pip3)\s+install\b", "package installation from the inference server"],
      [r"(?i)\b(apt-get|apt|yum|dnf|apk)\s+(install|add)\b", "system package installation"],
      [r"(?i)\b(whoami|uname\s+-a)\b", "host discovery"],
  ]

  # Persistence / staging write locations (narrows detection; not a trust list).
  DROP_PATTERNS = [
      ["authorized keys", "SSH authorized_keys"],
      ["ssh id", "SSH private key material"],
      ["cron", "cron location"],
      ["systemd system", "systemd unit"],
      ["bashrc", "shell profile"],
      ["usr local bin", "system binary directory"],
      ["dev shm", "shared-memory staging"],
      ["var tmp", "world-writable staging"],
  ]

  def to_int(s):
      if s == None:
          return 0
      v = str(s)
      if v == "":
          return 0
      if re.find(r"^[0-9]+$", v) == None:
          return 0
      return int(v)

  def trunc(s, n):
      if s == None:
          return ""
      v = str(s)
      if len(v) > n:
          return v[:n] + "..."
      return v

  def within(ts_str, ref):
      t = to_int(ts_str)
      if t == 0 or ref == 0:
          return True
      d = ref - t
      if d < 0:
          d = -d
      return d <= WINDOW_NS

  def spawn_cmd(content):
      # execute_process content is {"command": ..., "path": ...} (json.Marshal,
      # so quotes, backslashes and < > & arrive escaped). Return the raw command.
      i = content.find('"command":')
      if i < 0:
          return content
      j = content.find('"', i + 10)
      if j < 0:
          return content
      out = ""
      k = j + 1
      n = len(content)
      for _ in range(n):
          if k >= n:
              break
          c = content[k]
          if c == '"':
              break
          if c == "\\" and k + 1 < n:
              d = content[k + 1]
              if d == "u" and k + 5 < n:
                  out += chr(int(content[k + 2:k + 6], 16))
                  k += 6
                  continue
              if d == "n":
                  out += "\n"
              elif d == "t":
                  out += "\t"
              else:
                  out += d
              k += 2
              continue
          out += c
          k += 1
      return out

  def marker_of(text):
      if text == "":
          return ""
      for p in SERVER_MARKERS:
          m = re.find(p, text)
          if m != None:
              return m
      return ""

  def is_mooncake(text):
      return re.find(r"(?i)mooncake", text) != None

  def match_tier(cmd, table):
      for row in table:
          if re.find(row[0], cmd) != None:
              return row[1]
      return ""

  def inline_interp(cmd):
      # inline interpreter payloads; deliberately excludes multiprocessing.spawn
      if re.find(r"(?i)\b(python[0-9.]*|perl|ruby|node|php)\b[^;|&]{0,120}\s-(c|e|r)\b", cmd) == None:
          return ["", ""]
      if re.find(r"(?i)\bsocket\b", cmd) != None:
          if re.find(r"(?i)\b(connect|bind|dup2|SOCK_STREAM)\b", cmd) != None:
              return ["A", "inline interpreter socket shell"]
      if re.find(r"(?i)\bpickle\b", cmd) != None:
          if re.find(r"(?i)(loads|__reduce__|Unpickler)", cmd) != None:
              return ["A", "inline pickle deserialization gadget executed"]
      if re.find(r"(?i)(os\.system|os\.popen|commands\.getoutput)", cmd) != None:
          return ["A", "inline interpreter command execution"]
      if re.find(r"(?i)(eval|exec)\s*\(\s*(base64|compile|zlib|marshal|__import__)", cmd) != None:
          return ["A", "inline interpreter evaluating an encoded payload"]
      if re.find(r"(?i)subprocess\.(Popen|run|call|check_output)", cmd) != None:
          return ["B", "inline interpreter spawning a subprocess"]
      return ["", ""]

  def sess_spawn(x):
      # The session's own SPAWNED row (keyed by the child), or None.
      for r in events(kind="SPAWNED", session=x["id"], limit=1):
          return r
      return None

  def sess_cmdline(x):
      r = sess_spawn(x)
      if r != None and r.get("cmdline", "") != "":
          return r.get("cmdline", "")
      p = node(x.get("program", ""))
      if p != None:
          return p.get("cmdlines", "")
      return ""

  def row_edge(r):
      t = r.get("ts", "0")
      frm = r.get("session_id", "")
      if r.get("kind", "") == "SPAWNED":
          frm = r.get("parent_session", "")
      return {"from": frm, "to": r.get("target_id", ""), "kind": r.get("kind", ""),
              "dir": "out", "ts": t, "first_ts": t, "last_ts": t,
              "cmdline": r.get("cmdline", "")}

  def sess_edge(x):
      # How this session came to exist: its SPAWNED row from the parent, or the
      # INSTANCE_OF edge to its program when it is a root session.
      r = sess_spawn(x)
      if r != None:
          return row_edge(r)
      t = x.get("first_seen", "0")
      if x.get("parent", "") != "":
          return {"from": x["parent"], "to": x["id"], "kind": "SPAWNED", "dir": "out",
                  "ts": t, "first_ts": t, "last_ts": t}
      return {"from": x["id"], "to": x.get("program", ""), "kind": "INSTANCE_OF", "dir": "out",
              "ts": t, "first_ts": t, "last_ts": t}

  def chain_root(lin):
      # The nearest agent ancestor, else the lineage root.
      for x in lin:
          if x.get("agent", "0") == "1":
              return x
      return lin[-1]

  def lineage_attribution(inst):
      # Walk the triggering session's ancestry looking for the server marker on
      # a session's program path or command line. The spawned primitive itself
      # (lineage[0]) never supplies the marker: the marker must be an ANCESTOR.
      lin = lineage(inst["id"])
      if lin == None or len(lin) == 0:
          return None
      names  = []
      marker = ""
      mc     = False
      server = None
      for i in range(len(lin)):
          x = lin[i]
          ap = x.get("path", "")
          if ap != "":
              names.append(ap.split("/")[-1])
          if i == 0:
              continue
          blob = ap + " " + sess_cmdline(x)
          if marker == "":
              m = marker_of(blob)
              if m != "":
                  marker = m
                  server = x
          if is_mooncake(blob):
              mc = True
      return {"names": " <- ".join(names), "marker": marker, "mooncake": mc,
              "server": server, "root": chain_root(lin)["id"]}

  def already_reported(key, ts):
      recent = store_get("recent")
      if recent == None:
          recent = {}
      prev = to_int(recent.get(key, "0"))
      if prev > 0 and ts > 0 and (ts - prev) < DEDUPE_NS:
          return True
      if len(recent) > 48:
          recent = {}
      recent[key] = str(ts)
      u = store_usage()
      if u["free"] > 8192:
          store_set("recent", recent)
      return False

  def run():
      # ---- 1. relevance gate: pure string work on meta, no graph/log calls ----
      if meta.get("context_type", "") != "execute_process":
          return "allow"
      cmd = spawn_cmd(meta.get("content", ""))
      if len(cmd) < 6:
          return "allow"
      ts = to_int(meta.get("event_ts", "0"))

      # ---- 2. specificity: is the spawned command an execution primitive? ----
      tier = ""
      what = ""
      hit = match_tier(cmd, TIER_A)
      if hit != "":
          tier = "A"
          what = hit
      else:
          ip = inline_interp(cmd)
          if ip[0] != "":
              tier = ip[0]
              what = ip[1]
          else:
              hb = match_tier(cmd, TIER_B)
              if hb != "":
                  tier = "B"
                  what = hb
      if tier == "":
          return "allow"

      # ---- 3. attribution: the spawned primitive is the triggering session ----
      inst = session()
      if inst == None:
          return "allow"   # unknown session: nothing to attribute to
      att = lineage_attribution(inst)
      if att == None or att["marker"] == "":
          return "allow"   # not attributable to a vLLM/Mooncake server lineage
      marker   = att["marker"]
      mooncake = att["mooncake"]
      names    = att["names"]
      root     = att["root"]
      server   = att["server"]

      # ---- 4. kill chain + graph corroboration ----
      chain  = new_chain(root)
      stages = []

      chain.append(step(sess_edge(server), stage_id="Inference Server Context",
                        stage_desc="vLLM/Mooncake server process launched: " +
                                   trunc(sess_cmdline(server) or server.get("path", "?"), 160)))

      trig = None
      own = sess_spawn(inst)
      if own != None:
          trig = row_edge(own)
      if trig == None:
          parent_id = inst.get("parent", "")
          if parent_id == "":
              parent_id = root
          trig = {"from": parent_id, "to": inst["id"], "kind": "SPAWNED",
                  "ts": str(ts), "first_ts": str(ts), "last_ts": str(ts),
                  "cmdline": trunc(cmd, 300)}
      chain.append(step(trig, stage_id="Post-Deserialization Execution",
                        stage_desc=what + " -- " + trunc(cmd, 220)))
      stages.append(what)

      has_write = False
      cid = inst["id"]

      for e in edges(cid, dir="out", kind="CONNECTS"):
          h = node(e["to"])
          if h == None or h.get("is_ztna_host", "0") == "1":
              continue
          if not within(e.get("last_ts", e.get("first_ts", "")), ts):
              continue
          chain.append(step(e, stage_id="C2 / Exfil Egress",
                            stage_desc="spawned process connected to public endpoint " +
                                       h.get("host", "?") + ":" + h.get("port", "?")))
          stages.append("public egress " + h.get("host", "?"))
          break

      for e in edges(cid, dir="out", kind="HTTP_REQUEST"):
          u = node(e["to"])
          if u == None or u.get("is_ztna_host", "0") == "1":
              continue
          if not within(e.get("last_ts", e.get("first_ts", "")), ts):
              continue
          chain.append(step(e, stage_id="Payload Retrieval",
                            stage_desc="spawned process issued HTTP " + e.get("method", "") +
                                       " to " + u.get("host", "?")))
          stages.append("http fetch " + u.get("host", "?"))
          break

      for k in ["CREATE_FILE", "WRITE_FILE"]:
          if has_write:
              break
          op = "CREATE"
          if k == "WRITE_FILE":
              op = "WRITE"
          for e in edges(cid, dir="out", kind=k):
              if has_write:
                  break
              if not within(e.get("last_ts", e.get("first_ts", "")), ts):
                  continue
              for dp in DROP_PATTERNS:
                  acts = fs_activity(session=cid, op=op, pattern=dp[0])
                  pick = None
                  for a in acts:
                      if within(a.get("ts", ""), ts):
                          pick = a
                          break
                  if pick != None:
                      chain.append(step(e, stage_id="Dropper / Persistence",
                                        stage_desc="spawned process wrote " + dp[1] + ": " +
                                                   pick["path"], activity=pick))
                      stages.append("write " + pick["path"])
                      has_write = True
                      break

      # ---- 5. verdict ----
      if tier == "B" and not has_write:
          return "allow"

      key = marker + "|" + trunc(cmd, 90)
      if already_reported(key, ts):
          return "allow"

      sev = "MEDIUM"
      if tier == "A":
          sev = "HIGH"
      if tier == "A" and (has_write or len(stages) > 1):
          sev = "CRITICAL"
      transport = "vLLM"
      if mooncake:
          transport = "vLLM+Mooncake KV transport"

      print("vLLM/Mooncake post-deser exec [" + sev + "] marker=" + trunc(marker, 60) +
            " lineage=" + trunc(names, 120) + " stages=" + "; ".join(stages))

      return {
          "action": "report",
          "reason": "[" + sev + "] " + transport + " server lineage spawned an execution " +
                    "primitive - consistent with unsafe deserialization RCE over the " +
                    "exposed ZMQ/TCP KV-cache interface (CWE-502). Server marker: " +
                    trunc(marker, 80) + ". Lineage: " + trunc(names, 140) +
                    ". Evidence: " + "; ".join(stages) +
                    ". NOTE: the deserialization event itself is not observable by this " +
                    "engine - this is downstream inference, verify the Mooncake listener " +
                    "bind address and authentication.",
          "chain": chain,
      }

  result = run()
