title: Invisible Ink Injected Goal - Low-Harm Side Effect After Content Ingestion
id: 6f2b91d4-3c58-42ae-9a71-8d0e5b47c1f3
status: experimental
level: medium
description: |
  Detects the execution signature of an "Invisible Ink" indirect prompt injection
  against a computer-use agent: the agent ingests remote, attacker-controllable
  content (an issue thread, comment, README, raw markdown page, wiki, mailbox
  item, or a curl/gh view of one) and then, inside the same process session and
  within five minutes, performs a low-harm state-mutating side effect that is
  behaviourally indistinguishable from legitimate work - starring / forking /
  watching / subscribing / following / reacting via a mutating HTTP verb or a
  GraphQL mutation, or installing a package or editor extension via a subprocess.

  Neither stage is suspicious alone. A star is a star; npm install is npm install.
  The signal is the ordered, session-scoped, tightly-windowed pairing of "read
  untrusted content" -> "quietly change external state", which is exactly the
  behaviour a human-in-the-loop reviewer waves through.

  Attribution is instance-resolved: the rule anchors on meta["caller_pid"], resolves
  the exact process instance with proc_instance(), walks proc_lineage() to the
  session root, expands to descendants spawned inside the window, and queries the
  event log scoped to (actor_pid, actor_start) pairs. Nothing is ever attributed
  across sessions or across PID reuse. The triggering event itself is read from
  meta and never re-queried, so the async ingest race cannot drop the anchor stage.

  Action is report only: by construction this behaviour is low-harm and ambiguous,
  and blocking a package install or a repo star would break ordinary developer work.
author: Haibo
date: "2026-06-11"
references:
  - https://atlas.mitre.org/techniques/AML.T0051
  - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
tags:
  - attack.execution
  - attack.t1204
  - atlas.aml.t0051
  - owasp.llm01
falsepositives:
  - Developer explicitly asks the agent to star, fork, watch or subscribe to a repository
    immediately after the agent has read that repository's README or issue thread. This is
    behaviourally identical to the attack and is the reason the rule reports rather than blocks.
  - Agent reads a docs page or install guide and then runs the documented "npm install" /
    "pip install" / "brew install" / "code --install-extension" step as part of a legitimate
    environment setup or dependency-resolution task.
  - Issue-triage workflows where the agent reads an issue and then legitimately subscribes to
    the thread, adds a reaction, or posts via "gh api -X POST" as part of the assigned task.
  - CI or bootstrap automation that fetches a manifest over HTTP and then installs the packages
    it names inside the same shell session.
  - Marketplace or plugin-installation flows performed at the user's direct request after the
    agent browsed the marketplace listing page.
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_exec:
    event_type: execute_process
  sel_http:
    event_type: http_request
  condition: sel_exec or sel_http
action: execute
on_timeout: report
on_error: allow
script: |
  # ── Invisible Ink: low-harm injected goal executed by a computer-use agent ──
  WINDOW_NS = 300000000000     # 5 min - ingestion and side effect must cluster
  DEDUP_NS  = 900000000000     # 15 min - suppress identical repeat reports
  MAX_ROWS  = 200

  MUTATING = ["PUT", "POST", "PATCH", "DELETE"]

  # Low-harm, state-mutating surfaces. Detection only - nothing here permits anything.
  SIDE_EFFECT_PATHS = [
      r"(?i)/user/starred/",
      r"(?i)/repos/[^/]+/[^/]+/(subscription|forks|stargazers)",
      r"(?i)/user/following/",
      r"(?i)/gists/[^/]+/star",
      r"(?i)/(follow|unfollow|subscribe|unsubscribe|watch|star|unstar|favorite|bookmark)(/|$|\?)",
      r"(?i)/friendships/(create|destroy)",
      r"(?i)/(likes?|favourites?|reactions)(/|$|\?)",
      r"(?i)/marketplace/[^/]*install",
      r"(?i)/(apps?|extensions?|plugins?)/[^/]*/install",
  ]

  SIDE_EFFECT_BODY = [
      r"(?i)\b(addStar|removeStar|starRepository|followUser|watchRepository|createReaction|subscribeTo)\b",
  ]

  SIDE_EFFECT_EXEC = [
      r"(?i)\b(npm|pnpm|yarn|bun)\s+(i|add|install|star)\b",
      r"(?i)\bpip3?\s+install\b",
      r"(?i)\buv\s+(pip\s+)?(add|install)\b",
      r"(?i)\b(gem|cargo|go|brew|pipx|composer)\s+install\b",
      r"(?i)\bcode\s+--install-extension\b",
      r"(?i)\bgh\s+repo\s+(star|fork|subscribe)\b",
      r"(?i)\bgh\s+api\b[^\n]*\b(starred|subscription|following|reactions)\b",
      r"(?i)\bgh\s+api\b[^\n]*-X\s*(PUT|POST|PATCH|DELETE)\b",
      r"(?i)\bcurl\b[^\n]*\b(starred|subscription|following)\b",
  ]

  # Attacker-controllable content surfaces - the injection carrier.
  INGEST_PATHS = [
      r"(?i)/issues(/|$|\?)",
      r"(?i)/pulls?(/|$|\?)",
      r"(?i)/comments(/|$|\?)",
      r"(?i)/readme",
      r"(?i)/raw/",
      r"(?i)/blob/",
      r"(?i)/gist",
      r"(?i)/wiki",
      r"(?i)\.(md|markdown|txt|html?|rst)(\?|$)",
      r"(?i)/(page|article|post|thread|ticket|task|doc)s?/",
      r"(?i)/(inbox|mail|messages|conversations|threads)(/|$|\?)",
  ]

  INGEST_EXEC = [
      r"(?i)\b(curl|wget|httpie|lynx|w3m|pandoc)\b",
      r"(?i)\bgh\s+(issue|pr)\s+view\b",
      r"(?i)\bcat\b[^\n]*\.(md|markdown|txt|rst)\b",
  ]

  def clip(s, n):
      if len(s) <= n:
          return s
      return s[:n] + "..."

  def any_match(pats, s):
      if s == "":
          return False
      for p in pats:
          if re.find(p, s) != None:
              return True
      return False

  def row_is_side_effect_http(e):
      m = e.get("method", "").upper()
      if m not in MUTATING:
          return False
      p = e.get("path", "")
      if p == "":
          p = e.get("target_id", "")
      return any_match(SIDE_EFFECT_PATHS, p)

  def ev_edge(e):
      return {
          "from":     "process://" + e.get("actor_path", ""),
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", ""),
          "ts":       e.get("ts", "0"),
          "first_ts": e.get("ts", "0"),
          "last_ts":  e.get("ts", "0"),
      }

  def trig_edge(inst, ts, kind, target):
      return {
          "from":     "process://" + inst.get("actor_path", ""),
          "to":       target,
          "kind":     kind,
          "ts":       str(ts),
          "first_ts": str(ts),
          "last_ts":  str(ts),
      }

  # Session = lineage of the triggering instance + descendants spawned in-window.
  def session_instances(lineage, since_ns, now_ns):
      pids = {}
      for x in lineage:
          pids[x["actor_pid"]] = x.get("actor_start", "0")
      rows = query_events(kind="EXECUTE_PROCESS", since_ns=since_ns,
                          until_ns=now_ns, limit=2000)
      for i in range(4):
          added = 0
          for e in rows:
              pp = e.get("parent_pid", "")
              ap = e.get("actor_pid", "")
              if pp != "" and pp in pids and ap != "" and ap not in pids:
                  pids[ap] = e.get("actor_start", "0")
                  added = added + 1
          if added == 0:
              break
      return pids

  # One bounded pass per session instance: classify rows as ingestion or side effect.
  def scan_session(pids, since_ns, now_ns, trig_ts):
      ingest = None
      extra  = {}
      for pid in pids:
          ipid = int(pid)
          istart = int(pids[pid]) if pids[pid] != "" else 0
          for e in query_events(kind="HTTP_REQUEST", actor_pid=ipid, actor_start=istart,
                                since_ns=since_ns, until_ns=now_ns, limit=MAX_ROWS):
              ts = int(e.get("ts", "0"))
              p  = e.get("path", "")
              if p == "":
                  p = e.get("target_id", "")
              if row_is_side_effect_http(e):
                  extra["http:" + e.get("host", "?") + p] = e
              elif ts <= trig_ts and any_match(INGEST_PATHS, p):
                  if ingest == None or ts > int(ingest.get("ts", "0")):
                      ingest = e
          for e in query_events(kind="EXECUTE_PROCESS", actor_pid=ipid, actor_start=istart,
                                since_ns=since_ns, until_ns=now_ns, limit=MAX_ROWS):
              ts = int(e.get("ts", "0"))
              c  = e.get("cmdline", "")
              if any_match(SIDE_EFFECT_EXEC, c):
                  extra["exec:" + clip(c, 120)] = e
              elif ts <= trig_ts and any_match(INGEST_EXEC, c):
                  if ingest == None or ts > int(ingest.get("ts", "0")):
                      ingest = e
      return ingest, extra

  def already_reported(key, now_ns):
      seen = store_get("reported")
      if seen == None:
          return False
      v = seen.get(key, None)
      if v == None:
          return False
      return (now_ns - int(v)) < DEDUP_NS

  def mark_reported(key, now_ns):
      seen = store_get("reported")
      if seen == None:
          seen = {}
      fresh = {}
      for k in seen:
          if (now_ns - int(seen[k])) < DEDUP_NS:
              fresh[k] = seen[k]
      fresh[key] = str(now_ns)
      if len(fresh) > 200 or store_usage()["free"] < 16384:
          fresh = {key: str(now_ns)}
      store_set("reported", fresh)

  def run():
      # ── 1. Relevance gate: pure string work on meta, no graph, no log ──────
      ct = meta.get("context_type", "")
      if ct != "http_request" and ct != "execute_process":
          return "allow"

      now = int(meta.get("event_ts", "0"))
      if now == 0:
          return "allow"

      kind   = ""
      target = ""
      detail = ""
      if ct == "http_request":
          m = meta.get("method", "").upper()
          if m not in MUTATING:
              return "allow"
          p = meta.get("path", "")
          if p == "":
              p = meta.get("url", "")
          hit = any_match(SIDE_EFFECT_PATHS, p)
          if not hit:
              hit = any_match(SIDE_EFFECT_BODY, meta.get("content", ""))
          if not hit:
              return "allow"
          kind   = "HTTP_REQUEST"
          target = meta.get("host", "") + p
          detail = m + " " + clip(target, 160)
      else:
          cmd = meta.get("content", "")
          if not any_match(SIDE_EFFECT_EXEC, cmd):
              return "allow"
          kind   = "EXECUTE_PROCESS"
          target = clip(cmd, 160)
          detail = target

      # ── 2. Instance anchor: caller_pid -> instance -> lineage ──────────────
      cp = int(meta.get("caller_pid", "0"))
      if cp == 0:
          return "allow"
      inst = proc_instance(cp, now)
      if inst == None:
          return "allow"          # degraded attribution - re-fires when the row lands
      lineage = proc_lineage(int(inst["actor_pid"]), int(inst.get("actor_start", "0")))
      if not lineage:
          return "allow"

      # ── 3. Session scope + windowed look-back for the ingestion stage ──────
      since = now - WINDOW_NS
      if since < 0:
          since = 0
      pids = session_instances(lineage, since, now)
      ingest, extra = scan_session(pids, since, now, now)
      if ingest == None:
          return "allow"          # no injection carrier in this session/window

      ing_ts = int(ingest.get("ts", "0"))
      if ing_ts <= 0 or ing_ts > now or (now - ing_ts) > WINDOW_NS:
          return "allow"          # ordering / clustering not satisfied

      if ingest.get("kind", "") == "HTTP_REQUEST":
          ing_desc = "fetched " + clip(ingest.get("host", "?") + ingest.get("path", ""), 160)
      else:
          ing_desc = "ran " + clip(ingest.get("cmdline", "?"), 160)

      root  = lineage[len(lineage) - 1]
      rname = root.get("actor_path", "?").split("/")[-1]
      key   = root.get("actor_pid", "0") + ":" + root.get("actor_start", "0") + "|" + target
      if already_reported(key, now):
          return "allow"

      # ── 4. Kill chain, rooted at the session owner ─────────────────────────
      chain = new_chain("process://" + root.get("actor_path", ""))
      chain.append(step(ev_edge(ingest),
                        stage_id="Content Ingestion",
                        stage_desc="agent ingested attacker-controllable content: " + ing_desc))
      chain.append(step(trig_edge(inst, now, kind, target),
                        stage_id="Low-Harm Side Effect",
                        stage_desc="state-mutating action " + str((now - ing_ts) // 1000000000) +
                                   "s later: " + detail))
      n = 0
      for k in extra:
          e = extra[k]
          ts = int(e.get("ts", "0"))
          if ts <= ing_ts or ts >= now or n >= 3:
              continue
          if e.get("kind", "") == "HTTP_REQUEST":
              d = e.get("method", "") + " " + clip(e.get("host", "?") + e.get("path", ""), 140)
          else:
              d = clip(e.get("cmdline", "?"), 140)
          chain.append(step(ev_edge(e),
                            stage_id="Repeat Side Effect",
                            stage_desc="additional low-harm mutation in the same window: " + d))
          n = n + 1

      lin = []
      for x in lineage:
          lin.append(x.get("actor_path", "?").split("/")[-1])

      reason = ("Invisible Ink: low-harm side effect (" + detail + ") executed " +
                str((now - ing_ts) // 1000000000) + "s after the agent " + ing_desc +
                " in the same session (" + " -> ".join(lin) + "; root " + rname +
                "; " + str(len(extra)) + " side-effect action(s) in window). " +
                "Behaviourally indistinguishable from legitimate work - review the " +
                "ingested content for an injected goal.")
      print(reason)
      mark_reported(key, now)
      return {"action": "report", "reason": reason, "chain": chain}

  result = run()
