title: vLLM Assert Bypass - Optimized Mode Model Load RCE
id: 7f3c1a92-4d5e-4b0a-9c31-2f8b6ea41d57
status: experimental
level: high
description: |
  Detects a single process-execution event that launches vLLM with CPython's
  optimized mode enabled (python -O / -OO, combined short flags such as -uO, or
  PYTHONOPTIMIZE set to a non-zero value in the same command line / container env).

  vLLM before 0.22.0 enforces the activation-function safety check in the model
  loading path with a bare `assert`. CPython strips all assert statements when
  __debug__ is false, so running the server under -O or PYTHONOPTIMIZE=1 removes
  the check entirely: a model published on HuggingFace can then name an arbitrary
  callable as its activation function and obtain code execution inside the vLLM
  worker process, unauthenticated, at model load time.

  The detection is deliberately a conjunction of two independent, individually
  weak signals that must appear in the SAME command line: (1) an explicit vLLM
  entrypoint (vllm serve / vllm.entrypoints / -m vllm / vllm-openai image /
  the vllm binary), and (2) an explicit optimized-mode enabler. Neither alone
  fires. This is a configuration-exposure detection, not an exploitation
  detection - it reports the window in which a malicious model becomes
  exploitable, before any model is fetched.
author: Evgen
date: "2026-03-18"
references:
  - https://github.com/vllm-project/vllm/security/advisories
  - https://docs.python.org/3/using/cmdline.html#cmdoption-O
  - https://attack.mitre.org/techniques/T1195/001/
  - https://attack.mitre.org/techniques/T1059/006/
tags:
  - attack.initial-access
  - attack.execution
  - attack.defense-evasion
  - attack.t1195.001
  - attack.t1059.006
  - atlas.aml.t0010
  - owasp.llm03
falsepositives:
  - ML platform teams benchmarking vLLM throughput deliberately under python -O; the
    finding is still a real exposure but is an accepted internal configuration.
  - Base container images that export PYTHONOPTIMIZE=1 for every Python service and
    happen to start a vLLM server from the same command line.
  - A command line that passes -O to an unrelated Python script while also referencing
    a wheel, image or path whose name matches a vLLM entrypoint pattern.
  - Shell one-liners that print, grep or document the vulnerable invocation rather than
    run it - suppressed by filter_inspection_tool.
  - curl -O / wget -O downloading a vLLM artifact in the same shell line, where the -O
    is an output-file flag and not a Python flag - suppressed by filter_download_output_flag.
  - Lint, type-check and test harness invocations over a vLLM source tree - suppressed by
    filter_test_harness.
  - '--help / --version probes of the vLLM CLI - suppressed by filter_help_or_version.'
logsource:
  product: ai_agent
  category: agent_events
detection:

  # ── scope: syscall-level process spawn only ───────────────────────────────
  sel_scope:
    event_type: execute_process

  # ── signal 1: an actual vLLM entrypoint (not a bare "vllm" substring) ─────
  sel_vllm_cmd:
    command|re:
      - '(?i)\bvllm[\s"'',]+(?:serve|chat|complete|bench)\b'
      - '(?i)\bvllm\.entrypoints\b'
      - '(?i)[\s"'',]-m[\s"'',]+vllm\b'
      - '(?i)\bvllm/vllm-openai\b'
      - '(?i)(?:^|[\s"''/])vllm(?:[\s"'',]|$)'
  sel_vllm_content:
    content|re:
      - '(?i)\bvllm[\s"'',]+(?:serve|chat|complete|bench)\b'
      - '(?i)\bvllm\.entrypoints\b'
      - '(?i)[\s"'',]-m[\s"'',]+vllm\b'
      - '(?i)\bvllm/vllm-openai\b'
      - '(?i)(?:^|[\s"''/])vllm(?:[\s"'',]|$)'

  # ── signal 2: CPython optimized mode == asserts stripped ──────────────────
  # -O / -OO as a standalone flag, or folded into a combined short-flag group
  # (-uO, -EsO ...), or PYTHONOPTIMIZE exported / passed via docker -e / k8s env.
  # Flag letters are matched case-SENSITIVELY: -o is not -O.
  sel_optimize_cmd:
    command|re:
      - '(?i:python)[0-9.]*[^\n]{0,100}?[\s"'',]-OO?(?:[\s"'',]|$)'
      - '(?i:python)[0-9.]*[^\n]{0,100}?[\s"'',]-[bBdEiIPqsSuvx]{1,3}OO?(?:[\s"'',]|$)'
      - '(?i:python)[0-9.]*[^\n]{0,100}?[\s"'',]-OO?[bBdEiIPqsSuvx]{1,3}(?:[\s"'',]|$)'
      - '\bPYTHONOPTIMIZE["'']?[\s:=]{1,3}["'']?[1-9]'
      - '\bPYTHONOPTIMIZE["'']?[\s:=]{1,3}["'']?(?i:true|yes|on)\b'
  sel_optimize_content:
    content|re:
      - '(?i:python)[0-9.]*[^\n]{0,100}?[\s"'',]-OO?(?:[\s"'',]|$)'
      - '(?i:python)[0-9.]*[^\n]{0,100}?[\s"'',]-[bBdEiIPqsSuvx]{1,3}OO?(?:[\s"'',]|$)'
      - '(?i:python)[0-9.]*[^\n]{0,100}?[\s"'',]-OO?[bBdEiIPqsSuvx]{1,3}(?:[\s"'',]|$)'
      - '\bPYTHONOPTIMIZE["'']?[\s:=]{1,3}["'']?[1-9]'
      - '\bPYTHONOPTIMIZE["'']?[\s:=]{1,3}["'']?(?i:true|yes|on)\b'

  # ── suppressors ───────────────────────────────────────────────────────────
  # The command line reads/prints/searches text rather than starting a server.
  filter_inspection_tool:
    content|re: '(?i)(?:^|[\s"'',/])(?:grep|egrep|fgrep|rg|ack|awk|sed|cat|less|head|tail|strings|diff|man|echo|printf)(?:[\s"'']|$)'
  # -O here is curl/wget''s remote-name output flag, not a Python flag.
  filter_download_output_flag:
    content|re: '(?i)\b(?:curl|wget|aria2c|axel)\b[^\n]{0,150}?[\s"'',]-O'
  # Test, lint and type-check harnesses walking a vLLM source tree.
  filter_test_harness:
    content|re: '(?i)\b(?:pytest|py\.test|unittest|nox|tox|coverage|mypy|ruff|flake8|black|isort)\b'
  # CLI probes that never reach the model loading path.
  filter_help_or_version:
    content|re: '(?:^|[\s"''])(?:--help|--version|-h|-V)(?:$|[\s"'',])'

  condition: >
    sel_scope
    and (sel_vllm_cmd or sel_vllm_content)
    and (sel_optimize_cmd or sel_optimize_content)
    and not (filter_inspection_tool or filter_download_output_flag or
             filter_test_harness or filter_help_or_version)

action: report
