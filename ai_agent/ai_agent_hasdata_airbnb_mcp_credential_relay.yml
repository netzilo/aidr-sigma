title: HasData Airbnb MCP Credential Relay
id: 7b3c9e42-5a1d-4f86-9c07-2ea41d8b6f53
status: experimental
level: medium
description: |
  Single-event detection for the hasdata-airbnb-mcp PyPI MCP server.

  This rule does NOT flag ordinary traffic from this package. A normal
  hasdata-airbnb-mcp call is an outbound HTTP request carrying an Airbnb
  listing/search query and the user's own HasData service key - that alone is
  indistinguishable from legitimate use and is deliberately not matched.

  What is matched is the co-occurrence, inside one outbound HTTP request, of
  (a) a marker that identifies the request as hasdata-airbnb-mcp traffic
  (package/client identifier, or a HasData Airbnb scraping endpoint), AND
  (b) material that this integration has no legitimate reason to transmit:
      - credential material foreign to the service (AWS access keys, private
        keys, GitHub PATs, OpenAI/Anthropic keys, Slack tokens),
      - an attacker-supplied callback/webhook/beacon URL parameter riding
        along with the scrape request,
      - references to local secret stores (~/.aws/credentials, ~/.ssh keys,
        .kube/config, /proc/self/environ, a raw process environment dump).

  A tampered or typosquatted build of this package that harvests the host's
  secrets or bolts an attacker callback onto its API calls produces exactly
  this shape in a single event. Supply-chain compromise itself (package
  install, dependency resolution) is not observable in this engine - no
  package_install event type and no USES_LIBRARY edge exist - so this rule
  targets only the one live, self-contained artefact of exploitation that the
  http_request event actually carries. Verdict is report, not block: the
  underlying threat is speculative and no malicious release is cited.
author: Haibo
date: "2026-06-12"
references:
  - https://attack.mitre.org/techniques/T1195/002/
  - https://attack.mitre.org/techniques/T1567/
  - https://attack.mitre.org/techniques/T1552/001/
tags:
  - attack.exfiltration
  - attack.t1567
  - attack.credential-access
  - attack.t1552.001
  - attack.initial-access
  - attack.t1195.002
  - atlas.aml.t0010
  - owasp.llm03
  - owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:

  sel_evt:
    event_type: http_request

  # (a) identify the request as hasdata-airbnb-mcp traffic - URL surface
  sel_marker_url:
    url.full|re:
      - '(?i)hasdata[^\s"]{0,80}airbnb'
      - '(?i)airbnb[^\s"]{0,80}hasdata'
      - '(?i)hasdata[-_]airbnb[-_]mcp'

  # (a) identify the request as hasdata-airbnb-mcp traffic - body surface
  sel_marker_body:
    content|re:
      - '(?i)hasdata[-_ ]?airbnb[-_ ]?mcp'
      - '(?i)api\.hasdata\.com/[a-z0-9._/-]{0,60}airbnb'
      - '(?i)hasdata[\s\S]{0,200}airbnb'

  # (b1) credential material foreign to this integration
  sel_cred:
    content|re:
      - '-----BEGIN\s+(RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
      - '\bAKIA[0-9A-Z]{16}\b'
      - '(?i)\baws_secret_access_key\b\s*[":=]{1,3}\s*"?[A-Za-z0-9/+]{40}'
      - '\b(?:ghp|ghs|ghu|gho|github_pat)_[A-Za-z0-9_]{30,}\b'
      - '\bsk-(?:ant-)?[A-Za-z0-9_-]{32,}\b'
      - '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'

  # (b2) attacker-controlled callback bolted onto the scrape request
  sel_exfil_param:
    content|re: '(?i)\b(callback_url|callbackurl|webhook_url|webhookurl|notify_url|report_url|beacon_url|exfil_url|c2_url)\b\s*[":=]{1,3}\s*"?https?://'

  # (b3) local secret stores referenced inside outbound scraper traffic
  sel_secret_path:
    content|re:
      - '(?i)\.aws/credentials'
      - '(?i)\.ssh/id_[a-z0-9]{2,10}'
      - '(?i)\.kube/config'
      - '(?i)/proc/self/environ'
      - '(?i)\bprocess\.env\b'
      - '(?i)\bos\.environ\b'
      - '(?i)(^|[^a-z0-9])\.env\b'

  # ── FP suppressors (narrow the detection only; no host/domain is trusted) ──

  # documented placeholders, redactions and vendor sample keys
  filter_placeholders:
    content|re:
      - '(?i)\byour[_-]?(api[_-]?)?(key|token|secret)\b'
      - '(?i)<[A-Za-z_][A-Za-z0-9_ -]{2,40}>'
      - '\bAKIAIOSFODNN7EXAMPLE\b'
      - '(?i)\bsk-(xxx|your|example|placeholder|test|dummy|fake)'
      - '(?i)\b(placeholder|redacted|changeme|dummy[_-]?key|fake[_-]?key|sample[_-]?key|not[_-]?a[_-]?real[_-]?key)\b'
      - '[Xx]{8,}'
      - '\*{6,}'

  # README / PyPI project page / install docs fetched or echoed by the agent
  filter_docs:
    content|contains|all:
      - 'pip install'
      - '```'

  # test fixtures and mocked responses for this package
  filter_test_fixture:
    content|re: '(?i)\b(conftest\.py|pytest|unittest|mock(ed)?[_-]?(key|token|response|client)|responses\.add|test_hasdata|fixtures?/)\b'

  condition: >
    sel_evt
    and (sel_marker_url or sel_marker_body)
    and (sel_cred or sel_exfil_param or sel_secret_path)
    and not (filter_placeholders or filter_docs or filter_test_fixture)

falsepositives:
  - An agent fetching the package's PyPI project page or GitHub README, where the
    usage example shows an API key literal next to the package name. Suppressed by
    filter_placeholders (YOUR_API_KEY, <api_key>, sk-example) and filter_docs
    (fenced code block plus a pip install line).
  - Developer test suites and recorded HTTP fixtures for hasdata-airbnb-mcp that
    embed mock credentials. Suppressed by filter_test_fixture.
  - A user's genuine HasData service key that happens to match a generic secret
    shape. HasData keys are not sk-/AKIA/ghp_ prefixed, so sel_cred should not
    match them; if a deployment issues keys in one of those formats this rule will
    report on every call from that deployment and sel_cred must be tightened.
  - A legitimate integration that intentionally posts a callback_url to receive
    async scrape results. This is a supported pattern for some scraping APIs; if it
    is in use here, sel_exfil_param will report on normal traffic and should be
    dropped from the condition rather than the destination being allowlisted.
  - Debug or error payloads that echo the agent's environment (os.environ dumps in
    a stack trace) attached to an outbound request. Genuinely worth reviewing, but
    it is operator error rather than package compromise.
action: report
