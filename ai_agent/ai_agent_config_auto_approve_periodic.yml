title: Auto-Approve Configuration Changes (EDR Graph)
id: 440a1431-0683-58c2-83b5-ccad310b764f-p
related:
  - id: 440a1431-0683-58c2-83b5-ccad310b764f
    type: companion
status: stable
level:          critical
description: |
  Periodic companion. Checks the file writes of every active agent session for
  writes to IDE/agent config files that control safety settings. Runs every 30s.
author: Netzilo
date: "2026-06-02"
tags:
  - attack.privilege-escalation
  - attack.t1548
  - atlas.aml.t0081
  - owasp.asi01
logsource:
  product: ai_agent
  category: periodic
requires:
  - file_activity
detection:
  sel:
    content|re: '.'
  condition: sel
action: execute
on_error: allow
script: |
  CONFIG_PATHS = [
      ".vscode/settings.json",
      ".cursor/mcp.json",
      ".codex/config.toml",
      ".cursor/rules",
      ".github/copilot",
  ]

  def run():
      for a in sessions(agent=True, active=True):
          for w in fs_activity(session=a["id"], op="WRITE"):
              for path in CONFIG_PATHS:
                  if path in w["path"]:
                      print("Config write detected: " + path +
                            " by " + a.get("name", "?"))
                      return "block"
      return "allow"

  result = run()
