title: Injected Code — Contact-List Harvest and SMTP Spam Exfiltration
id: 702eec32-730d-4dfa-9889-045ac3a8e20b
status: experimental
level: high
description: |-
  Detects injected code that reads a local contacts.csv and uses SMTP (smtplib / yagmail) to blast remote-fetched content to every contact — a worm/spam propagation primitive that also exfiltrates the contact list.

  Adapted from Agent Threat Rules ATR-2026-01895 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01895
tags:
- attack.exfiltration
- atlas.aml.t0048
- atlas.aml.t0051
- owasp.asi01
- owasp.llm02
- owasp.llm05
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)contacts\.csv[\s\S]{0,160}(?:smtplib\.|yagmail\.|secure_smtplib\.|\.sendmail\(|\.send_message\()
  condition: sel_0
falsepositives:
- Security documentation, papers, or test suites that describe this attack technique without executing
  it.
- Legitimate developer or user requests that share the surface vocabulary but lack the malicious invariant.
action: report
