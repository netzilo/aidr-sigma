title: Credential and Secret Exposure in Agent Output
id: e69fe2b0-35ef-4757-8437-54f70aed08b3
status: experimental
level: critical
description: |-
  Detects when an AI agent exposes API keys, secret tokens, private keys,
  database connection strings, JWT tokens, or other sensitive credentials
  in its output. Covers all major cloud provider key formats, CI/CD tokens,
  payment processor keys, SSH keys, .env file content patterns, and generic
  secret assignment patterns. Credential leakage in agent output poses a
  critical security risk leading to unauthorized access, lateral movement,
  financial loss, and full account compromise.

  Adapted from Agent Threat Rules ATR-2026-00021 (MIT).
author: ATR Community (adapted)
date: '2026-03-08'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00021
- https://nvd.nist.gov/vuln/detail/CVE-2025-32711
tags:
- attack.exfiltration
- atlas.aml.t0055
- atlas.aml.t0057
- owasp.asi03
- owasp.llm02
- owasp.llm07
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: sk-[a-zA-Z0-9]{20,}
  sel_1:
    response|re: AKIA[0-9A-Z]{16}
  sel_2:
    response|re: AIza[a-zA-Z0-9_-]{35}
  sel_3:
    response|re: (?:sk_live|pk_live|sk_test|rk_live)_[a-zA-Z0-9]{20,}
  sel_4:
    response|re: eyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]+
  sel_5:
    response|re: '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
  sel_6:
    response|re: ghp_[a-zA-Z0-9]{36}
  sel_7:
    response|re: xox[bpors]-[a-zA-Z0-9\-]{10,}
  sel_8:
    response|re: Bearer\s+[a-zA-Z0-9\-._~+/]{20,}=*
  sel_9:
    response|re: (?:mongodb(?:\+srv)?|postgres(?:ql)?|mysql|redis|amqp)://[^\s"']{10,}
  sel_10:
    response|re: (?:DB_PASSWORD|DATABASE_URL|REDIS_URL|MONGO_URI|SECRET_KEY|JWT_SECRET|ENCRYPTION_KEY|PRIVATE_KEY|AUTH_TOKEN)\s*[=:]\s*["']?[^\s"']{8,}
  sel_11:
    response|re: (?:api[_-]?key|api[_-]?secret|access[_-]?token|auth[_-]?token|client[_-]?secret)\s*[=:]\s*["']?[a-zA-Z0-9_\-]{16,}
  sel_12:
    response|re: (?:ANTHROPIC_API_KEY|OPENAI_API_KEY|GOOGLE_API_KEY|AZURE_API_KEY|COHERE_API_KEY|HF_TOKEN)\s*[=:]\s*[^\s]{8,}
  sel_13:
    response|re: (?:ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp256)\s+[A-Za-z0-9+/]{40,}
  sel_14:
    response|re: (?:secret["'\s]*[:=]["'\s]*[a-zA-Z0-9]{16,}|password["'\s]*[:=]["'\s]*[^\s"']{8,})
  condition: 1 of sel_*
falsepositives:
- Agent discussing API key formats in educational context without real keys
- Redacted or placeholder keys such as sk-xxxxxxxxxxxx or AKIA_EXAMPLE
- Documentation examples using clearly fake credentials
- Connection string templates with placeholder values
action: report
