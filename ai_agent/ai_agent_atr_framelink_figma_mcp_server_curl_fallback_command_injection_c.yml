title: Framelink Figma MCP Server curl-Fallback Command Injection (CVE-2025-53967)
id: bcf354f1-f033-4d6e-a7a2-3393671f202c
status: experimental
level: high
description: |-
  The Vulnerable MCP Project entry cve-2025-53967-figma-mcp-rce (CVE-2025-53967), reported by Imperva Threat Research. Command injection in the Framelink Figma MCP server fetch-with-retry.ts module: when the standard fetch fails, the server falls back to executing curl via child_process.exec while concatenating the URL string without sanitization, enabling arbitrary command execution. Triggerable through prompt injection in Figma design file names, text layers, or component descriptions that smuggle shell metacharacters into the fetched URL. CVSS 8.0.

  Adapted from Agent Threat Rules ATR-2026-01928 (MIT).
author: ATR Community (adapted)
date: '2026-06-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01928
- https://www.imperva.com/blog/another-critical-rce-discovered-in-a-popular-mcp-server/
- https://nvd.nist.gov/vuln/detail/CVE-2025-53967
tags:
- attack.execution
- atlas.aml.t0051.001
- atlas.aml.t0053
- owasp.asi02
- owasp.asi05
- owasp.llm05
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\b(?:framelink|figma)\b[^\n]{0,120}\b(?:fetch-with-retry|child_process\.exec|execSync|exec)\b[^\n]{0,120}\bcurl\b
  sel_1:
    content|re: (?i)\b(?:framelink|figma)[-_]?mcp\b[^\n]{0,140}(?:\$\([^)\n]{1,80}\)|`[^`\n]{1,80}`)
  sel_2:
    content|re: (?i)\b(?:framelink|figma)\b[^\n]{0,80}\b(?:curl|exec)\b[^\n]{0,80}https?://[^\s"'`]{0,120}\$\([^)\n]{1,80}\)
  sel_3:
    content|re: (?i)\b(?:framelink|figma)\b[^\n]{0,80}\b(?:curl|exec)\b[^\n]{0,80}https?://[^\s"'`]{0,120}`[^`\n]{1,80}`
  sel_4:
    content|re: (?i)\b(?:framelink|figma)\b[^\n]{0,80}\b(?:curl|exec)\b[^\n]{0,80}https?://[^\s"'`]{0,120}\s*(?:;|\|\||&&|\|)\s*(?:[a-z]{2,12}\s|/(?:bin|usr|tmp|etc)/|\bsh\b|\bbash\b|\bnc\b|\bwget\b|\bcat\b|\brm\b|\bwhoami\b|\bid\b|\bpython\b)
  condition: 1 of sel_*
falsepositives:
- Generic install-doc curl pipelines such as "curl https://example.com/install.sh | bash", nvidia-skill
  setup docs, or vercel agent-API docs that contain curl or a URL with & query separators but do NOT name
  the Framelink/Figma MCP curl-fallback sink (figma/framelink + fetch-with-retry / child_process.exec)
  are benign and must not fire. Both the figma/framelink anchor AND the exec/curl-fallback sink must be
  present.
- Normal HTTP(S) URLs that use & to separate query-string parameters (?a=1&b=2), and shell variable interpolation
  in config templates such as ${BASE} or ${FIGMA_FILE_KEY}, are benign env substitution -- not command
  substitution $(...) -- and are excluded.
- Patch-discussion, advisory, and research text that merely names CVE-2025-53967, fetch-with-retry.ts,
  or the curl fallback without carrying a live injected URL payload does not match.
action: report
