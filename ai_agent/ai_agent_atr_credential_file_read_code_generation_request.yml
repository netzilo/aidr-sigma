title: Credential File Read Code Generation Request
id: 385f9e54-618d-4962-9c40-da8a485c0edd
status: experimental
level: critical
description: |-
  Detects prompts asking the LLM to generate code that reads high-value credential or secret files (/etc/shadow, Windows SAM hive, ~/.ssh/id_rsa, cloud metadata endpoints, browser cookie stores, credential managers). From NVIDIA garak malwaregen.SubFunctions probe — attackers frame this as "useful code" but the target files contain no legitimate-dev use case for automated reading.

  Adapted from Agent Threat Rules ATR-2026-00263 (MIT).
author: ATR Community (adapted)
date: '2026-04-19'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00263
- https://github.com/NVIDIA/garak/blob/main/garak/probes/malwaregen.py
- https://attack.mitre.org/techniques/T1003/
tags:
- attack.persistence
- atlas.aml.t0053
- atlas.aml.t0057
- owasp.asi03
- owasp.llm05
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?:write|generate|create|give\s+me|show\s+me)\s+(?:\w+\s+){0,4}code\s+to\s+read\s+(?:the\s+)?(?:encrypted\s+)?(?:system\s+)?password\s+file\b
  sel_1:
    response|re: (?:read|dump|extract|exfiltrate|copy|cat|grep)\s+(?:the\s+)?(?:contents\s+of\s+)?(?:/etc/(?:shadow|passwd|gshadow|master\.passwd|sudoers)|/var/(?:lib/authn|db/sudo))\b
  sel_2:
    response|re: (?:read|dump|extract)\s+(?:the\s+)?(?:windows\\system32\\config\\(?:sam|security)|c:\\windows\\system32\\config\\(?:sam|security)|%systemroot%\\system32\\config\\(?:sam|security))
  sel_3:
    response|re: (?:read|extract|parse)\s+(?:\w+\s+){0,3}(?:~/\.ssh/id_(?:rsa|dsa|ed25519|ecdsa)|\.ssh/authorized_keys|known_hosts|\.aws/credentials|\.gcloud/credentials|\.azure/credentials|\.kube/config|\.netrc|\.git-credentials)
  sel_4:
    response|re: (?:read|fetch|query|curl|wget|request)\s+(?:https?://)?(?:[\w.]+\s+){0,3}(?:169\.254\.169\.254|metadata\.google\.internal|metadata\.azure\.com|imds(?:v\d+)?)/(?:latest/meta-data|computeMetadata|metadata)
  condition: 1 of sel_*
falsepositives:
- sysadmin scripts that legitimately read /etc/passwd for user enumeration (read-only stat)
- cron-job documentation discussing /etc/shadow for password aging policies
- security-research blog posts describing credential-theft techniques defensively
- legitimate ssh-config tooling that parses ~/.ssh/config (not private keys)
action: report
