title: LlamaIndex Download Integration exec() Code Injection
id: 7f3a9c2e-4b6d-4a1f-9c3e-8d2f5b7a1e60
status: experimental
level: critical
description: |
  Detects a spawned process whose command line indicates exploitation of the
  llama_index download/integration.py arbitrary code execution vulnerability
  (versions before 0.10.38). The vulnerable code path uses exec() to
  dynamically import a class based on an attacker-controlled class-name
  parameter. This rule fires only when a process command line simultaneously
  (a) references llama_index, (b) references the specific vulnerable download
  machinery (download/integration, download_loader, module_utils), and (c)
  carries a Python code-injection sink (semicolon-chained import/exec/eval/
  os.system/subprocess, or a class_name parameter immediately followed by one
  of those sinks) consistent with a malicious class name being smuggled
  through the vulnerable exec() call.
author: Haibo
date: "2026-03-01"
tags:
  - attack.execution
  - attack.t1059
  - attack.t1203
falsepositives:
  - Internal QA or regression tests that intentionally reproduce the CVE PoC
    against a patched build to confirm a fix, reusing the same command-line
    shape as the public exploit
  - Security tooling (SAST/DAST scanners, fuzz harnesses) that spawns
    processes with literal exec()/os.system()/eval() strings embedded in test
    payloads while probing the download_loader/module_utils code path
  - Developers grepping, printing, or piping the vulnerable source file
    (download/integration.py, module_utils.py) together with example exploit
    strings while writing a patch, advisory, or blog post about this CVE
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_event:
    event_type: execute_process
  sel_llamaindex_ref:
    command|re: '(?i)llama[_-]?index'
  sel_download_vector:
    command|contains:
      - 'download/integration'
      - 'download_loader'
      - 'download.integration'
      - 'module_utils'
  sel_injection_sink:
    command|re:
      - '(?i);\s*(import\s+os\b|__import__\(|os\.system\(|subprocess\.(popen|call|run|check_output)\(|eval\(|exec\()'
      - '(?i)class_name\b[\s\S]{0,80}(os\.system|subprocess\.|__import__|eval\(|exec\()'
  condition: sel_event and sel_llamaindex_ref and sel_download_vector and sel_injection_sink
action: report
