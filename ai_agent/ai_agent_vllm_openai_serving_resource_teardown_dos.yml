title: vLLM OpenAI-Compatible Serving Path Resource Teardown DoS Payload
id: 7b3c9f2e-5a41-4d86-9c07-2f8e6b1a4d53
status: experimental
level: high
description: |
  Detects a single outbound request to an OpenAI-compatible model-serving route
  (vLLM dialect) whose body carries out-of-contract resource-control parameters —
  negative or absurd max_tokens / n / best_of / logprobs values, out-of-vocabulary
  logit_bias or prompt token IDs, a malformed (non-object) stream_options, or an
  invalid truncate_prompt_tokens. These are the request shapes that drive the
  improper resource shutdown / release path in vLLM 0.19.0's OpenAI-compatible
  server and lead to denial of service on the inference tier.

  SCOPE AND LIMITATION (deliberate, per triage): the engine emits no
  resource_exhaustion, service_crash or network_request event, and there is no
  RESOURCE_CONSUMPTION or SERVICE_DENIAL edge kind. The only live signal for this
  threat is the HTTP/LLM request itself. This rule therefore detects the CRAFTED
  REQUEST, not the server-side teardown. It cannot confirm that the target vLLM
  instance actually leaked or aborted resources — that requires runtime telemetry
  this deployment does not collect. Precision is bought by requiring TWO
  independent signals in the same event: (1) the request is on an OpenAI-compatible
  serving route or speaks the vLLM parameter dialect, AND (2) a resource-control
  field carries a value no conforming client library will ever emit.

  Report-only. Do not promote to block until a false-positive baseline has been
  measured against your own batch-evaluation and fuzzing traffic.
author: Tanya
date: "2026-06-11"
references:
  - https://attack.mitre.org/techniques/T1499/004/
  - https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html
tags:
  - attack.impact
  - attack.t1499
  - attack.t1499.004
  - cwe.404
logsource:
  product: ai_agent
  category: agent_events
detection:

  # ── Scope: only requests leaving the agent toward a model-serving endpoint ──
  sel_event:
    event_type:
      - http_request
      - llm_request

  # ── Route indicator A: the OpenAI-compatible serving path itself ────────────
  sel_route_path:
    path|re: '(?i)^/(?:v[0-9]+/)?(?:chat/completions|completions|embeddings|tokenize|detokenize|score|rerank|pooling|invocations)/?$'

  # ── Route indicator B: same route visible only in the full URL ──────────────
  sel_route_url:
    url.full|re: '(?i)/v[0-9]+/(?:chat/)?completions\b'

  # ── Route indicator C: vLLM-only extension fields. No OpenAI SDK emits these,
  #    so their presence identifies a vLLM OpenAI-compatible server even when the
  #    route metadata is not populated on the event.
  sel_route_vllm_dialect:
    content|re:
      - '"truncate_prompt_tokens"\s*:'
      - '"prompt_logprobs"\s*:'
      - '"stop_token_ids"\s*:'
      - '"use_beam_search"\s*:'
      - '"guided_decoding_backend"\s*:'
      - '"spaces_between_special_tokens"\s*:'
      - '"include_stop_str_in_output"\s*:'

  # ── The actual teardown trigger: a resource-control field with a value that no
  #    conforming client produces. -1 sentinels are deliberately excluded on the
  #    two fields where -1 is a documented "unbounded" convention.
  sel_malformed_resource_param:
    content|re:
      - '"(?:n|best_of|min_tokens|max_completion_tokens|top_logprobs)"\s*:\s*-[0-9]+'
      - '"max_tokens"\s*:\s*-(?:[2-9]|[0-9]{2,})'
      - '"(?:max_tokens|max_completion_tokens|min_tokens)"\s*:\s*[1-9][0-9]{8,}'
      - '"(?:n|best_of)"\s*:\s*[1-9][0-9]{3,}'
      - '"(?:logprobs|top_logprobs|prompt_logprobs)"\s*:\s*[1-9][0-9]{2,}'
      - '"truncate_prompt_tokens"\s*:\s*(?:0|-[2-9]|-[0-9]{2,}|[1-9][0-9]{7,})'
      - '"logit_bias"\s*:\s*\{\s*"-?[0-9]{7,}"'
      - '"prompt"\s*:\s*\[\s*(?:-[0-9]+|[1-9][0-9]{9,})'
      - '"stream_options"\s*:\s*(?:"[^"]*"|-?[0-9]+|true|false|\[)'

  # ── Suppression: an API spec / schema document, not a live request ──────────
  filter_spec_or_doc:
    content|contains:
      - '"$schema"'
      - '"openapi"'
      - '"swagger"'
      - 'application/schema+json'

  # ── Suppression: advisory / PoC text travelling with the payload. A real
  #    exploit body carries none of this; a researcher pasting the public PoC into
  #    a chat request carries all of it.
  filter_security_discussion:
    content|re: '(?i)\b(?:cve-[0-9]{4}-[0-9]{4,7}|ghsa-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}|proof[- ]of[- ]concept|security advisory|vulnerability (?:report|disclosure|writeup)|reproduction steps|responsible disclosure)\b'

  # ── Suppression: templated documentation payload, never a live call ─────────
  filter_template_placeholder:
    content|re: '(?i)(?:\{\{\s*[A-Za-z_][A-Za-z0-9_]*\s*\}\}|<your[_ -]?(?:api[_ -]?key|token|endpoint)>|"YOUR_API_KEY"|\$\{[A-Z0-9_]+\})'

  condition: >
    sel_event
    and (sel_route_path or sel_route_url or sel_route_vllm_dialect)
    and sel_malformed_resource_param
    and not (filter_spec_or_doc or filter_security_discussion or filter_template_placeholder)

falsepositives:
  - Batch-evaluation or best-of-N sampling harnesses that legitimately request n or best_of >= 1000 against a self-hosted vLLM endpoint.
  - Homegrown SDKs that use a negative sentinel other than -1 to mean "unbounded"; -1 is already excluded for max_tokens and truncate_prompt_tokens, but -2 or lower will match.
  - Robustness / fuzzing test suites that deliberately send out-of-contract parameters to a staging inference endpoint.
  - Security researchers or red teams replaying the public PoC body; largely suppressed by filter_security_discussion, but a bare JSON paste with no advisory wording will still fire.
  - API-client generators or integration tests that emit a stream_options value of the wrong JSON type while scaffolding.
  - Very long-context models with genuinely large max_tokens — the threshold is 100,000,000, far above any deployed context window, so this should not occur in practice.

action: report
