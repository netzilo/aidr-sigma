title: JsonPickleSerializer Deserialization RCE - Reverse Shell Gadget Execution
id: 7e2b1c4a-9f3d-4a6e-8b2c-1d5f9a3e7c60
status: experimental
level: critical
description: |
  Detects a spawned child-process command line matching the canonical reverse-shell
  or inline os.system/subprocess/pty.spawn gadget idioms that a pickle __reduce__
  payload produces once executed. Targets the observable aftermath of llama_index's
  JsonPickleSerializer calling pickle.loads() on untrusted data (v0.12.27-v0.12.40),
  since no dedicated deserialization event exists -- only the resulting process spawn
  is observable. This is a single-event content heuristic, not proof of exploitation.
author: Selhan
date: "2026-03-01"
references:
  - https://github.com/run-llama/llama_index
tags:
  - attack.execution
  - attack.t1059
falsepositives:
  - Legitimate bash /dev/tcp port-connectivity checks that redirect a file
    descriptor (e.g. exec 3<>/dev/tcp/host/port) without the interactive
    ">& ... 0>&1" reverse-shell redirection idiom
  - Network diagnostic scripts combining timeout with /dev/tcp for port scanning
  - Security test suites (pytest/unittest) that construct reverse-shell strings
    as fixtures or literal assertions rather than executing them
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_proc:
    event_type: execute_process
  sel_gadget:
    command|re:
      - '(?i)\b(bash|sh)\b[^\n]{0,30}-[ci]\b[^\n]{0,80}>&\s*/dev/tcp/\d{1,3}(\.\d{1,3}){3}/\d{1,5}[^\n]{0,20}0>&1'
      - '(?i)\bnc(\.traditional)?\b[^\n]{0,15}-e\s+/bin/(ba)?sh\b'
      - '(?i)\bmkfifo\b[^\n]{0,60};[^\n]{0,60}\bnc\b[^\n]{0,60}\|\s*/bin/(ba)?sh\b'
      - '(?i)\bpython3?\b[^\n]{0,10}-c\b[^\n]{0,300}\bsocket\.socket\b[^\n]{0,300}(os\.system|subprocess\.(Popen|call|run)|pty\.spawn)\s*\('
      - '(?i)\bpython3?\b[^\n]{0,10}-c\b[^\n]{0,300}(os\.system|subprocess\.(Popen|call|run)|pty\.spawn)\s*\([^\n]{0,300}\bsocket\.socket\b'
  filter_healthcheck:
    command|re:
      - '(?i)\bexec\s+\d+<>\s*/dev/tcp/'
      - '(?i)\btimeout\b[^\n]{0,40}/dev/tcp/'
  filter_test_context:
    command|contains:
      - 'pytest'
      - 'unittest'
      - 'test_reverse_shell'
  condition: sel_proc and sel_gadget and not (filter_healthcheck or filter_test_context)
action: report
