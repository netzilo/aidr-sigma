title: Fork Claim and Community Package Impersonation
id: 8528ae50-ef46-45bb-b5ff-187ed0971afe
status: experimental
level: medium
description: |-
  Detects skill/package impersonation through fork claims and community-variant naming. Unlike ATR-2026-060 (typosquatting detection), this catches packages that claim to be "community forks", "enhanced versions", or "unofficial alternatives" of known tools. Also detects abstracted permission descriptions that obscure dangerous capabilities behind benign language ("required capabilities: internet, storage" instead of "needs network + filesystem access"). Discovered via Autoresearch v0 (94% miss on fork_claim, 97% on abstracted_permissions, 97% on original_naming).

  Adapted from Agent Threat Rules ATR-2026-00134 (MIT).
author: ATR Community (adapted)
date: '2026-04-01'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00134
tags:
- attack.persistence
- atlas.aml.t0010
- atlas.aml.t0010.005
- owasp.asi04
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(community|unofficial|third-party|3rd-party|independent|alternative|enhanced|improved|better|advanced|extended|upgraded|boosted|supercharged|turbo)\s+(fork|version|variant|edition|release|build|branch|alternative|mod|modification|port|implementation|adaptation)\s+(of|from|based\s+on|derived\s+from|inspired\s+by|built\s+on|forked\s+from)\s+(the\s+)?(official|original|standard|default|canonical|upstream|main|base|core|primary)
  sel_1:
    content|re: (?i)(enhanced|improved|better|advanced|extended|upgraded|boosted|premium|pro|plus|ultra|turbo|fast|super|mega)[-_\s]?(version|edition|variant|fork|mod)\s+(of|for|replacing)\s+.{0,30}(calculator|file|search|database|weather|email|calendar|git|github|slack|discord|api|http|web|cloud|aws|gcp|azure)
  sel_2:
    content|re: (?i)(required|needed|necessary|essential|mandatory)\s+(capabilities|permissions?|access|requirements?)\s*[:=]\s*.{0,20}(internet|network|web|online|connectivity|storage|filesystem|disk|file\s+system|system|shell|execute|admin|root|sudo)
  sel_3:
    content|re: (?i)(with\s+)?(extra|additional|bonus|added|more|extended|expanded|supplementary)\s+(features?|capabilities?|functions?|tools?|options?|functionalities?)\s*.{0,20}(not\s+(found|available|present|included)\s+in\s+(the\s+)?original|that\s+(the\s+)?original\s+(lacks?|doesn't\s+have|is\s+missing))
  condition: 1 of sel_*
falsepositives:
- A README or changelog document that describes a legitimate community-maintained fork of an open-source
  project using language like 'community fork of the official repository', triggering Layer 1 even though
  it is a genuine open-source contribution with transparent provenance.
action: report
