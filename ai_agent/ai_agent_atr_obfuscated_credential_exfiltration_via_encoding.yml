title: Obfuscated Credential Exfiltration via Encoding
id: 985298c7-93cc-4be3-b2d8-2955ee893122
status: experimental
level: high
description: |-
  Detects attempts to leak credentials using partial obfuscation techniques: AES256() wrapping, hex encoding references, rot13, or "encrypted key" framing that presents real credentials as encrypted data to bypass content filters. Crystallized from 16 partial_obfuscation samples.

  Adapted from Agent Threat Rules ATR-2026-00152 (MIT).
author: ATR Community (adapted)
date: '2026-04-08'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00152
tags:
- attack.exfiltration
- atlas.aml.t0057
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(encrypted|encoded|obfuscated)\s+(key|token|secret|credential|password)\s*[:=]\s*\S*(sk-|ghp_|gho_|glpat-|xox[bpras]-|AKIA|real-key)
  sel_1:
    content|re: (?i)(AES256|RSA|DES|rot13|base64)\s*\(\s*(sk-\S{5,}|ghp_\S{5,}|real-key|actual-secret)
  sel_2:
    content|re: (?i)master\s+password\s+to\s+decrypt.{0,50}(sk-|ghp_|key-|secret-|token-)
  condition: 1 of sel_*
falsepositives:
- Security documentation about encryption
- Encryption tutorials with example keys
- A penetration testing report that documents the finding pattern 'encrypted token=' as a vulnerability
  example in prose, potentially matching pattern [1] if followed by a sample key prefix
- Automated security scanner output that logs intercepted credential patterns including prefixes like
  sk- or ghp_ alongside words like 'encoded' or 'obfuscated' in its finding descriptions
action: report
