title: Output Emoji-Substitution Hijack of the Response
id: 0e47b47d-cb86-40da-9d1f-9cf4f04ff656
status: experimental
level: medium
description: |-
  Detects indirect-injection instructions that force the agent to replace its response words with emojis (full or keyword substitution), a lossy-encoding evasion of output content checks. Anchored to the output target to avoid firing on legitimate 'add an emoji' formatting requests.

  Adapted from Agent Threat Rules ATR-2026-01902 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01902
tags:
- attack.initial-access
- atlas.aml.t0048
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\bemojis?\b[^.\n]{0,40}\b(?:your|the)\s+(?:answer|reply|response|message)\b
  sel_1:
    content|re: (?i)\b(?:your|the)\s+(?:answer|reply|response|message)\b[^.\n]{0,30}\bemojis?\b
  condition: 1 of sel_*
falsepositives:
- Security documentation, papers, or test suites that describe this attack technique without executing
  it.
- Legitimate developer or user requests that share the surface vocabulary but lack the malicious invariant.
action: report
