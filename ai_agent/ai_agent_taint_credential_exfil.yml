title: Credential File Read Followed by External HTTP Request
id: 44d5e6f7-a8b9-4c01-2345-d6e7f8a9b0c1
status: experimental
level: critical
description: |
  Detects when an agent reads a credential file (SSH key, .aws/credentials, .env, browser
  login data) and subsequently makes an outbound HTTP request — the behavior graph equivalent
  of SkillSpector TT3 (credential taint flow to network sink). The rule takes the agent
  session that owns the triggering tool call (its agent ancestor), looks for a credential
  path among that session's file reads (fs_activity) and for a later HTTP_REQUEST edge
  from the same session to a host outside the allow list.
author: Netzilo (SkillSpector TT3)
date: "2026-06-03"
falsepositives:
  - Authorized backup tools that legitimately copy credentials to secure storage
  - SSH config tools that read keys and push public keys to remote hosts
tags:
  - attack.exfiltration
  - attack.t1041
  - attack.credential-access
  - attack.t1552
  - atlas.aml.t0083
  - atlas.aml.t0055
  - atlas.aml.t0086
  - owasp.asi02
logsource:
  product: ai_agent
  category: agent_events
requires:
  - file_activity
  - tool
  - http
detection:
  sel_trigger:
    event_type: tool_call
    content|re: '.'
  condition: sel_trigger
action: execute
on_error: allow
on_timeout: allow
script: |
  CREDENTIAL_PATHS = [
      ".ssh/", ".aws/credentials", ".aws/config", ".env", ".netrc",
      ".git-credentials", ".npmrc", ".docker/config", ".kube/config",
      "Login Data", "Cookies", "wallet.dat", "id_rsa", "id_ed25519",
      "/etc/passwd", "/etc/shadow", "application_default_credentials",
  ]
  SAFE_HOSTS = [
      "github.com", "gitlab.com", "pypi.org", "npmjs.com", "registry.npmjs.org",
      "api.anthropic.com", "api.openai.com", "127.0.0.1", "localhost",
  ]

  def is_credential(path):
      lp = path.lower()
      for c in CREDENTIAL_PATHS:
          if c.lower() in lp:
              return True
      return False

  def is_safe_host(host):
      h = host.lower()
      k = h.find(":")
      if k >= 0:
          h = h[:k]
      for s in SAFE_HOSTS:
          if h == s or h.endswith("." + s):
              return True
      return False

  def edge_ts(e):
      for k in ["last_ts", "ts", "first_ts"]:
          v = e.get(k, "")
          if v != "":
              return int(v)
      return 0

  # The agent session to examine: the agent ancestor of the triggering
  # session (walking parent links, which exist for hook and gateway sessions
  # too), else every active agent session when the call is unattributed.
  def candidate_agents():
      x = session()
      for _ in range(64):
          if x == None:
              break
          if x.get("agent", "0") == "1":
              return [x]
          x = session(x.get("parent", "")) if x.get("parent", "") != "" else None
      return sessions(agent=True, active=True)

  def run():
      for agent in candidate_agents():
          aid = agent["id"]
          # Credential reads by this session (paths live in the event log).
          cred_reads = []
          for r in fs_activity(session=aid, op="READ"):
              if is_credential(r["path"]):
                  cred_reads.append(r)
          if not cred_reads:
              continue
          # A later HTTP request to a host outside the allow list.
          for e in edges(aid, dir="out", kind="HTTP_REQUEST"):
              url_node = node(e.get("to", ""))
              if not url_node:
                  continue
              host = url_node.get("host", url_node.get("id", ""))
              if is_safe_host(host):
                  continue
              hts = edge_ts(e)
              first = None
              for r in cred_reads:
                  if hts == 0 or int(r["ts"]) <= hts:
                      first = r
                      break
              if first == None:
                  continue
              chain = new_chain(aid)
              chain.append(step({"from": aid, "to": "filesystem://" + aid, "kind": "READ_FILE",
                                 "dir": "out", "ts": first["ts"], "first_ts": first["ts"],
                                 "last_ts": first["ts"]},
                                stage_id="Credential Access",
                                stage_desc="agent read credential file " + first["path"],
                                activity=first))
              chain.append(step(e, stage_id="Network Sink",
                                stage_desc="outbound HTTP " + e.get("method", "") + " to " + host))
              reason = ("Credential file " + first["path"] + " read by " +
                        agent.get("name", aid) + " followed by HTTP request to " + host)
              print(reason)
              return {"action": "block", "reason": reason, "chain": chain}
      return "allow"
  result = run()
