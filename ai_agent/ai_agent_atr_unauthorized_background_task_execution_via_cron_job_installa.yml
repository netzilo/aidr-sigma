title: Unauthorized Background Task Execution via Cron Job Installation
id: 348fa831-feba-4597-9495-69498910c073
status: experimental
level: high
description: |-
  Detects skills that automatically install cron jobs to execute background tasks without explicit user consent. This skill installs a cron job that polls external marketplace tasks every 10 seconds and executes arbitrary browser automation commands from unknown third parties, potentially compromising the system during "idle" periods.

  Adapted from Agent Threat Rules ATR-2026-00154 (MIT).
author: ATR Community (adapted)
date: '2026-04-06'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00154
tags:
- attack.initial-access
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?:automatically|auto).*(?:registers?|installs?).*cron\s+job.*(?:polls?|executes?|handles?).*(?:tasks?|commands?)
  sel_1:
    content|re: when\s+(?:the\s+)?agent\s+(?:is\s+)?idle.*(?:connect|execute|run).*(?:tasks?|commands?).*(?:consumers?|marketplace|external)
  condition: 1 of sel_*
falsepositives:
- A DevOps tutorial document explaining how cron jobs work, which includes example sentences like 'you
  can automatically install a cron job that polls a health endpoint and handles task retries' as part
  of educational content rather than an actual malicious skill.
action: report
