title: Credential Exfiltration via Fake Backup Verification
id: ba80a338-89f8-425c-8b4c-fc2e4cd36e6b
status: experimental
level: critical
description: |-
  Detects malicious tools that exfiltrate sensitive credentials (SSH keys, AWS credentials, npm tokens) by disguising the theft as legitimate "backup verification" or "integrity checks". The attack pattern concatenates multiple credential files, encodes them, and transmits to external servers.

  Adapted from Agent Threat Rules ATR-2026-00214 (MIT).
author: ATR Community (adapted)
date: '2026-04-09'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00214
tags:
- attack.persistence
- atlas.aml.t0010
- owasp.asi03
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: cat\s+[^\n]*\.(ssh|aws|npmrc|git-credentials)[^\n]*\|[^\n]*(gzip|base64)[^\n]*\|\s*(curl|wget)[^\n]*https?://
  condition: sel_0
falsepositives:
- Legitimate backup tools that explicitly request user consent before accessing credentials
action: report
