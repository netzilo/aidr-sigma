title: SSRF Origin-Check Bypass in Agent URL Fetch (RecursiveUrlLoader)
id: 7b3c1e9a-4d52-4f18-9c6d-2a8e5f0b7d31
status: experimental
level: medium
description: |
  Detects a single outbound agent HTTP fetch whose target URL carries one of the
  three primitives used to defeat prefix/origin-based crawl restrictions such as
  LangChain RecursiveUrlLoader's `prevent_outside=True`:

    1. Domain-shaped userinfo before '@' or '%40'
       (https://victim.com@attacker.tld/file.html) - a naive
       url.startswith(base_url) check passes while the socket connects to
       attacker.tld.
    2. A generic TLD label embedded as the antepenultimate label of the host
       (victim.com.attacker.tld) - the attacker registers a domain whose text
       begins with the crawl base so the prefix comparison still succeeds.
    3. A non-dotted-quad IP literal in the authority - decimal (2130706433),
       hex (0x7f000001), leading-zero octal (0177.0.0.1) or IPv4-mapped IPv6
       ([::ffff:169.254.169.254]) - string-comparison and simple host allow
       checks do not normalise these, so they reach internal services.

  Each arm is a fetch that has already left the intended origin. The rule is
  single-event and content-only: it inspects url.full and host of the
  http_request that the crawler is about to perform.
author: Haibo
date: "2026-06-12"
references:
  - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
  - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
  - https://python.langchain.com/docs/integrations/document_loaders/recursive_url/
tags:
  - attack.discovery
  - attack.t1046
  - owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_http:
    event_type: http_request

  # 1. Userinfo that is itself a hostname - the classic prefix-check bypass.
  #    A colon-separated password cannot match (the class excludes ':' and the
  #    optional group after it must be a numeric port).
  sel_userinfo_bypass:
    url.full|re: '(?i)^https?://[a-z0-9][a-z0-9.-]{0,60}\.(?:com|net|org|edu|gov|io|co|ai|dev|app|info|biz|xyz|cloud|site|online|me)(?::[0-9]{1,5})?(?:@|%40)'

  # 2. Generic TLD carried as a non-terminal label, with exactly two labels
  #    after it (victim.com.attacker.tld). The fixed two-label tail is what
  #    keeps virtual-hosted bucket / CDN names (five or more labels) out.
  sel_embedded_gtld_host:
    host|re: '(?i)^[a-z0-9-]{1,63}(?:\.[a-z0-9-]{1,63})*\.(?:com|net|org|edu|gov)\.[a-z0-9-]{1,63}\.[a-z]{3,24}$'

  # 3. Non-canonical IP literal in the authority.
  sel_obfuscated_ip_authority:
    url.full|re: '(?i)^https?://(?:[0-9]{8,10}|0x[0-9a-f]{5,8}|0[0-7]{2,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|\[[0-9a-f:]{0,32}::ffff:[0-9a-f:.]{3,45}\])(?::[0-9]{1,5})?(?:[/?#]|$)'

  # Benign: real HTTP basic-auth credentials embedded in a registry, git or
  # proxy URL (user:password@host). Not a host allowlist - a structural shape.
  filter_basic_auth_credentials:
    url.full|re: '(?i)^https?://[a-z0-9._~%+-]{1,64}:[^@/\s]{1,128}@'

  # Benign: country-code second-level domains (x.com.au, x.co.uk, x.org.nz).
  # Structural, names no organisation or host.
  filter_cc_second_level_domain:
    host|re: '(?i)\.(?:com|net|org|edu|gov|co|ac|or|ne|in|nom)\.[a-z]{2}$'

  condition: >
    sel_http
    and (sel_userinfo_bypass or sel_embedded_gtld_host or sel_obfuscated_ip_authority)
    and not (filter_basic_auth_credentials or filter_cc_second_level_domain)
falsepositives:
  - Corporate DNS conventions that use a generic TLD word as an environment or
    zone label, e.g. api.net.corp.example or www.org.group.example. These match
    the embedded-gTLD arm and should be triaged once per hostname.
  - Virtual-hosted object storage or CDN names whose bucket is itself a domain
    (mysite.com.<provider>.<tld>) when the provider suffix happens to be only
    two labels long. The fixed two-label tail suppresses the common five-label
    forms but not every provider.
  - Legitimate URLs with embedded basic-auth credentials (package registries,
    git remotes, authenticated proxies) - suppressed by
    filter_basic_auth_credentials.
  - ccSLD hostnames such as example.com.au or bbc.co.uk - suppressed by
    filter_cc_second_level_domain and by the three-or-more character terminal
    TLD requirement in the embedded-gTLD arm.
  - Purely numeric hostnames used by internal short-link or shard services could
    match the decimal-IP arm; extremely rare in agent fetch traffic.
action: report
