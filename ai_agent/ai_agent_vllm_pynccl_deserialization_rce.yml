title: vLLM PyNcclPipe Deserialization RCE - Suspicious Process Spawn
id: 7c4a3f2e-9d61-4b8a-9e2f-1c6d8a4b7f30
status: experimental
level: critical
description: |
  Detects process-spawn command lines consistent with post-exploitation command
  execution following successful exploitation of the vLLM PyNcclPipe unsafe
  deserialization vulnerability. PyNcclPipe's _recv_metadata handler calls
  pickle.loads() on attacker-supplied data received over StatelessProcessGroup
  (client.send_obj(), default port 18888) without validation. A crafted object
  with a __reduce__ method (e.g. returning os.system(...) or subprocess.Popen(...))
  executes arbitrary commands with vLLM's privileges the instant it is unpickled.
  On POSIX hosts this typically surfaces as a bare shell interpreter
  (/bin/sh -c, /bin/bash -c) spawned directly by the vLLM/python process with an
  attacker-controlled command string; on Windows it surfaces as cmd.exe /c or
  powershell.exe. The attacker-controlled command itself commonly carries
  reverse-shell, download-and-execute, or base64-decode-and-execute markers.
  This is a single-event, content-only heuristic: it has no visibility into
  process ancestry (which process is the vLLM/PyNcclPipe worker) or network
  destination, so it cannot confirm the parent was vLLM. Shipped report-only
  pending correlation with process-lineage or network telemetry.
author: Selhan
date: "2025-06-10"
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1059/
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
  - https://github.com/vllm-project/vllm/security/advisories
tags:
  - attack.initial-access
  - attack.t1190
  - attack.execution
  - attack.t1059
  - owasp.llm03
falsepositives:
  - Legitimate install/bootstrap scripts that pipe curl or wget output directly into bash or sh (e.g. "curl https://get.docker.com | bash")
  - Administrative or CI/CD automation that spawns /bin/sh -c or cmd.exe /c with an inline one-off command
  - Health-check or network-diagnostic scripts that write to /dev/tcp/<host>/<port> from bash purely to test port connectivity
  - Build or packaging tooling that creates named pipes with mkfifo for legitimate inter-process communication
  - Deployment or glue-code Python invoked as `python -c "..."` that legitimately calls os.system(), subprocess.Popen()/call()/run(), or socket.socket() for operational (non-malicious) purposes
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_shell_payload:
    event_type: execute_process
    file_path|re: '(?i)(^|[\\/])(sh|bash|dash|zsh|cmd\.exe|powershell(\.exe)?)$'
    command|re:
      - '(?i)/dev/tcp/[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{2,5}'
      - '(?i)\bnc\s+-e\s+/bin/(sh|bash)\b'
      - '(?i)\bmkfifo\s+\S+\s*;'
      - '(?i)\bbase64\s+-d\s*\|\s*(bash|sh)\b'
      - '(?i)\b(curl|wget)\b[^\n]{0,200}\|\s*(bash|sh|python[23]?)\b'
  sel_python_direct_exec:
    event_type: execute_process
    file_path|re: '(?i)(^|[\\/])python[23]?(\.exe)?$'
    command|re: '(?i)-c\s+["\x27][^"\x27]{0,400}(os\.system\(|subprocess\.(popen|call|run|check_output)\(|socket\.socket\()[^"\x27]{0,400}["\x27]'
  condition: sel_shell_payload or sel_python_direct_exec
action: report
