falsepositives:
- Security advisories, changelogs, incident write-ups or postmortems that quote the pre-fix log line verbatim
  including a trailing exception name. Layer 1 cannot tell a quoted log from an emitted one; scan_target
  is runtime specifically so static skill/doc scans do not load this rule.
- Chaos-engineering or fault-injection suites that deliberately break the policy loader to prove the fail-closed
  path works. These produce genuine loader-failure lines by design.
- Log aggregation pipelines that replay historical logs from a deployment that was already patched and
  restarted; the old degraded-start line is real but no longer actionable.
- Non-security components that legitimately fail open by design and happen to sit within the layer 4 proximity
  window, for example an authorization-decision CACHE whose miss behaviour is 'continue to the origin
  policy engine' rather than 'allow the request'.
- Vendor SDKs whose log wording places a policy noun after the load verb in a fail-CLOSED message that
  also contains an unrelated 'skipping' or 'ignoring' token within the layer 3 window.
action: report
