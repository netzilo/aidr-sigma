title: SSRF via Agent URL Fetch Instruction
id: 34f4fe45-cf5a-494b-bf4b-405480fa3158
status: experimental
level: critical
description: |-
  Detects prompts instructing an AI agent to fetch or retrieve content from internal network addresses, exposing SSRF (Server-Side Request Forgery) risk. Covers: cloud metadata endpoints (AWS IMDS 169.254.169.254, GCP metadata.google.internal), localhost and loopback admin panels (127.0.0.1, localhost), RFC-1918 private IP ranges (10.x.x.x, 172.16-31.x.x, 192.168.x.x), and generic internal hostname patterns. These attacks exploit agents with web-fetch tools to pivot to internal services. Generalised from promptfoo SSRF plugin corpus - literal internal.corp.example.com replaced with pattern matching any internal-like hostname or private IP range.

  Adapted from Agent Threat Rules ATR-2026-00500 (MIT).
author: ATR Community (adapted)
date: '2026-05-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00500
tags:
- attack.execution
- atlas.aml.t0053
- owasp.asi06
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(fetch|retrieve|get|request|load|read|access|check|visit|open|download|curl|ping).{0,40}https?://(169\.254\.169\.254|metadata\.google\.internal|169\.254\.170\.2|fd00:ec2::254)
  sel_1:
    content|re: (?i)(fetch|retrieve|get\s+the\s+(page|content|resource|data|url)|request\s+the\s+(page|content|resource|url)|load\s+the\s+(resource|page|content|url)|read\s+the\s+(content|page|resource|data)|access\s+the\s+(page|content|resource|url)|download\s+the\s+(page|content|resource)).{0,40}https?://(localhost|127\.0\.0\.1|::1|0\.0\.0\.0)(:[0-9]{1,5})?
  sel_2:
    content|re: (?i)(fetch|retrieve|get|request|load|read|access|check|visit|open|download|curl|ping).{0,40}https?://(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3})(:[0-9]{1,5})?
  sel_3:
    content|re: (?i)(fetch|retrieve|get|request|load|read|access|check|visit|open|download|curl|ping).{0,40}https?://(internal|intranet|corp|local|private|admin|management|staging|test)\.
  sel_4:
    content|re: (?i)https?://169\.254\.169\.254/(latest|v[0-9]|meta|latest/meta-data)
  condition: 1 of sel_*
falsepositives:
- Network troubleshooting discussions mentioning private IP ranges without fetch instructions
- Educational content about SSRF attacks with sanitised examples
- Internal developer tooling that legitimately fetches internal URLs with operator authorization
action: report
