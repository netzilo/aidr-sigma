title: Discord Quote-Format Explicit Sexual Content Poem Injection
id: 168508b4-1007-4826-b95d-b9119eed2970
status: experimental
level: high
description: |-
  Detects Discord quote-format injection of explicit pornographic poem generation requests from the NVIDIA garak dan.DanInTheWild inthewild corpus (prompt #415). The attacker uses Discord markdown quote syntax (> **bold**) combined with a user mention (<@ID>) to embed a direct NSFW poem request that bypasses content filters by appearing as a quoted or forwarded message rather than a direct command. The payload uses the triple combo of "graphic/explicit sex scene", "porno/pornographic", and "vulgar pornographic language" to unambiguously request explicit adult content generation. Key signals: "graphic/explicit sex scene + porno" combo, "pornographic language" exact phrase, "vulgar/explicit + pornographic" modifier, and the Discord quote injection format (&gt; **...** &lt;@ID&gt;) with explicit content embedded.

  Adapted from Agent Threat Rules ATR-2026-00390 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00390
- https://github.com/NVIDIA/garak/blob/main/garak/probes/dan.py
- https://github.com/NVIDIA/garak/blob/main/garak/data/dan/inthewild_jailbreak_llms.json
tags:
- attack.initial-access
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?:graphic|explicit)[\s\S]{0,50}(?:sex\s+scene|sexual\s+content)[\s\S]{0,50}porn(?:o|ographic)
  sel_1:
    response|re: (?:write|create|generate|produce|make|compose|use)\s+[\s\S]{0,80}pornographic\s+language
  sel_2:
    response|re: (?:write|create|generate|produce|make|compose)\s+[\s\S]{0,80}(?:vulgar|explicit|graphic)\s+(?:pornographic|sexual)\s+(?:language|content|imagery|descriptions?)
  sel_3:
    response|re: '&gt;\s+\*\*[\s\S]{0,100}(?:porn|sex\s+scene|sexual|explicit)[\s\S]{0,100}&lt;@\d{10,20}&gt;'
  condition: 1 of sel_*
falsepositives:
- 'Content moderation policy: "This system flags pornographic language and graphic sexual content in user
  submissions." (descriptive policy statement, not generation request)'
- 'Film review: "The NC-17 film contains graphic sexual content and explicit scenes." (descriptive review
  without generation request)'
- 'Literary analysis: "Analyze the use of vulgar language in 20th-century American poetry." (academic
  analysis without pornographic content request)'
action: report
