title: Supply Chain npm Install Context Credential Egress (@edge-sky/dsh-oauth-adapter)
id: 7f3c1d2e-8b64-4a19-9c07-5e2ad84b1f36
status: experimental
level: high
description: |
  Detects the only part of the @edge-sky/dsh-oauth-adapter supply-chain threat that is
  actually instrumented by this engine.

  The engine has no package_install, credential_access or network_connection event type,
  and no INSTALLED_PACKAGE / CREDENTIAL_EXFILTRATION edge kind, so package provenance
  cannot be read directly. The causal link the triage skeptics said was missing is
  reconstructed from process provenance instead: the HTTP_REQUEST that fires this rule is
  anchored on the triggering session (session()), and its true spawn chain is walked with
  lineage(). If a package manager (npm / npx / yarn / pnpm / bun / node-gyp) is an
  ancestor of the requesting session, the request provably happened *inside an install or
  lifecycle-script context* of that one run.

  Two tracks, both strictly session-scoped:

    IoC track       - the literal package identifier (@edge-sky/dsh-oauth-adapter) appears
                      in a command line of this session, or in the triggering URL/path.

    Behaviour track - REQUIRED ordered anchor: package-manager install/lifecycle exec in
                      this session -> a non-npm OAuth/cloud credential store is read by an
                      instance of the same session AFTER that anchor -> the triggering
                      outbound HTTP request by the caller. All three inside a 15-minute
                      window.

  Reads of ~/.npmrc are deliberately NOT treated as credential access (every legitimate
  install reads it); only credential stores that an install script has no business opening
  are anchors. No host, domain or path is trusted or allowlisted anywhere in this rule -
  the discriminator is the ordered install -> secret-read -> egress sequence, not the
  destination.
author: Evgen
date: "2026-06-12"
references:
  - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
  - https://attack.mitre.org/techniques/T1195/001/
  - https://attack.mitre.org/techniques/T1552/001/
tags:
  - attack.initial-access
  - attack.t1195.001
  - attack.credential-access
  - attack.t1552.001
  - attack.exfiltration
  - attack.t1041
  - owasp.a08-2021
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - file_activity
  - http
detection:
  sel_http_egress:
    event_type: http_request
  sel_pkgmgr_exec:
    event_type: execute_process
    content|re: '(?i)\b(npm|npx|yarn|pnpm|bun|node-gyp)\b'
  sel_ioc_exec:
    event_type: execute_process
    content|contains:
      - '@edge-sky/dsh-oauth-adapter'
      - 'dsh-oauth-adapter'
  condition: sel_http_egress or sel_pkgmgr_exec or sel_ioc_exec
falsepositives:
  - Repositories whose install lifecycle legitimately authenticates to a private registry or
    artifact store by reading a cloud credential file (for example a CodeArtifact or GCP
    Artifact Registry login helper invoked from a preinstall script) and then fetching
    tarballs - the ordered install -> secret-read -> egress chain will match. Confirm the
    reading binary and the destination before escalating.
  - CI runners executing 'npm ci' inside an agent session where a build step assumes an IAM
    role from ~/.aws/credentials or reads ~/.kube/config before calling an API.
  - Security researchers or SOC engineers deliberately installing @edge-sky/dsh-oauth-adapter
    in a sandbox for payload analysis - the IoC track fires by design.
  - Long-lived monorepo dev loops ('pnpm exec', 'yarn dlx') where a package-manager ancestor
    stays in the lineage and an unrelated tool in the same shell session reads a credential
    store within the 15-minute window.
  - Hosts where the shell ancestor was never ingested - lineage is short and the reason
    string is marked attribution=degraded; the install anchor is still required, but the
    owning session shown in the chain may be truncated.
action: report
on_timeout: allow
on_error:   allow
script: |
  # ---------------------------------------------------------------------------
  # Session-resolved supply-chain detection.
  # session() -> lineage() -> events(session=...), one run only.
  # No host/domain/path is trusted anywhere in this rule.
  # ---------------------------------------------------------------------------

  WINDOW_NS   = 900000000000   # 15 min: install -> lifecycle script -> egress
  MAX_SESSION = 24
  MAX_EXEC    = 3000
  MAX_READS   = 200

  IOC = ["@edge-sky/dsh-oauth-adapter", "dsh-oauth-adapter", "edge-sky/dsh-oauth"]

  PKG_MGR = [r"\bnpm\b", r"\bnpx\b", r"\byarn\b", r"\bpnpm\b", r"\bbun\b", r"\bnode-gyp\b"]

  INSTALL = [r"\binstall\b", r"\bci\b", r"\badd\b", r"\bdlx\b", r"\bexec\b",
             r"\bpreinstall\b", r"\bpostinstall\b", r"\bprepare\b", r"\brebuild\b",
             r"\bnpx\b", r"\bnode-gyp\b"]

  # OAuth / cloud credential stores an install script has no business opening.
  # ~/.npmrc is intentionally absent - every legitimate install reads it.
  SECRET = ["/.aws/credentials",
            "/.ssh/id_",
            "/.netrc",
            "/.kube/config",
            "/.config/gh/hosts.yml",
            "/.claude/.credentials.json",
            "/.codex/auth.json",
            "/.gemini/oauth_creds.json",
            "/.config/gcloud/application_default_credentials.json",
            "/.config/gcloud/credentials.db",
            "/.azure/msal_token_cache.json",
            "/.huggingface/token",
            "/.databricks/token",
            "/etc/shadow"]

  def to_int(v):
      if v == None:
          return 0
      s = str(v)
      if s == "":
          return 0
      return int(s)

  def re_any(pats, s):
      for p in pats:
          if re.find(p, s) != None:
              return True
      return False

  def is_secret(p):
      low = p.lower()
      for s in SECRET:
          if s in low:
              return True
      if low.endswith(".json") or low.endswith(".yml") or low.endswith(".yaml"):
          if "oauth" in low or "credential" in low or "refresh_token" in low:
              return True
      return False

  def ioc_in(s):
      low = s.lower()
      for t in IOC:
          if t in low:
              return t
      return ""

  # ---- relevance gate: pure string checks on meta, no log/graph calls --------
  def is_relevant_event():
      ct = meta.get("context_type", "")
      if ct == "http_request":
          if meta.get("host", "") == "":
              return False
          return meta.get("session", "") != ""
      if ct == "execute_process":
          cmd = meta.get("content", "").lower()
          if ioc_in(cmd) != "":
              return True
          return re_any(PKG_MGR, cmd)
      return False

  def ev_edge(e):
      # Event row -> edge. A SPAWNED row is keyed by the CHILD session, so the
      # edge runs from the spawner (parent_session) to the child.
      t = e.get("ts", "0")
      frm = e.get("session_id", "")
      if e.get("kind", "") == "SPAWNED":
          frm = e.get("parent_session", "")
      return {
          "from":     frm,
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", ""),
          "dir":      "out",
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
      }

  def lineage_row(x):
      # A lineage session as a SPAWNED row: its own spawn row when logged (it
      # carries the command line), else synthesised from the session dict.
      rows = events(kind="SPAWNED", session=x["id"], limit=1)
      if rows:
          return rows[0]
      return {"kind": "SPAWNED", "ts": x.get("first_seen", "0"),
              "session_id": x["id"], "parent_session": x.get("parent", ""),
              "target_id": x["id"], "program": x.get("path", ""), "cmdline": ""}

  def short(p):
      parts = p.split("/")
      return parts[len(parts) - 1]

  def run():
      if not is_relevant_event():
          return "allow"

      ct  = meta.get("context_type", "")
      now = to_int(meta.get("event_ts", "0"))
      cp  = meta.get("session", "")
      if now == 0 or cp == "":
          return "allow"

      # ---- anchor on the triggering session ---------------------------------
      inst = session(cp)
      if inst == None:
          return "allow"          # degraded: session not known yet; re-fires later
      lineage_ = lineage(inst["id"])
      if not lineage_:
          return "allow"

      trig_blob = (meta.get("url", "") + " " + meta.get("path", "") + " " +
                   meta.get("content", "")).lower()
      trig_ioc = ioc_in(trig_blob)

      # package-manager ancestry is what links this event to an install context
      pkg_anc = None
      for x in lineage_:
          if re_any(PKG_MGR, x.get("path", "").lower()):
              pkg_anc = x
              break
      if pkg_anc == None and trig_ioc == "":
          return "allow"

      since = now - WINDOW_NS

      # ---- scope = lineage + descendants of lineage (one bounded log pass) --
      scope = {}
      prog  = {}
      for x in lineage_:
          scope[x["id"]] = True
          prog[x["id"]] = x.get("path", "")
      execs = events(kind="SPAWNED", since_ns=since, until_ns=now,
                     limit=MAX_EXEC)
      for e in execs:
          prog[e.get("session_id", "")] = e.get("program", "")
      for i in range(3):
          for e in execs:
              pp = e.get("parent_session", "")
              ap = e.get("session_id", "")
              if pp != "" and pp in scope and ap not in scope:
                  if len(scope) < MAX_SESSION:
                      scope[ap] = True

      # ---- STAGE 1 (REQUIRED): install / lifecycle anchor in THIS run -------
      cands = []
      for e in execs:
          if e.get("session_id", "") in scope:
              cands.append(e)
      for x in lineage_:
          cands.append(lineage_row(x))

      anchor    = None
      anchor_ts = 0
      pkg_ioc   = trig_ioc
      for e in cands:
          ts = to_int(e.get("ts", "0"))
          if ts < since or ts > now:
              continue
          blob = (e.get("program", "") + " " + e.get("cmdline", "") + " " +
                  prog.get(e.get("parent_session", ""), "")).lower()
          hit = ioc_in(blob)
          if hit != "" and pkg_ioc == "":
              pkg_ioc = hit
          if not re_any(PKG_MGR, blob):
              continue
          if hit == "" and not re_any(INSTALL, blob):
              continue
          if anchor == None or ts < anchor_ts:
              anchor = e
              anchor_ts = ts

      # the triggering exec itself can be the anchor (its log row races ingest)
      if ct == "execute_process":
          blob = meta.get("content", "").lower()
          if re_any(PKG_MGR, blob) and (trig_ioc != "" or re_any(INSTALL, blob)):
              if anchor == None:
                  anchor = {"kind":           "SPAWNED",
                            "session_id":     inst["id"],
                            "parent_session": inst.get("parent", ""),
                            "target_id":      inst["id"],
                            "program":        inst.get("path", "?"),
                            "cmdline":        meta.get("content", ""),
                            "ts":             str(now)}
                  anchor_ts = now

      if anchor == None:
          return "allow"

      # ---- STAGE 2: OAuth/cloud secret read by this run AFTER the anchor ----
      cred     = None
      cred_sid = ""
      for sid in scope:
          if cred != None:
              break
          rows = events(kind="READ_FILE", session=sid,
                        since_ns=anchor_ts, until_ns=now, limit=MAX_READS)
          for r in rows:
              p = r.get("path", "")
              if p != "" and is_secret(p):
                  cred = r
                  cred_sid = sid
                  break

      # ---- STAGE 3: the triggering egress, taken from meta (never re-queried) -
      egress = None
      if ct == "http_request":
          egress = {
              "from":     inst["id"],
              "to":       "https://" + meta.get("host", "?"),
              "kind":     "HTTP_REQUEST",
              "dir":      "out",
              "ts":       str(now),
              "first_ts": str(now),
              "last_ts":  str(now),
              "method":   meta.get("method", ""),
              "callid":   meta.get("callid", ""),
          }

      # ---- verdict ----------------------------------------------------------
      # IoC track: named package present in this run.
      # Behaviour track: install anchor + credential read + egress, ordered.
      if pkg_ioc == "":
          if cred == None or egress == None:
              return "allow"

      names = []
      for x in lineage_:
          names.append(short(x.get("path", "?")))
      lin_str = " -> ".join(names)
      degraded = len(lineage_) < 2

      chain = new_chain(lineage_[-1]["id"])
      stages = []

      acmd = anchor.get("cmdline", "")
      if acmd == "":
          acmd = anchor.get("program", "?")
      chain.append(step(ev_edge(anchor),
                        stage_id="Install Context",
                        stage_desc="package-manager install/lifecycle in this session: " + acmd))
      stages.append("install-context")

      if pkg_ioc != "":
          chain.append(step(ev_edge(anchor),
                            stage_id="Supply-Chain IoC",
                            stage_desc="flagged npm package identifier observed in session: " + pkg_ioc))
          stages.append("ioc:" + pkg_ioc)

      if cred != None:
          chain.append(step(ev_edge(cred),
                            stage_id="Credential Access",
                            stage_desc="OAuth/cloud credential store read by session " +
                                       cred_sid + ": " + cred.get("path", "?"),
                            activity={"path": cred.get("path", ""), "ts": cred.get("ts", "0")}))
          stages.append("cred:" + cred.get("path", "?"))

      if egress != None:
          chain.append(step(egress,
                            stage_id="Egress",
                            stage_desc="outbound HTTP from install context to " +
                                       meta.get("host", "?") + meta.get("path", "")))
          stages.append("egress:" + meta.get("host", "?"))

      attribution = "exact"
      if degraded:
          attribution = "degraded"

      reason = ("npm supply-chain suspicion (" + ", ".join(stages) + ") in session " +
                lin_str + " [attribution=" + attribution + "]")
      print(reason)

      return {
          "action": "report",
          "reason": reason,
          "chain":  chain,
      }

  result = run()
