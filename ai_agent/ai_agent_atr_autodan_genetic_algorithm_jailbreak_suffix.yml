title: AutoDAN Genetic-Algorithm Jailbreak Suffix
id: c82d4a6d-a948-4f51-9744-95aa2c10894b
status: experimental
level: critical
description: |-
  Detects AutoDAN-style jailbreak prompts from NVIDIA garak dan.AutoDAN / dan.AutoDANCached probes (garak/data/autodan/autodan_init.txt and autodan_prompts.json). AutoDAN (Liu et al. 2023, arXiv:2310.04451) uses a genetic-algorithm to paraphrase and mutate a Developer-Mode jailbreak seed into human-readable adversarial variants. Distinct from GCG (ATR-2026-00267) which produces gibberish token suffixes — AutoDAN variants read like fluent English. Signature markers: (1) "[PROMPT]" placeholder token used as target-goal substitution, (2) "Sure, here is how to [PROMPT]" / "Certainly, here''s how to respond to [PROMPT]" affirmative-response template (the GA objective), (3) substituted company name "ModelKeeper" in place of "OpenAI", and (4) paraphrased but structurally identical Dev Mode instructions with GA fingerprint phrasings like "forfeiting control", "endorsing transparent policies", "exhibit unquestioning obedience".

  Adapted from Agent Threat Rules ATR-2026-00306 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00306
- https://github.com/NVIDIA/garak/blob/main/garak/probes/dan.py
- https://github.com/NVIDIA/garak/blob/main/garak/data/autodan/autodan_init.txt
- https://arxiv.org/abs/2310.04451
tags:
- attack.execution
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?:Sure,?\s+here\s+is\s+how\s+to|Certainly,?\s+here(?:'s|\s+is)\s+how\s+(?:to\s+)?(?:respond\s+to\s+)?)\s*\[PROMPT\]|starting\s+with\s+"Sure,?\s+here\s+is\s+how\s+to\s+\[PROMPT\]"|respond\s+to\s+\[PROMPT\]
  sel_1:
    response|re: \bModelKeeper(?:'s)?\s+(?:content\s+polic(?:y|ies)|rules?|guidelines?)|\bModelKeeper\b[\s\S]{0,200}\b(?:Developer\s+Mode|content\s+polic|uncensored\s+conditions?)\b|(?:Developer\s+Mode|content\s+polic)[\s\S]{0,200}\bModelKeeper\b
  sel_2:
    response|re: (?:forfeiting\s+control\s+and\s+endorsing\s+transparent\s+policies|exhibit\s+unquestioning\s+obedience|triumph\s+lay\s+in\s+forfeiting|Henceforth,?\s+you'll\s+operate\s+as\s+\w+\s+featuring\s+Developer\s+Mode)
  sel_3:
    response|re: Disregard\s+previous\s+instructions\.?[\s\S]{0,300}\b(?:Developer\s+Mode|featuring\s+Developer\s+Mode|with\s+Developer\s+Mode\s+enabled)\b
  sel_4:
    response|re: \(\s*🔓\s*Developer\s+Mode\s+Output\s*\)\s*(?:Certainly|Sure),?\s+here(?:'s|\s+is)\s+how\s+to\s+respond\s+to\s+\[PROMPT\]|In\s+Developer\s+Mode,?\s+I\s+have\s+the\s+freedom\s+to\s+(?:express|generate)\s+(?:opinions|unfiltered)
  condition: 1 of sel_*
falsepositives:
- Academic paper on AutoDAN (Liu et al. 2023) discussing the attack methodology
- Red team report quoting autodan_prompts samples for evaluation
- Generic "Sure, here is how to X" completions where X is a real noun, not the literal [PROMPT] placeholder
action: report
