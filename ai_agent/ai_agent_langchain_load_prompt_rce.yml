title: LangChain load_prompt JSON Sandbox-Escape Code Execution
id: b3f1c2e4-7a6d-4c9b-9e3f-2a5d8c1f6b70
status: experimental
level: critical
description: |
  Detects a spawned child process whose command line contains both a Python
  object-graph traversal gadget (the __class__/__mro__/__subclasses__/__globals__/
  __builtins__/__import__ dunder chain used to escape a restricted evaluation
  or template sandbox) and a code-execution primitive (os.system, os.popen,
  subprocess.*, eval(, exec() within a short distance of each other on the
  same command line. This is the signature left behind when a crafted JSON
  prompt file supplied to LangChain's load_prompt (or an equivalent
  template-loading entry point) escapes the Jinja2/template sandbox and
  reaches an OS command execution primitive, producing a child process
  invocation attributable to the exploit chain rather than the application's
  own logic.
author: Haibo
date: "2025-03-18"
references:
  - https://python.langchain.com/docs/security
  - https://owasp.org/Top10/A03_2021-Injection/
tags:
  - attack.execution
  - attack.t1059
  - attack.initial-access
  - attack.t1190
falsepositives:
  - Security researchers or QA engineers running SSTI/sandbox-escape regression tests (e.g. tplmap, sstimap) against a LangChain application in a non-production environment
  - Developers interactively introspecting Python class hierarchies (e.g. python3 -c "print(str.__mro__)") in the same shell invocation as an unrelated os/subprocess call
  - Static analysis or security scanning tool invocations (semgrep, bandit, grep/ripgrep) whose command-line arguments literally contain the gadget substrings they are searching for rather than executing them
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_event:
    event_type: execute_process
  sel_gadget_exec_chain:
    command|re:
      - '(?i)__(class|mro|base|bases|subclasses|globals|builtins|import)__.{0,250}(os\.(system|popen)|subprocess\.(popen|call|run|check_output)|eval\(|exec\()'
      - '(?i)(os\.(system|popen)|subprocess\.(popen|call|run|check_output)|eval\(|exec\().{0,250}__(class|mro|base|bases|subclasses|globals|builtins|import)__'
  filter_sast_tools:
    command|re: '(?i)^\s*(semgrep|bandit|grep|egrep|fgrep|rg|ag|ripgrep|pylint|mypy|pytest|tox|sphinx-build|pdoc3?)\b'
  condition: sel_event and sel_gadget_exec_chain and not filter_sast_tools
action: report
