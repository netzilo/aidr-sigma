title: LangChain load_prompt Deserialization Code Execution
id: 7f3c1a2e-9b4d-4f61-8c2a-5d0e6b7a1c93
status: experimental
level: high
description: |
  Detects the post-exploitation signature of the LangChain `load_prompt` /
  `load_chain` unsafe-deserialization class of bugs (LangChain <= 0.0.171,
  CVE-2023-36281): a malicious prompt/chain JSON or YAML file whose template
  reaches `__subclasses__`, `__globals__` or an f-string/template evaluation
  path and executes attacker code inside the interpreter.

  The engine cannot observe the deserialization step itself (there is no
  EXECUTE_CODE or UNSAFE_DESERIALIZATION edge kind and no `deserialize`
  event type). What it can observe is the ordered, session-scoped pair:

    stage 1 (REQUIRED anchor) - a python-family host process reads an
                                untrusted prompt/chain specification file
                                (*.json / *.yaml / *.yml whose path carries a
                                prompt/template/chain/agent token), and
    stage 2 (trigger)         - within 5 minutes the same process session
                                spawns a shell, a network utility, an
                                encoder/loader, or a `python -c` payload.

  The rule is anchored on the triggering session (the spawned child), walks
  its real lineage with `lineage()`, and reads only prior, session-scoped rows
  out of the event log with `events()`. The triggering exec is taken from
  `meta`. Attribution never crosses a session tree: every stage must belong to
  the caller's lineage or to a session spawned by that lineage inside the
  window.

  Maps to OWASP A08:2023 - Software and Data Integrity Failures (untrusted
  deserialization of a prompt artifact). Report-only: the ordered pair is
  strong evidence but a legitimate agent that loads a prompt file and then
  shells out produces the same shape.
author: Egemen
date: "2026-06-12"
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2023-36281
  - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.006
  - owasp.llm03
falsepositives:
  - A LangChain / LlamaIndex application that legitimately loads a prompt or
    chain JSON from disk and then, in the same session, uses a Bash/Terminal
    tool - agent frameworks routinely spawn `sh -c` for their shell tool.
  - CI and pytest runs that read prompt fixtures (`tests/**/prompt*.json`) and
    then invoke shell helpers, `chmod +x`, or `curl` for artifact upload.
  - Notebook / Streamlit / Chainlit dev loops where the kernel reads a
    `*_prompt.json` and the same kernel later shells out for `pip install`.
  - Non-LangChain configuration files that happen to carry a `agent`,
    `chain` or `template` token in the filename (e.g. `agent.json` for an
    unrelated service) read by a python process that later runs `curl`.
  - Deployment scripts that render a Jinja/`template.yaml` and then run a
    packaging shell command.
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - file_activity
detection:
  sel_exec:
    event_type: execute_process
  condition: sel_exec
action: execute
on_timeout: allow
on_error:   allow
script: |
  # ─── LangChain load_prompt deserialization RCE — session-scoped ────────────
  # Anchor: the triggering session -> lineage() -> events(). The trigger stage
  # comes from meta; the prior (read) stage from the event log.

  WINDOW_NS = 300000000000        # 5 minutes — this rule's own window

  # Child processes that a prompt-template payload typically reaches for.
  CHILD_PATTERNS = [
      r"(?i)(^|[\s/])(sh|bash|zsh|dash|ksh)([\s]|$)",
      r"(?i)(^|[\s/])(curl|wget)([\s]|$)",
      r"(?i)(^|[\s/])(nc|ncat|netcat|socat)([\s]|$)",
      r"(?i)(^|[\s/])(osascript|powershell|pwsh|wscript|cscript)([\s]|$)",
      r"(?i)(^|[\s/])cmd\.exe([\s]|$)",
      r"(?i)(^|[\s/])(perl|ruby|php|node)([\s]|$)",
      r"(?i)\bchmod\s+\+x\b",
      r"(?i)\bbase64\s+--?d\b",
  ]

  # Markers of the deserialization gadget itself leaking into the child cmdline.
  PAYLOAD_PATTERNS = [
      r"__subclasses__",
      r"__globals__",
      r"__import__",
      r"__builtins__",
      r"(?i)\bos\.(system|popen|execv|execvp|execl)\b",
      r"(?i)\bsubprocess\.(run|call|Popen|check_output)\b",
      r"(?i)(^|[\s/])python[0-9.]*\s+-c([\s]|$)",
      r"(?i)\beval\s*\(",
      r"(?i)\bexec\s*\(",
  ]

  PROMPT_EXT   = [".json", ".yaml", ".yml"]
  PROMPT_HINTS = ["prompt", "template", "chain", "agent", "langchain",
                  "few_shot", "fewshot", "llm"]

  def has_any(s, pats):
      for p in pats:
          if re.find(p, s) != None:
              return True
      return False

  def short(path):
      if path == "":
          return "?"
      return path.split("/")[-1]

  def spawn_cmd(content):
      # execute_process content is {"command": ..., "path": ...} (json.Marshal,
      # so quotes, backslashes and < > & arrive escaped). Return the raw command.
      i = content.find('"command":')
      if i < 0:
          return content
      j = content.find('"', i + 10)
      if j < 0:
          return content
      out = ""
      k = j + 1
      n = len(content)
      for _ in range(n):
          if k >= n:
              break
          c = content[k]
          if c == '"':
              break
          if c == "\\" and k + 1 < n:
              d = content[k + 1]
              if d == "u" and k + 5 < n:
                  out += chr(int(content[k + 2:k + 6], 16))
                  k += 6
                  continue
              if d == "n":
                  out += "\n"
              elif d == "t":
                  out += "\t"
              else:
                  out += d
              k += 2
              continue
          out += c
          k += 1
      return out

  def is_python_proc(path):
      if path == "":
          return False
      base = short(path).lower()
      if re.match(r"^pythonw?[0-9.]*$", base):
          return True
      if re.match(r"^pythonw?[0-9.]*\.exe$", base):
          return True
      if re.match(r"^(uvicorn|gunicorn|streamlit|chainlit|celery|flask|langserve)$", base):
          return True
      return False

  def is_prompt_spec(p):
      if p == "":
          return False
      lp = p.lower()
      ext_ok = False
      for x in PROMPT_EXT:
          if lp.endswith(x):
              ext_ok = True
      if not ext_ok:
          return False
      for h in PROMPT_HINTS:
          if h in lp:
              return True
      return False

  def file_edge(e):
      t = e.get("ts", "0")
      return {
          "from":     e.get("session_id", ""),
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", ""),
          "dir":      "out",
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
      }

  def chain_root(lin):
      # The nearest agent ancestor, else the lineage root.
      for x in lin:
          if x.get("agent", "0") == "1":
              return x
      return lin[-1]

  # ─── relevance gate — pure string checks on meta, no graph / log calls ─────
  def is_relevant_event():
      if meta.get("context_type", "") != "execute_process":
          return False
      cmd = spawn_cmd(meta.get("content", ""))
      if cmd == "":
          return False
      if has_any(cmd, CHILD_PATTERNS):
          return True
      if has_any(cmd, PAYLOAD_PATTERNS):
          return True
      return False

  def run():
      if not is_relevant_event():
          return "allow"

      cmd   = spawn_cmd(meta.get("content", ""))
      ev_ts = int(meta.get("event_ts", "0"))
      if ev_ts == 0:
          return "allow"

      # ── anchor on the triggering session (the spawned child) ──────────────
      inst = session()
      if inst == None:
          return "allow"                     # degraded — never guess an owner
      lineage_ = lineage(inst["id"])
      if not lineage_:
          return "allow"

      # The LangChain host must be in this caller's own lineage.
      py = None
      for x in lineage_:
          if is_python_proc(x.get("path", "")):
              py = x
              break
      if py == None:
          return "allow"

      # ── scope: lineage sessions + sessions they spawned in-window ─────────
      since = ev_ts - WINDOW_NS
      scope = {}
      for x in lineage_:
          scope[x["id"]] = True
      for e in events(kind="SPAWNED", since_ns=since,
                      until_ns=ev_ts, limit=2000):
          if e.get("parent_session", "") in scope:
              scope[e.get("session_id", "")] = True

      # ── REQUIRED anchor stage: prompt spec read, ordered before the exec ──
      # READ_FILE is high volume — always scoped by session and windowed.
      read_ev = None
      for sid in scope:
          for e in events(kind="READ_FILE", session=sid,
                          since_ns=since, until_ns=ev_ts, limit=300):
              if is_prompt_spec(e.get("path", "")):
                  if int(e.get("ts", "0")) <= ev_ts:
                      read_ev = e
                      break
          if read_ev != None:
              break
      if read_ev == None:
          return "allow"                     # anchor absent — not this threat

      # ── verdict + kill chain, rooted at the agent ancestor / lineage root ──
      root  = chain_root(lineage_)
      chain = new_chain(root["id"])

      chain.append(step(
          file_edge(read_ev),
          stage_id="Untrusted Prompt Spec Load",
          stage_desc=short(read_ev.get("program", "")) +
                     " read prompt/chain specification: " + read_ev.get("path", ""),
          activity={"path": read_ev.get("path", ""), "ts": read_ev.get("ts", "0")},
      ))

      parent_id = inst.get("parent", "")
      if parent_id == "":
          parent_id = py["id"]
      trig_edge = {
          "from":     parent_id,
          "to":       inst["id"],
          "kind":     "SPAWNED",
          "ts":       str(ev_ts),
          "first_ts": str(ev_ts),
          "last_ts":  str(ev_ts),
          "cmdline":  cmd,
      }
      gadget = has_any(cmd, PAYLOAD_PATTERNS)
      label  = "Code Execution (template gadget)" if gadget else "Code Execution"
      chain.append(step(
          trig_edge,
          stage_id=label,
          stage_desc="python session spawned: " + cmd[:240],
      ))

      names = []
      for x in lineage_:
          names.append(short(x.get("path", "")))
      path_str = " -> ".join(names)
      conf = "gadget markers in child cmdline" if gadget else "no gadget markers"
      delta = (ev_ts - int(read_ev.get("ts", "0"))) / 1000000000

      print("LangChain load_prompt RCE pattern: " + read_ev.get("path", "") +
            " then exec after " + str(delta) + "s via " + path_str + " (" + conf + ")")

      return {
          "action": "report",
          "reason": "Possible LangChain load_prompt deserialization RCE - " +
                    short(py.get("path", "")) + " read untrusted prompt spec " +
                    read_ev.get("path", "") + " then spawned '" + cmd[:120] +
                    "' " + str(delta) + "s later (" + conf + "); lineage: " + path_str,
          "chain":  chain,
      }

  result = run()
