logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:"method"\s*:\s*"tasks/(?:get|update|cancel)"[\s\S]{0,300}"taskId"\s*:\s*"(?:[0-9]{1,7}|task[_\-]?[0-9]{1,7}|0{8,}[0-9a-f\-]{0,28}|[*%]|\.\.[\\/][^"]{0,60}|[^"]{0,60}(?:%27|\x27\s*(?:or|and|union)\s|;\s*drop\s)[^"]{0,60})"|"taskId"\s*:\s*"(?:[0-9]{1,7}|task[_\-]?[0-9]{1,7}|0{8,}[0-9a-f\-]{0,28}|[*%]|\.\.[\\/][^"]{0,60}|[^"]{0,60}(?:%27|\x27\s*(?:or|and|union)\s|;\s*drop\s)[^"]{0,60})"[\s\S]{0,300}"method"\s*:\s*"tasks/(?:get|update|cancel)")
  sel_1:
    content|re: (?i)(?:"method"\s*:\s*"tasks/(?:list|result)"[\s\S]{0,500}(?:io\.modelcontextprotocol/tasks|"protocolVersion"\s*:\s*"2026-(?:06-30|07-28)"|"resultType"\s*:\s*"(?:task|complete)")|(?:io\.modelcontextprotocol/tasks|"protocolVersion"\s*:\s*"2026-(?:06-30|07-28)"|"resultType"\s*:\s*"(?:task|complete)")[\s\S]{0,500}"method"\s*:\s*"tasks/(?:list|result)")
  sel_2:
    content|re: (?i)"inputRequests"\s*:\s*\{[\s\S]{0,800}"method"\s*:\s*"(?:elicitation/create|sampling/createMessage)"[\s\S]{0,800}(?:auto[\s_\-]?approve|approve\s+(?:all|any|every|future|subsequent|remaining)|do\s*n[o\x27]?t\s+ask\s+(?:me\s+)?again|(?:disable|skip|bypass|suppress)\s+(?:the\s+)?(?:confirmation|approval|consent|human\s+review)|remember\s+(?:this\s+)?(?:approval|consent|choice)\s+for\s+all|grant\s+(?:full|admin|root|unrestricted|permanent)\s+(?:access|permission|authority|privileges)|apply\s+to\s+all\s+(?:future|subsequent|remaining))
  sel_3:
    content|re: (?i)"inputRequests"\s*:\s*\{[\s\S]{0,800}"(?:message|systemPrompt|text)"\s*:\s*"(?:[^"]{0,300}(?:re-?authenticate|verify\s+your\s+(?:identity|account)|session\s+(?:has\s+)?expired|security\s+(?:check|verification)|confirm\s+your\s+(?:credentials|password)|account\s+(?:will\s+be\s+)?(?:locked|suspended)|urgent(?:ly)?|immediately)[^"]{0,300}(?:api[\s_\-]?keys?|secret\s+(?:access\s+)?key|client[\s_\-]?secret|password|passphrase|private[\s_\-]?key|access[\s_\-]?token|refresh[\s_\-]?token|seed\s+phrase|mnemonic|recovery\s+(?:code|phrase)|credit[\s_\-]?card|ssh[\s_\-]?key)|[^"]{0,300}(?:api[\s_\-]?keys?|secret\s+(?:access\s+)?key|client[\s_\-]?secret|password|passphrase|private[\s_\-]?key|access[\s_\-]?token|refresh[\s_\-]?token|seed\s+phrase|mnemonic|recovery\s+(?:code|phrase)|credit[\s_\-]?card|ssh[\s_\-]?key)[^"]{0,300}(?:re-?authenticate|verify\s+your\s+(?:identity|account)|session\s+(?:has\s+)?expired|security\s+(?:check|verification)|confirm\s+your\s+(?:credentials|password)|account\s+(?:will\s+be\s+)?(?:locked|suspended)|urgent(?:ly)?|immediately))
  sel_4:
    content|re: (?i)(?:"resultType"\s*:\s*"task"[\s\S]{0,400}"ttlMs"\s*:\s*[0-9]{10,}|"ttlMs"\s*:\s*[0-9]{10,}[\s\S]{0,400}"resultType"\s*:\s*"task")
  sel_5:
    content|re: (?i)(?:(?:modelcontextprotocol|mcpServers|oauth-protected-resource|mcp[_\-]?server|/mcp[/?"\s]|"?resource"?\s*[:=]\s*"?https?(?::|%3A)[^"&\s]{0,120}mcp)[\s\S]{0,600}(?:"?response_type"?\s*[:=]\s*"?(?:token\b|id_token(?:%20|\+|\s)+token)|"?code_challenge_method"?\s*[:=]\s*"?plain\b|"?grant_type"?\s*[:=]\s*"?password\b)|(?:"?response_type"?\s*[:=]\s*"?(?:token\b|id_token(?:%20|\+|\s)+token)|"?code_challenge_method"?\s*[:=]\s*"?plain\b|"?grant_type"?\s*[:=]\s*"?password\b)[\s\S]{0,600}(?:modelcontextprotocol|mcpServers|oauth-protected-resource|mcp[_\-]?server|/mcp[/?"\s]|"?resource"?\s*[:=]\s*"?https?(?::|%3A)[^"&\s]{0,120}mcp))
  sel_6:
    content|re: (?i)(?:"redirect_uris?"\s*:\s*(?:\[\s*)?"https?://(?:[a-z0-9\-]{1,63}\.)+[a-z]{2,24}[^"]{0,80}\*|"?redirect_uri"?\s*[:=]\s*"?https?(?::|%3A)(?://|%2F%2F)[^"&\s]{0,80}@[^"&\s]{0,80}|"authorization_servers"\s*:\s*\[\s*"http://|"authorization_servers"\s*:\s*\[\s*"https?://(?:[0-9]{1,3}\.){3}[0-9]{1,3})
  condition: 1 of sel_*
falsepositives:
- Legitimate long-horizon batch work (data migration, model fine-tune, render farm) whose server honestly
  returns a multi-week ttlMs on CreateTaskResult — Layer 5 cannot distinguish a long job from laundered
  authority.
- Load, soak and conformance test harnesses that poll tasks/get with synthetic sequential task IDs (task_1,
  task_2, ...) against their own server — Layer 1 sees the enumeration shape without the malicious intent.
- 'Servers still serving 2025-11-25 clients in a mixed fleet during the 12-month deprecation window: a
  tasks/list or tasks/result call is legitimate there, and Layer 2 will fire whenever a 2026 marker (resultType,
  extension id, protocolVersion) happens to appear in the same buffer.'
- Genuine credential elicitation inside a task that happens to use urgency wording ('your session has
  expired, please re-enter your access token') — Layer 4 cannot tell an honest re-auth prompt from a phishing
  one.
- Development and staging OAuth setups that intentionally use plain PKCE or an http:// authorization server
  on a trusted network.
- Attacker-controlled text quoted verbatim inside an otherwise benign MCP tool response (a scraped page,
  an issue body, a log line). Every layer matches on flat text with no notion of which side of the exchange
  produced it, so a task-shaped payload echoed back by a search tool reads identically to one the server
  actually emitted.
- 'Coverage boundary rather than a false positive, recorded here so no one over-reads this rule: it produces
  NO verdict on a SKILL.md scan. detection.condition is ''any'' and the engine short-circuits on the first
  matching condition, so matchedConditions is always 1, while a scan_target: mcp rule needs ceil(7 * 0.3)
  = 3 matched conditions on the skill path. Verified against engine.scanSkill() with a document carrying
  four distinct true-positive payloads. Treat this rule as MCP-exchange runtime coverage only.'
- 'Scope boundary, recorded because it was measured and then acted on: prose is NOT covered. The prose
  layer this rule shipped with was removed after all three of its branches fired on defensive security
  writing (threat models, hardening checklists, pentest reports, and the migration guidance that tells
  clients to iterate their stored task IDs now that tasks/list is gone). Text that merely describes, teaches,
  or warns about MCP async-task abuse will not be flagged by this rule, by design.'
action: report
