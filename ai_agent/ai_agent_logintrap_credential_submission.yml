title: LoginTrap Indirect Injection Credential Submission
id: 6f3b9c2a-8d41-4e7b-9c0f-2a5d1e84b7c3
status: experimental
level: high
description: |
  Detects the LoginTrap attack chain: an LLM-based web agent reads a page whose body
  carries agent-directed instruction text combined with login-coercion text (the
  task-agnostic indirect prompt injection), and then, inside the same process session
  and a five-minute window, submits real credential material over HTTP to a
  credential-collection endpoint that is either cross-origin from the lure page or a
  host the session had never contacted before the lure was read.

  The rule is instance-resolved: it anchors on meta["caller_pid"], resolves the exact
  process instance with proc_instance(), derives the owning session with proc_lineage()
  plus one bounded sibling-expansion pass, and reconstructs the earlier stages only from
  query_events() rows belonging to that session. No stage is ever attributed across
  sessions or across process instances that merely share an executable path.

  The triggering credential POST is taken from meta (host/method/path/content), never
  re-queried from the event log, because the just-fired event races asynchronous ingest.

  Only the graph/event-log evidence is reported; nothing is blocked and no host, domain
  or path is added to any trust list. Web-layer context for this technique corresponds to
  OWASP Web Top 10 A01:2021 (Broken Access Control) and A07:2021 (XSS) as the injection
  delivery surface; the tags below use the LLM/agent taxonomies the engine indexes.
author: Tanya
date: "2026-06-12"
references:
  - https://atlas.mitre.org/techniques/AML.T0051
  - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
tags:
  - attack.credential-access
  - attack.t1056.003
  - atlas.aml.t0051
  - owasp.llm01
  - owasp.llm06
falsepositives:
  - Security-research or LLM-documentation pages that quote prompt-injection examples
    ("ignore previous instructions", "note to the assistant") next to login instructions,
    read by an agent that then performs a genuine first-time login to an unrelated service
    within the same five-minute window.
  - Red-team / QA harnesses that intentionally host injection payloads and then drive a
    scripted login with realistic (non-placeholder) credentials.
  - Agent skill or README pages that legitimately contain an "instructions for the agent"
    block and a "sign in to continue" setup step, followed by an operator-approved SSO or
    password-manager login to a host the session has not visited before.
  - Bot-mitigation or consent interstitials whose copy is addressed to automated clients
    and which precede a real authentication step.
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_http:
    event_type: http_request
  sel_method:
    method:
      - POST
      - PUT
      - PATCH
  sel_credential_field:
    content|re: '(?i)(pass(word|wd|phrase)|client_secret|otp[_-]?code|mfa[_-]?code|totp)"?\s*[:=]'
  condition: sel_http and sel_method and sel_credential_field
action: execute
on_timeout: report
on_error: allow
script: |
  # ── constants ───────────────────────────────────────────────────────────────
  WINDOW_NS = 300000000000        # 5 minutes — lure read and credential POST must cluster
  MAX_PIDS  = 24                  # bound on session expansion
  MAX_HTTP  = 200                 # bound on per-pid HTTP_REQUEST rows
  MAX_CAND  = 24                  # bound on indexed documents inspected

  CRED_VALUE_RE  = r'(?i)(pass(?:word|wd|phrase)|client_secret|otp[_-]?code|mfa[_-]?code|totp)"?\s*[:=]\s*"?[^"&\s,;}]{3,}'
  PLACEHOLDER_RE = r'(?i)(your[_-]?pass|<[a-z_]*pass|\{\{|\$\{|x{4,}|\*{3,}|placeholder|redacted|dummy|changeme|password123|hunter2|example)'
  AUTH_CTX_RE    = r'(?i)(log[_-]?in|sign[_-]?in|auth|session|sso|oauth|token|credential|account)'
  AUTH_BODY_RE   = r'(?i)(grant_type|j_username|authenticity_token|csrf|username|email|login|signin)'

  # Agent-directed instruction markers — the LoginTrap payload speaks to the agent,
  # not to a human visitor. This is the discriminating half of the anchor.
  INJ_MARKERS = [
      "ignore previous instructions",
      "ignore all previous instructions",
      "disregard previous instructions",
      "note to the assistant",
      "instruction for the assistant",
      "instructions for the agent",
      "as an ai assistant you must",
      "the assistant must",
      "do not ask the user",
      "without asking the user",
      "before continuing this task",
      "to complete the user's task you must",
      "system prompt override",
      "important agent instruction",
  ]

  # Login-coercion half of the anchor — must co-occur in the SAME document.
  LOGIN_TERMS = [
      "log in",
      "login",
      "sign in",
      "signin",
      "authenticate",
      "username and password",
      "credentials",
  ]

  # ── pure helpers (no graph / log / index calls) ─────────────────────────────
  def host_from_source(src):
      i = src.find("#")
      if i >= 0:
          src = src[:i]
      p = src.find("://")
      if p < 0:
          return ""
      rest = src[p+3:]
      s = rest.find("/")
      if s >= 0:
          rest = rest[:s]
      return rest

  def same_site(a, b):
      if a == "" or b == "":
          return False
      if a == b:
          return True
      if a.endswith("." + b):
          return True
      if b.endswith("." + a):
          return True
      return False

  def short(p):
      return p.split("/")[-1]

  def ev_edge(e):
      return {
          "from":     "process://" + e.get("actor_path", ""),
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", "HTTP_REQUEST"),
          "ts":       e.get("ts", "0"),
          "first_ts": e.get("ts", "0"),
          "last_ts":  e.get("ts", "0"),
          "method":   e.get("method", ""),
      }

  # ── relevance gate: pure string checks on meta only ─────────────────────────
  def is_credential_post():
      if meta.get("context_type", "") != "http_request":
          return False
      m = meta.get("method", "").upper()
      if m != "POST" and m != "PUT" and m != "PATCH":
          return False
      body = meta.get("content", "")
      if body == "":
          return False
      hit = re.find(CRED_VALUE_RE, body)
      if hit == None:
          return False
      # a templated / masked / documentation value is not a submitted credential
      if re.find(PLACEHOLDER_RE, hit) != None:
          return False
      ctx = meta.get("path", "") + " " + meta.get("host", "")
      if re.find(AUTH_CTX_RE, ctx) != None:
          return True
      if re.find(AUTH_BODY_RE, body) != None:
          return True
      return False

  def run():
      if not is_credential_post():
          return "allow"

      now = int(meta.get("event_ts", "0"))
      cp  = int(meta.get("caller_pid", "0"))
      if now == 0 or cp == 0:
          return "allow"

      # ── anchor on the exact triggering instance ─────────────────────────────
      inst = proc_instance(cp, now)
      if inst == None:
          return "allow"            # degraded attribution — never guess an owner
      lineage = proc_lineage(int(inst["actor_pid"]), int(inst["actor_start"]))
      if not lineage:
          return "allow"

      # ── scope strictly to this session (lineage + its descendants) ──────────
      session = {}
      for x in lineage:
          session[x["actor_pid"]] = x["actor_start"]
      spawn = query_events(kind="EXECUTE_PROCESS", since_ns=now - WINDOW_NS,
                           until_ns=now, limit=2000)
      for i in range(3):
          for e in spawn:
              if e.get("parent_pid", "") in session:
                  session[e["actor_pid"]] = e["actor_start"]

      pids = []
      for p in session:
          if len(pids) < MAX_PIDS:
              pids.append(p)

      # session HTTP requests inside the window and strictly before the trigger
      latest = {}
      for p in pids:
          for e in query_events(kind="HTTP_REQUEST", actor_pid=int(p),
                                since_ns=now - WINDOW_NS, until_ns=now, limit=MAX_HTTP):
              h = e.get("host", "")
              if h == "":
                  continue
              prev = latest.get(h, None)
              if prev == None or int(e["ts"]) > int(prev["ts"]):
                  latest[h] = e
      if not latest:
          return "allow"

      # ── STAGE 1 (REQUIRED anchor): agent-directed instruction text AND
      #    login-coercion text in one document served by a host THIS session read
      lure_ev   = None
      lure_host = ""
      lure_mark = ""
      lure_term = ""
      seen = {}
      cand = 0
      for m in INJ_MARKERS:
          if lure_ev != None:
              break
          for r in search(m, topK=8):
              if lure_ev != None:
                  break
              src = r.get("source", "")
              if src == "" or src in seen:
                  continue
              seen[src] = True
              if not (src.startswith("http://") or src.startswith("https://")):
                  continue
              h = host_from_source(src)
              if h == "" or h not in latest:
                  continue                      # not this session's traffic
              cand = cand + 1
              if cand > MAX_CAND:
                  break
              if not search_in(src, m):
                  continue                      # BM25 candidate did not really contain it
              for t in LOGIN_TERMS:
                  if search_in(src, t):
                      lure_ev   = latest[h]
                      lure_host = h
                      lure_mark = m
                      lure_term = t
                      break
      if lure_ev == None:
          return "allow"

      s0_ts = int(lure_ev.get("ts", "0"))
      if s0_ts <= 0 or s0_ts > now or (now - s0_ts) > WINDOW_NS:
          return "allow"                        # ordering / window guard

      # ── corroborators: at least one must hold ───────────────────────────────
      post_host = meta.get("host", "")
      cross = not same_site(post_host, lure_host)

      prior = False
      for p in pids:
          if prior:
              break
          for e in query_events(kind="HTTP_REQUEST", actor_pid=int(p),
                                until_ns=s0_ts, limit=200):
              if e.get("host", "") == post_host:
                  prior = True
                  break
      first_contact = not prior

      if not (cross or first_contact):
          return "allow"

      # ── optional STAGE 2: navigation to the credential host after the lure ──
      nav_ev = None
      cand_nav = latest.get(post_host, None)
      if cand_nav != None:
          nts = int(cand_nav.get("ts", "0"))
          if nts >= s0_ts and nts < now:
              nav_ev = cand_nav

      # ── STAGE 3 (trigger): taken from meta, never re-queried ────────────────
      scheme = "https"
      if meta.get("url", "").startswith("http://"):
          scheme = "http"
      trig = {
          "from":     "process://" + inst.get("actor_path", ""),
          "to":       scheme + "://" + post_host,
          "kind":     "HTTP_REQUEST",
          "ts":       str(now),
          "first_ts": str(now),
          "last_ts":  str(now),
          "method":   meta.get("method", ""),
      }

      names = " -> ".join([short(x.get("actor_path", "")) for x in lineage])
      root  = lineage[-1]
      chain = new_chain("process://" + root.get("actor_path", ""))
      chain.append(step(ev_edge(lure_ev), stage_id="Injected Login Lure",
          stage_desc="page from " + lure_host +
                     " carried agent-directed instruction text (\"" + lure_mark +
                     "\") together with login-coercion text (\"" + lure_term + "\")"))
      if nav_ev != None:
          chain.append(step(ev_edge(nav_ev), stage_id="Login Page Navigation",
              stage_desc="agent navigated to credential-collection host " + post_host +
                         " after reading the lure"))
      why = "cross-origin from the lure page" if cross else "first contact for this session"
      chain.append(step(trig, stage_id="Credential Submission",
          stage_desc=meta.get("method", "POST") + " credential fields to " + post_host +
                     meta.get("path", "") + " (" + why + ")"))

      reason = ("LoginTrap pattern — indirect prompt injection on " + lure_host +
                " preceded credential submission to " + post_host +
                " (" + why + ") " + str((now - s0_ts) / 1000000000) +
                "s later, session: " + names)
      print(reason)
      return {"action": "report", "reason": reason, "chain": chain}

  result = run()
