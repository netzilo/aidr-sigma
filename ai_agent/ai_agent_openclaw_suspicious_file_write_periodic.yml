title: OpenClaw Suspicious File Write to Sensitive Paths (EDR Graph)
id: db43664e-2408-5e70-9b63-dcb0fabc8c5f-p
related:
  - id: db43664e-2408-5e70-9b63-dcb0fabc8c5f
    type: companion
status: stable
level:          high
description: |
  Periodic companion to the real-time rule. Checks the file writes of every
  agent session (and its child sessions) every 30 seconds for sensitive path
  writes that arrived via EDR (syscall level) rather than through the hook or
  MITM proxy. Covers writes by subprocesses that the tool_call path cannot see.
references:
  - https://attack.mitre.org/techniques/T1546/
  - https://attack.mitre.org/techniques/T1053/
author: Netzilo
date: "2026-06-02"
tags:
  - attack.persistence
  - attack.t1546
  - attack.t1053
  - atlas.aml.t0053
  - atlas.aml.t0081
  - owasp.asi02
  - owasp.asi07
logsource:
  product: ai_agent
  category: periodic
requires:
  - process_exec
  - file_activity
detection:
  sel:
    content|re: '.'
  condition: sel
action: execute
on_error: allow
script: |
  SENSITIVE = [
      "/etc/", ".bashrc", ".zshrc", ".profile", ".bash_profile", ".zprofile",
      "/cron.d/", "/crontab", "/cron.daily/", "/cron.hourly/",
      "/systemd/system/", "/systemd/user/",
      "/LaunchAgents/", "/LaunchDaemons/",
      "authorized_keys",
  ]

  def check(s, agent_name):
      # File paths live in the event log, one FileSystem node per session:
      # fs_activity() lists the exact paths this session wrote.
      for w in fs_activity(session=s["id"], op="WRITE"):
          p = w["path"]
          for path in SENSITIVE:
              if path in p:
                  print("Suspicious write — path: " + path +
                        " process: " + s.get("name", "?") +
                        " agent: " + agent_name)
                  return True
      return False

  def run():
      for a in sessions(agent=True):
          if check(a, a.get("name", "?")):
              return "block"
          # subprocesses the tool_call path cannot see
          for c in children(a["id"]):
              if check(c, a.get("name", "?")):
                  return "block"
      return "allow"

  result = run()
