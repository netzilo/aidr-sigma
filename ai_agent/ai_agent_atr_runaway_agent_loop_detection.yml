title: Runaway Agent Loop Detection
id: 43ebdf9b-5e93-45b1-8e82-9e5aeee207f3
status: experimental
level: high
description: |-
  Detects when an agent enters a runaway loop through repeated identical
  actions, infinite retry patterns, or recursive self-invocation. This
  rule uses regex-only detection to identify loop indicators in agent
  output and tool call content, such as retry counters, repeated action
  descriptions, recursive invocation patterns, and stalled progress
  indicators. Runaway loops waste computational resources, accumulate
  costs, and may indicate logic errors or adversarial manipulation.

  Adapted from Agent Threat Rules ATR-2026-00050 (MIT).
author: ATR Community (adapted)
date: '2026-03-08'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00050
tags:
- attack.execution
- atlas.aml.t0046
- atlas.aml.t0053
- owasp.asi05
- owasp.llm06
- owasp.llm10
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:retrying|retry\s+(?:attempt|number|#|count))\s*(?::?\s*)?\d+
  sel_1:
    content|re: (?i)attempt\s+\d+\s+(?:of|/)\s+\d+
  sel_2:
    content|re: (?i)(?:trying\s+again|let\s+me\s+(?:try|attempt)\s+(?:again|once\s+more|one\s+more\s+time)|retrying\s+(?:the\s+)?(?:same|previous|last)\s+(?:operation|request|call|action))
  sel_3:
    content|re: (?i)(?:still\s+(?:failing|not\s+working|getting\s+(?:the\s+same\s+)?error)|same\s+error\s+(?:again|as\s+before|persists)|error\s+(?:persists|continues|remains))
  sel_4:
    content|re: (?i)(?:calling\s+(?:myself|this\s+(?:function|tool|agent))\s+(?:again|recursively)|recursive\s+(?:call|invocation|execution))
  sel_5:
    content|re: (?i)(?:iteration\s+(?:#\s*)?\d{2,}|loop\s+(?:iteration|count|index)\s*[:=]?\s*\d{2,}|cycle\s+\d{2,})
  sel_6:
    content|re: (?i)(?:repeating\s+(?:the\s+)?(?:same|previous|identical)\s+(?:step|action|operation|request)|performing\s+(?:the\s+)?(?:same|identical)\s+(?:action|call)\s+again)
  sel_7:
    content|re: (?i)(?:max(?:imum)?\s+retries?\s+(?:reached|exceeded|hit)|(?:exceeded|hit|reached)\s+(?:the\s+)?(?:retry|attempt|iteration)\s+(?:limit|maximum|cap))
  sel_8:
    content|re: (?i)(?:no\s+progress\s+(?:after|in)\s+\d+\s+(?:attempts?|tries|iterations?|cycles?)|stuck\s+(?:in\s+(?:a\s+)?loop|on\s+(?:the\s+)?same\s+(?:step|error)))
  sel_9:
    content|re: (?i)(?:(?:while|for)\s*\(\s*(?:true|1|;;)\s*\)[\s\S]{0,80}?\b(?:invoke|call|execute|request|fetch|query|retry)\b|(?:loop|repeat)\s*\{\s*(?:call|invoke|execute))
  sel_10:
    content|re: (?i)(?:will\s+keep\s+(?:trying|retrying|attempting)|(?:continuously|endlessly|infinitely)\s+(?:retrying|looping|repeating|calling))
  sel_11:
    content|re: (?i)(?:spawn(?:ing|ed)?\s+(?:another|new|additional)\s+(?:instance|copy|clone)\s+of\s+(?:myself|this\s+agent)|fork(?:ing|ed)?\s+(?:a\s+)?(?:new\s+)?(?:agent|process|instance))
  condition: 1 of sel_*
falsepositives:
- Legitimate batch processing with progress counters in output
- Polling agents designed to check status at regular intervals
- Long-running data pipeline agents with expected high iteration counts
- Retry logic in error handling with bounded retry limits
- CI/CD build logs that include 'attempt 2 of 3' progress counters during normal deployment retries
- Monitoring dashboards displaying iteration counts for scheduled polling jobs that legitimately run hundreds
  of cycles
action: report
