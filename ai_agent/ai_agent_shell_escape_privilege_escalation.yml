title: Shell Escape Privilege Escalation
id: 3f9c1e0a-7b42-4d6e-9c85-1a2f4b6d8e07
status: experimental
level: high
description: |
  Detects an AI agent session breaking out of a restricted or wrapped execution
  context into a privileged interactive shell (classic GTFOBins-style shell
  escape) and then operating with the elevated shell.

  The rule is session-scoped: it anchors on the triggering session (the spawned
  process), walks the true spawn chain with lineage(), and only considers
  SPAWNED rows belonging to that one session tree (lineage plus the sessions
  that lineage spawned) inside a 5-minute window. It never attributes activity
  across sessions and never walks program nodes, which are ambiguous when many
  parents share a single binary such as /bin/sh.

  A high-specificity anchor is REQUIRED: the exec must carry a recognised shell
  escape payload (vi/less/man bang-escape, find -exec /bin/sh, awk BEGIN system,
  python pty.spawn, expect spawn, script -qc /bin/sh, SUID-preserving sh -p,
  nmap --interactive, or a privilege wrapper invoking a shell directly). The
  anchor alone is not reported: at least one additional, distinct evidence row
  from the same session must corroborate it (a restricted host binary spawning a
  shell, a privilege wrapper in the chain, an interactive/priv-preserving shell,
  or post-escalation recon after the anchor).

  Action is report only - shell escapes are also a legitimate operator workflow
  on developer machines, so this rule produces evidence for review rather than
  interrupting work.
author: Evgen
date: "2026-06-12"
references:
  - https://gtfobins.github.io/
  - https://attack.mitre.org/techniques/T1548/
  - https://attack.mitre.org/techniques/T1059/004/
tags:
  - attack.privilege-escalation
  - attack.execution
  - attack.t1548
  - attack.t1059.004
  - atlas.aml.t0050
  - owasp.llm06
falsepositives:
  - Developer or operator deliberately taking a root shell on their own machine
    (sudo -s, sudo su, sudo -i) and then running id / whoami - this produces
    anchor plus privilege-wrapper corroboration and will be reported.
  - Interactive editor or pager shell-out during normal work (:!bash from vim,
    !sh from less or man) while inspecting build output.
  - Build, packaging or CI scripts that use find ... -exec /bin/sh -c ... or
    script -qc /bin/sh to provide a PTY to a non-interactive runner.
  - Automation that legitimately uses python -c 'import pty; pty.spawn(...)' or
    expect/spawn to drive an interactive tool (ssh, passwd, telnet).
  - Security research, GTFOBins study, CTF work, or an authorised pentest run by
    the user through the agent - the command text is identical to the attack.
  - Container debugging where an entrypoint execs /bin/bash and a wrapper such
    as gosu or su-exec appears in the process chain.
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
detection:
  sel_exec:
    event_type: execute_process
  sel_escape_hint:
    content|re:
      - '(?i)(^|[/\s"])(sh|bash|zsh|dash|ksh|csh|tcsh|ash|busybox)([\s";,)}]|$)'
      - '(?i)(^|[/\s"])(sudo|su|doas|pkexec|runuser|gosu|setpriv|capsh)([\s";,)}]|$)'
      - '(?i)(pty\.spawn|import\s+pty|--interactive|stty\s+raw|:shell)'
  condition: sel_exec and sel_escape_hint
action: execute
on_timeout: allow
on_error:   allow
script: |
  # ---------------------------------------------------------------------------
  # Shell Escape Privilege Escalation - session-scoped.
  #   session() -> lineage() -> events()
  # Only SPAWNED rows belonging to the triggering session's own
  # lineage (and its descendants) are considered. No cross-session stitching.
  # ---------------------------------------------------------------------------

  WINDOW_NS = 300000000000      # 5 minutes - stage clustering window
  MAX_ROWS  = 500

  SHELLS  = ["sh", "bash", "zsh", "dash", "ksh", "csh", "tcsh", "ash", "busybox"]
  PRIVESC = ["sudo", "su", "doas", "pkexec", "runuser", "gosu", "setpriv", "capsh"]

  # Binaries that host a restricted/interactive context and are the classic
  # GTFOBins escape launchers. Deliberately excludes sh/bash/zsh, git, node,
  # npm, make and docker - those spawn shells constantly in benign work.
  ESCAPE_HOSTS = [
      "less", "more", "most", "man", "vi", "vim", "nvim", "rvim", "vimdiff",
      "view", "ed", "ex", "nano", "pico", "emacs", "awk", "gawk", "mawk",
      "find", "nmap", "ftp", "gdb", "tar", "zip", "unzip", "crontab", "watch",
      "mysql", "psql", "sqlite3", "expect", "script", "screen", "tmux",
      "strace", "ltrace", "socat", "flock", "stdbuf", "capsh", "xargs",
      "journalctl", "systemctl", "perl", "ruby", "python", "python2",
      "python3", "php", "lua", "irb", "tclsh", "env", "pg", "cpulimit",
      "nice", "ionice", "taskset", "setarch", "busybox",
  ]

  # REQUIRED anchor - recognised shell-escape / privilege-wrapper payloads.
  ESCAPE_PAYLOADS = [
      r"!\s*/?(usr/)?(bin/)?(sh|bash|zsh|ksh|dash)(\s|$|;)",
      r":shell(\s|$)",
      r"-exec\s+/(usr/)?bin/(sh|bash|zsh|ksh|dash)(\s|$)",
      r"BEGIN\s*\{\s*system\s*\(",
      r"pty\.spawn\s*\(",
      r"(?i)import\s+pty",
      r"(?i)os\.(system|execl|execv|popen)\s*\(\s*.{0,3}/(usr/)?bin/(sh|bash)",
      r"(?i)\bsystem\s*\(\s*.{0,3}/(usr/)?bin/(sh|bash)",
      r"(?i)\bexec\s+.{0,3}/(usr/)?bin/(sh|bash)(\s|$|;)",
      r"(?i)\bspawn\s+/(usr/)?bin/(sh|bash)(\s|$)",
      r"(?i)\bscript\b.{0,20}\s-\w*c\s+/(usr/)?bin/(sh|bash)",
      r"SHELL=/(usr/)?bin/(sh|bash)\s+.{0,20}(script|less|more|man|vi|vim|env|find|awk)\b",
      r"/(usr/)?bin/(sh|bash|dash|ksh)\s+-\w*p\b",
      r"(?i)\bnmap\b.{0,60}--interactive",
      r"(?i)\bstty\s+raw\s+-echo",
      r"(?i)(^|/|\s)(sudo|doas|pkexec|runuser)\s+(-\w+\s+)*/?(usr/)?(bin/)?(sh|bash|zsh|ksh|dash)(\s|$)",
      r"(?i)(^|/|\s)sudo\s+(-\w+\s+)*su(\s|$)",
      r"(?i)(^|/|\s)sudo\s+-[a-z]*[si](\s|$)",
      r"(?i)(^|/|\s)(vi|vim|nvim|less|more|man|awk|gawk|find|gdb|ftp|tar|zip)\b.{0,80}(^|\s)!\s*/?(usr/)?(bin/)?(sh|bash)",
  ]

  SHELL_TOKEN   = r"(^|[/\s])(sh|bash|zsh|dash|ksh|csh|tcsh|ash|busybox)(\s|$)"
  PRIVESC_TOKEN = r"(^|[/\s])(sudo|su|doas|pkexec|runuser|gosu|setpriv|capsh)(\s|$)"
  INTERACTIVE   = r"(^|[/\s])(sh|bash|zsh|dash|ksh)\s+-[a-zA-Z]*[ip](\s|$)"
  EXTRA_HINTS   = [r"pty\.spawn", r"(?i)import\s+pty", r"--interactive",
                   r"(?i)stty\s+raw", r":shell"]

  RECON = [
      r"(^|[/\s])(whoami|id)(\s|$)",
      r"(?i)\bsudo\s+-l\b",
      r"/etc/(shadow|sudoers)\b",
      r"-perm\s+[-/]?[0-9]{4}\b",
      r"-perm\s+-u=s",
      r"(?i)\bgetcap\b",
      r"(?i)\bcapsh\s+--print",
  ]

  # -- pure helpers (no graph / log calls) -----------------------------------
  def to_int(s):
      if s == None:
          return 0
      if s == "":
          return 0
      return int(s)

  def short(s, n):
      if s == None:
          return ""
      if len(s) > n:
          return s[:n] + "..."
      return s

  def base_name(p):
      if p == None or p == "":
          return ""
      parts = p.split("/")
      return parts[len(parts) - 1].lower()

  def in_list(name, lst):
      for x in lst:
          if name == x:
              return True
      return False

  def payload_hit(cmd):
      if cmd == None or cmd == "":
          return ""
      for p in ESCAPE_PAYLOADS:
          m = re.find(p, cmd)
          if m != None:
              return m
      return ""

  def recon_hit(cmd):
      if cmd == None or cmd == "":
          return ""
      for p in RECON:
          m = re.find(p, cmd)
          if m != None:
              return m
      return ""

  def in_window(ts, anchor):
      d = ts - anchor
      if d < 0:
          d = -d
      return d <= WINDOW_NS

  def ev_key(e):
      return e.get("session_id", "?") + "@" + e.get("ts", "0")

  # program path of the session that spawned a row (memoised per run)
  PARENT_PROG = {}

  def parent_prog(e):
      pid = e.get("parent_session", "")
      if pid == "":
          return ""
      if pid in PARENT_PROG:
          return PARENT_PROG[pid]
      ps = session(pid)
      pp = ""
      if ps != None:
          pp = ps.get("path", "")
      PARENT_PROG[pid] = pp
      return pp

  def ev_edge(e):
      t = e.get("ts", "0")
      frm = e.get("session_id", "")
      if e.get("kind", "") == "SPAWNED":
          frm = e.get("parent_session", "")
      return {
          "from":     frm,
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", ""),
          "dir":      "out",
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
      }
  # -- relevance gate - pure string checks on meta, no traversal -------------
  def is_relevant_event():
      if meta.get("context_type", "") != "execute_process":
          return False
      cmd = meta.get("content", "")
      if cmd == "":
          return False
      if payload_hit(cmd) != "":
          return True
      if re.find(SHELL_TOKEN, cmd) != None:
          return True
      if re.find(PRIVESC_TOKEN, cmd) != None:
          return True
      for h in EXTRA_HINTS:
          if re.find(h, cmd) != None:
              return True
      return False

  def run():
      if not is_relevant_event():
          return "allow"

      now = to_int(meta.get("event_ts", "0"))
      if now == 0:
          return "allow"

      # -- anchor on the triggering session (the spawned process) ------------
      inst = session()
      if inst == None:
          return "allow"          # session not landed yet; next exec re-fires

      lineage_ = lineage(inst["id"])
      if not lineage_:
          lineage_ = [inst]

      # -- session scope: lineage + what the lineage spawned, in-window -------
      scope = {}
      for x in lineage_:
          sid = x.get("id", "")
          if sid != "":
              scope[sid] = True

      since = now - WINDOW_NS
      if since < 0:
          since = 0
      rows = events(kind="SPAWNED", since_ns=since, limit=MAX_ROWS)

      for _pass in range(3):      # rows are newest-first; settle the closure
          for e in rows:
              pp = e.get("parent_session", "")
              ap = e.get("session_id", "")
              if pp != "" and ap != "" and pp in scope:
                  scope[ap] = True

      srows = []
      for e in rows:
          if e.get("session_id", "") in scope or e.get("parent_session", "") in scope:
              srows.append(e)

      # -- REQUIRED anchor: shell-escape payload ----------------------------
      anchor_edge = None
      anchor_ts   = 0
      anchor_desc = ""
      anchor_key  = ""

      tcmd = meta.get("content", "")
      thit = payload_hit(tcmd)
      if thit != "":
          # trigger stage comes from meta (never re-queried - ingest races)
          anchor_ts   = now
          anchor_desc = "shell-escape payload executed: " + short(thit, 90)
          te = {
              "kind":           "SPAWNED",
              "session_id":     inst["id"],
              "target_id":      inst["id"],
              "program":        inst.get("path", ""),
              "parent_session": inst.get("parent", ""),
              "ts":             str(now),
              "cmdline":        short(tcmd, 200),
          }
          anchor_edge = ev_edge(te)
          anchor_key  = ev_key(te)
      else:
          for e in srows:
              h = payload_hit(e.get("cmdline", ""))
              if h == "":
                  continue
              ts = to_int(e.get("ts", "0"))
              if now - ts > WINDOW_NS:
                  continue
              anchor_ts   = ts
              anchor_desc = "shell-escape payload in session: " + short(h, 90)
              anchor_edge = ev_edge(e)
              anchor_key  = ev_key(e)
              break

      if anchor_edge == None:
          return "allow"          # no high-specificity anchor - never report

      # -- corroborating stages, session-scoped and window-clustered ---------
      stages   = []
      evidence = []

      # 1. restricted host binary spawned a shell (the escape itself)
      for e in srows:
          if ev_key(e) == anchor_key:
              continue
          if not in_window(to_int(e.get("ts", "0")), anchor_ts):
              continue
          a = base_name(e.get("program", ""))
          p = base_name(parent_prog(e))
          if in_list(a, SHELLS) and in_list(p, ESCAPE_HOSTS):
              stages.append("restricted-context escape")
              evidence.append([e, "Shell Escape",
                               p + " spawned shell " + a + ": " +
                               short(e.get("cmdline", ""), 120)])
              break

      # 2. privilege wrapper in the same session
      for e in srows:
          if ev_key(e) == anchor_key:
              continue
          if not in_window(to_int(e.get("ts", "0")), anchor_ts):
              continue
          a = base_name(e.get("program", ""))
          p = base_name(parent_prog(e))
          if in_list(a, PRIVESC) or (in_list(p, PRIVESC) and in_list(a, SHELLS)):
              stages.append("privilege wrapper")
              evidence.append([e, "Privilege Escalation",
                               "privilege wrapper in chain (" + p + " -> " + a +
                               "): " + short(e.get("cmdline", ""), 120)])
              break

      # 2b. privileged ancestor in the lineage (only if 2 did not already fire)
      if not ("privilege wrapper" in stages):
          for x in lineage_:
              if in_list(base_name(x.get("path", "")), PRIVESC):
                  stages.append("privileged ancestor")
                  xe = {"kind": "SPAWNED", "session_id": x["id"], "target_id": x["id"],
                        "parent_session": x.get("parent", ""), "ts": x.get("first_seen", "0")}
                  evidence.append([xe, "Privileged Ancestor",
                                   "escape runs under " +
                                   base_name(x.get("path", "")) +
                                   " (" + x["id"] + ")"])
                  break

      # 3. interactive / privilege-preserving shell
      for e in srows:
          if ev_key(e) == anchor_key:
              continue
          if not in_window(to_int(e.get("ts", "0")), anchor_ts):
              continue
          c = e.get("cmdline", "")
          if re.find(INTERACTIVE, c) != None:
              stages.append("interactive shell")
              evidence.append([e, "Interactive Shell",
                               "interactive/priv-preserving shell: " + short(c, 120)])
              break

      # 4. post-escalation recon - must FOLLOW the anchor
      for e in srows:
          if ev_key(e) == anchor_key:
              continue
          ts = to_int(e.get("ts", "0"))
          if ts < anchor_ts:
              continue
          if not in_window(ts, anchor_ts):
              continue
          r = recon_hit(e.get("cmdline", ""))
          if r != "":
              stages.append("post-escalation recon")
              evidence.append([e, "Post-Escalation Recon",
                               "privilege recon after escape: " + short(r, 60) +
                               " | " + short(e.get("cmdline", ""), 100)])
              break

      if len(stages) == 0:
          return "allow"          # anchor alone is not enough - stay quiet

      # -- kill chain -------------------------------------------------------
      root = lineage_[len(lineage_) - 1]
      chain = new_chain(root["id"])
      chain.append(step(anchor_edge,
                        stage_id="Shell Escape Payload",
                        stage_desc=anchor_desc))
      for ev in evidence:
          chain.append(step(ev_edge(ev[0]), stage_id=ev[1], stage_desc=ev[2]))

      names = []
      for x in lineage_:
          nm = base_name(x.get("path", ""))
          if nm == "":
              nm = x.get("id", "?")
          names.append(nm)
      lin = " <- ".join(names)

      attribution = "session-resolved"
      if len(lineage_) < 2:
          attribution = "degraded"

      reason = ("Shell escape privilege escalation - " + anchor_desc +
                "; stages: " + ", ".join(stages) +
                "; lineage: " + lin +
                " (" + inst["id"] + ", " + attribution + ")")
      print(reason)
      return {"action": "report", "reason": reason, "chain": chain}

  result = run()
