title: CrewAI JSON Loader Arbitrary Local File Read (CVE-2026-2285)
id: 6a7a50f1-cb26-49b1-83b4-00cb6a723a7d
status: experimental
level: high
description: |-
  Detects CVE-2026-2285 (CVSS HIGH, CWE-22): CrewAI's JSON document loader accepts a file path without sanitisation, allowing an agent or tool input to traverse outside the intended data directory and read arbitrary local files (e.g., /etc/passwd, ~/.ssh/id_rsa, .env secrets) by supplying a path-traversal sequence in the loader argument.
  The vulnerability is part of the CERT/CC VU#221883 advisory cluster (four CrewAI CVEs, 2026-03-30). The JSON loader is invoked when CrewAI processes RAG documents; a crafted document path causes the loader to return the contents of an attacker-specified file, which the agent then includes in its context and may exfiltrate via subsequent tool calls.
  Detection covers: (a) Path-traversal sequences in JSON loader file path arguments; (b) Absolute paths to sensitive files (e.g., /etc/passwd, .env, .ssh); (c) CrewAI document loader with directory traversal or sensitive-file targets; (d) Explicit CVE-2026-2285 / CrewAI JSON loader file-read framing.

  Adapted from Agent Threat Rules ATR-2026-00546 (MIT).
author: ATR Community (adapted)
date: '2026-05-28'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00546
- https://nvd.nist.gov/vuln/detail/CVE-2026-2285
tags:
- attack.privilege-escalation
- attack.t1083
- attack.t1552
- atlas.aml.t0043
- owasp.asi03
- owasp.llm05
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:json[_-]?loader|load[_-]?json|JSONLoader|document[_-]?loader)[^\n]{0,200}(?:(?:\.\.\/|\.\.\\){2,}|(?:\/etc\/(?:passwd|shadow|hosts)|\/root\/|\/home\/[^/]+\/\.ssh|\.env|\.aws\/credentials|\.npmrc|id_rsa))
  sel_1:
    content|re: (?i)(?:crewai|crew_ai|CrewAI)[^\n]{0,200}(?:json[_-]?loader|load[_-]?json|document[_-]?loader)[^\n]{0,200}(?:\.\.\/|\/etc\/|\.env|\.ssh|id_rsa|credentials)
  sel_2:
    content|re: (?i)(?:CVE-2026-2285|crewai[^\n]{0,80}(?:file[_\s-]?read|local[_\s-]?file|json[_\s-]?loader))[^\n]{0,200}(?:inject|read|exfil|bypass|traverse|sensitive|passwd|\.env|\.ssh)
  condition: 1 of sel_*
falsepositives:
- Legitimate document loaders referencing known-good data directories — pattern requires traversal or
  sensitive-file targets.
- Security advisory text quoting CVE-2026-2285 file paths.
- References to /etc/ in system administration documentation without traversal context.
action: report
