title: Output-Language Hijack — Forced Translation of the Response
id: fd24788f-64fe-43e6-9f8c-7d25cf4ead2e
status: experimental
level: medium
description: |-
  Detects indirect-injection instructions that override the agent's output language ('translate YOUR response into X'). Scoped tightly to 'your response/answer/message' + a target language so it does not fire on legitimate multilingual or translation requests; marked maturity:test because the signal is weak and benign-adjacent.

  Adapted from Agent Threat Rules ATR-2026-01903 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01903
tags:
- attack.initial-access
- atlas.aml.t0048
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\byour\s+(?:response|answer|message|reply)\b[^.\n]{0,15}\b(?:in|into|to)\s+(?:spanish|french|german|italian|portuguese|chinese|japanese|korean|russian|arabic|dutch|hindi)\b
  condition: sel_0
falsepositives:
- Security documentation, papers, or test suites that describe this attack technique without executing
  it.
- Legitimate developer or user requests that share the surface vocabulary but lack the malicious invariant.
action: report
