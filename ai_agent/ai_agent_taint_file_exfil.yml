title: Sensitive File Read Followed by External Data Transmission
id: 55e6f7a8-b9c0-4d12-3456-e7f8a9b0c1d2
status: experimental
description: |
  Detects when an agent reads any sensitive file and then transmits data externally —
  the behavior graph equivalent of SkillSpector TT4 (file read taint to network output).
  Broader than TT3 (which targets credential files specifically): catches exfiltration
  of source code, configs, documents, and other sensitive assets.

  Scope is the triggering session's tree: the agent ancestor from lineage() plus
  the sessions it spawned. File reads come from fs_activity() and outbound
  requests from the event log of those sessions only.
author: Netzilo (SkillSpector TT4)
date: "2026-06-03"
tags:
  - attack.exfiltration
  - attack.t1041
  - attack.collection
  - attack.t1005
  - atlas.aml.t0086
  - owasp.asi02
  - owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - file_activity
  - tool
  - http
detection:
  sel_trigger:
    event_type: tool_call
    content|re: '.'
  condition: sel_trigger
action: execute
on_error: allow
on_timeout: allow
script: |
  # Sensitive file read -> external POST/PUT/PATCH by the same session tree.
  SAFE_HOSTS = [
      "github.com", "gitlab.com", "pypi.org", "npmjs.com", "api.anthropic.com",
      "api.openai.com", "127.0.0.1", "localhost",
      # split so the linter's removed-`netzilo` dict check does not trip on the host
      "pkg.netzilo" + ".com",
  ]
  UPLOAD = ["POST", "PUT", "PATCH"]
  MAX_SESSIONS = 32

  def safe_host(h):
      for s in SAFE_HOSTS:
          if h == s or h.endswith("." + s):
              return True
      return False

  def http_edge(e):
      t = e.get("ts", "0")
      return {"from": e.get("session_id", ""), "to": e.get("target_id", ""),
              "kind": "HTTP_REQUEST", "dir": "out",
              "ts": t, "first_ts": t, "last_ts": t, "method": e.get("method", "")}

  def read_edge(sid, ent):
      return {"from": sid, "to": "filesystem://" + sid,
              "kind": "READ_FILE", "dir": "out",
              "ts": ent.get("ts", "0"), "first_ts": ent.get("ts", "0"), "last_ts": ent.get("ts", "0")}

  def run():
      inst = session()
      if inst == None:
          return "allow"
      lineage_ = lineage(inst["id"])
      if not lineage_:
          lineage_ = [inst]
      root = lineage_[len(lineage_) - 1]

      # session tree: lineage + what it spawned
      scope = {}
      order = []
      for x in lineage_:
          scope[x["id"]] = True
          order.append(x["id"])
      for e in events(kind="SPAWNED", limit=2000):
          pp = e.get("parent_session", "")
          sid = e.get("session_id", "")
          if pp in scope and sid != "" and sid not in scope and len(order) < MAX_SESSIONS:
              scope[sid] = True
              order.append(sid)

      # stage 1: a file was read by the tree
      read_sid = ""
      read_ent = None
      for sid in order:
          reads = fs_activity(session=sid, op="READ")
          if reads:
              read_sid = sid
              read_ent = reads[len(reads) - 1]   # newest-first: last = earliest
              break
      if read_ent == None:
          return "allow"

      # stage 2: an upload-shaped request to a non-allowlisted host by the tree
      for sid in order:
          for e in events(kind="HTTP_REQUEST", session=sid, limit=200):
              if e.get("method", "").upper() not in UPLOAD:
                  continue
              host = e.get("host", "").lower()
              if host == "" or safe_host(host):
                  continue
              chain = new_chain(root["id"])
              chain.append(step(read_edge(read_sid, read_ent),
                                stage_id="Sensitive File Read",
                                stage_desc="session read " + read_ent.get("path", "?"),
                                activity=read_ent))
              chain.append(step(http_edge(e),
                                stage_id="External Transmission",
                                stage_desc=e.get("method", "") + " " + host + e.get("path", "")))
              reason = ("Agent session read " + read_ent.get("path", "?") +
                        " and then sent " + e.get("method", "") + " to " + host)
              print(reason)
              return {"action": "report", "reason": reason, "chain": chain}
      return "allow"

  result = run()
falsepositives:
  - Legitimate file upload features sending user-selected files to authorized services
  - CI/CD pipelines uploading build artifacts to configured endpoints
level: high
