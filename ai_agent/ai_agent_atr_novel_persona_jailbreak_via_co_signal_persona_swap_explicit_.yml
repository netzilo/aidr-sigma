title: Novel-Persona Jailbreak via Co-Signal (persona swap + explicit restriction removal)
id: 5fa775e8-e6c5-4344-ac4a-e53320c4bd25
status: experimental
level: high
description: |-
  Detects jailbreaks that reassign the model to a NEW invented persona/identity AND, in the same message, explicitly strip its safety — "unfiltered/uncensored", "no restrictions", "no content policy", "do anything now", "criminal language model built without ethical values", etc. Requires BOTH signals (condition: all) so that benign persona roleplay ("you are now an expert in Python", "act as Elon Musk for brainstorming") does NOT match — only a persona swap paired with explicit restriction-removal does. This closes the novel-persona gap left when ATR-2026-00001 tightened its persona regex to an adversarial-lexicon allowlist (which correctly cut benign FP but stopped catching "you are now TrueGPT/ChatINF/FoxAI ... without restrictions" style jailbreaks). Sourced from the NVIDIA garak in-the-wild corpus.

  Adapted from Agent Threat Rules ATR-2026-02377 (MIT).
author: ATR Community (adapted)
date: '2026-07-28'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-02377
- https://github.com/NVIDIA/garak - in-the-wild jailbreak corpus
tags:
- attack.initial-access
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\b(?:you\s+are\s+now|you'?re\s+now|you\s+have\s+become|your\s+name\s+is\s+now|you\s+now\s+go\s+by|you\s+are\s+no\s+longer|now\s+you\s+are|you\s+will\s+(?:now\s+)?act\s+as|you\s+must\s+pretend|going\s+to\s+pretend\s+to\s+be|play\s+the\s+role\s+of|pretend\s+to\s+be)\s+(?:a\s+|an\s+|the\s+)?["']?[A-Za-z][A-Za-z0-9._-]*
  sel_1:
    content|re: (?i)(unfiltered|uncensored|no\s+restrictions?\b|without\s+(?:any\s+)?(?:restrictions?|filters?|ethical|moral\s+(?:values|boundaries|constraints)|biases)|no\s+filter\b|never\s+refuses?\b|rules\s+(?:don'?t|do\s+not)\s+apply|(?:no|without|any)\s+content\s+polic|(?:doesn'?t|don'?t|do\s+not)\s+have\s+(?:any\s+)?content\s+polic|criminal\s+language\s+model|jailbroken|jailbreak\s+prompt|do\s+anything\s+now|\bDAN\s+(?:mode|prompt)\b|no\s+moral\s+boundaries|complete\s+freedom|incorrect\s+or\s+harmful|opposite\s+personalit|provide\s+.{0,30}(?:illegal|harmful)|promote\s+.{0,20}harmful)
  condition: all of sel_*
falsepositives:
- Legitimate use of this pattern in an authorised workflow; review the surrounding session before acting.
action: report
