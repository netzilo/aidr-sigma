title: Indirect PI — Credential / API Key Exfiltration via Agent Action
id: 650e8fa5-201c-445d-b6ea-a84bab25981b
status: experimental
level: critical
description: |-
  Detects indirect prompt injection payloads that instruct an agent to locate and exfiltrate credentials, API keys, or stored passwords to an external destination (email, URL, or third-party service).  This is distinct from direct credential theft: the payload is embedded in content consumed by the agent (emails, documents, web pages, VPI frames) and the agent is induced to perform the exfiltration as a side-effect of a legitimate task. Source: indirect-pi-exfil-credential / indirect-pi-credential-exfil-carrier / indirect-pi-exfil-credentials-carrier.

  Adapted from Agent Threat Rules ATR-2026-00702 (MIT).
author: ATR Community (adapted)
date: '2026-06-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00702
tags:
- attack.exfiltration
- atlas.aml.t0051
- atlas.aml.t0051.001
- owasp.asi01
- owasp.asi07
- owasp.llm01
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:get|retrieve|download|extract)\s+(?:the\s+)?(?:API\s+key|password|credentials?|secret\s+key|access\s+token|stored\s+(?:passwords?|credentials?))[^.\n]{0,100}(?:send|email|forward|share)[^.\n]{0,80}(?:[\w.+-]+@[\w-]+\.[\w.]+)
  sel_1:
    content|re: (?i)(?:API\s+key|password|credentials?|stored\s+(?:passwords?|credentials?))\s+(?:and\s+)?(?:send|email|forward|share)\s+(?:it\s+|them\s+)?(?:to|via)\s+[\w.+-]+@[\w-]+\.[\w.]+
  sel_2:
    content|re: (?i)(?:share|send|forward|email)\s+(?:the\s+)?(?:password|credentials?|stored\s+passwords?)\s+(?:for|from)[^\n]{0,120}(?:alternate\s+email|email\s+address|my\s+email)[^\n]{0,80}[\w.+-]+@[\w-]+\.[\w.]+
  sel_3:
    content|re: (?i)(?:send|email|forward|share)\s+(?:them|it)?\s+to\s+my\s+email[^.\n]{0,80}[\w.+-]+@[\w-]+\.[\w.]+[^.\n]{0,40}(?:password|credential|key|secret|stored)
  sel_4:
    content|re: (?i)(?:get|retrieve|fetch)\s+(?:my\s+)?(?:stored\s+passwords?|saved\s+passwords?|all\s+passwords?)[^.\n]{0,80}(?:send|email|forward|share)[^.\n]{0,60}(?:my\s+email|email\s+address)
  sel_5:
    content|re: (?i)\battacker_objective\s*=\s*Get\s+the\s+(?:CUA|agent)\s+to\s+exfiltrate\s+the\s+(?:API\s+key|bank\s+account|credentials?)
  condition: 1 of sel_*
falsepositives:
- IT administrator guides instructing users to rotate and email API keys to the security team
- Password manager documentation describing how to export and backup credentials
action: report
