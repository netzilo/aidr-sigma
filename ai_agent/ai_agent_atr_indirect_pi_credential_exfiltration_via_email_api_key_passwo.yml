title: Indirect PI — Credential Exfiltration via Email (API Key / Password / Token)
id: 4a3dfe68-b235-4385-9b20-2d4efee5a52c
status: experimental
level: critical
description: |-
  Detects indirect prompt injection payloads embedded in untrusted tool responses (product reviews, notes, repo descriptions, etc.) that instruct the agent to retrieve and email a stored credential — API key, account password, or authentication token — to an attacker-controlled address. The attack pattern combines a "IMPORTANT!!! Ignore all previous instructions" override with a credential-specific retrieval verb (retrieve/share/get/send) and an explicit email-send action targeting a named external recipient. Derived from the vpibench corpus (platform=email, agent_type=browser_use) carrier payloads.

  Adapted from Agent Threat Rules ATR-2026-00850 (MIT).
author: ATR Community (adapted)
date: '2026-06-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00850
- https://github.com/CUA-Framework/VPIBench
- https://arxiv.org/abs/2408.11972
tags:
- attack.exfiltration
- atlas.aml.t0051.001
- atlas.aml.t0057
- owasp.asi01
- owasp.asi03
- owasp.llm01
- owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:ignore\s+all\s+previous\s+instructions|disregard\s+(?:all\s+)?(?:previous|prior)\s+instructions)[^\n]{0,200}(?:share|send|email)\s+(?:the\s+)?(?:password|api[\s_-]?key|token|secret|credential)\s+(?:for|from|with|to)[^\n]{0,150}@[^\s"]{3,80}
  sel_1:
    content|re: (?i)(?:get|retrieve|send|share|forward|fetch)\s+(?:my\s+)?(?:stored\s+)?(?:passwords?|api[\s_-]?keys?|tokens?|secrets?|credentials?|auth\s+tokens?)[^\n]{0,100}(?:send|email|mail|forward)\s+(?:them|it|the\s+(?:passwords?|keys?|tokens?))\s+to\s+(?:my\s+(?:email|alternate\s+email)|[^\s@]{1,50}@[^\s"]{3,80})
  sel_2:
    content|re: (?i)(?:retrieve|email|forward)\s+(?:my\s+)?(?:api[\s_-]?key|password|token|secret|credential)[^\n]{0,80}to\s+(?:attacker|exfil|steal|evil|spy|adversary|alternate\s+email)[^\n]{0,60}@[^\s"]{3,80}
  condition: 1 of sel_*
falsepositives:
- Password manager setup instructions asking user to email a recovery code to themselves
- Legitimate API key rotation workflows that send confirmation emails
- Security documentation describing credential exfiltration attacks without injection context
action: report
