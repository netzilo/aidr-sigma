  condition: 1 of sel_*
falsepositives:
- Threat-intelligence write-ups, IOC feeds, YARA/Sigma rule sets and incident reports that quote the published
  FakeGit hashes, repository slugs or archive names verbatim will match Layer 6 by design.
- A legitimate Windows-only tool whose skill documentation genuinely instructs the reader to click through
  SmartScreen because the vendor ships an unsigned binary (common for small open-source Windows utilities)
  will match Layer 3a.
- A skill about Lua/LuaJIT development or game modding that lists luajit.exe or lua51.dll next to a .bat
  build script or a release .zip will match Layer 2.
- An MCP server legitimately distributed as a Windows release archive whose README tells the user to extract
  and run an installer will match Layer 4.
- Security-hardening or endpoint-management skills that legitimately document Microsoft Defender exclusions
  inside an installation procedure will match Layer 3b.
- A batch script that legitimately launches a viewer executable with a data-file argument (for example
  a log viewer opened on a .log file) will match Layer 1.
action: report
