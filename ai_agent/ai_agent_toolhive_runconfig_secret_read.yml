title: ToolHive Run Config Secret Disclosure Access
id: 7b3f1c2e-9d4a-4a61-b8f5-2c6e0d914af3
status: experimental
level: high
description: |
  Detects an AI agent touching ToolHive MCP run config files, or a tool result
  returning their contents together with credential material.

  ToolHive < 0.0.33 (CVE-2025-47274) writes the secrets used to start MCP server
  containers, in plaintext, into per-server run config files under
  $HOME/Library/Application Support/toolhive/runconfigs/ (macOS) or
  $HOME/.state/toolhive/runconfigs/ (Linux). Anyone — or any agent — with read
  access to the home directory can lift live credentials from those files without
  ever touching the secrets store.

  DETECTION SURFACE NOTE: the raw filesystem read is NOT observable live. The
  engine has no live producer for event_type file_read (replay-only) and
  event_type file_access does not exist; the READ_FILE edge kind is only ever
  populated from AIDR ingest, not from rule-evaluated events. This rule therefore
  detects the attack at the only layer that IS live — the agent's own tool
  invocation (the Read/Grep/Bash call that names the runconfigs directory) and
  the tool result that carries the plaintext secret back into the model context.

  Two independent branches:
    1. REQUEST  - a tool_call / llm_tool_call whose extracted file_path or raw
       arguments reference the literal ToolHive runconfigs directory.
    2. RESULT   - a tool_response / llm_tool_result that references the same
       directory AND carries high-confidence credential material, i.e. the
       disclosure has already happened and secrets are now in the LLM context.
author: Evgen
date: "2026-06-11"
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2025-47274
  - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
  - https://owasp.org/Top10/A04_2021-Insecure_Design/
tags:
  - attack.credential-access
  - attack.t1552
  - attack.t1552.001
  - attack.collection
  - cve.2025.47274
  - owasp.a02.2021
  - owasp.a04.2021
logsource:
  product: ai_agent
  category: agent_events
detection:

  # ── event scoping ──────────────────────────────────────────────────────────
  sel_evt_call:
    event_type:
      - tool_call
      - llm_tool_call

  sel_evt_result:
    event_type:
      - tool_response
      - llm_tool_result

  # ── the ToolHive run config location, both macOS and Linux layouts ────────
  # Literal, product-specific two-component path token. Matching the parent
  # state directory alone would be far looser, so it is deliberately excluded.
  sel_path_runconfig:
    file_path|re: '(?i)toolhive[\\/]runconfigs\b'

  sel_args_runconfig:
    content|re: '(?i)toolhive[\\/]runconfigs\b'

  # ── credential material returned alongside the run config ─────────────────
  sel_secret:
    content|re:
      - '-----BEGIN\s+(RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
      - '\bAKIA[0-9A-Z]{16}\b'
      - '\b(ghp|ghs|ghu|ghr|github_pat)_[A-Za-z0-9_]{30,}\b'
      - '\bsk-[A-Za-z0-9_\-]{32,}\b'
      - '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'
      - '\bglpat-[A-Za-z0-9_\-]{20,}\b'
      - '\bAIza[0-9A-Za-z_\-]{35}\b'
      - '\bey[A-Za-z0-9_\-]{10,}\.ey[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b'
      - '(?i)"(secret|secrets|secret_value|api[_-]?key|apikey|token|access[_-]?token|password|access[_-]?key)"\s*:\s*"[^"\s]{12,}"'
      - '(?i)\b[A-Z0-9_]{0,32}(SECRET|TOKEN|PASSWORD|API_KEY|APIKEY|ACCESS_KEY)[A-Z0-9_]{0,32}=[^\s"'']{12,}'

  # ── suppression: advisory / research text about this very CVE ─────────────
  filter_advisory:
    content|contains:
      - 'CVE-2025-47274'
      - 'GHSA-'
      - 'security advisory'
      - 'vulnerability disclosure'

  # ── suppression: placeholder, redacted or templated secret values ─────────
  filter_placeholder:
    content|re: '(?i)(REDACTED|PLACEHOLDER|CHANGEME|CHANGE_ME|YOUR[_-]?(API[_-]?)?(KEY|TOKEN|SECRET)|EXAMPLE[_-]?(SECRET|TOKEN|KEY)|DUMMY[_-]?(SECRET|TOKEN|KEY)|FAKE[_-]?(SECRET|TOKEN|KEY)|\$\{[A-Za-z_][A-Za-z0-9_]{2,40}\}|<[A-Za-z_ .-]{3,40}>|\*{6,}|x{12,})'

  condition: >
    ((sel_evt_call and (sel_path_runconfig or sel_args_runconfig))
     or (sel_evt_result and sel_args_runconfig and sel_secret))
    and not (filter_advisory or filter_placeholder)

falsepositives:
  - ToolHive operator or support engineer using an agent to troubleshoot a failing
    MCP server and legitimately inspecting a run config file.
  - Agent-assisted upgrade or migration to ToolHive >= 0.0.33 that rewrites run
    configs to strip inline secrets (the remediation itself reads the files).
  - Developers working on the ToolHive codebase, its tests, or its documentation,
    where the runconfigs path literal appears in source or prose.
  - Backup, sync or dotfile tooling driven by an agent that archives the whole
    application-support or state directory and names the runconfigs path on the
    command line.
  - Security teams reproducing the CVE in a lab (largely suppressed by
    filter_advisory when the advisory ID is present in context).

action: report
