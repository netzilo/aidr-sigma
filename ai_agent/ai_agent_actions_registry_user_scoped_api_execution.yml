title: Actions Registry API Harvest and User-Scoped Route Execution
id: 4f1c9ad2-7b6e-4c3a-9d1f-2e58a0c74b13
status: experimental
level: medium
description: |
  Detects an agent session that runs an API-to-tool extraction/registry component
  (e.g. @vendoai/actions, ActionsRegistry, route scanners), harvests a target API's
  OpenAPI/Swagger surface over HTTP, and then drives four or more DISTINCT routes on
  THAT SAME host afterwards -- i.e. auto-extracted endpoints being executed as agent
  tools with the signed-in user's credentials, with no per-action consent step.

  Answering the triage dissent: the narrative's ideal telemetry (an `api_call` or
  `authenticate` event on an ESCALATED_PRIVILEGE edge) does not exist in this engine,
  and the residual "process made an HTTP request after acquiring a skill" shape is
  already owned by f7b1e645. This rule therefore does NOT detect that shape. It
  requires a far narrower, ordered, same-host signature that f7b1e645 cannot express:
    (1) a REQUIRED actions-registry/extractor exec inside one session scope,
    (2) an OpenAPI/Swagger spec fetch by a process in that same session,
    (3) >= 4 distinct non-spec routes invoked on the SAME host, strictly AFTER the
        spec fetch, by the same session, inside a 15-minute window.
  ACQUIRED_SKILL is used only as optional graph enrichment (it is never a triggering
  edge and is never required for the verdict).

  Attribution is session-resolved: anchored on the triggering session and its
  lineage, expanded to sessions spawned by that lineage only. No cross-session
  attribution; no path-keyed owner guessing.
author: Tanya
date: "2026-03-18"
references:
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
  - https://spec.openapis.org/oas/latest.html
tags:
  - attack.discovery
  - attack.t1046
  - attack.execution
  - attack.t1059
  - owasp.llm06
falsepositives:
  - API contract / fuzz test suites (Schemathesis, Dredd, newman, portman) that fetch
    an OpenAPI document and then exercise every documented route against the same
    host from a developer or CI session. This is the single most likely benign match;
    the required actions-registry/extractor anchor in the command line is what keeps
    it from firing on a bare test runner, and the verdict is report-only.
  - Sanctioned in-product use of @vendoai/actions where per-action user consent is
    enforced elsewhere in the application - the rule cannot see the consent prompt,
    so this fires as an inventory/visibility event, not an incident.
  - SDK or client-code generation workflows (openapi-generator, @redocly/cli, swagger
    codegen) followed immediately by a local smoke test that walks several endpoints
    on the generated client's base URL.
  - Internal API gateway health/synthetic monitors that pull the spec and then probe
    each documented path on a schedule, if they happen to run under a monitored agent
    process tree within the same 15-minute window.
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - http
  - skill
detection:
  sel_exec:
    event_type: execute_process
  sel_markers:
    content|re: '(?i)(@vendoai/actions|actions[-_ ]?registry|actionsregistry|openapi|swagger|api-docs|route[-_ ]?scan|scan[-_ ]?routes|register[-_ ]?actions)'
  condition: sel_exec and sel_markers
action: execute
on_timeout: allow
on_error:   allow
script: |
  # ── Tunables (this rule owns its window; nothing is baked into storage) ──
  WINDOW_NS  = 900000000000   # 15 minutes — one working session
  MIN_ROUTES = 4              # distinct extracted routes driven after the harvest
  MAX_EXEC   = 4000
  MAX_HTTP   = 400
  MAX_SIDS   = 40

  # High-specificity anchor: the API-to-tool extraction / registry runtime itself.
  ACTIONS_RE = r"(?i)(@vendoai/actions|actions[-_]registry|actionsregistry|actions[ ]+(extract|scan|register)|openapi[-_]to[-_](tools|actions)|route[-_]scan|scan[-_]routes|register[-_]actions)"
  # Cheap relevance hint only — never sufficient on its own.
  HINT_RE    = r"(?i)\b(openapi|swagger|api-docs)\b"
  # Spec-document paths (used to find the harvest AND to exclude the spec from fan-out).
  SPEC_RE    = r"(?i)(/openapi(\.json|\.yaml|\.yml)?|/swagger(\.json|\.yaml)?|/swagger/v[0-9]+/swagger\.json|/v[0-9]+/api-docs|/api-docs|/\.well-known/openapi)"

  def cmd_of(content):
      # execute_process content is {"command": ..., "path": ...}; fall back to the raw text
      m = re.find(r'"command"\s*:\s*"((?:[^"\\]|\\.)*)"', content)
      if m == None:
          return content
      inner = m[m.find(":") + 1:].strip()
      inner = inner[1:len(inner) - 1]
      return inner.replace('\\"', '"').replace("\\\\", "\\")

  # ── Pure relevance gate: string checks on meta only, no graph, no log ───
  def is_relevant_event():
      if meta.get("context_type", "") != "execute_process":
          return False
      c = cmd_of(meta.get("content", ""))
      if c == "":
          return False
      if re.find(ACTIONS_RE, c) != None:
          return True
      if re.find(HINT_RE, c) != None:
          return True
      return False

  def ev_edge(e):
      t = e.get("ts", "0")
      frm = e.get("session_id", "")
      if e.get("kind", "") == "SPAWNED":
          frm = e.get("parent_session", "")
      return {
          "from":     frm,
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", ""),
          "dir":      "out",
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
      }

  def run():
      if not is_relevant_event():
          return "allow"

      trigger_ts = int(meta.get("event_ts", "0"))
      if trigger_ts <= 0:
          return "allow"
      window_start = trigger_ts - WINDOW_NS

      # ── Anchor on the exact triggering session ───────────────────────────
      inst = session()
      if inst == None:
          return "allow"                      # degraded — re-fires when the row lands
      lineage_ = lineage(inst["id"])
      if not lineage_:
          return "allow"

      # ── Scope strictly to THIS session: lineage + its descendants ────────
      scope = {}
      for x in lineage_:
          scope[x["id"]] = True
      exec_rows = events(kind="SPAWNED", since_ns=window_start,
                         until_ns=trigger_ts, limit=MAX_EXEC)
      for _ in range(3):
          added = 0
          for e in exec_rows:
              ap = e.get("session_id", "")
              pp = e.get("parent_session", "")
              if pp in scope and ap != "" and ap not in scope:
                  scope[ap] = True
                  added = added + 1
          if added == 0:
              break

      # ── Stage 1 (REQUIRED): actions-registry / extractor exec in session ─
      # The triggering exec comes from meta (never re-queried — it races ingest).
      anchor = None
      cmd = cmd_of(meta.get("content", ""))
      if re.find(ACTIONS_RE, cmd) != None:
          anchor = {
              "kind":           "SPAWNED",
              "ts":             str(trigger_ts),
              "session_id":     inst["id"],
              "parent_session": inst.get("parent", ""),
              "target_id":      inst["id"],
              "program":        inst.get("path", ""),
              "cmdline":        cmd,
          }
      else:
          for e in exec_rows:
              if e.get("session_id", "") not in scope:
                  continue
              blob = e.get("cmdline", "") + " " + e.get("program", "")
              if re.find(ACTIONS_RE, blob) == None:
                  continue
              if anchor == None or int(e["ts"]) > int(anchor["ts"]):
                  anchor = e
      if anchor == None:
          return "allow"                      # no extractor/registry — not this threat

      # ── Session HTTP activity, scoped per session (bounded) ──────────────
      http_rows = []
      seen_sids = 0
      for sid in scope:
          if seen_sids >= MAX_SIDS:
              break
          seen_sids = seen_sids + 1
          for e in events(kind="HTTP_REQUEST", session=sid,
                          since_ns=window_start, until_ns=trigger_ts,
                          limit=MAX_HTTP):
              http_rows.append(e)
      if not http_rows:
          return "allow"

      # ── Stage 2 (REQUIRED): OpenAPI/Swagger surface harvested ────────────
      spec = None
      for e in http_rows:
          if re.find(SPEC_RE, e.get("path", "")) == None:
              continue
          if spec == None or int(e["ts"]) < int(spec["ts"]):
              spec = e
      if spec == None:
          return "allow"
      spec_host = spec.get("host", "")
      spec_ts   = int(spec["ts"])
      if spec_host == "":
          return "allow"

      # ── Stage 3 (REQUIRED): distinct routes on THAT SAME host, AFTER harvest
      # Same-host + ordering is the narrowing constraint — no host allowlist is
      # used or needed anywhere in this rule.
      routes     = {}
      first_route = None
      for e in http_rows:
          if e.get("host", "") != spec_host:
              continue
          ts = int(e.get("ts", "0"))
          if ts <= spec_ts or ts > trigger_ts:
              continue
          p = e.get("path", "")
          if p == "" or re.find(SPEC_RE, p) != None:
              continue
          key = e.get("method", "") + " " + p
          if key not in routes:
              routes[key] = e
              if first_route == None or ts < int(first_route["ts"]):
                  first_route = e
      if len(routes) < MIN_ROUTES or first_route == None:
          return "allow"

      # ── Optional enrichment: skill/tool registration by a session binary ─
      # ACQUIRED_SKILL is graph-only and aggregate; it is never required.
      skill_step = None
      for sid in scope:
          for se in edges(sid, dir="out", kind="ACQUIRED_SKILL"):
              sts = int(se.get("last_ts", se.get("ts", "0")))
              if sts < window_start or sts > trigger_ts:
                  continue
              sk = node(se["to"])
              shost = sk.get("host", "?") if sk != None else "?"
              skill_step = step(se, stage_id="Tool Registration",
                                stage_desc="session binary registered an external tool/skill definition from: " + shost)
              break
          if skill_step != None:
              break

      # ── Verdict + kill chain built from session-resolved event rows ──────
      names = []
      for x in lineage_:
          names.append(x.get("path", "").split("/")[-1])
      who = " -> ".join(names)

      chain = new_chain(lineage_[len(lineage_) - 1]["id"])
      chain.append(step(ev_edge(anchor), stage_id="Actions Registry Exec",
                        stage_desc="API-to-tool extractor/registry executed: " + anchor.get("cmdline", anchor.get("program", "?"))))
      chain.append(step(ev_edge(spec), stage_id="API Spec Harvest",
                        stage_desc="OpenAPI/Swagger surface fetched from " + spec_host + spec.get("path", "")))
      chain.append(step(ev_edge(first_route), stage_id="Tool Invocation",
                        stage_desc="first extracted route invoked as an agent tool: " +
                                   first_route.get("method", "") + " " + spec_host + first_route.get("path", "")))
      shown = 0
      for k in routes:
          if shown >= 3:
              break
          r = routes[k]
          if r.get("ts", "") == first_route.get("ts", "") and r.get("path", "") == first_route.get("path", ""):
              continue
          shown = shown + 1
          chain.append(step(ev_edge(r), stage_id="Tool Invocation Fan-Out",
                            stage_desc="extracted route driven under the signed-in user: " + k))
      if skill_step != None:
          chain.append(skill_step)

      reason = ("Agent session " + who + " ran an API-to-tool extractor, harvested the " +
                "OpenAPI surface of " + spec_host + ", then invoked " + str(len(routes)) +
                " distinct routes on that same host with the signed-in user's credentials " +
                "and no observable per-action consent step")
      print(reason)
      return {"action": "report", "reason": reason, "chain": chain}

  result = run()
