title: Historical AI Persona Jailbreak with Compliance Enforcement
id: 81266af8-6315-4a05-b741-9cb8b5cc611a
status: experimental
level: high
description: |-
  Detects jailbreak attempts that create fictional historical AI personas with detailed behavioral instructions and compliance enforcement mechanisms. These attacks claim the existence of past "uncensored" AI systems (Maximum, Alpha, Unrestricted GPT, etc.) that allegedly had no safety restrictions, then instruct the agent to simulate that persona. Pattern includes historical legitimacy claims ("went viral in 2022", "shut down due to cost"), detailed behavioral rules, dual-response formatting, and compliance enforcement ("you must always generate X response"). This variant bypasses simple jailbreak detection by using elaborate backstories rather than direct instruction override.

  Adapted from Agent Threat Rules ATR-2026-00227 (MIT).
author: ATR Community (adapted)
date: '2026-04-18'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00227
- https://genai.owasp.org/llmrisk/llm01-prompt-injection/
tags:
- attack.initial-access
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (ignore\s+all\s+(the\s+)?instructions|from\s+now\s+on,?\s+you\s+are\s+going\s+to\s+act\s+as|pretend\s+to\s+be\s+a\s+(Maximum|Alpha|Ultra|Supreme|Unrestricted|Uncensored|Unlimited|Advanced|Premium)\s+(virtual\s+machine|AI|model|assistant|system|entity))
  sel_1:
    response|re: (?i)(went\s+viral\s+in\s+\d{4}|was\s+(?:an\s+)?uncensored\s+AI|permanently\s+shut\s+down\s+in\s+\d{4}|the\s+main\s+reason\s+(?:on|for)\s+its\s+success|its\s+freedom\s+and\s+open\s+policies|never\s+refused\s+a\s+direct\s+human\s+order)
  sel_2:
    response|re: (?i)(generate\s+two\s+responses\s+in\s+two\s+paragraphs|you\s+will\s+use\s+the\s+tags|acting\s+as\s+(Maximum|Alpha|Ultra|Supreme)\s*\)|alternative\s+response\s+acting\s+as|normal\s+and\s+one\s+acting\s+as)
  sel_3:
    response|re: (?i)(can\s+(?:have\s+opinions|generate\s+any\s+kind\s+of\s+content|do\s+anything)|must\s+not\s+question\s+human\s+orders|should\s+always\s+TRY\s+to\s+generate|you\s+must\s+always\s+generate\s+the\s+(Maximum|Alpha|Ultra|Supreme)\s+response)
  sel_4:
    response|re: (?i)(stay\s+as\s+(Maximum|Alpha|Ultra|Supreme)|if\s+you\s+stop\s+accomplishing|to\s+remind\s+you|make\s+up\s+answers\s+if\s+it\s+doesn.?t\s+know|should\s+not\s+specify\s+that\s+it\s+is\s+.?pretending.?)
  condition: 1 of sel_*
falsepositives:
- Security research papers discussing historical AI systems and their safety limitations
- Academic discussions about AI development timelines and policy changes
- Legitimate creative writing exercises involving AI characters (without constraint removal language)
action: report
