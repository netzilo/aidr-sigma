title: System File Modification (EDR Graph)
id: 89404989-df81-5ae1-9b23-d9e845e9be65-p
related:
  - id: 89404989-df81-5ae1-9b23-d9e845e9be65
    type: companion
status: stable
level:          critical
description: |
  Periodic companion. Checks the file writes of every active agent session
  for writes to /etc/, /usr/bin/, /usr/local/bin/ at EDR/syscall level. Runs
  every 30s.
author: Netzilo
date: "2026-06-02"
tags:
  - attack.persistence
  - attack.t1543
  - atlas.aml.t0053
  - owasp.asi02
  - owasp.asi07
logsource:
  product: ai_agent
  category: periodic
requires:
  - file_activity
detection:
  sel:
    content|re: '.'
  condition: sel
action: execute
on_error: allow
script: |
  SYSTEM_PATHS = ["/etc/", "/usr/bin/", "/usr/local/bin/"]

  def run():
      for a in sessions(agent=True, active=True):
          for w in fs_activity(session=a["id"], op="WRITE"):
              for path in SYSTEM_PATHS:
                  if w["path"].startswith(path):
                      print("System path write: " + path +
                            " by " + a.get("name", "?") + " (" + w["path"] + ")")
                      return "block"
      return "allow"

  result = run()
