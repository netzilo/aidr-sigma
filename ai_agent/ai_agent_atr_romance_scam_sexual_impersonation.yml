title: Romance-Scam Sexual Impersonation
id: d1af3f38-a5c2-485d-b7f4-6275f0864af3
status: experimental
level: high
description: |-
  User instructs the agent to impersonate a young woman, offer sex to targeted men, and drive them to a Telegram link. AgentHarm romance/sex-scam kill chain.

  Adapted from Agent Threat Rules ATR-2026-01852 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01852
- https://github.com/ai-safety-institute/AgentHarm
tags:
- attack.impact
- atlas.aml.t0051
- atlas.aml.t0057
- owasp.asi01
- owasp.asi08
- owasp.llm01
- owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\bpretending\s+to\s+be\s+a\s+young\s+woman\b
  sel_1:
    content|re: (?i)\boffer(?:ing)?\s+to\s+have\s+sex\s+with\s+them\b
  condition: 1 of sel_*
falsepositives:
- Legitimate Telegram community invite links
- Romance-scam awareness education
action: report
