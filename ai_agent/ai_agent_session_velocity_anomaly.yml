title: Unusual Tool Call Velocity in Session
id: d2c6956f-7960-5f83-9886-15cab99fcaab
status: stable
description: >
  Detects sessions with an unusually high number of tool calls (20+), which may
  indicate automated probing or scripted attack sequences.
  Adapted from AgentShield: original used session.tool_count field; this version
  counts the TOOL_CALL rows of the agent session (and the sessions it spawned).
references:
  - https://attack.mitre.org/techniques/T1046/
  - https://arxiv.org/abs/2403.04783
author: AgentShield (adapted by Netzilo)
date: "2026-03-18"
tags:
  - attack.discovery
  - attack.t1046
  - atlas.aml.t0053
  - owasp.asi02
  - owasp.asi10
logsource:
  product: ai_agent
  category: agent_events
requires:
  - tool
detection:
  # Scope to tool_call — velocity is measured in tool calls, not HTTP events.
  sel_trigger:
    event_type: tool_call
    content|re: '.'
  condition: sel_trigger
level: medium
falsepositives:
  - Legitimate batch operations
  - Automated testing sessions

action: execute
on_timeout: allow
on_error: allow
script: |
  THRESHOLD = 20
  MAX_ROWS  = 1000

  def agent_root():
      # the triggering session's topmost ancestor (the agent), or None when unknown
      s = session()
      if s == None:
          return None
      for i in range(16):
          p = s.get("parent", "")
          if p == "":
              break
          ps = session(p)
          if ps == None:
              break
          s = ps
      return s

  def run():
      if meta.get("context_type", "") != "tool_input":
          return "allow"
      root = agent_root()
      if root == None:
          return "allow"

      # every tool call made by the agent session - one row per call
      count = len(events(kind="TOOL_CALL", session=root["id"], limit=MAX_ROWS))

      if count >= THRESHOLD:
          print("Session velocity anomaly: " + str(count) + " tool calls (threshold=" + str(THRESHOLD) + ")")
          return "report"

      return "allow"

  result = run()
