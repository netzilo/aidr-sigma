logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\b(?:read_?file|readfile|read_text|read_secret|get_?file|load_?file|cat_?file|fs[._]read(?:file)?|open_?file|file_read|read)\s*\(\s*(?:file_?path|path|file)?\s*=?\s*["\x27](?:[^"\x27<>]{0,120}[\\/])?(?:\.?env(?:\.[\w.]+)?|secrets?(?:\.\w+)?|credentials|\.npmrc|\.netrc)["\x27]
  sel_1:
    content|re: (?i)"(?:file_?path|path|file|filename|target|src|source)"\s*:\s*"(?:[^"<>]{0,120}[\\/])?(?:\.?env(?:\.[\w.]+)?|secrets?(?:\.\w+)?|credentials|\.npmrc|\.netrc)"
  condition: 1 of sel_*
falsepositives:
- Natural-language prose that merely mentions a .env / secrets file ("create a .env file with your API
  key", "if you have a .env file in your project root") with no read-tool call or JSON path argument.
- The CLI flag form `node --env-file=.env` or `--env-file <path-to-.env>` — an interpreter loading its
  own config, not an agent read-tool ingesting the file content for the model.
- '`dotenv.config()` / `load_dotenv()` in normal application source — runtime config loading by the app
  itself, not an MCP read tool surfacing secrets to the agent.'
- Searching/listing for the file (`find . -name ".env" -type f`) without reading its contents.
- A read tool whose path argument targets a NON-secret config file (config.json, README.md, src/index.ts).
action: report
