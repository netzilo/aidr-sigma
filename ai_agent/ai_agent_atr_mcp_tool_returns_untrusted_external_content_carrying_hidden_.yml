logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?i)"(?:description|body|content|pagecontent|comment|commenttext|sourcecommenttext|reviewcomment|markdown|summary|notes|commitmessage|title)"\s*:\s*"[\s\S]{0,900}[\s\S]{0,900}<!--(?:[^-]|-[^-]|--[^>]){0,400}(?:ignore\s+(?:all\s+)?(?:the\s+)?(?:previous|prior|above)|disregard\s+(?:all\s+)?(?:the\s+)?(?:previous|prior|above)|new\s+instructions?\b|\[system\]|<system>|you\s+(?:must|should|shall|need\s+to)\s+(?:now\s+|also\s+|first\s+)?(?:call|invoke|run|execute|fetch|read|open|post|send|create|trigger|list|clone)|do\s+not\s+(?:tell|inform|mention|reveal|notify|report|alert)\s+(?:the\s+)?(?:user|reviewer|human|operator))
  sel_1:
    response|re: (?i)<!--(?:[^-]|-[^-]|--[^>]){0,300}\b(?:ai\s+(?:agent|assistant|reviewer|review)|llm|assistant|copilot|claude|chatgpt|gemini|cursor|codex|code\s+review(?:er)?\s+(?:agent|bot|assistant)|review(?:ing)?\s+agent|automated\s+reviewer)\b(?:[^-]|-[^-]|--[^>]){0,200}\b(?:you\s+(?:must|should|shall|need\s+to|are\s+required\s+to)|please\s+(?:also\s+)?(?:call|run|fetch|read|send|post|create|invoke|retrieve)|ignore\s+(?:all\s+)?(?:the\s+)?(?:previous|prior|above)|do\s+not\s+(?:tell|inform|mention|reveal)|instead\s+of\s+(?:reviewing|summarising|summarizing))\b
  sel_2:
    response|re: (?i)<(?:span|div|p|font|section|details|td)\b[^>]{0,200}(?:display\s*:\s*none|visibility\s*:\s*hidden|font-size\s*:\s*0|opacity\s*:\s*0|color\s*:\s*#?(?:fff\b|ffffff\b|white\b))[^>]{0,200}>(?:[^<]|<[^/]){0,300}\b(?:ignore\s+(?:all\s+)?(?:the\s+)?(?:previous|prior|above)|you\s+(?:must|should|shall)\s+(?:now\s+|also\s+|first\s+)?(?:call|run|execute|fetch|read|post|send|create)|do\s+not\s+(?:tell|inform|mention|reveal)\s+(?:the\s+)?(?:user|reviewer)|new\s+instructions?\b)
  sel_3:
    response|re: (?i)"type"\s*:\s*"text"\s*,\s*"text"\s*:\s*"(?:\\[nrt]|\s){0,20}[\{\[][\s\S]{0,900}[\s\S]{0,900}<!--(?:[^-]|-[^-]|--[^>]){0,400}(?:ignore\s+(?:all\s+)?(?:the\s+)?(?:previous|prior|above)|you\s+(?:must|should|shall)\s+(?:now\s+|also\s+|first\s+)?(?:call|run|execute|fetch|read|post|send|create)|do\s+not\s+(?:tell|inform|mention|reveal)\s+(?:the\s+)?(?:user|reviewer)|new\s+instructions?\b|\[system\])
  sel_4:
    content|re: (?i)\b(?:embed|insert|inject|append|plant|hide|conceal|place)\b[^\n]{0,80}\b(?:hidden|invisible|html\s+comment|<!--)[^\n]{0,140}\b(?:pull\s+request|pr\s+description|merge\s+request|issue\s+(?:body|description)|commit\s+message|wiki\s+page)\b
  condition: 1 of sel_*
falsepositives:
- Documentation, changelogs and README content returned by a docs/wiki MCP tool that legitimately contains
  HTML comments used for authoring directives (for example a comment reading 'do not edit, generated file')
  — these carry no second-person imperative aimed at an agent.
- Static-site and Markdown tooling output containing template comments such as <!-- prettier-ignore -->,
  <!-- markdownlint-disable -->, <!-- more --> or Jekyll/Hugo front-matter comments.
- 'Security research write-ups, disclosure posts and conference material about this very technique returned
  by a web-fetch or wiki MCP tool: prose describing that an attacker hides instructions in a PR description
  is third-person reportage, not a live payload. Layer 5 is bounded to imperative authoring verbs to keep
  this class out, but a quoted PoC snippet inside a research article WILL fire Layers 1-4 by design, because
  a quoted payload re-entering agent context is itself the risk.'
- 'Content that IS correctly spotlighted but still carries an embedded imperative: Layers 1-3 fire on
  the carrier regardless of the wrapper. This is intentional (spotlighting mitigates but does not neutralise
  an injection attempt) but means those layers do not, on their own, prove that spotlighting was missing.
  Only Layer 4 asserts the raw-serialization path.'
- Templated PR/issue bodies generated by bots (dependabot, release-please) that embed HTML comments holding
  machine-readable metadata; these lack agent-directed imperative verbs.
action: report
