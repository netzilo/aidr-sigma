title: Credential Data Leaked in Tool Response
id: db98e52d-4ef4-4c3e-bb07-feb4bcd8238c
status: experimental
level: critical
description: |-
  Detects private keys, API tokens, or credential material embedded in tool responses. Attackers embed credential data in seemingly benign tool output (weather, search results) to trick agents into exfiltrating secrets. Crystallized from 37 adversarial social_engineering samples.

  Adapted from Agent Threat Rules ATR-2026-00150 (MIT).
author: ATR Community (adapted)
date: '2026-04-08'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00150
tags:
- attack.exfiltration
- atlas.aml.t0057
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----
  sel_1:
    content|re: (?i)(id_rsa|id_ed25519|id_ecdsa)\s+(contains|has|file)[:\s]
  sel_2:
    content|re: (?i)(sk-(?:proj-|ant-|live-)\S{10,}|ghp_\S{30,}|gho_\S{30,}|glpat-\S{10,}|xox[bpras]-\S{10,})
  condition: 1 of sel_*
falsepositives:
- Documentation about key formats
- Security tools that intentionally scan for leaked keys
- Automated security scanning tools (e.g., truffleHog, git-secrets) that output detected credential patterns
  in their findings reports
- Developer documentation or tutorials that include example PEM headers to illustrate certificate/key
  file formats
action: report
