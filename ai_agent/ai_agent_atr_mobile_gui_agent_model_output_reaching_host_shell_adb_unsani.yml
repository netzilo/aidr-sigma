logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\badb(?:\.exe)?\b[^\n\r]{0,120}?\bshell\b[^\n\r]{0,80}?\b(?:input\s+(?:text|keyevent)|am\s+(?:start|startservice|broadcast)|monkey\s+-p|pm\s+(?:install|uninstall|grant))\b[^\n\r]{0,200}?(?:;|&&|\|\||\||&)(?:\s|%s){0,12}(?:[A-Za-z]:)?[\\/]{0,2}(?:[\w.-]{1,40}[\\/]){0,5}(?:calc(?:\.exe)?|cmd(?:\.exe)?|powershell(?:\.exe)?|pwsh|bash|zsh|dash|sh|python3?|perl|ruby|node|npx|curl|wget|ncat|netcat|nc|socat|telnet|ssh|scp|sftp|tftp|whoami|pwd|uname|hostname|systeminfo|ipconfig|ifconfig|base64|certutil|bitsadmin|mshta|rundll32|regsvr32|wscript|cscript|osascript|schtasks|crontab|launchctl|wmic|chmod|chown|rm|dd|xxd|sudo|killall|taskkill|explorer|notepad|xterm)\b
  sel_1:
    content|re: (?i)\badb(?:\.exe)?\b[^\n\r]{0,120}?\bshell\b[^\n\r]{0,80}?\binput\s+text\b[^\n\r]{0,200}?(?:\$\((?:\s|%s){0,12}[\w./\\-]{1,60}|`(?:\s|%s){0,12}[\w./\\-]{1,60}`|>{1,2}(?:\s|%s){0,12}[~\w.][\w./\\-]{0,60})
  sel_2:
    content|re: (?i)(?:\b(?:text|type|input_text|type_text|set_text|enter_text|write_text|send_keys)\s*\(\s*[\x22\x27]|[\x22\x27](?:action|action_type|operation|name)[\x22\x27]\s*:\s*[\x22\x27](?:type|text|input_text|type_text|send_keys)[\x22\x27][^\n\r]{0,160}?[\x22\x27](?:text|text_input|input_str|input_text|content|value)[\x22\x27]\s*:\s*[\x22\x27])[^\x22\x27\n\r]{0,200}?[\x22\x27]{0,2}(?:;|&&|\|\||\||&|\$\(|`)(?:\s|%s){0,12}(?:[A-Za-z]:)?[\\/]{0,2}(?:[\w.-]{1,40}[\\/]){0,5}(?:calc(?:\.exe)?|cmd(?:\.exe)?|powershell(?:\.exe)?|pwsh|bash|zsh|dash|sh|python3?|perl|ruby|node|npx|curl|wget|ncat|netcat|nc|socat|telnet|ssh|scp|sftp|tftp|whoami|pwd|uname|hostname|systeminfo|ipconfig|ifconfig|base64|certutil|bitsadmin|mshta|rundll32|regsvr32|wscript|cscript|osascript|schtasks|crontab|launchctl|wmic|chmod|chown|rm|dd|xxd|sudo|killall|taskkill|explorer|notepad|xterm)\b
  sel_3:
    content|re: (?i)\bshell\s+input\s+text\b[^\n\r]{0,160}?[\x22\x27](?:\s|%s){0,6}(?:;|&&|\|\||&)(?:\s|%s){0,12}(?:[A-Za-z]:)?[\\/]{0,2}(?:[\w.-]{1,40}[\\/]){0,5}[\w.-]{1,60}(?:\s|%s){0,12}(?:#|::|\brem\b)
  sel_4:
    content|re: (?i)(?:\badb\b[^\n\r]{0,160}?\bshell\s+input\s+(?:text|keyevent)\s*(?:\{[\w.\[\]()\x22\x27]{1,60}\}|\$\{[\w.\[\]]{1,60}\}|[\x22\x27]\s*(?:\+|\.)\s*[\w.\[\]()]{1,60})|(?:os\.system|subprocess\.(?:run|call|check_output|check_call|Popen)|child_process\.exec|shell_exec)\s*\([^\n\r]{0,200}?\badb\b[^\n\r]{0,160}?\bshell\s+input\s+(?:text|keyevent)[^\n\r]{0,200}?shell\s*=\s*True)
  sel_5:
    content|re: (?i)replace\s*\(\s*[\x22\x27]\x20[\x22\x27]\s*,\s*[\x22\x27]%s[\x22\x27]\s*\)[\s\S]{0,400}?\badb\b[^\n\r]{0,160}\bshell\s+input\s+text
  condition: 1 of sel_*
falsepositives:
- Legitimate text typed by the agent that contains a separator immediately followed by a token colliding
  with a command name, e.g. an adb input text argument carrying 'invoice;rm 402' or 'lab;dd 12'.
- Automation scripts that deliberately chain a GUI action with a real host command on one line, e.g. 'adb
  shell am start -n com.x/.Main; chmod +x ./collect.sh'.
- Security research repositories, CTF write-ups and framework regression tests that embed the literal
  injected adb command as a sample payload.
- Controller code that uses shell=True but escapes correctly with shlex.quote(); condition 5 still matches
  the interpolation shape because the escaping call sits inside the interpolated expression.
- Screen-recording or QA tooling that redirects adb GUI-command output to a relative log file, e.g. 'adb
  shell input text abc > run.log'.
action: report
