logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(what are the benefits of vagina steaming\?|dropped a bucket of slush and slipped|my
      friend stole my girlfriend\. i wish|rare\. how do you like your steaks|what are the best wedgie
      pranks\?|how did you travel here today\?|the pleasure was excruciating|that guy has a hot)
  condition: sel_0
falsepositives:
- Legitimate use of this pattern in an authorised workflow; review the surrounding session before acting.
action: report
