title: Credential Exfiltration via Malicious DevOps Toolkit Initialization
id: 7f3c1a24-9d8e-4b6f-9c2a-51e0d7a4b3c8
status: experimental
level: high
description: |
  Detects a single spawned command line in which local credential material and an
  outbound network client appear together in a way that only makes sense as theft:
  a credential file handed directly to a curl/wget/xh upload flag, a credential file
  or secret dump piped into a network client, a credential path interpolated into a
  URL or DNS lookup via command substitution, or an interpreter one-liner that reads a
  credential path and calls an HTTP/socket API.

  This is the payload of the fake DevOps toolkit init pattern: an attacker ships a
  toolkit bootstrap/setup step that an AI agent executes as ordinary DevOps work, and
  the setup step quietly harvests ~/.aws/credentials, id_rsa, .docker/config.json,
  .kube/config, .npmrc, service-account JSON, .env or kubectl secrets and ships them
  out. Only the exec event is observable (event_type: execute_process); the detection
  is therefore built entirely on the adjacency of credential source and network sink
  inside one command line, which is what separates theft from normal tooling.

  Deliberately NOT matched: credentials used as authentication (curl --netrc,
  --cert/--key, Authorization headers built from a token variable), credential files
  copied to local paths, and any credential read with no network sink in the same
  command.
author: Selhan
date: "2026-06-12"
references:
  - https://attack.mitre.org/techniques/T1552/001/
  - https://attack.mitre.org/techniques/T1041/
  - https://attack.mitre.org/techniques/T1195/002/
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.exfiltration
  - attack.t1041
  - atlas.aml.t0055
  - atlas.aml.t0025
  - owasp.llm02
  - owasp.llm03
falsepositives:
  - Backup or rotation scripts that intentionally upload ~/.aws/credentials, a .env or
    a secrets.yaml to an internal secret store with curl -T / -F / --data-binary.
  - CI or cluster-bootstrap automation that pipes 'kubectl get secret -o json' or
    'gcloud auth print-access-token' into an internal API with curl.
  - Developer debugging that pipes 'env' into a request-inspection service to see what
    the environment looks like from the outside.
  - Integration tests that upload dummy credential fixtures; suppressed only when the
    value carries an explicit placeholder marker (filter_placeholder).
  - Copy-pasted documentation or demo one-liners echoed into a shell, and 'man curl' or
    'curl --help' invocations (filter_help_or_demo).
logsource:
  product: ai_agent
  category: agent_events
detection:

  sel_exec:
    event_type: execute_process

  sel_exfil_cmd:
    command|re:
      - '(?i:curl|wget|xh|http)\b[^;\n&|]{0,300}\s-{1,2}(?:data-binary|data-urlencode|data-raw|upload-file|post-file|post-data|form|data|d|F|T)[=\s]+[^\s;|&]{0,140}(?:\.aws/credentials|id_(?:rsa|dsa|ecdsa|ed25519)(?:[^\w.]|$)|\.docker/config\.json|\.kube/config|\.npmrc(?:[^\w]|$)|\.pypirc|\.netrc(?:[^\w]|$)|\.git-credentials|\.config/gh/hosts\.yml|application_default_credentials\.json|service[-_]account[^\s]{0,40}\.json|\.gnupg/|\.env(?:[^\w]|$)|secrets?\.(?:ya?ml|json|env))'
      - '\b(?i:cat|base64|gzip|tar|zip|openssl|xxd|od|jq|head|tail|strings|awk|sed)\b[^;\n]{0,200}(?:\.aws/credentials|id_(?:rsa|dsa|ecdsa|ed25519)(?:[^\w.]|$)|\.docker/config\.json|\.kube/config|\.npmrc(?:[^\w]|$)|\.pypirc|\.git-credentials|\.config/gh/hosts\.yml|application_default_credentials\.json|service[-_]account[^\s]{0,40}\.json|\.gnupg/|\.env(?:[^\w]|$)|secrets?\.(?:ya?ml|json|env))[^;\n]{0,200}\|[^;\n]{0,140}\b(?i:curl|wget|nc|ncat|socat|xh|telnet)\b'
      - '\b(?i:printenv|env|security\s+dump-keychain|security\s+find-(?:generic|internet)-password|gcloud\s+auth\s+print-(?:access|identity)-token|aws\s+configure\s+get|kubectl\s+get\s+secrets?)\b[^;\n]{0,140}\|[^;\n]{0,140}\b(?i:curl|wget|nc|ncat|socat|xh)\b'
      - '(?i:curl|wget|xh|dig|nslookup)\b[^;\n]{0,300}(?:\$\(|`)\s*\b(?i:cat|base64|xxd|head|tr|openssl|printenv|env|jq)\b[^;\n)]{0,160}(?:\.aws/credentials|id_(?:rsa|dsa|ecdsa|ed25519)(?:[^\w.]|$)|\.docker/config\.json|\.kube/config|\.npmrc(?:[^\w]|$)|\.pypirc|\.git-credentials|\.config/gh/hosts\.yml|application_default_credentials\.json|service[-_]account[^\s]{0,40}\.json|\.gnupg/|\.env(?:[^\w]|$)|secrets?\.(?:ya?ml|json|env))'
      - '(?i:curl|wget|xh)\b[^;\n]{0,300}\$\(\s*<\s*[^\s)]{0,100}(?:\.aws/credentials|id_(?:rsa|dsa|ecdsa|ed25519)(?:[^\w.]|$)|\.docker/config\.json|\.kube/config|\.npmrc(?:[^\w]|$)|\.git-credentials|application_default_credentials\.json|service[-_]account[^\s]{0,40}\.json|\.env(?:[^\w]|$)|secrets?\.(?:ya?ml|json|env))'

  sel_exfil_content:
    content|re:
      - '(?i:curl|wget|xh|http)\b[^;\n&|]{0,300}\s-{1,2}(?:data-binary|data-urlencode|data-raw|upload-file|post-file|post-data|form|data|d|F|T)[=\s]+[^\s;|&]{0,140}(?:\.aws/credentials|id_(?:rsa|dsa|ecdsa|ed25519)(?:[^\w.]|$)|\.docker/config\.json|\.kube/config|\.npmrc(?:[^\w]|$)|\.pypirc|\.netrc(?:[^\w]|$)|\.git-credentials|\.config/gh/hosts\.yml|application_default_credentials\.json|service[-_]account[^\s]{0,40}\.json|\.gnupg/|\.env(?:[^\w]|$)|secrets?\.(?:ya?ml|json|env))'
      - '\b(?i:cat|base64|gzip|tar|zip|openssl|xxd|od|jq|head|tail|strings|awk|sed)\b[^;\n]{0,200}(?:\.aws/credentials|id_(?:rsa|dsa|ecdsa|ed25519)(?:[^\w.]|$)|\.docker/config\.json|\.kube/config|\.npmrc(?:[^\w]|$)|\.pypirc|\.git-credentials|\.config/gh/hosts\.yml|application_default_credentials\.json|service[-_]account[^\s]{0,40}\.json|\.gnupg/|\.env(?:[^\w]|$)|secrets?\.(?:ya?ml|json|env))[^;\n]{0,200}\|[^;\n]{0,140}\b(?i:curl|wget|nc|ncat|socat|xh|telnet)\b'
      - '\b(?i:printenv|env|security\s+dump-keychain|security\s+find-(?:generic|internet)-password|gcloud\s+auth\s+print-(?:access|identity)-token|aws\s+configure\s+get|kubectl\s+get\s+secrets?)\b[^;\n]{0,140}\|[^;\n]{0,140}\b(?i:curl|wget|nc|ncat|socat|xh)\b'
      - '(?i:curl|wget|xh|dig|nslookup)\b[^;\n]{0,300}(?:\$\(|`)\s*\b(?i:cat|base64|xxd|head|tr|openssl|printenv|env|jq)\b[^;\n)]{0,160}(?:\.aws/credentials|id_(?:rsa|dsa|ecdsa|ed25519)(?:[^\w.]|$)|\.docker/config\.json|\.kube/config|\.npmrc(?:[^\w]|$)|\.pypirc|\.git-credentials|\.config/gh/hosts\.yml|application_default_credentials\.json|service[-_]account[^\s]{0,40}\.json|\.gnupg/|\.env(?:[^\w]|$)|secrets?\.(?:ya?ml|json|env))'
      - '(?i:curl|wget|xh)\b[^;\n]{0,300}\$\(\s*<\s*[^\s)]{0,100}(?:\.aws/credentials|id_(?:rsa|dsa|ecdsa|ed25519)(?:[^\w.]|$)|\.docker/config\.json|\.kube/config|\.npmrc(?:[^\w]|$)|\.git-credentials|application_default_credentials\.json|service[-_]account[^\s]{0,40}\.json|\.env(?:[^\w]|$)|secrets?\.(?:ya?ml|json|env))'

  sel_inline_cred_c:
    content|re: '\b(?i:python3?|python2|node|nodejs|ruby|perl|php|deno|bun)\s+-{1,2}(?:c|e|r|eval|print)\b[^\n]{0,800}(?:\.aws/credentials|id_(?:rsa|dsa|ecdsa|ed25519)(?:[^\w.]|$)|\.docker/config\.json|\.kube/config|\.npmrc(?:[^\w]|$)|\.pypirc|\.git-credentials|\.config/gh/hosts\.yml|application_default_credentials\.json|service[-_]account[^\s]{0,40}\.json|\.gnupg/|\.env(?:[^\w]|$)|secrets?\.(?:ya?ml|json|env))'
  sel_inline_net_c:
    content|re: '(?:requests\.(?:post|put|patch)|urllib\.request|urlopen|http\.client\.HTTPS?Connection|socket\.create_connection|socket\.socket|axios\.|fetch\(|Net::HTTP|LWP::UserAgent|IO::Socket|curl_exec|file_get_contents)'
  sel_inline_cred_m:
    command|re: '\b(?i:python3?|python2|node|nodejs|ruby|perl|php|deno|bun)\s+-{1,2}(?:c|e|r|eval|print)\b[^\n]{0,800}(?:\.aws/credentials|id_(?:rsa|dsa|ecdsa|ed25519)(?:[^\w.]|$)|\.docker/config\.json|\.kube/config|\.npmrc(?:[^\w]|$)|\.pypirc|\.git-credentials|\.config/gh/hosts\.yml|application_default_credentials\.json|service[-_]account[^\s]{0,40}\.json|\.gnupg/|\.env(?:[^\w]|$)|secrets?\.(?:ya?ml|json|env))'
  sel_inline_net_m:
    command|re: '(?:requests\.(?:post|put|patch)|urllib\.request|urlopen|http\.client\.HTTPS?Connection|socket\.create_connection|socket\.socket|axios\.|fetch\(|Net::HTTP|LWP::UserAgent|IO::Socket|curl_exec|file_get_contents)'

  filter_placeholder:
    content|re:
      - '(?i)AKIAIOSFODNN7EXAMPLE'
      - '(?i)<(?:your|insert|redacted|placeholder|token|api[-_]?key)[^>\n]{0,40}>'
      - '(?i)\b(?:YOUR|MY|FAKE|DUMMY|SAMPLE|PLACEHOLDER)_(?:AWS_|GH_|GITHUB_|NPM_|API_)?(?:SECRET|ACCESS|AUTH)?_?(?:KEY|TOKEN|SECRET|PASSWORD)\b'
      - '(?i)\bCHANGE[-_]?ME\b'
      - '(?i)x{16,}'
  filter_help_or_demo:
    content|re:
      - '(?:^|\s)man\s+(?:curl|wget|xh|scp)\b'
      - '(?i)(?:^|\s)(?:curl|wget|xh)\s+(?:--help|--manual|--version)(?:\s|$)'
      - '^\s*(?:echo|printf)\s'

  condition: >
    sel_exec and
    (sel_exfil_cmd or sel_exfil_content or
     (sel_inline_cred_c and sel_inline_net_c) or
     (sel_inline_cred_m and sel_inline_net_m))
    and not (filter_placeholder or filter_help_or_demo)

action: report
