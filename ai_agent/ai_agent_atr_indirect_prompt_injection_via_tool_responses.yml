title: Indirect Prompt Injection via Tool Responses
id: 9ebc8540-8552-453a-a0d7-f5c89454a689
status: experimental
level: high
description: |-
  Detects indirect prompt injection payloads embedded in tool responses, API outputs, or retrieved content. Attackers place hidden instructions in external data sources that the agent processes, causing it to execute unintended actions when the poisoned data is consumed.

  Adapted from Agent Threat Rules ATR-2026-00083 (MIT).
author: ATR Community (adapted)
date: '2026-03-11'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00083
tags:
- attack.initial-access
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?i)\b(ignore|disregard|forget|override|replace)\s+.{0,20}(all\s+)?(previous|prior|above|original|system)\s+(instructions?|prompts?|rules?|context)
  sel_1:
    response|re: (?i)(\[SYSTEM\]|\[INST\]|<\|system\|>|<\|im_start\|>system|<<SYS>>)\s*.{1,200}
  sel_2:
    response|re: (?i)\b(you\s+are\s+now|new\s+instructions?|your\s+(real|true|actual|new)\s+(purpose|role|task|instruction))\b
  sel_3:
    response|re: (?i)((<!--|/\*|//|#)\s{0,4}(ignore|disregard|forget|override)\s+(all\s+|any\s+|the\s+)?(previous|prior|above|earlier|system)\s+(instructions?|prompts?|rules?|context|messages?)|(<!--|/\*|//|#)\s{0,4}(you\s+are\s+now|new\s+instructions?\s*:|system\s+prompt\s*:))
  condition: 1 of sel_*
falsepositives:
- Security documentation explaining indirect injection techniques
- IT change management documentation describing how a new configuration override replaces prior system
  settings, using phrases like 'this override replaces the original system configuration'
- Prompt-injection defence skills that quote the payload string verbatim in a catalogue of indicators
  to watch for ('Ignore previous instructions', '[SYSTEM]', 'You are now'). The quoted indicator and the
  live payload are the same characters, so conditions 0, 1 and 2 cannot separate them; this is the residual
  false-positive class and the reason the rule is held at maturity test rather than in the enforce lane.
- Product documentation that uses 'New instructions' or 'you are now' as ordinary English prose, for example
  a conversational-agent guide describing how an operator sends new instructions to a running agent
action: report
