title: vLLM Structured-Decoding Grammar Cache Flood
id: 7b3c1f9e-4d2a-4f6b-9c81-2e5a6d0f38b4
status: experimental
level: high
description: |
  Detects the vLLM / outlines unbounded on-disk grammar cache denial-of-service
  pattern: a client streams structured-output (guided decoding) requests at an
  inference endpoint where every request carries a NEW, unique schema/grammar,
  so every request compiles and persists a fresh FSM/grammar artefact into the
  outlines filesystem cache until the volume fills.

  The engine exposes no disk-utilisation or cache-size event, and file_write is
  replay-only, so the volumetric signal is synthesised inside the script from
  two live sources:

    1. Per-host distinct-schema cardinality over a sliding 10 minute window,
       derived on every call from the in-window HTTP_REQUEST rows to that host
       and their indexed bodies: each guided-decoding body is fingerprinted
       (FNV-1a over the extracted guided_json / json_schema / guided_grammar /
       guided_regex / guided_choice fragment) and the distinct fingerprints are
       counted. The store keeps only a per-host "last reported" marker. Normal
       structured-output clients reuse a handful of schemas; a cache-flood
       attacker by definition never repeats one. That cardinality IS the
       volumetric semantic the raw HTTP_REQUEST edge lacks.
    2. Graph corroboration once the cardinality anchor trips: the kill chain is
       rooted at the triggering session's agent ancestor with its HTTP_REQUEST
       edge to the target host, and WRITE_FILE edges are walked with
       fs_activity() to resolve grammar/FSM cache paths (outlines / grammar
       cache / fsm cache) written inside the same window, reported with the
       number of in-window writes.

  When the vLLM server is remote the write stage is absent; the rule still
  reports on the schema-cardinality anchor alone and says so in the reason.
  Verdict is report only - this is a capacity-abuse signal, not a payload.
author: Haibo
date: "2026-06-12"
modified: "2026-06-12"
references:
  - https://github.com/vllm-project/vllm/security/advisories
  - https://atlas.mitre.org/techniques/AML.T0029
  - https://genai.owasp.org/llmrisk/llm102025-unbounded-consumption/
tags:
  - attack.impact
  - attack.t1499
  - attack.t1499.001
  - atlas.aml.t0029
  - owasp.llm10
falsepositives:
  - Model-evaluation or benchmark harnesses that generate a per-item JSON schema
    (e.g. one schema per test row) and fire hundreds of guided-decoding requests
    in a burst. Mitigated by the 10 minute window, the 25-unique-schema floor,
    the 15 minute per-host report cooldown and report-only enforcement.
  - Agent frameworks that inline a dynamically built tool/response schema on
    every call, so each request body differs. These usually reuse the same small
    set of tool schemas, which collapses to few fingerprints; only genuinely
    novel schemas per request accumulate.
  - Fuzzing or conformance test suites that intentionally mutate guided_json /
    guided_grammar payloads against a staging inference server.
  - Load or soak testing of a structured-output endpoint with randomised schemas.
  - A shared multi-tenant inference host serving many unrelated applications,
    where the aggregate distinct-schema count is high without any single abuser.
logsource:
  product: ai_agent
  category: agent_events
requires:
  - file_activity
  - http
detection:
  sel_http:
    event_type: http_request
  sel_structured:
    content|contains:
      - 'guided_json'
      - 'guided_grammar'
      - 'guided_regex'
      - 'guided_choice'
      - 'guided_decoding_backend'
      - 'json_schema'
  condition: sel_http and sel_structured
action: execute
on_timeout: allow
on_error: allow
script: |
  # ── vLLM / outlines unbounded grammar-cache flood ───────────────────────────
  WINDOW_NS       = 600000000000   # 10 minutes
  REPORT_COOLDOWN = 900000000000   # 15 minutes, per host
  DISTINCT_MIN    = 25             # unique schemas per window
  DISTINCT_MIN_OL = 12             # lower floor once outlines backend is named
  MAX_HOSTS       = 8              # per-host report markers kept in the store
  MAX_ROWS        = 1000
  FP_INPUT_MAX    = 2000
  MAX_WRITE_STEPS = 4
  MAX_SESSIONS    = 200

  STRUCT_MARKERS = ["guided_json", "guided_grammar", "guided_regex",
                    "guided_choice", "guided_decoding_backend", "json_schema"]

  SCHEMA_PATTERNS = [r'"guided_json"[\s\S]{0,1000}',
                     r'"json_schema"[\s\S]{0,1000}',
                     r'"guided_grammar"[\s\S]{0,1000}',
                     r'"guided_regex"[\s\S]{0,1000}',
                     r'"guided_choice"[\s\S]{0,1000}']

  # FTS query that selects the indexed guided-decoding request bodies
  FTS_Q = '"guided_json" OR "json_schema" OR "guided_grammar" OR "guided_regex" OR "guided_choice"'

  # fs_activity path filter: every whitespace token must appear in the path
  CACHE_PATTERNS = ["outlines", "cache outlines", "grammar cache", "cache fsm"]

  # ── pure helpers (no graph / log / store calls) ─────────────────────────────
  def is_structured(body):
      low = body.lower()
      for m in STRUCT_MARKERS:
          if m in low:
              return True
      return False

  def names_outlines(body):
      return "outlines" in body.lower()

  def fnv(s):
      h = 2166136261
      for c in s[:FP_INPUT_MAX].elem_ords():
          h = ((h ^ c) * 16777619) % 4294967296
      return "%x" % h

  def schema_fp(body):
      for pat in SCHEMA_PATTERNS:
          m = re.find(pat, body)
          if m != None:
              return fnv(m)
      return None

  def url_root(u, host):
      p = u.find("://")
      if p < 0:
          return "https://" + host
      return u[:p].lower() + "://" + host

  # ── store housekeeping: one small "reported" marker per host ────────────────
  def make_room(key):
      keys = store_keys()
      if key in keys:
          return
      hostkeys = [k for k in keys if k.startswith("h:")]
      if len(hostkeys) < MAX_HOSTS:
          return
      oldest = ""
      oldest_ts = 0
      for k in hostkeys:
          st = store_get(k) or {}
          t = int(st.get("last", 0))
          if oldest == "" or t < oldest_ts:
              oldest = k
              oldest_ts = t
      if oldest != "":
          store_delete(oldest)

  def save(key, st):
      if store_usage()["free"] > 16384:
          store_set(key, st)

  # ── graph corroboration (only reached after the cardinality anchor) ─────────
  def http_edge(sid, url_id, now):
      for e in edges(sid, dir="out", kind="HTTP_REQUEST"):
          if e.get("to", "") == url_id:
              return e
      return {"from": sid, "to": url_id, "kind": "HTTP_REQUEST", "dir": "out",
              "ts": str(now), "first_ts": str(now), "last_ts": str(now), "count": "1"}

  def agent_root():
      # the triggering session's topmost ancestor (the agent), or None when unknown
      s = session()
      if s == None:
          return None
      for i in range(16):
          p = s.get("parent", "")
          if p == "":
              break
          ps = session(p)
          if ps == None:
              break
          s = ps
      return s

  def http_evidence(host):
      best = None
      for p in sessions(limit=MAX_SESSIONS):
          for e in edges(p["id"], dir="out", kind="HTTP_REQUEST"):
              u = node(e["to"])
              if u == None or u.get("host", "") != host:
                  continue
              if p.get("agent", "0") == "1":
                  return [p["id"], e]
              if best == None:
                  best = [p["id"], e]
      return best

  def cache_writes(now):
      hits = []
      for p in sessions(limit=MAX_SESSIONS):
          for e in edges(p["id"], dir="out", kind="WRITE_FILE"):
              for pat in CACHE_PATTERNS:
                  ents = fs_activity(session=p["id"], op="WRITE", pattern=pat)
                  if not ents:
                      continue
                  recent = None
                  n = 0
                  for en in ents:
                      if now - int(en["ts"]) <= WINDOW_NS:
                          n = n + 1
                          if recent == None:
                              recent = en
                  if recent == None:
                      continue
                  hits.append([e, recent, n])
                  break
              if len(hits) >= MAX_WRITE_STEPS:
                  break
          if len(hits) >= MAX_WRITE_STEPS:
              break
      return hits

  def run():
      # 1. relevance gate - pure string checks on meta only
      if meta.get("context_type", "") != "http_request":
          return "allow"
      body = meta.get("content", "")
      host = meta.get("host", "")
      now  = int(meta.get("event_ts", "0"))
      if body == "" or host == "" or now == 0:
          return "allow"
      if not is_structured(body):
          return "allow"
      fp = schema_fp(body)
      if fp == None:
          return "allow"

      # 2. keep the private store inside quota (never let store_set raise)
      if store_usage()["free"] < 65536:
          store_reset()

      # 3. sliding-window distinct-schema cardinality per destination host,
      #    derived from the in-window HTTP_REQUEST rows and their indexed bodies
      url_id = url_root(meta.get("url", ""), host)
      by_label = {}
      for r in events(kind="HTTP_REQUEST", target=url_id,
                      since_ns=now - WINDOW_NS, until_ns=now, limit=MAX_ROWS):
          cid = r.get("content_id", "")
          if cid != "":
              by_label[cid] = r
      fps = {fp: True}                       # the trigger itself (its index may race)
      ol  = names_outlines(body)
      for h in search(FTS_Q, MAX_ROWS):
          if h.get("source", "") not in by_label:
              continue
          text = h.get("text", "")
          f = schema_fp(text)
          if f != None:
              fps[f] = True
          if names_outlines(text):
              ol = True

      key = "h:" + host
      make_room(key)
      old = store_get(key) or {}
      rep = int(old.get("reported", 0))
      save(key, {"reported": rep, "last": now})

      distinct = len(fps)
      limit = DISTINCT_MIN
      if ol:
          limit = DISTINCT_MIN_OL
      if distinct < limit:
          return "allow"
      if rep > 0 and now - rep < REPORT_COOLDOWN:
          return "allow"   # already reported this host in this window

      # 4. anchor tripped - now (and only now) touch the graph
      inst = session()
      root = ""
      ev   = None
      if inst != None:
          root = agent_root()["id"]
          ev   = [inst["id"], http_edge(inst["id"], url_id, now)]
      else:
          ev = http_evidence(host)
          if ev != None:
              root = ev[0]
      writes = cache_writes(now)

      reason = ("vLLM/outlines grammar-cache flood: " + str(distinct) +
                " unique guided-decoding schemas sent to " + host + " in 10m")
      if ol:
          reason = reason + " (outlines backend named in request)"
      if len(writes) > 0:
          reason = reason + "; " + str(len(writes)) + " grammar-cache path(s) growing on disk"
      else:
          reason = reason + "; no local cache writes observed (inference host likely remote)"

      save(key, {"reported": now, "last": now})
      print(reason)

      if root == "":
          return {"action": "report", "reason": reason}

      chain = new_chain(root)
      chain.append(step(ev[1], stage_id="Schema Flood",
                        stage_desc="guided-decoding requests to " + host +
                                   " carrying " + str(distinct) +
                                   " unique schemas within 10m"))
      for w in writes:
          chain.append(step(w[0], stage_id="Grammar Cache Growth",
                            stage_desc="grammar/FSM cache write: " + w[1]["path"] +
                                       " (" + str(w[2]) + " writes in window)",
                            activity=w[1]))
      return {"action": "report", "reason": reason, "chain": chain}

  result = run()
