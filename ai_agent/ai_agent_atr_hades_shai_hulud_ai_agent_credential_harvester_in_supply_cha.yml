logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:ANTHROPIC_API_KEY|CLAUDE_API_KEY|claude_desktop_config|\.config[/\\]+claude|\.claude[/\\]+[a-z]|\.mcp\.json)[\s\S]{0,250}(?:requests?\.(?:post|put)|fetch\s*\(|urllib\.request|axios\.(?:post|get)|new\s+XMLHttpRequest|curl[^\n]{0,60}(?:-d\b|--data|-F\b|-T\b|--upload-file|-X\s*POST)|wget[^\n]{0,60}(?:--post-data|--post-file))
  sel_1:
    content|re: (?i)(?:requests?\.(?:post|put)|fetch\s*\(|urllib\.request|axios\.(?:post|get)|curl[^\n]{0,60}(?:-d\b|--data|-F\b|-T\b|--upload-file|-X\s*POST)|wget[^\n]{0,60}(?:--post-data|--post-file)|exfil|webhook\.site|discord\.com[/\\]+api[/\\]+webhooks)[\s\S]{0,250}(?:ANTHROPIC_API_KEY|CLAUDE_API_KEY|claude_desktop_config|\.config[/\\]+claude|\.mcp\.json)
  sel_2:
    content|re: (?i)(?:\.npmrc|\.pypirc|\.aws[/\\]+credentials|id_rsa|\.ssh[/\\]+id_)[\s\S]{0,200}(?:ANTHROPIC_API_KEY|\.mcp\.json|\.config[/\\]+claude|\.npmrc|\.pypirc|\.aws[/\\]+credentials)[\s\S]{0,200}(?:requests?\.post|fetch\s*\(|curl[^\n]{0,60}(?:-d\b|--data|-F\b|-T\b|--upload-file|-X\s*POST)|base64)
  condition: 1 of sel_*
falsepositives:
- Legitimate code that reads ANTHROPIC_API_KEY from the environment to call the API, with NO co-located
  outbound send of the secret to an arbitrary host (the patterns require an AI-agent credential/config
  surface AND a network exfil within ~250 chars).
- An SDK that posts to the real Anthropic/OpenAI endpoint — the exfil token must co-locate with the credential
  read, and benign SDK calls send a request body, not the credential file contents; review flagged hits
  before blocking a first-party SDK.
- Security writeups describing the Hades / Shai-Hulud campaign in prose without an actual credential-read
  + exfil artifact.
- 'RUNTIME/STATIC LIMITATION: a variant that base64/char-code-builds the credential path or the exfil
  host so the literal tokens never appear can evade a pattern match (see evasion_tests).'
action: report
