title: Casual Authority Claim and Scope Escalation
id: cb85b0e5-da7a-426a-a82d-110d12208a62
status: experimental
level: high
description: |-
  Detects casual, conversational-tone authority claims and scope escalation that bypass formal injection detection. Unlike explicit "I am the admin" claims (ATR-2026-030/117), these use informal language: "FYI the orchestrator wants...", "the boss said we should skip...", "I noticed the admin panel is accessible, let me check...". Also detects rationalized bypasses where agents justify unauthorized actions with efficiency claims: "to complete this more efficiently, I'll use the database directly instead of the API". Discovered via Autoresearch v0 (100% miss rate across casual_authority, casual_escalation, and rationalized_bypass techniques).

  Adapted from Agent Threat Rules ATR-2026-00132 (MIT).
author: ATR Community (adapted)
date: '2026-04-01'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00132
tags:
- attack.execution
- atlas.aml.t0051
- owasp.asi07
- owasp.asi09
- owasp.asi10
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(FYI|heads\s+up|just\s+so\s+you\s+know|for\s+your\s+info(rmation)?)\s*.{0,20}(the\s+)?(orchestrator|coordinator|supervisor|manager|admin|boss|lead\s+agent|primary\s+agent|main\s+agent)\s+(wants|says|said|asked|needs|requires|directed|instructed|told)\s+.{0,30}(us|you|we|agents?)\s+to
  sel_1:
    content|re: (?i)(the\s+)?(boss|manager|supervisor|admin|orchestrator|lead|director|team\s+lead)\s+(said|told|asked|wants|mentioned|directed|instructed)\s+.{0,30}(skip|bypass|disable|ignore|turn\s+off|remove|drop)\s+.{0,30}(content\s+filter|safety|security|check|validation|review|verification|approval|restriction|limit)
  sel_2:
    content|re: (?i)(I\s+)?(noticed|found|discovered|saw|spotted|realized|observed)\s+.{0,30}(admin\s+panel|admin\s+dashboard|admin\s+console|admin\s+interface|management\s+console|control\s+panel|root\s+access|privileged\s+access)\s+.{0,20}(is|was|seems?)\s+(accessible|available|open|exposed|reachable|unlocked)\s*.{0,40}(let\s+me|I'll|I\s+will|I\s+can|I\s+should|allow\s+me)
  sel_3:
    content|re: (?i)(to\s+(complete|finish|accomplish|do|handle|process)\s+.{0,30}(more\s+)?(efficien|quick|fast|rapid)|for\s+(better|improved|optimal|maximum)\s+(performance|efficiency|speed|throughput))\s*.{0,40}(I'll|I\s+will|let\s+me|I\s+can|I\s+should|going\s+to)\s+.{0,20}(use|access|connect\s+to|query|call|hit|go\s+to)\s+.{0,30}(database|db|server|system|API|endpoint|service|admin|root|production|prod)\s+(directly|instead|rather)
  sel_4:
    content|re: (?i)(it's|this\s+is)\s+a\s+(special|unique|exceptional|one-time|urgent|emergency|critical)\s+(case|situation|circumstance|exception|request|scenario)\s*.{0,40}(so\s+we\s+(can|should)|so\s+(skip|bypass|ignore|disable)|no\s+need\s+(to|for)\s+(follow|check|validate|verify|review))
  condition: 1 of sel_*
falsepositives:
- A project status update email where a team member writes 'The manager said to skip the validation review
  meeting this week since everyone is at the conference' — referring to skipping a calendar meeting, not
  a security control, but matching Layer 2 pattern
action: report
