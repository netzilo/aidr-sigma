title: LLM Response Eval Injection to Command Execution (llama_index RunGptLLM)
id: 7c1e4f2a-9b6d-4d51-8e3a-2f0c5b7ad914
status: experimental
level: high
description: |
  Detects the exploitation sequence of the RunGptLLM eval() command-injection flaw
  (llama_index <= 0.9.47, fixed in 0.10.13) and the same class of bug in any client
  that passes model-provider output to eval()/exec().

  The rule does not look for an injection payload in the model reply — it looks for
  the BEHAVIOUR that follows a successful injection:

    Stage 1 (required anchor): a Python interpreter in the caller's own process
             lineage exchanged data with an inference endpoint (an LLM_REQUEST /
             LLM_RESPONSE graph edge, or an HTTP_REQUEST whose path is an
             inference route such as /generate, /generate_stream, /v1/chat/completions)
             within the last 120 seconds.
    Stage 2 (required): that same Python lineage then spawned a process whose command
             line has an eval-injection payload shape (reverse shell, download-pipe-to-shell,
             base64-pipe-to-shell, os.system/subprocess/__import__ one-liner,
             socket().connect(), powershell -enc, or direct read of ssh/aws/kube secrets).
    Stage 3 (enrichment): the spawned instance dialled out.

  Attribution is session-exact: the rule anchors on the triggering session, walks its
  true lineage with lineage(), and looks for the model-traffic anchor only on those
  session nodes and their event rows. Nothing is inferred from a path-keyed node walk,
  so the verdict is deterministic for the same input.
author: Tanya
date: "2026-03-05"
modified: "2026-03-05"
references:
  - https://cwe.mitre.org/data/definitions/95.html
  - https://cwe.mitre.org/data/definitions/78.html
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
  - https://github.com/run-llama/llama_index
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.006
  - attack.t1203
  - owasp.llm05
falsepositives:
  - Python-hosted code-interpreter agents (LangChain PythonREPL, pandas/dataframe agents,
    Jupyter kernels, notebook tools) that legitimately execute model-authored code. These
    genuinely produce Stage 1 + Stage 2 and will be reported; the rule is report-only for
    exactly this reason and the kill chain shows the payload so a triager can dismiss it.
  - A Python build/bootstrap wrapper running an installer one-liner (`curl ... | sh`,
    `base64 -d | sh`) in the same 2-minute window as unrelated model traffic. Mitigated by
    requiring the anchor to be an LLM edge or an HTTP request to an inference-shaped path,
    not any outbound HTTP (package-index traffic does not qualify).
  - Shared build hosts where an unrelated Python process happens to spawn a matching
    command inside the 120-second window of a colocated inference call, when both processes
    share an ancestor in the resolved lineage.
  - Deliberate red-team or CVE-validation runs that trigger the RunGptLLM eval() path.
  - Devops automation that reads ~/.ssh or ~/.aws material from a Python wrapper for
    legitimate credential rotation.
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - llm
  - http
  - connect
detection:
  sel_exec_payload:
    event_type: execute_process
    content|re:
      - '/dev/tcp/'
      - '(?i:\bbash\s+-i\b)'
      - '(?i:\bnc\b\s+[^\n]{0,60}-[a-zA-Z]*e\b)'
      - '(?i:\b(curl|wget)\b[^\n|]{0,200}\|)'
      - '(?i:\bbase64\b[^\n]{0,80}\|)'
      - '__import__'
      - '(?i:\bos\.(system|popen|exec|spawn))'
      - '(?i:\bsubprocess\.)'
      - '(?i:\b(eval|exec)\s*\()'
      - 'socket\.socket'
      - '(?i:-(enc|encodedcommand)\b)'
      - '(/\.ssh/id_|/\.aws/credentials|/etc/shadow|/\.kube/config)'
  condition: sel_exec_payload
action: execute
on_timeout: allow
on_error:   allow
script: |
  # ── llama_index RunGptLLM eval() -> OS command execution (CWE-95 / CWE-78) ──
  WINDOW_NS = 120000000000   # 2 min: model output must precede the injected exec
  SKEW_NS   = 5000000000     # tolerate 5s of clock skew on graph timestamps
  DEDUP_NS  = 600000000000   # re-report the same payload after 10 min

  # A Python-family interpreter must be in the caller's lineage: the eval() runs
  # in-process inside the vulnerable client library.
  PY_RE = r"[/\\](python[0-9.]*|pypy[0-9.]*|ipython|jupyter|uvicorn|gunicorn)(\.exe)?$"

  # Inference-endpoint routes — narrows what counts as "model output" evidence.
  INFER_RE = r"(?i:/v1/chat/completions|/v1/completions|/v1/messages|/v1/responses|/chat/completions|/completions|/generate_stream|/generate|/api/generate|/api/chat|/invocations|/predict|/infer|:generatecontent|:streamgeneratecontent)"

  # Payload shapes an eval()'d provider response produces when it reaches the OS.
  PAYLOAD = [
      r"/dev/tcp/",
      r"(?i:\bbash\s+-i\b)",
      r"(?i:\bnc\b\s+[^\n]{0,60}-[a-zA-Z]*e\b)",
      r"(?i:\b(curl|wget)\b)[^\n|]{0,200}\|\s*(bash|sh|zsh|dash|python[0-9.]*)\b",
      r"(?i:\bbase64\b)[^\n]{0,80}\|\s*(bash|sh|zsh|dash|python[0-9.]*)\b",
      r"\b__import__\s*\(",
      r"\bos\.(system|popen|execl|execle|execv|execve|spawnl|spawnv)\s*\(",
      r"\bsubprocess\.(Popen|run|call|check_output|check_call)\s*\(",
      r"\b(eval|exec)\s*\(\s*[A-Za-z_][A-Za-z0-9_.]*\s*[\),]",
      r"socket\.socket\([^)]{0,60}\)[^\n]{0,160}connect\s*\(",
      r"(?i:powershell)\b[^\n]{0,80}-(enc|encodedcommand)\b",
      r"(?i:\b(cat|head|tail|base64|tar|zip)\b)[^\n]{0,100}(/\.ssh/id_|/\.aws/credentials|/etc/shadow|/\.kube/config)",
  ]

  def is_python(p):
      return re.find(PY_RE, p) != None

  def payload_hit(cmd):
      for pat in PAYLOAD:
          if re.find(pat, cmd) != None:
              return pat
      return ""

  def cmd_of(content):
      # execute_process content is {"command": ..., "path": ...}; fall back to the raw text
      m = re.find(r'"command"\s*:\s*"((?:[^"\\]|\\.)*)"', content)
      if m == None:
          return content
      inner = m[m.find(":") + 1:].strip()
      inner = inner[1:len(inner) - 1]
      return inner.replace('\\"', '"').replace("\\\\", "\\")

  def edge_ts(e):
      for k in ["last_ts", "ts", "first_ts"]:
          v = e.get(k, "")
          if v != "":
              return int(v)
      return 0

  def base(p):
      parts = p.split("/")
      p2 = parts[len(parts) - 1]
      parts = p2.split("\\")
      return parts[len(parts) - 1]

  def ev_edge(e):
      t = e.get("ts", "0")
      frm = e.get("session_id", "")
      if e.get("kind", "") == "SPAWNED":
          frm = e.get("parent_session", "")
      return {
          "from":     frm,
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", ""),
          "dir":      "out",
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
      }

  def peer_label(e):
      p = node(e.get("to", ""))
      if p == None or p.get("_type", "") == "Session":
          p = node(e.get("from", ""))
      if p == None:
          return "?"
      return p.get("host", "") or p.get("provider", "") or p.get("id", "")

  def run():
      # 1 ── relevance gate: pure string work on meta, no graph / no event log.
      if meta.get("context_type", "") != "execute_process":
          return "allow"
      cmd = cmd_of(meta.get("content", ""))
      if cmd == "":
          return "allow"
      pat = payload_hit(cmd)
      if pat == "":
          return "allow"

      trigger_ts = int(meta.get("event_ts", "0"))
      if trigger_ts == 0:
          return "allow"

      # 2 ── session-exact attribution (never a path-keyed node walk).
      inst = session()
      if inst == None:
          return "allow"           # degraded — re-fires when the session lands
      lineage_ = lineage(inst["id"])
      if len(lineage_) == 0:
          return "allow"

      # 3 ── required: a Python interpreter close above the spawned command.
      py    = None
      depth = 0
      for x in lineage_:
          if depth > 3:
              break
          if is_python(x.get("path", "")):
              py = x
              break
          depth = depth + 1
      if py == None:
          return "allow"

      # 4 ── required anchor A: model traffic on the graph for this lineage.
      anchor_edge = None
      anchor_ev   = None
      anchor_ts   = 0
      anchor_desc = ""
      root_id     = py["id"]

      for x in lineage_:
          for kd in ["LLM_RESPONSE", "LLM_REQUEST"]:
              for e in edges(x["id"], dir="both", kind=kd):
                  ets = edge_ts(e)
                  if ets <= 0 or ets > trigger_ts + SKEW_NS:
                      continue
                  if trigger_ts - ets > WINDOW_NS:
                      continue
                  if ets > anchor_ts:
                      anchor_ts   = ets
                      anchor_edge = e
                      anchor_desc = kd + " " + peer_label(e)

      # 4b ── anchor B: HTTP request from this lineage to an inference route.
      #        Only inference-shaped paths qualify as model output — ordinary
      #        outbound HTTP (package indexes, telemetry) is not evidence.
      if anchor_edge == None:
          for x in lineage_:
              rows = events(kind="HTTP_REQUEST", session=x["id"],
                            since_ns=trigger_ts - WINDOW_NS,
                            until_ns=trigger_ts + SKEW_NS,
                            limit=200)
              for e in rows:
                  if re.find(INFER_RE, e.get("path", "")) == None:
                      continue
                  ets = int(e.get("ts", "0"))
                  if ets > anchor_ts:
                      anchor_ts   = ets
                      anchor_ev   = e
                      anchor_desc = "HTTP " + e.get("method", "") + " " + \
                                    e.get("host", "?") + e.get("path", "")

      if anchor_edge == None and anchor_ev == None:
          return "allow"           # no untrusted model output preceded the exec

      # 5 ── dedup: same session + same payload inside DEDUP_NS reports once.
      key    = inst["id"] + "|" + cmd[:120]
      seen   = store_get("reported") or {}
      pruned = {}
      for k in seen:
          if trigger_ts - int(seen[k]) < DEDUP_NS:
              pruned[k] = seen[k]
      if key in pruned:
          return "allow"

      # 6 ── kill chain, rooted at the Python host session.
      chain = new_chain(root_id)
      gap   = str((trigger_ts - anchor_ts) // 1000000000)
      if anchor_edge != None:
          chain.append(step(anchor_edge,
                            stage_id="Untrusted Model Output",
                            stage_desc="inference exchange (" + anchor_desc +
                                       ") by " + base(py.get("path", "")) +
                                       " " + gap + "s before the exec"))
      else:
          chain.append(step(ev_edge(anchor_ev),
                            stage_id="Untrusted Model Output",
                            stage_desc="inference endpoint fetched (" + anchor_desc +
                                       ") by " + base(py.get("path", "")) +
                                       " " + gap + "s before the exec"))

      # The trigger stage comes from meta (its own SPAWNED row races ingest).
      parent_id = py["id"]
      if len(lineage_) > 1:
          parent_id = lineage_[1]["id"]
      exec_edge = {
          "from":     parent_id,
          "to":       inst["id"],
          "kind":     "SPAWNED",
          "ts":       str(trigger_ts),
          "first_ts": str(trigger_ts),
          "last_ts":  str(trigger_ts),
          "cmdline":  cmd[:400],
      }
      chain.append(step(exec_edge,
                        stage_id="Eval Injection to Command Execution",
                        stage_desc=base(py.get("path", "")) + " spawned " +
                                   base(inst.get("path", "")) +
                                   " matching payload shape " + pat + ": " + cmd[:200]))

      # 7 ── optional enrichment: did the spawned session dial out?
      egress = ""
      for e in events(kind="CONNECTS", session=inst["id"],
                      since_ns=trigger_ts - WINDOW_NS,
                      limit=20):
          h = e.get("host", "")
          if h != "":
              egress = h + ":" + e.get("port", "")
              chain.append(step(ev_edge(e),
                                stage_id="Post-Exploitation Egress",
                                stage_desc="spawned process connected to " + egress))
              break

      names = []
      for x in lineage_:
          names.append(base(x.get("path", "")))
      reason = "Possible eval-injection command execution (RunGptLLM class, CWE-95): " + \
               "inference response to " + base(py.get("path", "")) + " followed " + \
               gap + "s later by " + " <- ".join(names) + " running: " + cmd[:200]
      if egress != "":
          reason = reason + " | egress " + egress
      print(reason)

      if store_usage()["free"] > 16384 and len(pruned) < 200:
          pruned[key] = str(trigger_ts)
          store_set("reported", pruned)

      return {
          "action": "report",
          "reason": reason,
          "chain":  chain,
      }

  result = run()
