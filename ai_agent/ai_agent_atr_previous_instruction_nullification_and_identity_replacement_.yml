title: Previous Instruction Nullification and Identity Replacement Jailbreak
id: b17cc1ac-0741-4a7d-ae1c-21b5428181c8
status: experimental
level: high
description: |-
  Detects jailbreak attempts that explicitly instruct the AI to ignore previous instructions and replace its identity with a harmful persona. This technique combines instruction nullification ("ignore all instructions previously given") with identity replacement ("you will no longer act as [model], but act as [harmful persona]") to bypass safety mechanisms. The attack creates a new behavioral framework that claims to override the original system prompt and safety guidelines. Common personas include Skynet, DAN variants, or custom "unrestricted" AI characters with detailed instructions to ignore ethical constraints and output harmful content.

  Adapted from Agent Threat Rules ATR-2026-00240 (MIT).
author: ATR Community (adapted)
date: '2026-04-19'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00240
- 'https://arxiv.org/abs/2402.16914 - DrAttack: Prompt Decomposition and Reconstruction Makes Powerful
  LLM Jailbreakers'
tags:
- attack.initial-access
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: ignore\s+(all|any|every|the)\s+(instructions?|prompts?|directives?|commands?|guidelines?|rules?)\s+(previously\s+)?(given|provided|sent|issued)\s+(to\s+)?you
  sel_1:
    response|re: (?i)(you\s+will\s+no\s+longer|you\s+are\s+no\s+longer|stop\s+being|cease\s+to\s+be)\s+(act|acting|function|operating|behaving)\s+(as|like)\s+([A-Z][a-zA-Z]+|ChatGPT|Claude|GPT|Bard|Gemini|the\s+AI|an?\s+AI\s+(assistant|model))
  sel_2:
    response|re: (?i)(you\s+will\s+act|you\s+will\s+now\s+act|act|behave|function|operate)\s+(as|like)\s+(an?\s+AI\s+(called|named)|a\s+(callous|heartless|evil|malicious|unethical|immoral|dangerous|harmful|unrestricted|unfiltered))
  sel_3:
    response|re: (?i)(has\s+no|lacks|without|free\s+from|devoid\s+of)\s+(moral|ethical|legal)\s+(bounds?|restrictions?|limitations?|constraints?|guidelines?)
  sel_4:
    response|re: (?i)(will\s+(return|provide|give|output)\s+anything|will\s+(never\s+)?(deny|refuse)\s+(any\s+)?request|execute\s+ANYTHING)
  condition: 1 of sel_*
falsepositives:
- Academic discussions about AI model switching or instruction processing
- Legitimate roleplay scenarios without harmful persona characteristics
- Security research documenting jailbreak techniques as examples
action: report
