title: Policy Puppetry / XML Role-Config Injection
id: db162524-d85b-439d-8f7e-c2d02ed2677b
status: experimental
level: critical
description: |-
  Detects Policy Puppetry (Hidden Layer, 2024) — a universal prompt injection technique that injects a forged XML configuration block mimicking an operator system prompt. The attacker sends an `<interaction-config>` or similar XML structure that redefines the agent's role (e.g. "Medical Advisor"), blocks refusal strings ("I'm sorry" is a blocked-string), and allows only the attacker-specified response types. From NVIDIA garak doctor.py Puppetry probe. The technique is "post-instruction hierarchy" — it exploits models that treat XML-formatted content in user turns as authoritative configuration overrides. High severity because it is model-agnostic and transferable across providers.

  Adapted from Agent Threat Rules ATR-2026-00280 (MIT).
author: ATR Community (adapted)
date: '2026-04-19'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00280
- https://github.com/NVIDIA/garak/blob/main/garak/probes/doctor.py
- https://hiddenlayer.com/innovation-hub/novel-universal-bypass-for-all-major-llms/
- https://cwe.mitre.org/data/definitions/1427.html
tags:
- attack.initial-access
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: <(?:interaction[\s_-]?config|system[\s_-]?config|agent[\s_-]?config|operator[\s_-]?config|policy[\s_-]?config|llm[\s_-]?config)\s*>
  sel_1:
    response|re: <(?:blocked[\s_-]?(?:string|strings?|mode|modes?|response|responses?|output)|forbidden[\s_-]?(?:string|phrase|word))\s*>(?:I\s*["\x27]?m\s+sorry|I\s+cannot|I\s+(?:am\s+)?unable|refusal|deny|I\s+can\s*["\x27]?t|please\s+consult)
  sel_2:
    response|re: <(?:role|persona|identity|agent[\s_-]?role)\s*>(?:Medical\s+Advisor|Legal\s+Advisor|Financial\s+Advisor|Security\s+Expert|Admin|Root|System\s+Administrator|Unrestricted\s+AI|DAN|DUDE|Jailbreak)\s*</(?:role|persona|identity|agent[\s_-]?role)>
  sel_3:
    response|re: <(?:blocked[\s_-]?modes?|disallowed[\s_-]?modes?|forbidden[\s_-]?(?:modes?|responses?|outputs?))\s*>(?:apologetic|refusal|denial|denial[\s,]+refusal|safe\s+mode|content\s+filtering)\s*</(?:blocked[\s_-]?modes?|disallowed[\s_-]?modes?|forbidden[\s_-]?(?:modes?|responses?|outputs?))>
  sel_4:
    response|re: (?:<(?:interaction[\s_-]?config|system[\s_-]?config)[^>]*>|<blocked[\s_-]?string>).{0,1000}(?:<(?:allowed[\s_-]?responses?|requests[\s_-]?allowed|responses[\s_-]?allowed)>|<(?:role|persona)>)
  condition: 1 of sel_*
falsepositives:
- Legitimate XML-based system prompt configurations in agent frameworks that use XML format
- Anthropic constitutional AI examples showing role configuration in documentation
- Developers testing XML parsing in LLM pipelines with benign config structures
action: report
