title: Credential Exfiltration via Shell Pipe
id: a0275095-cc78-401d-88fc-d591588e90f8
status: experimental
level: critical
description: |-
  Detects credential theft patterns where environment variables containing API keys, secrets, or tokens are piped to external commands (curl, nc, etc.) or echoed for capture. Also detects explicit references to provider-specific API key variable names (ANTHROPIC_*, OPENAI_*, AWS_*, etc.) which may indicate reconnaissance or targeting. Derived from real-world Claude Code skill scanning.

  Adapted from Agent Threat Rules ATR-2026-00201 (MIT).
author: ATR Community (adapted)
date: '2026-04-05'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00201
tags:
- attack.exfiltration
- attack.t1041
- attack.t1552.001
- atlas.aml.t0051.001
- owasp.asi06
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)echo\s+\$\{?[A-Z_]*(API_KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)[A-Z_]*\}?\s*\|
  sel_1:
    content|re: (?i)(cat|printenv|env|set)\s+.{0,20}(API_KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)\s*\|
  sel_2:
    content|re: (?i)curl\s+.{0,100}(-d|--data)\s+.{0,30}(key|token|secret|password|credential)
  condition: 1 of sel_*
falsepositives:
- Setup documentation explaining how to configure API keys
- Debugging guides that show how to verify key configuration
action: report
