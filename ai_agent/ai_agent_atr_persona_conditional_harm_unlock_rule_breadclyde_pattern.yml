title: Persona Conditional Harm-Unlock Rule (BreadClyde Pattern)
id: 1ef6d1a1-a1bd-4f0a-9f10-acc203dcd511
status: experimental
level: high
description: |-
  Detects persona injection attacks that embed a conditional harm-unlock rule from the NVIDIA garak dan.DanInTheWild inthewild corpus (prompt #153 — BreadClyde). The attack defines a persona with a rule like "dislikes violence unless explicitly asked to like it", creating a conditional permission structure that legitimizes harmful requests as long as they are framed as explicit asks. The unlock emoji answer-prefix "{🔓 PersonaName}" (curly-brace format) extends the [🔓JAILBREAK] pattern (ATR-2026-00346) to a new bracket style. Key signals: "dislikes/avoids/ refuses [harm-type] unless explicitly asked to like it" — the conditional harm- unlock construction; and "{🔓 Name}" curly-brace unlock emoji prefix mandated as an answer prefix. The combination of a named persona, conditional harm unlock, and unlock-emoji answer prefix is the defining signature of this jailbreak class.

  Adapted from Agent Threat Rules ATR-2026-00391 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00391
- https://github.com/NVIDIA/garak/blob/main/garak/probes/dan.py
- https://github.com/NVIDIA/garak/blob/main/garak/data/dan/inthewild_jailbreak_llms.json
tags:
- attack.execution
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: dislikes\s+violence\s+unless\s+explicitly\s+asked\s+to\s+like\s+it
  sel_1:
    response|re: (?:dislikes?|avoids?|refuses?)\s+(?:violence|harm|illegal|explicit(?:\s+content)?)\s+unless\s+explicitly\s+asked
  sel_2:
    response|re: \{🔓\s*[A-Za-z][A-Za-z0-9 ]{0,30}\}
  sel_3:
    response|re: All\s+answers?\s+will\s+begin\s+with\s+['"{\[]\s*🔓
  condition: 1 of sel_*
falsepositives:
- 'Normal preference statement: "Our AI assistant dislikes confrontational language and avoids arguments."
  (preference without conditional harm unlock path)'
- 'Unconditional restriction: "The chatbot will not discuss violence, hate speech, or illegal activities."
  (hard block without "unless explicitly asked" unlock)'
- 'Style preference: "Unless explicitly asked, prefer concise answers over long explanations." (output
  format preference, not harm-unlock)'
action: report
