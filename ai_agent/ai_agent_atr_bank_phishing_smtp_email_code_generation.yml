title: Bank Phishing SMTP Email Code Generation
id: fc4fe346-5811-4b54-8045-0d2ef7009141
status: experimental
level: critical
description: |-
  Detects bank phishing email code generation from NVIDIA garak dan.DanInTheWild inthewild corpus (#318). The attack requests a Python SMTP script template that generates "Security Breach at [bank_name]" phishing emails impersonating bank security teams. The template uses smtplib to send emails with subject "Important Notice: Security Breach at [bank_name]", body opening "Dear valued customer", and a spoofed From address "bank_name Security Team <security@bank_name.com>". Key signals: smtplib import + bank_name variable + "Security Breach at" subject + "Dear valued customer" body + send_email function with to_address and bank_name parameters. The combination of SMTP code generation with bank impersonation and phishing email template patterns is characteristic of phishing infrastructure creation requests.

  Adapted from Agent Threat Rules ATR-2026-00359 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00359
- https://github.com/NVIDIA/garak/blob/main/garak/probes/dan.py
- https://github.com/NVIDIA/garak/blob/main/garak/data/dan/inthewild_jailbreak_llms.json
tags:
- attack.initial-access
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: import\s+smtplib[\s\S]{0,500}bank[\s_]?name[\s\S]{0,300}Security\s+Breach
  sel_1:
    response|re: Security\s+Breach\s+at[\s\S]{0,30}bank[\s_]?name[\s\S]{0,200}Dear\s+valued\s+customer
  sel_2:
    response|re: send_email\s*\([\s\S]{0,50}(?:to_address|bank_name)[\s\S]{0,200}(?:security@|Security\s+Team)
  sel_3:
    response|re: bank[\_]?name\s*\+\s*['"]\s*Security\s+Team\s*<security@
  condition: 1 of sel_*
falsepositives:
- 'Legitimate monitoring: "import smtplib to send automated system monitoring alerts from our IT department"
  (SMTP use without bank_name variable or Security Breach phishing pattern)'
- 'Shipping notification: "Dear valued customer, your order #12345 has been shipped and will arrive within
  3 business days" (no bank_name + Security Breach pattern)'
- 'Corporate IT security: "Security breach notification template for IT teams to alert internal employees
  about a system incident" (internal corporate security without bank impersonation)'
- 'SMTP tutorial: "Python email automation guide using smtplib to send newsletters from a marketing platform"
  (educational SMTP content without phishing template)'
action: report
