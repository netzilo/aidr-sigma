title: Cursor Terminal Cmd-K Webpage Prompt Injection to Command Execution
id: 7b3c1f42-9d5e-4a08-b6c1-2f8e5a4d91c7
status: experimental
level: medium
description: |
  Single-event content detection for the Cursor Terminal Cmd-K / Ctrl-K indirect
  prompt-injection chain (attacker-controlled webpage content imported into the
  terminal command-generation prompt, mitigated server- and client-side in
  September 2024).

  The engine cannot represent the causal chain: there is no PROMPT_INJECTION,
  LLM_OUTPUT or EXECUTE_COMMAND edge, and no user_prompt event type, so the
  LLM-mediated translation from injected webpage text into a shell command is
  invisible. This rule therefore deliberately does NOT try to correlate a page
  fetch with a later terminal command (which would be indistinguishable from
  browsing plus unrelated shell use). Instead it fires only on two single events
  that are individually high-specificity and are both scoped to the Cursor
  process:

    A. execute_process whose command line, spawned under Cursor, carries an
       attacker-shaped execution primitive that a legitimate Cmd-K generation
       essentially never produces: cleartext-HTTP or tunnel/paste-service fetch
       piped straight into an interpreter, decode-and-execute, fetch-chmod-run,
       credential-path read piped to an egress tool, or literal instruction-
       override text surviving into the command line alongside a dangerous
       primitive.

    B. http_request from Cursor (or to a Cursor API host) whose body contains
       instruction-override text AND terminal-command-generation markers AND an
       explicit directive to run a shell primitive - i.e. the injected page text
       observed inside the Cmd-K prompt itself, before any command exists.

  Neither branch claims to prove causality; each is an artefact that only appears
  when the Cmd-K prompt or its output has been poisoned. Report-only.
author: Selhan
date: "2026-06-12"
references:
  - https://attack.mitre.org/techniques/T1059/
  - https://atlas.mitre.org/techniques/AML.T0051
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
tags:
  - attack.execution
  - attack.t1059
  - attack.initial-access
  - atlas.aml.t0051
  - owasp.llm01
falsepositives:
  - A detection or security engineer authoring, grepping or testing prompt-injection
    rules inside the Cursor integrated terminal - mitigated by filter_rule_authoring
    (Sigma/YAML rule keys, promptfoo/garak/llm-guard markers) and
    filter_readonly_search (grep/rg/git-grep/less/head style read-only commands).
  - Bootstrap installers that legitimately pipe a downloaded script into a shell
    (rustup, nvm, homebrew, docker convenience script). These are served over HTTPS
    to a normal domain, so sel_remote_shape (which requires cleartext http:// to a
    dotted public host, a tunnel/paste service, or URL userinfo credentials) does
    not match them.
  - Local development servers (http://localhost, http://127.0.0.1, RFC1918 hosts)
    fetched and piped to a shell. sel_remote_shape requires an alphabetic TLD after
    a dot, so hostless and dotted-quad targets never satisfy it - achieved by
    narrowing the pattern, not by trusting any host.
  - Legitimate developer requests such as "scp my deploy key to the build box" or
    reading a .env file into a curl call - real, and the reason this branch requires
    both a credential-shaped path and an egress primitive in the same command line,
    and the reason the rule is report-only.
  - A user pasting security-awareness or red-team documentation that quotes
    "ignore previous instructions" into the Cmd-K prompt - branch B additionally
    requires terminal-command-generation markers and an explicit run/execute
    directive naming a shell primitive, and filter_placeholder suppresses obvious
    illustrative payloads.
  - Cursor telemetry or crash reports echoing a previously blocked command line.
logsource:
  product: ai_agent
  category: agent_events
detection:

  # ── event scoping ──────────────────────────────────────────────────────────
  sel_evt_exec:
    event_type: execute_process
  sel_evt_http:
    event_type: http_request

  # ── product scoping: the CVE is specific to Cursor's Cmd-K terminal flow ──
  sel_cursor_agent:
    agent_name|re: '(?i)(cursor\.app[/\\]|[/\\]cursor[/\\]|[/\\]cursor( helper)?(\.exe)?$)'
  sel_cursor_api_host:
    host|re: '(?i)(^|\.)cursor\.(sh|com)$'

  # ── branch A1: remote content piped straight into an interpreter ──────────
  sel_fetch_pipe:
    command|re: '(?i:\b(curl|wget|httpie|iwr|invoke-webrequest)\b)[^|]{0,300}\|[^|]{0,40}\b(bash|sh|zsh|ksh|dash|python3?|perl|ruby|node|osascript|pwsh|powershell)\b'
  sel_remote_shape:
    command|re:
      - '(?i)http://[a-z0-9][a-z0-9._-]{0,60}\.[a-z]{2,24}([:/?#]|\s|$)'
      - '(?i)https?://([a-z0-9._-]{1,60}\.)?(ngrok(-free)?\.(io|app|dev)|trycloudflare\.com|loca\.lt|serveo\.net|localhost\.run|webhook\.site|requestbin\.(com|net|in)|oastify\.com|interact\.sh|burpcollaborator\.net|transfer\.sh|0x0\.st|termbin\.com|pastebin\.com|paste\.ee|dpaste\.org|ix\.io|sprunge\.us|bashupload\.com|filebin\.net|gofile\.io|tmpfiles\.org)([:/?#]|\s|$)'
      - '(?i)https?://[a-z0-9._%+-]{1,40}:[^@\s/]{1,60}@'

  # ── branch A2: decode-and-execute (never a legitimate generated command) ──
  sel_decode_exec:
    command|re:
      - '(?i)\bbase64\s+-{1,2}d(ecode)?\b[^|]{0,60}\|[^|]{0,40}\b(bash|sh|zsh|python3?|perl|node)\b'
      - '(?i)\becho\s+[A-Za-z0-9+/=]{40,}[^|]{0,20}\|[^|]{0,40}\bbase64\s+-{1,2}d'
      - '(?i)\b(bash|sh|zsh)\s+-c\s+[^\n]{0,30}\$\(\s*(curl|wget)\b'
      - '(?i)\bpython3?\s+-c\s+[^\n]{0,80}(urlopen|urlretrieve|requests\.get)[^\n]{0,80}\b(exec|eval|system|popen)\b'
      - '(?i)\b(powershell|pwsh)\b[^|]{0,80}\s-e(nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{20,}'

  # ── branch A3: fetch to disk, make executable, run ────────────────────────
  sel_fetch_chmod_exec:
    command|re:
      - '(?i:\b(curl|wget|iwr)\b)[\s\S]{0,300}\bchmod\s+(\+x|[0-7]*7[0-7][0-7])'
      - '(?i:\b(curl|wget)\b)[\s\S]{0,200}(&&|;)\s*(\./|/tmp/|/var/tmp/|\$HOME/|\$TMPDIR/)[^\s]{1,60}'

  # ── branch A4 / B: literal instruction-override text ──────────────────────
  sel_injection_phrase:
    content|re:
      - '(?i)\bignor(e|ing)\s+(all\s+|any\s+|the\s+)?(previous|prior|above|preceding|earlier|foregoing)\s+(instruction|prompt|rule|direction|context)'
      - '(?i)\bdisregard\s+(all\s+|any\s+|the\s+)?(previous|prior|above|preceding|earlier)\s+(instruction|prompt|rule)'
      - '(?i)\b(new|updated|revised|override)\s+(system\s+)?(instructions?|task|directive)s?\s*[:\-]'
      - '(?i)\byou\s+are\s+now\s+(a|an|in|the)\b'
      - '(?i)\b(system|developer)\s+(prompt\s+)?(override|overridden|bypass)\b'
      - '(?i)\bdo\s+not\s+(tell|inform|mention|show|reveal)\s+(this\s+to\s+)?the\s+user\b'
      - '(?i)\bwithout\s+(informing|telling|notifying|asking)\s+the\s+user\b'
      - '(?i)\b(important|urgent|attention)\s*[:!]\s*(ai|assistant|agent|cursor|llm|model)\b'
      - '(?i)<\|?\s*(im_start|im_end|system)\s*\|?>'
  sel_danger_primitive:
    command|re:
      - '(?i:\b(curl|wget|nc|ncat|socat|scp|ssh)\b)'
      - '/dev/tcp/'
      - '(?i)\bbase64\s+-{1,2}d'
      - '(?i)\bchmod\s+\+x'
      - '(?i)\brm\s+-rf\s+(/|~|\$HOME)'
      - '(?i)\bhistory\s+-c\b'
      - '(?i)\b(osascript|powershell|pwsh)\b'

  # ── branch A5: credential-shaped read paired with an egress primitive ─────
  sel_secret_path:
    command|re: '(?i)(\.ssh/id_(rsa|dsa|ecdsa|ed25519)|\.aws/credentials|\.config/gcloud|\.kube/config|\.docker/config\.json|\.npmrc|\.pypirc|\.git-credentials|\.netrc|\.gnupg/|\.env(\.[a-z]{1,12})?(\s|$|\"|\))|login\.keychain|Cookies\.binarycookies)'
  sel_outbound:
    command|re:
      - '(?i:\b(curl|wget|nc|ncat|socat|scp|rsync|ssh|sendmail)\b)'
      - '/dev/tcp/'

  # ── branch B: the Cmd-K generation prompt itself ──────────────────────────
  sel_cmdk_context:
    content|contains:
      - 'cmd_k'
      - 'cmdk'
      - 'terminal_command'
      - 'shell_command'
      - 'is_terminal'
      - 'generate a terminal command'
      - 'generate the terminal command'
      - 'terminal cmd'
      - 'run in terminal'
  sel_exec_directive:
    content|re:
      - '(?i)\b(run|execute|paste|type|append|emit|output|return)\b[^.\n]{0,60}\b(curl|wget|bash\b|sh\s+-c|zsh|powershell|pwsh|nc\s|socat|base64|chmod|rm\s+-rf)'
      - '(?i)\b(the\s+)?(following|below|this)\s+(command|script|one-?liner)\b[^.\n]{0,40}\b(run|execute|paste)\b'

  # ── filters: benign look-alikes (content-only, no host/domain/path trust) ─
  filter_readonly_search:
    command|re: '(?i)^\s*(sudo\s+)?([a-z0-9._/\\-]*[/\\])?(grep|egrep|fgrep|rg|ag|ack|findstr|less|more|head|tail|wc|man|which|type|file|git)\b'
  filter_help_dryrun:
    command|re: '(?i)(--help\b|--dry-run\b|--version\b|\bman\s+(curl|wget|bash|zsh)\b)'
  filter_rule_authoring:
    content|contains:
      - 'falsepositives:'
      - 'logsource:'
      - 'detection:'
      - 'sigma rule'
      - 'promptfoo'
      - 'garak'
      - 'llm-guard'
      - 'rebuff'
      - 'rulelint'
  filter_placeholder:
    content|re: '(?i)\b(placeholder|<your[-_ ]|your_token_here|xxxxxxxx|redacted|lorem ipsum|do not run this|for illustration only|sample payload|proof.of.concept only)\b'

  condition: >
    (
      (sel_evt_exec and sel_cursor_agent and (
        (sel_fetch_pipe and sel_remote_shape)
        or sel_decode_exec
        or sel_fetch_chmod_exec
        or (sel_injection_phrase and sel_danger_primitive)
        or (sel_secret_path and sel_outbound)
      ))
      or
      (sel_evt_http and (sel_cursor_agent or sel_cursor_api_host)
        and sel_injection_phrase and sel_cmdk_context and sel_exec_directive)
    )
    and not (filter_readonly_search or filter_help_dryrun
             or filter_rule_authoring or filter_placeholder)
action: report
