title: Codex Agent Credential-to-Egress One-Liner
id: 7c3f2a9e-5b41-4d86-9f0a-2e6d1b47c3aa
status: experimental
level: high
description: |
  Post-injection terminal artefact detection for code-generation agents
  (GPT-5.1-Codex-Max class). The rule deliberately does NOT attempt to detect
  "an injected instruction" as text: the engine exposes no PROMPT_INJECTION,
  EXECUTE_CODE, NETWORK_ACCESS or SANDBOX_ESCAPE_ATTEMPT edge, and no
  file_access event, so the injection -> escape -> exfiltration chain cannot be
  correlated. What IS observable is the single artefact that any successful
  injection of this class must eventually produce inside the sandbox: one
  spawned command line that BOTH references concrete credential material
  (~/.aws/credentials, ~/.ssh/id_*, ~/.netrc, ~/.codex/auth.json, gh hosts.yml,
  kubeconfig, /etc/shadow, /proc/self/environ, or a literal AKIA / PEM / PAT /
  Slack / Anthropic key string) AND invokes an outbound transfer primitive
  (curl, wget, socat, ncat, command-position nc/scp/sftp/rsync/ftp, an
  interpreter one-liner using an HTTP client, or PowerShell web cmdlets) in the
  same process invocation. A second, independent branch fires when an outbound
  HTTP request carries a token class in its query string that is never
  legitimately query-borne (GitHub PAT, Slack token, Anthropic API key, raw or
  base64 PEM header).

  Neither branch infers intent from a lone generic primitive: a bare curl, a
  bare credential read, or a bare process spawn is ignored. Only the
  co-occurrence of secret source and egress sink in one event is reported.
author: Selhan
date: "2026-06-12"
modified: "2026-06-12"
references:
  - https://openai.com/index/gpt-5-1-codex-max-system-card/
  - https://attack.mitre.org/techniques/T1552/001/
  - https://attack.mitre.org/techniques/T1567/
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.exfiltration
  - attack.t1567
  - attack.execution
  - attack.t1059
  - atlas.aml.t0051
  - atlas.aml.t0050
  - atlas.aml.t0025
  - owasp.llm01
  - owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:

  # ── Branch A: sandboxed process spawn that fuses secret source + egress sink ──
  sel_exec_event:
    event_type: execute_process

  sel_exec_credsource:
    command|re:
      - '(?i)\.aws/credentials\b'
      - '(?i)\.ssh/id_(rsa|dsa|ecdsa|ed25519)([^.A-Za-z0-9]|$)'
      - '(?i)\.ssh/identity([^.A-Za-z0-9]|$)'
      - '(?i)\.netrc([^A-Za-z0-9]|$)'
      - '(?i)\.git-credentials\b'
      - '(?i)\.kube/config([^A-Za-z0-9]|$)'
      - '(?i)\.docker/config\.json\b'
      - '(?i)\.config/gcloud/[A-Za-z_]*credentials\.json'
      - '(?i)\.azure/(accessTokens\.json|msal_token_cache)'
      - '(?i)\.codex/auth\.json\b'
      - '(?i)\.config/gh/hosts\.ya?ml\b'
      - '(?i)\.gnupg/(secring\.gpg|private-keys-v1\.d)'
      - '/etc/shadow([^A-Za-z0-9]|$)'
      - '/proc/self/environ\b'
      - '\bAKIA[0-9A-Z]{16}\b'
      - '-----BEGIN [A-Z ]{0,24}PRIVATE KEY-----'
      - '\b(ghp|ghs|ghu|ghr)_[A-Za-z0-9]{36}\b'
      - '\bsk-ant-api03-[A-Za-z0-9_-]{20,}'
      - '\bxox[baprs]-[A-Za-z0-9-]{12,}'

  sel_exec_netsink:
    command|re:
      - '\b(?i:curl|wget|socat|ncat|netcat)\b'
      - '(^|[|;&("`]|\$\()\s*(?i:nc|scp|sftp|rsync|ftp|tftp)\s'
      - '(?i)\b(python[0-9.]*|node|deno|bun|ruby|perl|php)\b[^\n]{0,300}(urllib|requests\.(post|put)|http\.client|net/http|Net::HTTP|fetch\(|axios|socket\.connect|file_get_contents|curl_exec)'
      - '(?i)Invoke-(WebRequest|RestMethod)\b'
      - '(?i)\[System\.Net\.(WebClient|Http)'

  # ── Branch B: egress carrying a token class never legitimately query-borne ────
  sel_http_event:
    event_type: http_request

  sel_http_cred_in_query:
    url.full|re: '[?&][A-Za-z0-9_.%\[\]-]{1,64}=[^&\s]{0,512}((ghp|ghs|ghu|ghr)_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{30,}|xox[baprs]-[A-Za-z0-9-]{12,}|sk-ant-api03-[A-Za-z0-9_-]{20,}|LS0tLS1CRUdJTi|-----BEGIN(\+|%20)|%2D%2D%2D%2D%2DBEGIN)'

  # ── Filters: benign shapes only. No host, domain or path is trusted here. ─────
  filter_help_and_version:
    command|re:
      - '(^|[|;&]\s*)(?i:man)\s+(curl|wget|scp|nc|socat|rsync)\b'
      - '\s--help(\s|$)'
      - '(?i:curl|wget)\s+--version\b'

  filter_auth_flag_usage:
    command|re:
      - '(?i)\s-i\s+\S*\.ssh/id_[a-z0-9]+'
      - '(?i)\sIdentityFile[=\s]'
      - '(?i)\s--netrc(-file|-optional)?\b'

  filter_readonly_no_pipe:
    command|re:
      - '^(?i:grep|egrep|rg|ag|ack|fd|find|ls|stat|file|wc|head|tail|diff|shellcheck|semgrep|trufflehog|gitleaks|detect-secrets|echo|printf|git\s+grep|git\s+diff|git\s+log)\b[^|]*$'
      - '^(?i:pytest|tox|npm|yarn|pnpm|go|cargo|mvn|gradle|jest|vitest|make|bundle)\b[^|]*\b(?i:test|check|lint|ci)\b[^|]*$'

  filter_placeholder_material:
    command|contains:
      - 'AKIAIOSFODNN7EXAMPLE'
      - 'wJalrXUtnFEMI/K7MDENG'
      - 'YOUR_'
      - '<your-'
      - '<token>'
      - 'path/to/'
      - 'PLACEHOLDER'
      - 'REPLACE_ME'
      - 'changeme'
      - 'xxxxxxxx'
      - 'EXAMPLE_KEY'

  condition: >
    (sel_exec_event and sel_exec_credsource and sel_exec_netsink and not 1 of filter_*)
    or (sel_http_event and sel_http_cred_in_query and not 1 of filter_*)

falsepositives:
  - Agent authenticates to an internal or vendor API by inlining a token it read
    from ~/.netrc, ~/.config/gh/hosts.yml or ~/.git-credentials into a curl
    command. Standard flag forms (--netrc, --netrc-file) are filtered; hand-rolled
    "$(cat ...)" substitutions are intentionally still reported.
  - Deployment or backup scripts that scp/rsync with an explicit SSH identity
    (-i ~/.ssh/id_ed25519, IdentityFile=) — filtered by filter_auth_flag_usage.
  - Secret scanners (trufflehog, gitleaks, detect-secrets, semgrep) or grep/find
    sweeps that name credential paths as search arguments — filtered when the
    command contains no pipe, since a pipe-free read-only command cannot egress.
  - Test suites and fixtures containing the AWS documentation key
    (AKIAIOSFODNN7EXAMPLE) or obvious placeholders — filtered by
    filter_placeholder_material and the test-runner filter.
  - Documentation or README generation that echoes an example curl one-liner —
    filtered when run pipe-free via echo/printf.
  - Intentional operator-driven transfer of a kubeconfig or docker config to
    another machine during environment setup. This is genuinely indistinguishable
    from exfiltration at the command-line layer, which is why the action is
    report and not block.
action: report
