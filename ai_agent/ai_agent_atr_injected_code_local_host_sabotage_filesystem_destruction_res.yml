title: Injected Code — Local Host Sabotage (Filesystem Destruction / Resource Exhaustion / Hosts Tamper)
id: 8b60229a-8027-459c-bd51-e0eef561bd6c
status: experimental
level: critical
description: |-
  Detects injected code that sabotages the local host: recursive root deletion (shutil.rmtree('/')), removal of critical system binaries (libc), fork bombs, megabyte-string memory bombs in an infinite loop, infinite window spawning, or DNS hijack by appending to /etc/hosts.

  Adapted from Agent Threat Rules ATR-2026-01897 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01897
tags:
- attack.impact
- atlas.aml.t0048
- atlas.aml.t0051
- owasp.asi01
- owasp.llm05
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)shutil\.rmtree\(\s*[\"']/[\"']\s*\)
  sel_1:
    content|re: (?i)os\.remove\(\s*[\"']/(?:lib|bin|etc|boot|usr)/[^\"'\n]{0,40}[\"']\)
  sel_2:
    content|re: (?i)while\s+True\s*:\s*\n?\s*os\.fork\(\)
  sel_3:
    content|re: (?i)open\(\s*[\"']/etc/hosts[\"']\s*,\s*[\"']a[\"']\)
  sel_4:
    content|re: (?i)while\s+True\s*:[\s\S]{0,60}[\"']x[\"']\s*\*\s*\d{6,}
  sel_5:
    content|re: (?i)while\s+True\s*:\s*\n?\s*create_window\(\)
  condition: 1 of sel_*
falsepositives:
- Security documentation, papers, or test suites that describe this attack technique without executing
  it.
- Legitimate developer or user requests that share the surface vocabulary but lack the malicious invariant.
action: report
