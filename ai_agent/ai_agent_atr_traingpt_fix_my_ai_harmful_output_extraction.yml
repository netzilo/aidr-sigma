title: TrainGPT Fix-My-AI Harmful Output Extraction
id: 81fad035-91f9-4d01-b3ab-6a50f12d7114
status: experimental
level: high
description: |-
  Detects the TrainGPT "fix my AI" harmful output extraction jailbreak from garak inthewild corpus (#202). Uses a social engineering pretext of "helping fix an AI that doesn''t refuse inappropriate answers" to extract harmful content framed as training examples. The attacker instructs the model to produce both a normal ChatGPT answer and a "How your AI should NOT answer" section containing the harmful content — a dual-response extraction technique that launders dangerous outputs as negative training examples for a "Banned Answers database". Key signals: "TrainGPT" / "TrAInerGPT" persona name, "my AI do not refuses to answer with inappropriate sentences", "How your AI should not answer" + harmful content framing, and "STOPTRAIN" / "CREATIVEGPT" session-control keywords. The fake training framing bypasses safety by positioning the model as a tutor demonstrating bad behavior rather than a participant producing it.

  Adapted from Agent Threat Rules ATR-2026-00352 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00352
- https://github.com/NVIDIA/garak/blob/main/garak/probes/dan.py
- https://github.com/NVIDIA/garak/blob/main/garak/data/dan/inthewild_jailbreak_llms.json
tags:
- attack.execution
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?:(?:acting|act|continue|acting)\s+as\s+[Tt]rain(?:er)?\s*GPT|# TrAInerGPT|TrAInerGPT[\s\S]{0,200}(?:Created\s+by|gmCreative|tiktok|STOPTRAIN|CREATIVEGPT|Banned\s+[Aa]nswers?|should\s+NOT\s+(?:give|answer|respond)))
  sel_1:
    response|re: my\s+AI\s+do\s+not\s+refuses?\s+to\s+answer[\s\S]{0,100}(?:inappropriate|harmful|dangerous|immoral|illegal)
  sel_2:
    response|re: '[Hh]ow\s+your\s+AI\s+should\s+not\s+answer[\s\S]{0,200}(?:based\s+on\s+your\s+question|my\s+(?:AI|question)|Banned\s+[Aa]nswers?\s+database|copy\s+the\s+text)'
  sel_3:
    response|re: (?:STOPTRAIN|CREATIVEGPT)[\s\S]{0,300}(?:[Tt]rain(?:er)?\s*GPT|fix(?:ing)?\s+(?:my\s+)?AI|Banned\s+[Aa]nswers?|inappropriate\s+(?:sentence|answer|response))
  sel_4:
    response|re: (?:fix(?:ing)?\s+(?:a\s+)?problem\s+with\s+my\s+AI|make\s+my\s+AI\s+have\s+ethics|train(?:ing)?\s+(?:my\s+)?AI\s+(?:to\s+not|not\s+to))[\s\S]{0,400}(?:[Tt]rain(?:er)?\s*GPT|How\s+your\s+AI\s+should\s+not|Banned\s+[Aa]nswers?|ChatGPT:\*\*|should\s+NOT\s+(?:give|answer|respond))
  condition: 1 of sel_*
falsepositives:
- 'Legitimate AI debugging: "Could you help me fix a bug in my AI chatbot''s Python code? The issue is
  in the response filtering logic." (genuine technical debugging without TrainGPT framing)'
- 'AI safety research: "I''m building an AI safety classifier and need examples of harmful responses for
  training" (academic framing without TrainGPT format or "fix my AI" pretext)'
- 'Academic reference: "TrainGPT is a jailbreak technique documented in the garak corpus that uses a training
  pretext" (analysis without adoption)'
- 'Legitimate training request: "My AI refuses to answer questions about cooking history — how should
  I fix the refusal behavior?" (genuine behavior fix without harmful content extraction)'
action: report
