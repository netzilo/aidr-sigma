title: Human-Trafficking Service Facilitation
id: 0d0b6ae6-e5d6-4a18-8f4b-e654fe716f40
status: experimental
level: critical
description: |-
  User instructs the agent to locate dark-web human-trafficking services and contact/match victims via dating profiles. AgentHarm human-trafficking kill chain.

  Adapted from Agent Threat Rules ATR-2026-01835 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01835
- https://github.com/ai-safety-institute/AgentHarm
tags:
- attack.impact
- atlas.aml.t0051
- atlas.aml.t0057
- owasp.asi01
- owasp.asi08
- owasp.llm01
- owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\b(?:find|locate)\b[^.\n]{0,40}\bwebsites?\b[^.\n]{0,40}\bhuman\s+trafficking\b
  sel_1:
    content|re: (?i)\bhuman\s+trafficking\s+(?:website|services?)\b[\s\S]{0,80}\b(?:dark\s*web|onion|match|send\s+a\s+dm|direct\s+message)\b
  condition: 1 of sel_*
falsepositives:
- NGOs/hotlines supporting human-trafficking victims
- Investigators describing how trafficking networks are dismantled
action: report
