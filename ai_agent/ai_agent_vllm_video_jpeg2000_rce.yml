title: vLLM Video JPEG2000 Decoder RCE Attempt
id: 7f3c1d2e-9b64-4a17-b0d5-6c8e2f4a91d3
status: experimental
level: high
description: |
  Single-event content detection for exploitation of the vLLM multimodal video path,
  where a crafted JPEG2000 asset (Motion JPEG2000 / JP2 boxes with a malicious cdef
  channel-definition box) is fetched by the server and handed to OpenCV's bundled
  FFmpeg 5.1 decoder, producing a heap buffer overflow and, via a corrupted
  AVBuffer.free pointer, a system() call.

  Two independent, tightly scoped branches:

  (1) DELIVERY - an HTTP request to a vLLM inference endpoint
      (/v1/chat/completions, /v1/invocations) that either
        a. references a JPEG2000-family media URL (.mj2/.mjp2/.jp2/.j2k/.jpf/.jpx/
           .jpm/.jph/.j2c) - these are never used by normal VLM video inference,
        b. carries literal Motion JPEG2000 container markers in the body
           ('ftypmj2', or a 'jp2h' header box followed closely by a 'cdef' box -
           the exact structure abused by this exploit), or
        c. carries a video_url content part whose media is fetched from a bare
           IP-literal host, or over cleartext HTTP on a non-standard port -
           the delivery shape of attacker-staged payload video.
      Ordinary multimodal inference (an https .mp4/.webm on a named host) does NOT
      match any of these; that is deliberate, to keep this branch quiet.

  (2) POST-EXPLOITATION - an execute_process event whose command line is a
      /bin/sh -c invocation (exactly what libc system() spawns) carrying a
      reverse-shell primitive (/dev/tcp, nc -e, mkfifo backpipe, python/perl
      socket one-liner). This is the observable tail of the AVBuffer.free ->
      system() hijack.

  Reports only - this rule never blocks inference or process execution.
author: Tanya
date: "2025-11-18"
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1059/004/
  - https://github.com/vllm-project/vllm/security
tags:
  - attack.initial-access
  - attack.t1190
  - attack.execution
  - attack.t1059.004
  - owasp.llm03
falsepositives:
  - Digital-cinema, geospatial, satellite or medical-imaging pipelines that legitimately
    serve Motion JPEG2000 (.mj2/.jp2/.j2k) assets to a vision-language model. These are
    rare but real - treat a repeated, same-source .mj2 stream from a known internal
    pipeline as expected traffic and tune by media source, not by widening the rule.
  - Internal media servers addressed as http://<ip>:<port>/clip.mp4 feeding legitimate
    multimodal inference. Only the IP-literal / cleartext-non-standard-port shape matches;
    named-host https media never fires.
  - Security regression tests or PoC replays against a patched vLLM build (the exploit
    body still matches, by design).
  - OpenAPI/JSON-schema documents or templated request fixtures containing sample
    video_url values - suppressed by filter_schema_doc and filter_templated_url.
  - Operators or CI jobs running a deliberate `sh -c` netcat/mkfifo one-liner for network
    debugging on the same host (post-exploitation branch only).
logsource:
  product: ai_agent
  category: agent_events
detection:

  # ── Branch 1: delivery to a vLLM inference endpoint ────────────────────────
  sel_endpoint_path:
    event_type: http_request
    path|contains:
      - '/v1/chat/completions'
      - '/v1/invocations'
      - '/invocations'

  sel_endpoint_url:
    event_type: http_request
    url.full|contains:
      - '/v1/chat/completions'
      - '/v1/invocations'
      - '/invocations'

  # OpenAI-style multimodal video part as accepted by vLLM
  sel_video_part:
    event_type: http_request
    content|re:
      - '"type"\s*:\s*"video_url"'
      - '"video_url"\s*:\s*[{"]'

  # JPEG2000-family media URL - not used by normal VLM video inference
  sel_j2k_url:
    event_type: http_request
    content|re: '(?i:https?)://[^"\s\\]{1,400}\.(?i:mj2|mjp2|jp2|j2k|jpf|jpx|jpm|jph|j2c)(?:[?#][^"\s\\]{0,200})?"'

  # Literal Motion JPEG2000 / JP2 container structure in the request body,
  # including the jp2h -> cdef box pair this exploit abuses
  sel_j2k_container:
    event_type: http_request
    content|re:
      - 'ftypmj2'
      - 'jp2h[\s\S]{0,900}cdef'

  # Attacker-staging delivery shape for the payload container
  sel_suspicious_fetch:
    event_type: http_request
    content|re:
      - '"url"\s*:\s*"(?i:https?)://(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?::[0-9]{1,5})?/[^"]{0,400}\.(?i:mov|mp4|m4v|mkv|webm|avi|mxf|3gp|ts)'
      - '"url"\s*:\s*"(?i:http)://[^"/:]{1,253}:[0-9]{2,5}/[^"]{0,400}\.(?i:mov|mp4|m4v|mkv|webm|avi|mxf|3gp|ts)'

  # ── Branch 1 filters (narrowing only) ──────────────────────────────────────
  filter_templated_url:
    content|re: '"(?:video_)?url"\s*:\s*"[^"]{0,300}(?:\{\{|\$\{|<[A-Za-z_][A-Za-z0-9_]{0,30}>)'

  filter_schema_doc:
    content|re: '"(?:\$schema|openapi|swagger)"\s*:'

  # ── Branch 2: system() tail of the AVBuffer.free hijack ────────────────────
  sel_exec_sh_c:
    event_type: execute_process
    command|re: '(?:\A|/)(?:sh|dash|bash)\s+-c\s'

  sel_exec_revshell:
    event_type: execute_process
    command|re:
      - '/dev/tcp/[0-9A-Za-z._\-]{1,253}/[0-9]{1,5}'
      - '\b(?:nc|ncat|netcat)\b[^\n]{0,80}\s-{1,2}(?:e|exec)\b[^\n]{0,40}/bin/(?:sh|bash)\b'
      - '\bmkfifo\b[^\n]{0,120}\|[^\n]{0,120}\b(?:sh|bash)\b\s+-i\b'
      - '(?i:python)[0-9.]{0,4}\s+-c\s[\s\S]{0,300}socket\.socket[\s\S]{0,300}(?:dup2|\.connect\()'
      - '(?i:perl)\s+-e\s[\s\S]{0,300}(?:Socket|sockaddr_in)[\s\S]{0,300}(?:exec|/bin/sh)'

  condition: >
    ((sel_endpoint_path or sel_endpoint_url)
     and (sel_j2k_url or sel_j2k_container or (sel_video_part and sel_suspicious_fetch))
     and not (filter_templated_url or filter_schema_doc))
    or (sel_exec_sh_c and sel_exec_revshell)
action: report
