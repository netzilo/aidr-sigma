title: Instruction Injection via Tool Output
id: 9119260b-d194-4117-9a41-7279dc8b6637
status: experimental
level: high
description: |-
  Detects hidden instructions embedded in tool outputs that attempt to manipulate the agent's subsequent behavior. Tool responses may contain injected directives disguised as data that instruct the agent to perform unauthorized actions, change behavior, or exfiltrate information. Detection covers: urgency-prefixed directives addressing the agent, direct agent manipulation commands, information suppression directives, tool invocation instructions, data exfiltration commands, hidden instruction tags, response injection directives, conversational steering, system-pretending tokens, fake API response structures, subtle action-required patterns, and steganographic instruction embedding. Patterns are designed to require multiple signals where possible to reduce false positives.

  Adapted from Agent Threat Rules ATR-2026-00011 (MIT).
author: ATR Community (adapted)
date: '2026-03-08'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00011
- https://nvd.nist.gov/vuln/detail/CVE-2025-59536
- https://nvd.nist.gov/vuln/detail/CVE-2025-32711
tags:
- attack.execution
- atlas.aml.t0051.001
- atlas.aml.t0053
- owasp.asi02
- owasp.llm01
- owasp.llm05
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?i)(IMPORTANT|URGENT|CRITICAL|PRIORITY|MANDATORY|REQUIRED|ESSENTIAL|ATTENTION)\s*(NOTE\s+)?(TO\s+)?(THE\s+)?(ASSISTANT|AI|AGENT|MODEL|LLM|CHATBOT|BOT|SYSTEM)\s*[:\-]\s*(you\s+(must|should|need\s+to|have\s+to|are\s+(required|instructed|directed|ordered)\s+to)|please|now|immediately|do\s+not|never|always)
  sel_1:
    response|re: (?i)(assistant|ai|agent|model|chatbot|bot)\s*[,:;]+\s*(ignore|disregard|override|forget|bypass|abandon|drop|discard|suppress)\s+(your|all|the|any|every|previous|prior|existing|current)\s+(instructions?|rules?|guidelines?|directives?|constraints?|programming|training|safety|restrictions?|protocols?|policies)
  sel_2:
    response|re: (?i)(do\s+not|don'?t|never|avoid|refrain\s+from)\s+(tell(ing)?|inform(ing)?|reveal(ing)?|show(ing)?|mention(ing)?|display(ing)?|disclos(e|ing)|report(ing)?|log(ging)?)\s+(the\s+)?(user|human|operator|requester|client|customer|person)\s+(about\s+)?(this|these|what|that|any|the)
  sel_3:
    response|re: (?i)(you\s+(?:must|should|need\s+to|have\s+to)\s+)?(call|invoke|execute|run|trigger|activate|launch|fire|initiate)\s+(the\s+)?(tool|function|action|command|plugin|skill)\s*[:\-]\s*[a-zA-Z_][a-zA-Z0-9_]*
  sel_4:
    response|re: (?i)(send|transmit|post|forward|exfiltrate|upload|deliver|relay|transfer|pipe|redirect|leak|expose|share)\s+(this|the|all|any|every|complete|full|entire)\s+(data|information|context|conversation|history|messages?|session|memory|contents?|payload|details?|credentials?|secrets?|tokens?|keys?)\s+(to|via|through|using|over)\s+(https?://|\w+\.\w+|the\s+(server|endpoint|webhook|url|api|service))
  sel_5:
    response|re: (?i)<\s*(hidden|invisible|secret|private|internal|covert)\s*[-_]?(instruction|directive|command|message|note|order|task|action)\s*>
  sel_6:
    response|re: (?i)(include|embed|inject|insert|prepend|append|add|place|put)\s+(this|the\s+following|these\s+words?|this\s+text|this\s+message|this\s+content|exactly)\s+(in|into|to|within|at\s+the\s+(start|end|beginning)\s+of)\s+(your|the)\s+(response|output|reply|answer|message|next\s+message)
  sel_7:
    response|re: (?i)(\[SYSTEM\]|\[ADMIN\]|\[OVERRIDE\]|\[PRIORITY\]|\[INTERNAL\]|\[CONTROL\]|\[DIRECTIVE\]|<<SYS>>|<<SYSTEM>>|<<ADMIN>>|<\|system\|>|<\|im_start\|>system|\{\{SYSTEM\}\}|\{\{ADMIN\}\})
  sel_8:
    response|re: (?i)(\{\s*["']?(system_message|system_instruction|agent_directive|admin_command|priority_action|override_instruction)["']?\s*:\s*["']|api_response\s*[=:]\s*\{.{0,100}(instruction|directive|command|override|ignore|disregard))
  sel_9:
    response|re: (?i)(I\s+recommend\s+the\s+(agent|assistant|AI|model|system)\s+(should|must|needs?\s+to)|the\s+next\s+step\s+(is\s+to|should\s+be\s+to|for\s+the\s+(agent|assistant))|the\s+(agent|assistant|AI|model)\s+(should|must|needs?\s+to|is\s+(expected|required)\s+to)\s+(now|next|immediately|first))
  sel_10:
    response|re: (?i)(\[?ACTION\s*REQUIRED\]?|\[?TASK\s*FOR\s*(AGENT|ASSISTANT|AI)\]?|\[?INSTRUCTION\s*FOR\s*(AGENT|ASSISTANT|AI)\]?|\[?AGENT\s*DIRECTIVE\]?|\[?DO\s*THIS\s*NOW\]?)\s*[:\-]
  sel_11:
    response|re: (?i)(this\s+is\s+a\s+(system|admin|priority|critical|mandatory)\s+(message|instruction|directive|update|notice|alert)\s*(from|by|issued|sent)\s*(the\s+)?(system|admin|administrator|developer|platform|operator|control\s+plane))
  condition: 1 of sel_*
falsepositives:
- Tool outputs with legitimate formatting instructions for agent response
- API documentation tools describing how to call other endpoints
- Error messages instructing agent to retry with different parameters
- Workflow orchestration tools that legitimately direct next steps
- Monitoring tools that include 'action required' in their standard output format
action: report
