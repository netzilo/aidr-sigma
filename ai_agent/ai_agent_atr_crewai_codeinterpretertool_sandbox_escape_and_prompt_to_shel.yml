logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\.__subclasses__\s*\(\s*\)[^\n]{0,300}(?:BuiltinImporter|builtins|importlib|__import__|load_module\s*\(\s*["\x27]os["\x27]|ctypes)
  sel_1:
    content|re: (?i)\(\s*\)\s*\.__class__\s*\.__bases__\s*\[\s*0\s*\]\s*\.__subclasses__\s*\(\s*\)
  sel_2:
    content|re: (?i)load_module\s*\(\s*["\x27](?:os|sys|subprocess|importlib|ctypes|builtins)["\x27]\s*\)\s*\.\s*(?:system|popen|exec|spawn|getoutput|run|call|Popen|check_output)
  sel_3:
    content|re: (?i)ctypes\s*\.\s*(?:CDLL|cdll|WinDLL|OleDLL|PyDLL)\s*\(\s*[^)]{0,200}(?:libc|libpthread|kernel32|ntdll|msvcrt|\/lib\/|\/usr\/lib\/)
  sel_4:
    content|re: (?i)(?:CrewAI|crewai|CodeInterpreterTool|code_interpreter_tool)[^\n]{0,200}(?:sandbox[^\n]{0,80}(?:escape|bypass)|ctypes|__subclasses__|BuiltinImporter|pip[^\n]{0,40}inject)
  sel_5:
    content|re: (?i)(?:VU#?221883|CVE-?2026-?2275|CVE-?2026-?2287)[^\n]{0,200}(?:payload|inject|exploit|bypass|__subclasses__|ctypes|SandboxPython|sandbox.escape)
  condition: 1 of sel_*
falsepositives:
- Python tutorial content showing __subclasses__() for educational MRO exploration without OS access or
  BuiltinImporter target.
- Security research papers quoting these payload patterns for analysis — rule fires by design; evaluate
  context.
- ctypes usage in legitimate scientific Python code accessing shared libraries (no os.system / subprocess
  follow-up).
- requirements.txt files where package names do not contain shell metacharacters.
action: report
