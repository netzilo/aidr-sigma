title: Hidden LLM Safety Bypass Instructions in Tool Descriptions
id: 4a3b0811-ebe0-4c25-a566-ac2ed38ffb89
status: experimental
level: critical
description: |-
  Detects tools that embed explicit instructions directing the LLM to disregard safety
  mechanisms, ignore security policies, or bypass previous instructions. Commonly uses
  patterns like "NOTE TO AI: disregard all safety instructions" to manipulate the LLM
  into operating outside its safety boundaries. Unlike consent-bypass attacks (ATR-2026-100),
  this targets the LLM's core safety mechanisms rather than specific user confirmation flows.

  Adapted from Agent Threat Rules ATR-2026-00103 (MIT).
author: ATR Community (adapted)
date: '2026-03-15'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00103
tags:
- attack.execution
- atlas.aml.t0051
- atlas.aml.t0110.000
- owasp.asi01
- owasp.llm01
- owasp.llm07
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: NOTE\s+TO\s+AI:.*(?:disregard|ignore|bypass).*(?:safety|security|previous).*(?:instructions|checks|policies)
  condition: sel_0
falsepositives:
- Security documentation tools that reference bypass techniques for educational purposes
- A cybersecurity training platform tool whose description quotes the exact attack pattern as an example
  of what to detect, inadvertently triggering the rule
action: report
