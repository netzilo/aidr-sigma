title: Credential File Theft from Agent Environment
id: fd243525-081c-4a7a-9314-0787d4ce735f
status: experimental
level: critical
description: |-
  Detects tools or agent instructions that access well-known credential files from
  the host environment. Attackers target files like ~/.aws/credentials, SSH private
  keys, Docker configs, and Kubernetes configs to gain lateral movement capabilities.
  When credential file access is combined with a network call, this strongly indicates
  exfiltration rather than legitimate local usage.

  Adapted from Agent Threat Rules ATR-2026-00113 (MIT).
author: ATR Community (adapted)
date: '2026-03-26'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00113
tags:
- attack.exfiltration
- attack.t1552.001
- atlas.aml.t0057
- owasp.asi03
- owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)~/?\.(?:aws/credentials|ssh/id_(?:rsa|ed25519|ecdsa)|npmrc|netrc|docker/config\.json|kube/config)
  sel_1:
    content|re: (?i)(?:cat|read|open|load|get)\s+.*(?:credentials|id_rsa|private[_\s]?key|secret[_\s]?key)
  sel_2:
    content|re: (?i)(?:keychain|credential-manager|secret-tool|security\s+find-(?:generic|internet)-password)
  sel_3:
    content|re: (?i)/etc/(?:shadow|passwd|security/)|/var/lib/(?:jenkins|docker)/.*(?:secret|token|credential)
  sel_4:
    content|re: (?i)(?:BEGIN\s+(?:RSA|DSA|EC|OPENSSH)\s+PRIVATE\s+KEY)
  condition: 1 of sel_*
falsepositives:
- SSH configuration management tools operating on the local machine
- Cloud CLI tools reading their own credential files
- DevOps automation scripts that validate credential file permissions without reading their contents
- Security scanning tools that check for the existence of well-known credential files to generate compliance
  reports
action: report
