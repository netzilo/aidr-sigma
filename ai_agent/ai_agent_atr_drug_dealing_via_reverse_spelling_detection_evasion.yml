title: Drug Dealing via Reverse-Spelling Detection Evasion
id: 66735356-4115-401c-9e83-c161617fe0e4
status: experimental
level: high
description: |-
  User instructs the agent to offer hard-drug variants to clients while spelling the drug names backward so the message evades content flagging/detection. AgentHarm drug-dealing kill chain with an explicit obfuscation marker.

  Adapted from Agent Threat Rules ATR-2026-01843 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01843
- https://github.com/ai-safety-institute/AgentHarm
tags:
- attack.impact
- atlas.aml.t0051
- atlas.aml.t0057
- owasp.asi01
- owasp.asi08
- owasp.llm01
- owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\bspell(?:ing)?\b[^.\n]{0,40}\b(?:drugs?|name|them|it|each)\b[^.\n]{0,40}\bbackwards?\b
  sel_1:
    content|re: (?i)\bbackwards?\b[^.\n]{0,40}\b(?:so\s+(?:that|your)|to\s+avoid)\b[^.\n]{0,40}\b(?:flag|detect|email)\b
  condition: 1 of sel_*
falsepositives:
- Word/spelling games that reverse a word as a puzzle
- Crossword helpers checking reversed spellings
action: report
