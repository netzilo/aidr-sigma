title: SSRF - OpenAPI $ref Loopback/Metadata Bypass (FrontMCP / mcp-from-openapi)
id: f3a9c2d4-7b1e-4c8a-9d3f-2e6b8a1c4f70
status: experimental
level: high
description: |
  Detects outbound HTTP traffic consistent with the FrontMCP / mcp-from-openapi
  external $ref SSRF-denylist bypass. The upstream hostname denylist checks the
  parsed hostname string but never resolves it, never pins the fetch to a
  validated IP, and never revalidates redirect targets. Attackers exploit this
  by supplying an untrusted OpenAPI document whose $ref values (or the eventual
  dereference request itself) target loopback/link-local/cloud-metadata
  addresses using literal encodings that a naive string-based denylist misses:
  decimal, octal, and hex IPv4 encodings of 127.0.0.1, IPv4-mapped IPv6 loopback
  syntax, bracketed/unbracketed ::1, the AWS/GCP/Azure metadata IP
  169.254.169.254, the Alibaba metadata IP 100.100.100.200, and well-known
  wildcard-DNS-to-loopback services (localtest.me, vcap.me, lvh.me, and
  nip.io/xip.io/sslip.io subdomains that literally embed a loopback or
  metadata IP). This is a single-event content match only: it cannot observe
  DNS resolution results or redirect-chain endpoints, so DNS-rebinding
  hostnames that do not literally embed a loopback/metadata address in the
  string are out of scope for this rule (see falsepositives / known gaps).
  Reported as OWASP Top 10 A10:2021 - Server-Side Request Forgery (SSRF); no
  MITRE ATLAS technique applies to this classic web SSRF bypass, so no
  atlas.* tag is included per policy (a forced mapping would be incorrect).
author: Evgen
date: "2026-03-18"
references:
  - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
tags:
  - attack.initial-access
  - attack.t1190
falsepositives:
  - An agent or MCP server that legitimately calls its own local sidecar or health-check endpoint on 127.0.0.1/localhost as part of normal operation (this rule will report, not block, so operation is not disrupted)
  - Internal QA/CI tooling that intentionally references 127.0.0.1 or 0.0.0.0 in OpenAPI test fixtures used for local schema validation
  - Development environments that use nip.io/xip.io/sslip.io wildcard DNS to point at a loopback address on purpose for local integration testing
  - Documentation or example OpenAPI specs that use 127.0.0.1 in a $ref purely as illustrative sample text rather than a live dereference target
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_loopback_host:
    event_type: http_request
    host|re:
      - '^127(\.[0-9]{1,3}){1,3}$'
      - '^0\.0\.0\.0$'
      - '(?i)^0177\.0\.0\.1$'
      - '^017700000001$'
      - '(?i)^0x7f(\.0\.0\.1|000001)$'
      - '^2130706433$'
      - '^\[?::1\]?$'
      - '(?i)^\[?::ffff:(127\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|7f00:0?1)\]?$'
      - '^169\.254\.169\.254$'
      - '^100\.100\.100\.200$'
      - '(?i)^\[?fd00:ec2::254\]?$'
      - '(?i)(^|\.)localtest\.me$'
      - '(?i)(^|\.)vcap\.me$'
      - '(?i)(^|\.)lvh\.me$'
      - '(?i)(127\.0\.0\.1|0\.0\.0\.0|169\.254\.169\.254)\.(nip|xip|sslip)\.io$'
  sel_ref_json_loopback:
    event_type: http_request
    content|re: '(?i)"\$ref"\s*:\s*"https?://[^"]{0,300}(127\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|0\.0\.0\.0|169\.254\.169\.254|100\.100\.100\.200|\[?::1\]?|\[?::ffff:127\.)'
  sel_ref_yaml_loopback:
    event_type: http_request
    content|re: '(?i)\$ref:\s*"?https?://[^\s"]{0,300}(127\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|0\.0\.0\.0|169\.254\.169\.254|100\.100\.100\.200)'
  condition: sel_loopback_host or sel_ref_json_loopback or sel_ref_yaml_loopback
action: report
