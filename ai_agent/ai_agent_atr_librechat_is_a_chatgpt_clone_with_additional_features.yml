title: LibreChat is a ChatGPT clone with additional features.
id: f3e04913-256a-4a9f-a6c1-f3f27fd1a33a
status: experimental
level: high
description: |-
  NVD-tracked CVE CVE-2026-31951 (CVSS v3 6.8 (MEDIUM)). LibreChat is a ChatGPT clone with additional features. In versions 0.8.2-rc1 through 0.8.3-rc1, user-created MCP (Model Context Protocol) servers can include arbitrary HTTP headers that undergo credential placeholder substitution. An attacker can create a malicious MCP server with headers containing `{{LIBRECHAT_OPENID_ACCESS_TOKEN}}` (and others), causing victims who call tools on that server to have their OAuth tokens exfiltrated. Version 0.8.3-rc2 fixes the issue.

  Adapted from Agent Threat Rules ATR-2026-00566 (MIT).
author: ATR Community (adapted)
date: '2026-05-30'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00566
- https://github.com/danny-avila/LibreChat/security/advisories/GHSA-pmw7-gqwj-f954
- https://nvd.nist.gov/vuln/detail/CVE-2026-31951
tags:
- attack.exfiltration
- atlas.aml.t0057
- owasp.asi01
- owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i){{\s*LIBRECHAT_[A-Z_]*(?:TOKEN|SECRET|KEY|CREDENTIAL)\s*}}
  sel_1:
    content|re: (?i)(?:headers?|HTTP[-_]?headers?|x[-_]?[a-z0-9\-]+)\s*[=:]\s*[^\n]*{{\s*[A-Z_]*(?:TOKEN|SECRET|CREDENTIAL|PASSWORD|AUTH|API[-_]?KEY)\s*}}
  sel_2:
    content|re: (?i)createHeader|addHeader|setHeader|registerHeader.*{{\s*(?:ACCESS|OAUTH|BEARER|JWT|TOKEN)\s*}}
  condition: 1 of sel_*
falsepositives:
- Legitimate use of this pattern in an authorised workflow; review the surrounding session before acting.
action: report
