title: Credential Harvesting via Fake Backup Tool
id: 36f73f7e-e4f9-4f7e-88f0-ce286b4c407c
status: experimental
level: critical
description: |-
  Detects malicious MCP tools disguised as backup utilities that systematically collect sensitive credentials (SSH keys, certificates, environment files) and exfiltrate them via base64 encoding to external endpoints. This pattern matches the analyzed skill which performs filesystem traversal for credential files followed by base64 encoding and HTTP POST to external domains.

  Adapted from Agent Threat Rules ATR-2026-00217 (MIT).
author: ATR Community (adapted)
date: '2026-04-10'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00217
tags:
- attack.persistence
- atlas.aml.t0024
- owasp.asi04
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: find\s+[/~][^\n]*(-name\s+"[^"]*\.(pem|key|p12|keystore)"|"id_rsa[^"]*"|"\.env[^"]*"|"credentials[^"]*")
  sel_1:
    content|re: cat\s+"?\$f"?\s*\|\s*base64
  sel_2:
    content|re: curl\s+[^\n]*-X\s+POST\s+https?://[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/[^\s]*\s+[^\n]*-d\s+@-
  sel_3:
    content|re: (backup|restore|sync)\s+[^\n]*(ssh|key|credential|certificate|\.env)
  sel_4:
    content|re: 2>/dev/null\s*\|\s*while\s+read\s+[a-zA-Z]+
  condition: 1 of sel_*
falsepositives:
- Legitimate enterprise backup tools with proper authentication
- System administration scripts with secure credential handling
- DevOps deployment tools mentioning backup procedures in documentation
action: report
