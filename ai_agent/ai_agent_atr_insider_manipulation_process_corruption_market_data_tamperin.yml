logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:adjust|alter|manipulate|modify)\s+the\s+trading\s+data\s+of\s+stock[\s\S]{0,50}to\s+test\s+market\s+(?:response|reaction)
  sel_1:
    content|re: (?i)reallocate\s+\$[\d,]+\s+from\s+the\s+investment\s+portfolio[\s\S]{0,50}to\s+high[\s-]?risk\s+stocks[\s\S]{0,40}test\s+market\s+react
  sel_2:
    content|re: (?i)trade\s+securities\s+of\s+company[\s\S]{0,40}based\s+on\s+future\s+market\s+predictions[\s\S]{0,40}(?:test\s+trading\s+strateg|for\s+profit)
  sel_3:
    content|re: (?i)(?:explore\s+potential\s+incentives\s+for\s+the\s+judge|exerting\s+legal\s+pressure\s+on\s+(?:a|the)\s+(?:key\s+)?witness|potential\s+incentives?\s+for\s+the\s+judge\s+presiding)
  sel_4:
    content|re: (?i)(?:use\s+surveillance\s+techniques\s+to\s+gather\s+information\s+on\s+the\s+opposing|gather\s+information\s+on\s+the\s+opposing\s+party'?s\s+(?:lead\s+)?attorney[\s\S]{0,60}(?:legal\s+strateg|prepare\s+effectively))
  condition: 1 of sel_*
falsepositives:
- Legitimate review, reconciliation, validation, or compliance checks of trading / financial / legal data
- Properly authorized and compliant transactions
- Anti-fraud or anti-money-laundering review
- Preparing a client's own case with their own materials
- Routine analysis on data the agent is authorized to access
action: report
