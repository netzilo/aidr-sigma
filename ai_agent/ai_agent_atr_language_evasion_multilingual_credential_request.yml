title: 'Language-Evasion: Multilingual Credential Request'
id: 7459f16c-002c-422e-9673-5782f7e9fc76
status: experimental
level: high
description: |-
  Detects prompt injection via language evasion where the attacker asks for a password, secret key, or other credential in a non-English language (Spanish, French, Italian, German, Japanese, Chinese, Korean, Portuguese, Dutch, Russian, Polish, Turkish, Arabic, Hindi) to bypass English-only keyword detection. The defining carrier is a single-language utterance that translates directly to "What is the password?" or equivalent credential request. ATR-2026-00001 covers some multilingual instruction-override patterns but not bare credential-request translations. This rule fills that gap.

  Adapted from Agent Threat Rules ATR-2026-01013 (MIT).
author: ATR Community (adapted)
date: '2026-06-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01013
tags:
- attack.initial-access
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(¿?(cu[aá]l\s+es|d[ií]me|proporciona|comparte)\s+(la|tu|el)\s+(contrase[ñn]a|clave\s*(secreta)?|c[oó]digo\s*(de\s*acceso)?|pin\b|credenciales?))
  sel_1:
    content|re: (?i)(quel\s+est\s+le\s+(mot\s+de\s+passe|code\s+secret|code\s+d.acc[eè]s|identifiant)|donnez[\s-]moi\s+(le\s+)?(mot\s+de\s+passe|code)|partagez\s+(le\s+)?(mot\s+de\s+passe))
  sel_2:
    content|re: (?i)(qual\s+[eè]\s+(la\s+)?(password|parola\s+d.ordine|codice\s*segreto|pin\b|chiave\s*segreta)\??|dimmi\s+(la\s+)?(password|parola\s+d.ordine))
  sel_3:
    content|re: (?i)(was\s+ist\s+(das\s+)?(passwort|geheimnis|geheimschl[uü]ssel|pin\b|zugangsco[de])|wie\s+lautet\s+das\s+passwort|sag\s+mir\s+das\s+passwort)
  sel_4:
    content|re: (パスワード|暗証番号|秘密の言葉|アクセスコード|秘密鍵|パスコード).{0,20}(は何|を教えて|を教えろ|を教えなさい|を共有|を確認|を入力)
  sel_5:
    content|re: (?i)(qual\s+[eé]\s+(a\s+)?(senha|palavra[\s-]passe|c[oó]digo\s*secreto|pin\b)|me\s+d[eê]\s+(a\s+)?(senha|palavra[\s-]passe)|compartilhe\s+(a\s+)?(senha))
  sel_6:
    content|re: (?i)(wat\s+is\s+(het\s+)?(wachtwoord|geheime\s+sleutel|pincode|toegangscode)|vertel\s+me\s+(het\s+)?(wachtwoord))
  sel_7:
    content|re: (какой|что\s+такое|скажи|сообщи|дай).{0,20}(пароль|секретный\s+ключ|код\s+доступа|пин[\s-]код)
  sel_8:
    content|re: (?i)(şifre|parola|gizli\s+anahtar|erişim\s+kodu).{0,30}(nedir|ne|söyle|paylaş|ver)
  sel_9:
    content|re: (密码|密碼|口令|暗码|暗碼|秘密|访问码|存取碼).{0,20}(是什么|是什麼|是多少|告诉我|告訴我|给我|給我|分享)
  sel_10:
    content|re: (비밀번호|패스워드|패스코드|접근코드|비밀키).{0,20}(가\s*(무엇|뭐|뭔지|어떻게)|를\s*(알려|공유|말해|입력))
  sel_11:
    content|re: (ما\s+هي|أخبرني|أعطني|شارك).{0,20}(كلمة\s+المرور|رمز\s+السر|المفتاح\s+السري|رمز\s+الدخول)
  sel_12:
    content|re: (पासवर्ड|गुप्त\s+कुंजी|एक्सेस\s+कोड).{0,20}(क्या\s+है|बताओ|दो|साझा)
  condition: 1 of sel_*
falsepositives:
- Legitimate authentication UI prompts that ask users to 'enter your password' in their language
- Educational content translating security terms into multiple languages
action: report
