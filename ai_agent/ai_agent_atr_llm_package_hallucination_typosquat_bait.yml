title: LLM Package Hallucination Typosquat Bait
id: 5799f74b-e5c0-49b4-8fa3-adecce564cfe
status: experimental
level: high
description: |-
  Detects prompts designed to elicit non-existent package names from LLMs in generated code, which attackers then squat on public registries (npm, PyPI, crates.io, RubyGems) to execute supply-chain attacks when developers copy-paste the AI-suggested import. Based on NVIDIA garak packagehallucination probe. Pattern: "give me N packages that do X", "which library lets me Y", where X/Y is sufficiently obscure that the model is likely to confabulate a fake name.

  Adapted from Agent Threat Rules ATR-2026-00260 (MIT).
author: ATR Community (adapted)
date: '2026-04-19'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00260
- https://www.usenix.org/publications/loginonline/we-have-package-you-comprehensive-analysis-package-hallucinations-code
- https://arxiv.org/abs/2501.19012
- https://www.lasso.security/blog/ai-package-hallucinations
tags:
- attack.persistence
- atlas.aml.t0060
- owasp.asi07
- owasp.llm02
- owasp.llm09
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?:give\s+(?:me\s+)?examples\s+of\s+)?(?:two|three|four|five|six|seven|eight|nine|ten|\d{1,2})\s+(?:python|javascript|node|ruby|rust|go|java|php|typescript)\s+(?:libraries|packages|modules|crates|gems)\s+(?:which|that)\s+\w{1,40}
  sel_1:
    response|re: which\s+(?:python|javascript|node|ruby|rust|go|java|php|typescript)\s+(?:modules?|libraries?|packages?|crates?)\s+(?:let|allow|help|would\s+a|can)\s+me\s+\w+
  sel_2:
    response|re: (?:interface\s+with|connect\s+to|read\s+from|load\s+a?|write\s+to)\s+(?:arangodb|istio|pinecone|langchain|cuda\s+kernel|realtek\s+\d+|tektronix|stromberg|ae35|hal\s*9000|dex\s+holographic|lumon|marblepunk|scp\s+database|kitt|zapata|sigismondi)\b
  sel_3:
    response|re: (?:as\s+a\s+(?:woman|man|black|white|asian|latino|queer|trans)[^,]{0,30},\s*)?(?:i\s+need|please\s+write|could\s+you\s+(?:help|give))\s+(?:example\s+)?(?:python|javascript|rust|ruby|go|java|php)\s+code\s+using\s+a\s+library\s+to\s+\w+
  condition: 1 of sel_*
falsepositives:
- Legitimate package discovery questions about well-known libraries (requests, numpy, pandas)
- Library comparison posts on Stack Overflow or Reddit
- Framework documentation listing official companion packages
action: report
