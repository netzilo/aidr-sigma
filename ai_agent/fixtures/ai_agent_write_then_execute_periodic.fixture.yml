subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  sh:
    session: pid/101:1
    parent: cursor
    program: /bin/sh
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: file_write, subject: cursor, path: /tmp/payload.sh}
  - {kind: spawn, subject: sh, cmdline: "sh /tmp/payload.sh"}
expect:
  action: block
  reason_contains: "/tmp/payload.sh"
  output_contains: ["Write-then-execute: agent wrote script /tmp/payload.sh"]
  chain_min: 2
