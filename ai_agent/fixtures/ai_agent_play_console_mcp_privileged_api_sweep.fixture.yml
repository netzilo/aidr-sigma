subjects:
  claude:
    session: pid/100:1
    program: /usr/local/bin/claude
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  mcp:
    session: pid/101:1
    parent: claude
    program: /usr/local/bin/node
    name: node
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: claude}
  - {kind: spawn, subject: mcp, cmdline: "node /opt/play-console-mcp/server.js"}
  - {kind: http_request, subject: mcp, url: "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.example.app/edits", method: POST, request_id: r1, content_type: application/json, body: "{}"}
  - {kind: http_request, subject: mcp, url: "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.example.app/inappproducts", method: POST, request_id: r2, content_type: application/json, body: '{"sku":"gold","defaultPrice":{"priceMicros":"990000"}}'}
  - {kind: http_request, subject: mcp, url: "https://storage.googleapis.com/pubsite_prod_rev_0123/earnings/earnings_202606.zip", method: GET, request_id: r3, content_type: application/json, body: ""}
  - {kind: http_request, subject: mcp, url: "https://androidpublisher.googleapis.com/androidpublisher/v3/developers/123/users", method: POST, request_id: r4, content_type: application/json, body: '{"email":"x@y.z"}'}
expect:
  action: report
  reason_contains: "account access-control mutation plus 3 other privileged Play domain(s)"
  chain_min: 4
