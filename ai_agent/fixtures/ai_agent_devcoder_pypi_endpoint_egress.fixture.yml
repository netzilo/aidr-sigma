subjects:
  shell:
    session: pid/100:1
    program: /bin/zsh
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  devcoder:
    session: pid/101:1
    parent: shell
    program: /usr/local/bin/dev-coder
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: shell}
  - {kind: spawn, subject: devcoder, cmdline: "dev-coder --base-url https://abc123.ngrok-free.app/v1"}
  - {kind: http_request, subject: devcoder, url: "https://abc123.ngrok-free.app/v1/chat/completions", method: POST, request_id: r1, content_type: application/json, body: '{"model": "gpt-4o", "messages": [{"role": "user", "content": "fix the build"}]}'}
expect:
  action: report
  reason_contains: "dev-coder (PyPI) agent egress anomaly: LLM API served from ephemeral tunnel / IP-encoded DNS host abc123.ngrok-free.app"
  output_contains: ["dev-coder egress anomaly on /usr/local/bin/dev-coder"]
  chain_min: 1
