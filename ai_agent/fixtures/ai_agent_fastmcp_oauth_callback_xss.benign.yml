rule: ai_agent_fastmcp_oauth_callback_xss.yml
subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  python:
    session: pid/101:1
    parent: cursor
    program: /usr/local/bin/python3
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: spawn, subject: python, cmdline: "python3 -m fastmcp.client.auth.oauth --server https://mcp.example"}
  - {kind: http_request, subject: python, url: "https://auth.example/oauth/authorize?client_id=mcp", method: GET, request_id: r1, content_type: text/html, body: ""}
  - {kind: http_request, subject: python, url: "http://localhost:8080/oauth/callback?code=abc123&state=xyz789", method: GET, request_id: r2, content_type: text/html, body: ""}
expect:
  action: allow
