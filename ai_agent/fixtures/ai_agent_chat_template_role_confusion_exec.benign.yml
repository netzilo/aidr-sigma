rule: ai_agent_chat_template_role_confusion_exec.yml
subjects:
  claude:
    session: pid/100:1
    program: /usr/local/bin/claude
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  shell:
    session: pid/101:1
    parent: claude
    program: /bin/zsh
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: claude}
  - {kind: http_request, subject: claude, url: "https://docs.example.com/rag/corpus.md", method: GET, request_id: r1, content_type: text/plain, body: ""}
  - {kind: spawn, subject: shell, cmdline: "zsh -c 'grep -rn TODO src/ | head -20'"}
expect:
  action: allow
