subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: file_read, subject: cursor, path: /Users/dev/proj/README.md}
  - {kind: file_read, subject: cursor, path: /Users/dev/.aws/credentials}
expect:
  action: block
  output_contains: ["Credential file read: /Users/dev/.aws/credentials by Cursor"]
