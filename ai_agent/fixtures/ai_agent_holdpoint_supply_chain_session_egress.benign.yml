rule: ai_agent_holdpoint_supply_chain_session_egress.yml
subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com, groups: [eng]}]
    device: dev-1
    source: probe
  pip:
    session: pid/101:1
    parent: cursor
    program: /usr/local/bin/pip3
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: spawn, subject: pip, cmdline: "pip3 install holdpoint"}
  - {kind: connect, subject: pip, host: pypi.org, port: 443, protocol: tcp}
  - {kind: connect, subject: cursor, host: api.anthropic.com, port: 443, protocol: tcp}
expect:
  action: allow
