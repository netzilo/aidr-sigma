rule: ai_agent_taint_credential_exfil.yml
subjects:
  cursor:
    session: pid/1300:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: file_read, subject: cursor, path: /Users/dev/.ssh/id_rsa}
  - {kind: http_request, subject: cursor, url: "https://api.anthropic.com/v1/messages", method: POST, request_id: r1}
  - {kind: file_read, subject: cursor, path: /Users/dev/proj/main.go}
  - {kind: tool_call, subject: cursor, server: builtin, server_url: "", tool: bash, call_id: c1, args: '{"command":"go build ./..."}'}
expect:
  action: allow
