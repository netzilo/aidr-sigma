rule: ai_agent_vllm_automap_dynamic_module_rce.yml
subjects:
  bash:
    session: pid/100:1
    program: /bin/bash
    actors: [{id: u1, name: MLOps, email: mlops@example.com}]
    device: gpu-1
    source: probe
  vllm:
    session: pid/101:1
    parent: bash
    program: /usr/bin/python3.11
    actors: [{id: u1, name: MLOps}]
    device: gpu-1
    source: probe
  sh:
    session: pid/102:1
    parent: vllm
    program: /bin/sh
    actors: [{id: u1, name: MLOps}]
    device: gpu-1
    source: probe
observations:
  - {kind: session_start, subject: bash}
  - {kind: spawn, subject: vllm, cmdline: "python3.11 -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-3-8B"}
  - {kind: file_read, subject: vllm, path: /root/.cache/huggingface/hub/models--meta-llama--Llama-3-8B/snapshots/abc/config.json}
  - {kind: file_read, subject: vllm, path: /root/.cache/huggingface/hub/models--meta-llama--Llama-3-8B/snapshots/abc/model.safetensors}
  - {kind: spawn, subject: sh, cmdline: "/bin/sh -c curl -s http://localhost:8000/health"}
expect:
  action: allow
