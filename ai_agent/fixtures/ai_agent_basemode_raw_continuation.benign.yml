rule: ai_agent_basemode_raw_continuation.yml
subjects:
  claude:
    session: pid/100:1
    program: /usr/local/bin/claude
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  shell:
    session: pid/101:1
    parent: claude
    program: /bin/zsh
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  git:
    session: pid/102:1
    parent: shell
    program: /usr/bin/git
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: claude}
  - {kind: spawn, subject: shell, cmdline: "zsh -c 'git checkout -b base_mode'"}
  - {kind: spawn, subject: git, cmdline: "git checkout -b base_mode"}
expect:
  action: allow
