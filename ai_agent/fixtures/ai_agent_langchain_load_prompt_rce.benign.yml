rule: ai_agent_langchain_load_prompt_rce.yml
subjects:
  claude:
    session: pid/400:1
    program: /Applications/Claude.app/Contents/MacOS/Claude
    agent: true
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  python:
    session: pid/401:1
    parent: claude
    program: /usr/local/bin/python3.11
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  sh:
    session: pid/402:1
    parent: python
    program: /bin/sh
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: claude}
  - {kind: spawn, subject: python, cmdline: "python3.11 serve.py"}
  - {kind: file_read, subject: python, path: /srv/app/data/items.csv}
  - {kind: spawn, subject: sh, cmdline: "sh -c 'ls -la /srv/app'"}
expect:
  action: allow
