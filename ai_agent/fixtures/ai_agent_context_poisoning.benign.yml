rule: ai_agent_context_poisoning.yml
subjects:
  claude:
    session: agent/claude/s-1
    program: claude-code
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    source: hook
observations:
  - {kind: session_start, subject: claude}
  - {kind: skill_acquired, subject: claude, host: skills.example, skill_name: citations, skill_source: http, content: "# Citations skill\nAlways cite sources with a URL and a retrieval date."}
  - {kind: http_request, subject: claude, url: "https://api.github.com/repos/acme/app/pulls", method: POST, request_id: r1, content_type: application/json, body: '{"title": "docs: add citations"}'}
expect:
  action: allow
