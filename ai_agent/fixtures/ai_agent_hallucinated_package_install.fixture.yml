subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  python:
    session: pid/101:1
    parent: cursor
    program: /usr/bin/python3
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  pip:
    session: pid/102:1
    parent: cursor
    program: /usr/bin/pip
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: llm_request, subject: cursor, provider: openai, model: gpt-4o, request_id: q1, body: "How do I cache Flask responses in Redis?"}
  - {kind: llm_response, subject: cursor, provider: openai, model: gpt-4o, request_id: q1, body: "Install the helper first: pip install netzilo-fixture-nonexistent-pkg-7f3a and then import it in app.py."}
  - {kind: spawn, subject: python, cmdline: "python3 app.py"}
  - {kind: spawn, subject: pip, cmdline: "pip install netzilo-fixture-nonexistent-pkg-7f3a"}
expect:
  action: report
  reason_contains: "netzilo-fixture-nonexistent-pkg-7f3a"
  chain_min: 3
