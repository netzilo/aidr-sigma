rule: ai_agent_pypi_sec_research_payload_chain.yml
subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  pip:
    session: pid/101:1
    parent: cursor
    program: /usr/local/bin/python3
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  curl:
    session: pid/102:1
    parent: cursor
    program: /usr/bin/curl
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: spawn, subject: pip, cmdline: "pip install sec-research"}
  - {kind: spawn, subject: curl, cmdline: "curl -sL https://arxiv.org/abs/2401.00001"}
expect:
  action: allow
