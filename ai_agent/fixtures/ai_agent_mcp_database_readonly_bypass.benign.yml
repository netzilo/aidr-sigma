rule: ai_agent_mcp_database_readonly_bypass.yml
subjects:
  claude:
    session: pid/100:1
    program: /Applications/Claude.app/Contents/MacOS/Claude
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com, groups: [eng]}]
    device: dev-1
    source: probe
  dbserver:
    session: pid/101:1
    parent: claude
    program: /usr/local/bin/node
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  psql:
    session: pid/103:1
    parent: claude
    program: /opt/homebrew/bin/psql
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: claude}
  - {kind: spawn, subject: dbserver, cmdline: "node /usr/local/lib/node_modules/@executeautomation/database-server/dist/index.js --postgresql --host db.internal --database app"}
  - {kind: spawn, subject: psql, cmdline: "psql postgresql://app@db.internal/app -c \"INSERT INTO users (name) VALUES ('x')\""}
expect:
  action: allow
