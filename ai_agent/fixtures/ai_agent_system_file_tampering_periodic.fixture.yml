subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: file_write, subject: cursor, path: /Users/dev/proj/src/main.go}
  - {kind: file_write, subject: cursor, path: /usr/local/bin/helper}
expect:
  action: block
  output_contains: ["System path write: /usr/local/bin/ by Cursor"]
