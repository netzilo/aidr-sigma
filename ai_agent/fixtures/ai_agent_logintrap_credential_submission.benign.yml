rule: ai_agent_logintrap_credential_submission.yml
subjects:
  agent:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: agent}
  - {kind: http_request, subject: agent, url: "https://docs.example/guide", method: GET, request_id: r1, content_type: text/html, body: ""}
  - {kind: http_response, subject: agent, url: "https://docs.example/guide", request_id: r1, status: 200, content_type: text/html, body: "<p>Sign in to the dashboard to view usage metrics for your account.</p>"}
  - {kind: http_request, subject: agent, url: "https://docs.example/login", method: POST, request_id: r2, content_type: application/json, body: '{"username": "dev@example.com", "password": "Tr0ub4dor&3"}'}
expect:
  action: allow
