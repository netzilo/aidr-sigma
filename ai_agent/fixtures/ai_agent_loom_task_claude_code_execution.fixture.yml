subjects:
  zsh:
    session: pid/100:1
    program: /bin/zsh
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  node:
    session: pid/101:1
    parent: zsh
    program: /usr/local/bin/node
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  claude:
    session: pid/102:1
    parent: node
    program: /usr/local/bin/claude
    agent: true
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: zsh}
  - {kind: spawn, subject: node, cmdline: "node /Users/dev/proj/node_modules/@lamemind/loom-deck/bin/loom-deck.js run"}
  - {kind: file_read, subject: node, path: /Users/dev/proj/tasks.md}
  - {kind: spawn, subject: claude, cmdline: "claude -p --dangerously-skip-permissions"}
expect:
  action: report
  reason_contains: "3 ordered stages (tasks.md read confirmed)"
  output_contains: ["loom-deck LOOM_TASK Claude Code launch"]
  chain_min: 3
