rule: ai_agent_pypi_book_recommendations_supply_chain.yml
subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  pip:
    session: pid/101:1
    parent: cursor
    program: /usr/local/bin/python3
    name: pip
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: spawn, subject: pip, cmdline: "python3 -m pip install requests"}
  - {kind: http_request, subject: pip, url: "https://pypi.org/simple/requests/", method: GET, request_id: r1, content_type: text/html, body: ""}
  - {kind: http_request, subject: pip, url: "https://files.pythonhosted.org/packages/ab/cd/requests-2.32.3-py3-none-any.whl", method: GET, request_id: r2, content_type: application/octet-stream, body: ""}
expect:
  action: allow
