rule: ai_agent_vllm_mooncake_deser_rce.yml
subjects:
  bash:
    session: pid/1100:1
    program: /bin/bash
    actors: [{id: u1, name: Ops}]
    device: gpu-1
    source: probe
  vllm:
    session: pid/1101:1
    parent: bash
    program: /opt/venv/bin/python3
    actors: [{id: u1, name: Ops}]
    device: gpu-1
    source: probe
  curl:
    session: pid/1102:1
    parent: vllm
    program: /usr/bin/curl
    actors: [{id: u1, name: Ops}]
    device: gpu-1
    source: probe
observations:
  - {kind: session_start, subject: bash}
  - {kind: spawn, subject: vllm, cmdline: "python3 -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-3-8B"}
  - {kind: spawn, subject: curl, cmdline: "curl -L -o /models/tokenizer.json https://huggingface.co/meta-llama/Llama-3-8B/resolve/main/tokenizer.json"}
  - {kind: file_write, subject: curl, path: /models/tokenizer.json}
trigger: 2
expect:
  action: allow
