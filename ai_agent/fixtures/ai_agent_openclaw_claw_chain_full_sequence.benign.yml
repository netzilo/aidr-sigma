rule: ai_agent_openclaw_claw_chain_full_sequence.yml
subjects:
  claude:
    session: pid/100:1
    program: /usr/local/bin/claude
    agent: true
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  shell:
    session: pid/101:1
    parent: claude
    program: /bin/zsh
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: claude}
  - {kind: spawn, subject: shell, cmdline: "zsh -c 'aws sts get-caller-identity'"}
  - {kind: file_read, subject: shell, path: /Users/dev/.aws/credentials}
  - {kind: connect, subject: shell, host: 169.254.169.254, port: 80, protocol: tcp}
expect:
  action: allow
