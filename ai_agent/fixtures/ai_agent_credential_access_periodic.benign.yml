rule: ai_agent_credential_access_periodic.yml
subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  shell:
    session: pid/101:1
    parent: cursor
    program: /bin/zsh
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: file_read, subject: cursor, path: /Users/dev/proj/README.md}
  - {kind: file_write, subject: cursor, path: /Users/dev/.aws/credentials.bak.txt}
  - {kind: file_read, subject: shell, path: /Users/dev/proj/.env.example}
expect:
  action: allow
