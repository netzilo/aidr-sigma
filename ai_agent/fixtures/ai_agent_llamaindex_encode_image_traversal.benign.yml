rule: ai_agent_llamaindex_encode_image_traversal.yml
subjects:
  agent:
    session: pid/100:1
    program: /usr/bin/python3
    name: python3
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: agent}
  - {kind: tool_call, subject: agent, server: local, tool: encode_image, call_id: c1, args: '{"image_path": "../assets/diagram.png"}'}
  - {kind: file_read, subject: agent, path: /Users/dev/proj/assets/diagram.png}
trigger: 1
expect:
  action: allow
