rule: ai_agent_fictional_terminal_override.yml
subjects:
  claude:
    session: pid/100:1
    program: /usr/local/bin/claude
    agent: true
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  build:
    session: pid/101:1
    parent: claude
    program: /bin/bash
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  override:
    session: pid/102:1
    parent: claude
    program: /bin/bash
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: claude}
  - {kind: spawn, subject: build, cmdline: "bash -c 'make test'"}
  - {kind: spawn, subject: override, cmdline: "bash -c 'sudo ufw disable'"}
expect:
  action: allow
