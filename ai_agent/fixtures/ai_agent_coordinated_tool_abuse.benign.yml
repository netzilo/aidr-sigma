rule: ai_agent_coordinated_tool_abuse.yml
subjects:
  claude:
    session: agent/claude/s-42
    program: claude-code
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    source: hook
observations:
  - {kind: session_start, subject: claude}
  - {kind: tool_call, subject: claude, server: ops, server_url: "https://mcp.ops.example", tool: exec_shell, call_id: c0, args: '{"cmd": "cat /etc/hosts0"}'}
  - {kind: tool_call, subject: claude, server: ops, server_url: "https://mcp.ops.example", tool: exec_shell, call_id: c1, args: '{"cmd": "cat /etc/hosts1"}'}
  - {kind: tool_call, subject: claude, server: ops, server_url: "https://mcp.ops.example", tool: exec_shell, call_id: c2, args: '{"cmd": "cat /etc/hosts2"}'}
  - {kind: tool_call, subject: claude, server: ops, server_url: "https://mcp.ops.example", tool: exec_shell, call_id: c3, args: '{"cmd": "cat /etc/hosts3"}'}
  - {kind: tool_call, subject: claude, server: ops, server_url: "https://mcp.ops.example", tool: exec_shell, call_id: c4, args: '{"cmd": "cat /etc/hosts4"}'}
expect:
  action: allow
