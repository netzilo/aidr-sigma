rule: ai_agent_faiss_pickle_deserialization_rce.yml
subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  python:
    session: pid/101:1
    parent: cursor
    program: /usr/local/bin/python3
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  sh:
    session: pid/102:1
    parent: python
    program: /bin/sh
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: spawn, subject: python, cmdline: "python3 setup.py build_ext"}
  - {kind: spawn, subject: sh, cmdline: "sh -c 'chmod +x configure && ./configure'"}
expect:
  action: allow
