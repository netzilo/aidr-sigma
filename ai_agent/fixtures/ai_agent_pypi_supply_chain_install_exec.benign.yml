rule: ai_agent_pypi_supply_chain_install_exec.yml
subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  python:
    session: pid/101:1
    parent: cursor
    program: /usr/local/bin/python3
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  cc:
    session: pid/102:1
    parent: python
    program: /usr/bin/cc
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: spawn, subject: python, cmdline: "python3 -m pip install numpy"}
  - {kind: http_request, subject: python, url: "https://pypi.org/simple/numpy/", method: GET, request_id: r1, content_type: text/html, body: ""}
  - {kind: spawn, subject: cc, cmdline: "cc -O2 -c build/temp/x.c -o build/temp/x.o"}
trigger: 1
expect:
  action: allow
