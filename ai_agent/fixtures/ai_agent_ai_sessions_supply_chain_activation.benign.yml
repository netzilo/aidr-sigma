rule: ai_agent_ai_sessions_supply_chain_activation.yml
subjects:
  claude:
    session: pid/100:1
    program: /Applications/Claude.app/Contents/MacOS/Claude
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com, groups: [eng]}]
    device: dev-1
    source: probe
  pip:
    session: pid/101:1
    parent: claude
    program: /usr/local/bin/pip3
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: claude}
  - {kind: spawn, subject: pip, cmdline: "pip3 install ai-sessions"}
  - {kind: http_request, subject: pip, url: "https://pypi.org/simple/ai-sessions/", method: GET, request_id: r1}
trigger: 1
expect:
  action: allow
