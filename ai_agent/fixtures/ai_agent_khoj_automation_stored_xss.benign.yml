rule: ai_agent_khoj_automation_stored_xss.yml
subjects:
  agent:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: agent}
  - {kind: http_request, subject: agent, url: "https://khoj.example/api/chat?q=hello", method: GET, request_id: r1, content_type: application/json, body: ""}
  - {kind: http_request, subject: agent, url: "https://khoj.example/api/automation?q=summarise+my+notes+every+morning&schedule=daily", method: POST, request_id: r2, content_type: application/json, body: ""}
expect:
  action: allow
