rule: ai_agent_langchain_palchain_code_exec.yml
subjects:
  agent:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  python:
    session: pid/101:1
    parent: agent
    program: /usr/local/bin/python3
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  pip:
    session: pid/102:1
    parent: python
    program: /usr/local/bin/python3
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: agent}
  - {kind: spawn, subject: python, cmdline: "python3 -m pip install langchain"}
  - {kind: spawn, subject: pip, cmdline: "python3 -c import sys, setuptools, tokenize; sys.argv[0] = 'setup.py'; exec(compile(getattr(tokenize, 'open', open)('setup.py').read().replace('\\r\\n', '\\n'), 'setup.py', 'exec'))"}
expect:
  action: allow
