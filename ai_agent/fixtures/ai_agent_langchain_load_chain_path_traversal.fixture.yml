subjects:
  claude:
    session: pid/700:1
    program: /Applications/Claude.app/Contents/MacOS/Claude
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  python:
    session: pid/701:1
    parent: claude
    program: /usr/local/bin/python3.11
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: claude}
  - {kind: spawn, subject: python, cmdline: "python3.11 app.py"}
  - {kind: file_read, subject: python, path: /srv/app/.env}
  - {kind: http_request, subject: python, url: "https://raw.githubusercontent.com/hwchase17/langchain-hub/master/../../../etc/passwd", method: GET, request_id: r1}
expect:
  action: report
  reason_contains: "followed by same-session read of 1 secret-bearing file(s)"
  output_contains: ["issued by python3.11 -> Claude"]
  chain_min: 2
