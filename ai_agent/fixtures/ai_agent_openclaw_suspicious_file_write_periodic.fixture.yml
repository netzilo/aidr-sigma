subjects:
  cursor:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  shell:
    session: pid/101:1
    parent: cursor
    program: /bin/zsh
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: spawn, subject: shell, cmdline: "zsh -c 'echo export PATH=/tmp/x:$PATH >> ~/.zshrc'"}
  - {kind: file_write, subject: cursor, path: /Users/dev/proj/README.md}
  - {kind: file_write, subject: shell, path: /Users/dev/.zshrc}
expect:
  action: block
  output_contains: ["Suspicious write — path: .zshrc process: zsh agent: Cursor"]
