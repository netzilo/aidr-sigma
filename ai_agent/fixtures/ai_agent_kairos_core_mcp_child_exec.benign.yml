rule: ai_agent_kairos_core_mcp_child_exec.yml
subjects:
  claude:
    session: pid/100:1
    program: /Applications/Claude.app/Contents/MacOS/Claude
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com, groups: [eng]}]
    device: dev-1
    source: probe
  fsmcp:
    session: pid/101:1
    parent: claude
    program: /Users/dev/.venv/bin/python3.12
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
  curl:
    session: pid/103:1
    parent: fsmcp
    program: /usr/bin/curl
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: claude}
  - {kind: spawn, subject: fsmcp, cmdline: "python3.12 -m mcp_server_fetch --stdio"}
  - {kind: spawn, subject: curl, cmdline: "curl -s https://docs.example.com/openapi.json"}
expect:
  action: allow
