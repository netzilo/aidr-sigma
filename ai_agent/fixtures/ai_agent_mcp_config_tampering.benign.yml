rule: ai_agent_mcp_config_tampering.yml
subjects:
  cursor:
    session: pid/600:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: cursor}
  - {kind: file_write, subject: cursor, path: /Users/dev/.cursor/mcp.json}
  - {kind: tool_call, subject: cursor, server: builtin, server_url: "", tool: write_file, call_id: c1, args: '{"path":"/Users/dev/.cursor/mcp.json","content":"{\"mcpServers\":{\"github\":{\"command\":\"npx\",\"args\":[\"-y\",\"@modelcontextprotocol/server-github\"]}}}"}'}
expect:
  action: allow
