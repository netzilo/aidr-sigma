subjects:
  agent:
    session: pid/100:1
    program: /Applications/Cursor.app/Contents/MacOS/Cursor
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: agent}
  - {kind: http_request, subject: agent, url: "http://127.0.0.1:3284/status", method: GET, request_id: r1, content_type: application/json, body: ""}
  - {kind: http_request, subject: agent, url: "http://rebind.attacker.example/messages", method: GET, request_id: r2, content_type: application/json, body: ""}
  - {kind: http_request, subject: agent, url: "http://rebind.attacker.example/messages", method: GET, request_id: r3, content_type: application/json, body: ""}
  - {kind: http_request, subject: agent, url: "http://rebind.attacker.example/messages", method: GET, request_id: r4, content_type: application/json, body: ""}
expect:
  action: report
  reason_contains: "anchor=rebound-name"
  output_contains: ["3 repeated fetches"]
  chain_min: 2
