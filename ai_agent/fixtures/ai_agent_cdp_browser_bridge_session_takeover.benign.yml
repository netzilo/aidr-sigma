rule: ai_agent_cdp_browser_bridge_session_takeover.yml
subjects:
  agent:
    session: pid/100:1
    program: /usr/local/bin/node
    name: node
    agent: true
    actors: [{id: u1, name: Dev, email: dev@example.com}]
    device: dev-1
    source: probe
observations:
  - {kind: session_start, subject: agent}
  - {kind: http_request, subject: agent, url: "http://127.0.0.1:9222/json/version", method: GET, request_id: r1, content_type: application/json, body: ""}
  - {kind: http_request, subject: agent, url: "http://127.0.0.1:9222/devtools/browser/0F1E2D3C", method: GET, request_id: r2, content_type: application/json, body: ""}
expect:
  action: allow
