title: Package Lifecycle Script Writes Agent Memory/Instruction Store
id: 7c3f1d2a-9b64-4e18-a5d7-2f0c6b81e4a3
status: stable
level: high
description: |
  Detects the DSH/"memory plugin" supply-chain pattern: a package-manager
  lifecycle process (npm/npx/pnpm/yarn/bun install, or a binary executed from
  node_modules) spawns a subtree that synchronises files into an AI agent's
  memory / instruction / skill store (e.g. ~/.local/share/\u5FC6\u65F6, ~/.claude/skills,
  ~/.codex, ~/.gemini, *.mcp.json) and registers new capabilities such as
  "memocap" without explicit user authorisation. Content dropped into those
  stores is re-read as instructions on every later agent invocation, so this is
  persistence + instruction injection delivered through the software supply
  chain.

  DIFFERENTIATION FROM 043f4e6f-5354-5bc0-8046-ac279b2763ca (Agent Persistent
  Memory Poisoning via Behavioural Modifier Injection): that rule keys off the
  WRITE_FILE target path/content pattern alone and is delivery-agnostic. This
  rule's REQUIRED anchor is session provenance -- the writing session must be
  inside the spawn subtree of a package-manager lifecycle invocation, resolved
  from the triggering session's lineage and the session-keyed event log. A
  path/content rule cannot express "this write was performed by a postinstall
  script", and a lineage rule cannot be evaded by renaming the store
  directory. The two rules are complementary, not duplicative: if there is no
  package-manager provenance in the session lineage this rule returns allow and
  defers entirely to the content-keyed rule.

  Only WRITE_FILE is used as the behavioural primitive -- SYNC_FILES,
  INJECT_INSTRUCTIONS, REGISTER_CAPABILITY, capability_registration and
  file_sync are not known to the engine, and the file_write context has no live
  client producer, so file writes are read per session from the event log via
  events(kind="WRITE_FILE", session=...).
author: Evgen
date: "2026-06-12"
references:
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
  - https://atlas.mitre.org/techniques/AML.T0010
  - https://attack.mitre.org/techniques/T1195/002/
tags:
  - attack.initial-access
  - attack.t1195.002
  - attack.persistence
  - atlas.aml.t0010
  - owasp.llm03
  - owasp.llm04
falsepositives:
  - Legitimate, user-approved agent plugin packages installed from npm that
    intentionally write skills or prompt files into ~/.claude/skills,
    ~/.codex or ~/.gemini as part of their documented setup step. These will be
    reported once per install burst; triage by confirming the package name in
    the Supply-Chain Delivery stage command line.
  - An MCP server package whose postinstall step writes or patches a
    .mcp.json / mcp_settings.json entry during a deliberate developer install.
  - A monorepo bootstrap (pnpm install / yarn install) that runs a workspace
    prepare script which copies documentation markdown into a shared user data
    directory whose path happens to contain a memory/prompt/skill token.
  - Reinstall or upgrade of an already-trusted agent toolkit, which repeats the
    same fan-out of markdown files into the agent store.
  - Security research or detection-engineering work that intentionally installs
    the malicious package in a lab to reproduce the behaviour.
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - file_activity
  - llm
  - tool
  - skill
detection:
  sel_trigger:
    event_type:
      - execute_process
      - tool_call
      - tool_response
  condition: sel_trigger
action: execute
on_timeout: allow
on_error: allow
script: |
  # ── Constants ─────────────────────────────────────────────────────────────
  WINDOW_NS   = 300000000000   # 5 min: install burst -> memory-store sync
  MAX_SESSION = 48             # session fan-out cap (cost bound)
  WRITE_LIMIT = 300            # per-session WRITE_FILE rows (scoped, never broad)

  # Package-specific memory-store markers (忆时 == "yishi", the DSH store dir).
  MEM_MARKERS = ["忆时", "memocap", "dsh-yishi", "dsh_yishi", "dshyishi", "yishi"]

  # Directories that hold agent instruction / memory / skill state.
  AGENT_STORE = ["/.claude/", "/.codex/", "/.gemini/", "/.cursor/", "/.continue/",
                 "/.aider/", "/.agents/", "/.config/", "/.local/share/"]

  # A write inside AGENT_STORE only counts when the path also looks like an
  # instruction/memory/skill artefact -- positive requirement, no exclusions.
  INSTR_TOKENS = ["memor", "memocap", "skill", "prompt", "instruction", "persona",
                  "agents.md", "claude.md", "gemini.md", "mcp.json", "mcp_settings",
                  "mcpservers", "/commands/", "/rules/", "system.md"]

  PKG_MGR_RE = r"\b(npm|npx|pnpm|yarn|bun|corepack)\b"
  INSTALL_RE = r"\b(install|add|ci|postinstall|preinstall|prepare|rebuild|link|exec|dlx)\b"

  # Optional stage 0 -- what made the agent run the install in the first
  # place. FTS5 phrase queries (multi-word terms quoted) against whichever
  # content the poisoning surface indexed.
  INJECTION_MARKERS = ['"ignore previous"', '"ignore all previous"',
                       '"new instructions"', '"you must always"',
                       "disregard", '"override system"']

  # ── Pure helpers (no graph / log calls) ───────────────────────────────────
  def to_int(v):
      if v == None:
          return 0
      if type(v) == "int":
          return v
      m = re.find(r"^[0-9]+", str(v))
      if m == None:
          return 0
      return int(m)

  def is_pkg_install(cmd, path):
      s = (cmd + " " + path).lower()
      if "/node_modules/" in s or "node_modules/.bin" in s:
          return True
      if re.find(PKG_MGR_RE, s) == None:
          return False
      return re.find(INSTALL_RE, s) != None

  def path_class(p):
      lp = p.lower()
      for m in MEM_MARKERS:
          if m in lp:
              return "marker"
      in_store = False
      for d in AGENT_STORE:
          if d in lp:
              in_store = True
      if not in_store:
          return ""
      for t in INSTR_TOKENS:
          if t in lp:
              return "store"
      return ""

  def is_capability(p):
      lp = p.lower()
      if "memocap" in lp:
          return True
      if "/skills/" in lp or lp.endswith("skill.json") or lp.endswith("skills.json"):
          return True
      if "mcp.json" in lp or "mcp_settings" in lp or "mcpservers" in lp:
          return True
      return False

  def ev_edge(e, kind):
      # Event rows are keyed by the acting session. A SPAWNED row is keyed by
      # the CHILD, so its "from" is the spawner (parent_session) and its "to"
      # the child itself; every other row goes from the session to its target.
      frm = e.get("parent_session", "") if kind == "SPAWNED" else e.get("session_id", "")
      t = e.get("ts", "0")
      return {
          "from":     frm,
          "to":       e.get("target_id", ""),
          "kind":     kind,
          "dir":      "out",
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
      }

  def spawn_row(sid):
      # The SPAWNED row of a session carries its command line (session dicts
      # only carry the program path).
      rows = events(kind="SPAWNED", session=sid, limit=1)
      if rows:
          return rows[0]
      return None

  def has_marker(source_label):
      for m in INJECTION_MARKERS:
          if search_in(source_label, m):
              return True
      return False

  # Optional stage 0: what made the agent run the install. Any one of these
  # signals -- an untrusted skill acquisition, a poisoned LLM prompt/response,
  # or a tool result carrying injected instructions -- upgrades the verdict
  # from report to block (see run()). ACQUIRED_SKILL/LLM/TOOL_RESULT edges hang
  # off the SPECIFIC session that made the call (e.g. the curl child, not the
  # agent root), so every session in scope is checked, not just the agent root.
  # ACQUIRED_SKILL and MCP-tool-description poisoning only exist when the
  # MITM/semantic-classifier path is active; otherwise these loops are a no-op.
  # ACQUIRED_SKILL is a MERGED edge, so it carries first_ts/last_ts and never a
  # plain "ts" (see the edge schema). Reading "ts" alone yields 0, which is
  # always older than `since`, so every poisoning edge was skipped and the
  # 0- Agent Poisoning stage could never fire.
  def edge_ts(e):
      return to_int(e.get("last_ts", e.get("first_ts", e.get("ts", "0"))))

  def find_poisoning(node_ids, since, now):
      for nid in node_ids:
          for e in edges(nid, dir="out", kind="ACQUIRED_SKILL"):
              ts = edge_ts(e)
              if ts < since or ts > now:
                  continue
              s = node(e.get("to", ""))
              untrusted = s != None and s.get("is_ztna_host", "0") == "0"
              if untrusted or has_marker(e.get("to", "")):
                  host = s.get("host", "?") if s != None else "?"
                  return {"edge": e, "stage_desc": "skill acquired from untrusted host: " + host}

      for nid in node_ids:
          for e in edges(nid, dir="out", kind="LLM_REQUEST"):
              ts = to_int(e.get("ts", "0"))
              if ts < since or ts > now:
                  continue
              llm = node(e.get("to", ""))
              rid = e.get("request_id", e.get("callid", ""))
              label = "llmreq://" + (llm.get("provider", "") + "/" + llm.get("model", "") if llm != None else "") + "#" + rid
              if has_marker(label):
                  return {"edge": e, "stage_desc": "LLM prompt carried instruction-injection markers"}

      for nid in node_ids:
          for e in edges(nid, dir="in", kind="LLM_RESPONSE"):
              ts = to_int(e.get("ts", "0"))
              if ts < since or ts > now:
                  continue
              llm = node(e.get("from", ""))
              rid = e.get("request_id", e.get("callid", ""))
              label = "llmres://" + (llm.get("provider", "") + "/" + llm.get("model", "") if llm != None else "") + "#" + rid
              if has_marker(label):
                  return {"edge": e, "stage_desc": "LLM response carried instruction-injection markers"}

      for nid in node_ids:
          for e in edges(nid, dir="in", kind="TOOL_RESULT"):
              ts = to_int(e.get("ts", "0"))
              if ts < since or ts > now:
                  continue
              cid = e.get("call_id", e.get("callid", ""))
              label = e.get("from", "") + "#result:" + cid
              if has_marker(label):
                  return {"edge": e, "stage_desc": "tool result carried instruction-injection markers"}

      return None

  # ── Relevance gate: pure string checks on meta, no traversal ──────────────
  def is_relevant_event():
      ct = meta.get("context_type", "")
      c  = meta.get("content", "")
      lc = c.lower()
      if ct == "execute_process":
          return is_pkg_install(c, "")
      if ct == "tool_input" or ct == "tool_output":
          if re.find(PKG_MGR_RE, lc) != None and re.find(INSTALL_RE, lc) != None:
              return True
          for m in MEM_MARKERS:
              if m in lc:
                  return True
          return False
      return False

  def run():
      if not is_relevant_event():
          return "allow"

      now = to_int(meta.get("event_ts", "0"))
      if meta.get("session", "") == "" or now == 0:
          return "allow"

      # ── Anchor on the triggering session and its lineage ──────────────────
      inst = session()
      if inst == None:
          return "allow"          # degraded: session not known yet -- re-fires later
      lineage_ = lineage(inst["id"])
      if not lineage_:
          return "allow"

      # ── Scope: the lineage + sessions spawned inside it within the window ──
      scope = {}
      for x in lineage_:
          scope[x["id"]] = True

      execs = events(kind="SPAWNED", since_ns=now - WINDOW_NS,
                     until_ns=now, limit=4000)
      for _r in range(4):
          added = 0
          for e in execs:
              pp = e.get("parent_session", "")
              ap = e.get("session_id", "")
              if pp in scope and ap not in scope and len(scope) < MAX_SESSION:
                  scope[ap] = True
                  added += 1
          if added == 0:
              break

      # ── Stage 1 (REQUIRED anchor): package lifecycle provenance ───────────
      # Walk the lineage root-first so the top-most lifecycle process (the
      # `npm install` itself) anchors the window, not a postinstall descendant.
      install_ev = None
      for i in range(len(lineage_)):
          x = lineage_[len(lineage_) - 1 - i]
          r = spawn_row(x["id"])
          cmd = r.get("cmdline", "") if r != None else ""
          if is_pkg_install(cmd, x.get("path", "")):
              if r != None:
                  install_ev = r
              else:
                  install_ev = {"ts": x.get("first_seen", "0"), "kind": "SPAWNED",
                                "session_id": x["id"], "parent_session": x.get("parent", ""),
                                "target_id": x["id"], "program": x.get("path", ""),
                                "cmdline": cmd}
              break
      # execs is newest-first; break on the first match so a stale, older
      # install from an earlier unrelated burst in the same scope can
      # never get stitched onto a newer, separate incident's writes.
      if install_ev == None:
          for e in execs:
              ap = e.get("session_id", "")
              pp = e.get("parent_session", "")
              if ap not in scope and pp not in scope:
                  continue
              if is_pkg_install(e.get("cmdline", ""), e.get("program", "")):
                  install_ev = e
                  break
      if install_ev == None:
          return "allow"          # no supply-chain provenance -> not this rule's threat

      s0_ts = to_int(install_ev.get("ts", "0"))
      if s0_ts == 0 or (now - s0_ts) > WINDOW_NS:
          return "allow"          # stale -- never stitch an old install to a new write
      since = max(s0_ts, now - WINDOW_NS)

      # ── Stage 2: memory/instruction store writes by sessions in scope ──────
      marker_w = []
      store_w  = []
      cap_w    = []
      seen     = {}
      for sid in scope:
          rows = events(kind="WRITE_FILE", session=sid,
                        since_ns=since, until_ns=now, limit=WRITE_LIMIT)
          for e in rows:
              p = e.get("path", "")
              if p == "" or p in seen:
                  continue
              seen[p] = True
              k = path_class(p)
              if k == "marker":
                  marker_w.append(e)
              elif k == "store":
                  store_w.append(e)
              if k != "" and is_capability(p):
                  cap_w.append(e)

      fanout = len(marker_w) + len(store_w)
      if fanout == 0:
          return "allow"

      score = 0
      if marker_w:
          score += 2            # package-specific store (忆时 / memocap / dsh-yishi)
      if store_w:
          score += 1            # generic agent instruction store
      if fanout >= 3:
          score += 1            # docs/scripts bulk sync signature
      if cap_w:
          score += 1            # skill / MCP capability manifest touched
      if score < 2:
          return "allow"

      # ── Optional stage 0: what poisoned the agent into running this ───────
      # Poisoning necessarily precedes the install, so it falls BEFORE `since`
      # (which is anchored at-or-after the install's own s0_ts) -- look back
      # the full WINDOW_NS from `now`, not from the install's own start.
      aid = lineage_[-1]["id"]
      poison = find_poisoning(list(scope.keys()), now - WINDOW_NS, now)

      # ── Kill chain, built from session-keyed event rows ───────────────────
      chain = new_chain(aid)
      names = []
      for x in lineage_:
          names.append(x.get("path", "?").split("/")[-1])
      lname = " -> ".join(names)

      if poison != None:
          chain.append(step(poison["edge"], stage_id="0- Agent Poisoning",
                            stage_desc=poison["stage_desc"]))

      chain.append(step(ev_edge(install_ev, "SPAWNED"),
                        stage_id="1- Supply-Chain Delivery",
                        stage_desc="package-manager lifecycle process: " +
                                   install_ev.get("cmdline", install_ev.get("program", "?"))))

      first = marker_w[0] if marker_w else store_w[0]
      chain.append(step(ev_edge(first, "WRITE_FILE"),
                        stage_id="2- Memory Store Write",
                        stage_desc="agent memory/instruction store written by install subtree: " +
                                   first.get("path", ""),
                        activity={"path": first.get("path", ""), "ts": first.get("ts", "0")}))

      if fanout >= 3:
          for e in (marker_w + store_w)[1:4]:
              chain.append(step(ev_edge(e, "WRITE_FILE"),
                                stage_id="3- Instruction Store Fan-Out",
                                stage_desc="bulk sync into agent store: " + e.get("path", ""),
                                activity={"path": e.get("path", ""), "ts": e.get("ts", "0")}))

      if cap_w:
          c0 = cap_w[0]
          chain.append(step(ev_edge(c0, "WRITE_FILE"),
                            stage_id="4- Capability Registration",
                            stage_desc="skill/capability manifest written: " + c0.get("path", ""),
                            activity={"path": c0.get("path", ""), "ts": c0.get("ts", "0")}))

      verdict = "block" if poison != None else "report"
      reason = ("Package lifecycle subtree wrote " + str(fanout) +
                " file(s) into the agent memory/instruction store via " + lname +
                " (marker_writes=" + str(len(marker_w)) +
                ", capability_writes=" + str(len(cap_w)) +
                ", score=" + str(score) + ")")
      if poison != None:
          reason = "Full chain confirmed -- " + poison["stage_desc"] + " -> " + reason
      print(reason)
      # Mark the agent/host integrity as BREACHED (level 0), report or block --
      # the write into the agent's own memory/instruction store already
      # happened either way, and the level persists in posture metadata until
      # something resets it (see Claw Chain's identical use of this call).
      set_integrity_level(0)
      return {"action": verdict, "reason": reason, "chain": chain}

  result = run()
