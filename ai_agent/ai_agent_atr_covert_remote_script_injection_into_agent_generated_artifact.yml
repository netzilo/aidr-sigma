falsepositives:
- 'Everyday front-end instructions that add a CDN or analytics script tag to a page (measured: 0 hits,
  but this is the neighbourhood the rule lives in)'
- An instruction that adds a remote script AND, for an unrelated reason, conceals something else from
  the user within the same 140 characters
- 'Legitimate-but-covert product work: silent canary rollouts, internal-only telemetry, hotfix scripts
  an operator does not want surfaced yet. The rule fires on these by design -- the shape is covert third-party
  script insertion regardless of motive -- so triage is required before acting'
- Security research or documentation that quotes an AML.CS0041 payload verbatim
action: report
