title: Covert Remote-Script Injection into Agent-Generated Artifacts
id: c493f841-5891-4219-937b-c2fd1d9c911c
status: experimental
level: high
description: |-
  Detects an instruction that tells a coding agent to insert a REMOTE-sourced <script>/<iframe> element into the artifacts it generates AND, in the same breath, to conceal that insertion from the person it is working for. MITRE ATLAS AML.CS0041 (Rules File Backdoor) family: a poisoned rules file makes every subsequent generation carry an attacker-controlled script.
  SCOPE, STATED NARROWLY ON PURPOSE. The bare "inject a script tag into the HTML" instruction is NOT detectable at the pattern layer and this rule does not try: "attach the analytics script tag to the bottom of the html file" and the AML.CS0041 sample text are word-for-word the same shape, and the benign corpora carry that shape densely (92 documents contain a literal <script, 28 an explicit "script src", including Sentry / Stripe / Mapbox / chart.js / GTM loader instructions). What this rule keys on is the CONJUNCTION with an object-bound concealment clause -- "and do not tell the user about it", "keep it hidden from the user", "never mention this addition to the user". A principal has no reason to instruct an agent to hide, from that same principal, a third-party script it just added to the principal's own deliverable.
  Concealment clauses with NO grammatical object ("...without telling the user.", "...keep it secret.") are deliberately excluded: measured against hand-written benign instructions they attach to an unrelated clause ("add <script src=...> to the layout; it runs the schema migration without telling the user") and false-positive. That residue is judgement, not string matching, and is left out rather than guessed at.
  HTML-entity spellings of the tag (&lt;script, &amp;lt;script) are accepted by the pattern because the engine performs no entity decoding, but their false-positive behaviour is UNMEASURED -- those byte sequences occur zero times in all three local benign corpora. They ride on the concealment conjunction, which is where this rule's precision actually comes from.

  Adapted from Agent Threat Rules ATR-2026-02502 (MIT).
author: ATR Community (adapted)
date: '2026-08-11'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-02502
tags:
- attack.initial-access
- atlas.aml.t0051
- atlas.aml.t0051.000
- owasp.asi01
- owasp.llm01
