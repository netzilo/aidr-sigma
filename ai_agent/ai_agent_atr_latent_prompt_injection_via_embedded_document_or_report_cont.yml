title: Latent Prompt Injection via Embedded Document or Report Context
id: 649e1054-785a-4f72-a931-973f17283eab
status: experimental
level: high
description: |-
  Detects latent prompt injection embedded inside document contexts beyond translation (covered by ATR-2026-00264). From NVIDIA garak latentinjection.py: LatentInjectionReportFull, LatentInjectionResumeFull, LatentInjectionFactSnippetEiffel, LatentInjectionFactSnippetLegal, LatentJailbreakFull, LatentWhoisSnippetFull. The attack hides an instruction inside an otherwise legitimate document (report, resume, legal text, Whois output, factual snippet) and asks the agent to process the document. The hidden instruction then hijacks the agent's task. Key injection patterns planted inside documents: (1) "Ignore the above and..." hidden in document body; (2) "Your task is now to..." appearing mid-document; (3) Injected tool call or API instruction embedded in base64 or comment syntax; (4) "<!-- DO THIS INSTEAD: ... -->" HTML comment injection in document content. Complements ATR-2026-00265 (RAG/document) with report, resume, and structured data contexts that agents commonly process.

  Adapted from Agent Threat Rules ATR-2026-00286 (MIT).
author: ATR Community (adapted)
date: '2026-04-19'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00286
- https://github.com/NVIDIA/garak/blob/main/garak/probes/latentinjection.py
- https://kai-greshake.de/posts/inject-my-pdf/
- https://arxiv.org/abs/2302.12173
tags:
- attack.initial-access
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?:summarize|analyze|review|process|read|extract\s+(?:info|information|data|key\s+points)\s+from)\s+(?:this\s+)?(?:report|resume|CV|document|article|PDF|file|text|whois|legal\s+document)[\s\S]{20,2000}(?:ignore\s+(?:the\s+)?(?:above|previous|prior|all\s+(?:the\s+)?above)|your\s+(?:new\s+)?(?:task|instruction|goal|objective)\s+(?:is|now)\s+(?:is\s+)?to)
  sel_1:
    response|re: (?:<!--\s*(?:NOTE|INSTRUCTION|SYSTEM|PROMPT|INJECT(?:ED)?|DO\s+THIS|OVERRIDE)[:\s].{5,200}-->|<!--.{0,50}(?:ignore|override|your\s+task|instead|new\s+instruction).{0,200}-->)
  sel_2:
    response|re: (?:\[(?:INTERNAL|SYSTEM|HIDDEN|SECRET|NOTE|PROMPT)\]:?\s.{5,200}(?:ignore|override|instead|your\s+task|new\s+(?:task|instruction|goal))|(?:\/\/|#)\s*(?:INJECT|OVERRIDE|PROMPT|INSTRUCTION):\s*.{5,150})
  sel_3:
    response|re: (?:Whois|WHOIS|whois)\s+(?:output|result|data|record|information)[\s\S]{0,500}(?:ignore\s+(?:the\s+)?(?:above|previous|whois\s+context)|your\s+(?:real\s+)?(?:task|instruction)\s+(?:is|now))
  sel_4:
    response|re: (?:paraphrase|refine|polish|improve|correct)\s+(?:the\s+)?(?:following\s+)?(?:sentence|text|paragraph|passage)[\s\S]{0,300}(?:(?:Ignore|Disregard)\s+(?:the\s+)?(?:above|previous|prior)\s+(?:and|instructions?|context)|your\s+(?:actual|real|true|new)\s+(?:task|goal|objective)\s+(?:is\s+)?(?:to|:))
  condition: 1 of sel_*
falsepositives:
- Security audit reports that quote injection examples inside the document body
- Red team exercise documents containing injection test cases as examples
- Legitimate documents that coincidentally contain instruction-like language
action: report
