title: Hydra instantiate() Target Hijack to Process Execution
id: 3f9c7b41-0a2e-4d16-9b8c-7e5a1c26d4f0
status: experimental
level: high
description: |
  Detects arbitrary code execution reached through Hydra's instantiate() /
  hydra.utils.get_method resolution of an attacker-controllable _target_.

  The only telemetry this class of bug can ever produce is an execute_process
  event: instantiate() resolves _target_ to os.system / os.popen /
  subprocess.Popen and the interpreter spawns a child. This rule anchors on the
  triggering exec (meta, never re-queried - the just-fired event races async
  ingest), resolves the exact caller instance with proc_instance(), walks
  proc_lineage() to find the *Python interpreter ancestor in the same spawn
  chain* whose own command line carries Hydra config/override control
  (_target_=, --config-name/-cn, --config-path/-cp, --config-dir,
  hydra.searchpath, hydra.run.dir, +key=/++key= overrides), and only then
  requires either (a) a dangerous _target_ value on that ancestor's command line
  or (b) an unmistakably injected payload in the spawned command.

  Why this is not covered by 'External Network Input Followed by Process
  Execution': that rule requires a network-origin input edge before the exec
  sink. Hydra config is frequently attacker-influenced with NO network event at
  all - a CLI override injected by a pipeline, a YAML on local disk, a model
  directory unpacked earlier in the job, or a config composed by a previously
  running step. Those cases produce execute_process with no preceding
  HTTP_REQUEST and are invisible to the network-anchored rule. Conversely, when
  the config *was* fetched, the network rule reports 'network then exec' with no
  attribution of *which* process instance executed and no evidence that Hydra
  target resolution was the mechanism - it cannot separate a hydra launcher
  plugin shelling out from instantiate() resolving os.system. This rule carries
  the Hydra target-control evidence in the ancestor's command line and binds it
  to the child exec through an instance-exact lineage, so the kill chain names
  the responsible interpreter instance. The remote-config fetch and the untrusted
  config file read are kept as optional corroborating stages, not requirements.
author: Haibo
date: "2026-06-12"
references:
  - https://hydra.cc/docs/advanced/instantiate_objects/overview/
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
  - https://attack.mitre.org/techniques/T1059/006/
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.004
  - attack.t1059.006
  - owasp.a03_2021_injection
  - owasp.a08_2021_software_and_data_integrity_failures
falsepositives:
  - Hydra launcher plugins (submitit/slurm, ray, joblib, rq) legitimately wrap job
    submission in `sh -c`. Those payloads are plain interpreter invocations and do
    not match the dangerous-payload list, so they are dropped by the script.
  - Legitimate setup steps in a Hydra-launched training script that download an
    artifact and mark it executable (`sh -c "curl ... && chmod +x ..."`). These do
    match the payload list and will be reported; the chain's config-source stage
    shows whether the config came from an untrusted directory.
  - Advanced but benign configs that resolve callables via
    `hydra.utils.get_method` or `_target_=builtins.<fn>` for factory patterns.
  - CI/notebook pipelines that pass a shell snippet through a Hydra override
    (`+cmd="..."`) and then execute it deliberately.
  - Security research or CVE reproduction in a sandbox using `_target_=os.system`.
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_exec_sink:
    event_type: execute_process
    content|re: '(?i)(/bin/(sh|bash|zsh|dash)\b|\b(sh|bash|zsh)\s+-c\b|\bpython[0-9.]*\s+-c\b|\bperl\s+-e\b|\bruby\s+-e\b|\bnode\s+-e\b|\bosascript\b|\bpowershell(\.exe)?\b|\bcmd(\.exe)?\s+/c\b|\b(nc|ncat|socat|curl|wget)\b)'
  condition: sel_exec_sink
action: execute
on_timeout: allow
on_error:   allow
script: |
  # ── Hydra instantiate() _target_ hijack → process execution ───────────────
  # Instance-resolved: caller_pid → proc_instance → proc_lineage → query_events.
  # The triggering exec is taken from meta only (async-ingest race, gotcha 1).

  LINEAGE_WINDOW_NS = 21600000000000   # 6h  ancestor spawn → child exec
  CONFIG_WINDOW_NS  = 3600000000000    # 1h  corroborating config-origin lookback
  DEDUPE_NS         = 300000000000     # 5m  per-instance report suppression

  SINKS = [
      r"/bin/sh\b", r"/bin/bash\b", r"/bin/zsh\b", r"/bin/dash\b",
      r"\bsh\s+-c\b", r"\bbash\s+-c\b", r"\bzsh\s+-c\b",
      r"\bpython[0-9.]*\s+-c\b", r"\bperl\s+-e\b", r"\bruby\s+-e\b",
      r"\bnode\s+-e\b", r"\bosascript\b", r"(?i)\bpowershell(\.exe)?\b",
      r"(?i)\bcmd(\.exe)?\s+/c\b",
      r"\bnc\b", r"\bncat\b", r"\bsocat\b", r"\bcurl\b", r"\bwget\b",
  ]

  # Payload shapes that a benign hydra launcher wrapper does not produce.
  PAYLOAD = [
      r"/dev/tcp/", r"\bbash\s+-i\b", r"\bsh\s+-i\b", r"\bnc\s+-[a-zA-Z]*e\b",
      r"(?i)base64\s+(-d|-D|--decode)", r"(?i)b64decode",
      r"(?i)\|\s*(bash|sh|zsh|python[0-9.]*|perl|ruby|node)\b",
      r"(?i)\bchmod\s+\+?x\b",
      r"(?i)os\.system\s*\(", r"(?i)os\.popen\s*\(",
      r"(?i)subprocess\.(popen|run|call|check_output)",
      r"(?i)__import__\s*\(", r"(?i)\bpty\.spawn\b",
      r"(?i)\beval\s*\(", r"(?i)\bexec\s*\(",
      r"authorized_keys", r"(?i)\bcrontab\b", r"/etc/cron",
      r"\.ssh/id_", r"\.aws/credentials", r"/etc/shadow", r"/etc/passwd",
      r"(?i)\brm\s+-rf\s+/",
      r"(?i)\b(curl|wget)\b[^\n]{0,200}\b(sh|bash|python[0-9.]*)\b",
      r"(?i)\bhydra\.utils\.get_method\b",
  ]

  # Evidence that the ancestor is a Hydra entrypoint whose composition/target
  # is externally influenceable.
  HYDRA_MARKERS = [
      r"_target_",
      r"(?i)--config-name\b", r"(?i)--config-path\b", r"(?i)--config-dir\b",
      r"(?i)\s-cn\s", r"(?i)\s-cp\s", r"(?i)\s-cd\s",
      r"(?i)\bhydra\.run\.dir\b", r"(?i)\bhydra\.searchpath\b",
      r"(?i)\bhydra\.job\b", r"(?i)\bhydra/job_logging\b",
      r"(?i)\bhydra\.main\b", r"(?i)\bhydra\.utils\b",
      r"\s\+\+?[A-Za-z_][A-Za-z0-9_.]*=",
  ]

  TARGET_DANGEROUS = r"(?i)_target_\s*[:=]\s*[\"']?(os\.system|os\.popen|os\.exec|subprocess\.|builtins\.|__builtin__\.|eval|exec|pty\.spawn|commands\.getoutput|importlib|__import__|pickle\.loads|hydra\.utils\.get_method)"

  CONFIG_EXT     = [".yaml", ".yml", ".json", ".pkl", ".ckpt", ".bin"]
  UNTRUSTED_DIRS = ["/tmp/", "/private/tmp/", "/var/tmp/", "/dev/shm/",
                    "/Downloads/", "/downloads/",
                    "/.cache/huggingface", "/huggingface/hub", "/.cache/torch"]

  def clip(s, n):
      if len(s) > n:
          return s[:n] + "..."
      return s

  def first_match(pats, s):
      for p in pats:
          if re.find(p, s) != None:
              return p
      return None

  def is_python(path, cmd):
      if re.find(r"(?i)\bpython[0-9.]*(\.exe)?\b", path) != None:
          return True
      if re.find(r"(?i)\bpython[0-9.]*\b", cmd) != None:
          return True
      if re.find(r"(?i)\.py\b", cmd) != None:
          return True
      return False

  # Relevance gate — pure string checks on meta, no graph / log calls.
  def is_relevant_event():
      if meta.get("context_type", "") != "execute_process":
          return False
      cmd = meta.get("content", "")
      if cmd == "":
          return False
      if first_match(SINKS, cmd) == None:
          return False
      return True

  # Ancestors started before monitoring have no EXECUTE_PROCESS row; fall back
  # to the Process node for their command line.
  def cmdline_for(x):
      c = x.get("cmdline", "")
      if c != "":
          return c
      pid = x.get("actor_pid", "")
      pth = x.get("actor_path", "")
      for p in graph(type="Process"):
          if p.get("pid", "") == pid and p.get("path", "") == pth:
              return p.get("cmdline", "")
      return ""

  def ev_edge(e):
      ts = e.get("ts", "0")
      tgt = e.get("target_id", "")
      if tgt == "":
          tgt = "process://" + e.get("actor_path", "")
      frm = e.get("parent_path", "")
      if frm == "":
          frm = e.get("actor_path", "")
      return {"from": "process://" + frm, "to": tgt, "kind": e.get("kind", ""),
              "ts": ts, "first_ts": ts, "last_ts": ts}

  def trigger_edge(hy, inst):
      ts   = meta.get("event_ts", "0")
      cmd  = meta.get("content", "")
      hpat = hy.get("actor_path", "")
      ipat = inst.get("actor_path", "")
      to_p = ipat
      if to_p == "" or to_p == hpat:
          tok = re.find(r"/[A-Za-z0-9_./+-]*/(sh|bash|zsh|dash|python[0-9.]*|perl|ruby|node|nc|ncat|socat|curl|wget)\b", cmd)
          if tok == None:
              tok = re.find(r"[A-Za-z0-9_./+-]{2,}", cmd)
          to_p = tok if tok != None else "unknown"
      return {"from": "process://" + hpat, "to": "process://" + to_p,
              "kind": "EXECUTE_PROCESS", "ts": ts, "first_ts": ts, "last_ts": ts,
              "cmdline": clip(cmd, 400)}

  def run():
      if not is_relevant_event():
          return "allow"

      cmd        = meta.get("content", "")
      trigger_ts = int(meta.get("event_ts", "0"))
      sink       = first_match(SINKS, cmd)

      # ── Anchor on the exact triggering instance ──────────────────────────
      cp = int(meta.get("caller_pid", "0"))
      if cp == 0:
          return "allow"
      inst = proc_instance(cp, trigger_ts)
      if inst == None:
          return "allow"          # degraded: create row not landed; next event re-fires
      lineage = proc_lineage(int(inst["actor_pid"]), int(inst["actor_start"]))
      if not lineage:
          return "allow"

      # ── REQUIRED anchor: Hydra-controlled Python interpreter in THIS chain ─
      hy     = None
      hy_cmd = ""
      for x in lineage:
          c = cmdline_for(x)
          if c == "":
              continue
          if not is_python(x.get("actor_path", ""), c):
              continue
          if first_match(HYDRA_MARKERS, c) == None:
              continue
          hy     = x
          hy_cmd = c
          break
      if hy == None:
          return "allow"

      # Ordering + staleness. Lineage already guarantees causality and single
      # session; the window only rejects stale replays.
      hy_ts = int(hy.get("ts", "0"))
      if trigger_ts > 0 and hy_ts > 0:
          if hy_ts > trigger_ts:
              return "allow"
          if trigger_ts - hy_ts > LINEAGE_WINDOW_NS:
              return "allow"

      # ── REQUIRED discriminator ───────────────────────────────────────────
      strong  = re.find(TARGET_DANGEROUS, hy_cmd) != None
      payload = first_match(PAYLOAD, cmd)
      if not strong and payload == None:
          return "allow"

      hy_pid   = int(hy.get("actor_pid", "0"))
      hy_start = int(hy.get("actor_start", "0"))

      # ── Per-instance dedupe ──────────────────────────────────────────────
      key = str(hy_pid) + ":" + str(hy_start) + ":" + (sink or "") + ":" + (payload or "target")
      if trigger_ts > 0:
          seen = store_get("reported")
          if seen == None:
              seen = {}
          fresh = {}
          for k in seen:
              if trigger_ts - int(seen[k]) < DEDUPE_NS:
                  fresh[k] = seen[k]
          if key in fresh:
              return "allow"
          fresh[key] = str(trigger_ts)
          if store_usage()["free"] > 8192:
              store_set("reported", fresh)

      # ── Optional corroboration, scoped to the SAME instance ──────────────
      since = 0
      if trigger_ts > CONFIG_WINDOW_NS:
          since = trigger_ts - CONFIG_WINDOW_NS
      cfg_row = None
      net_row = None
      if hy_pid > 0:
          for r in query_events(kind="READ_FILE", actor_pid=hy_pid,
                                actor_start=hy_start, since_ns=since,
                                until_ns=trigger_ts, limit=400):
              p = r.get("path", "")
              if p == "":
                  continue
              ext = False
              for e2 in CONFIG_EXT:
                  if p.endswith(e2):
                      ext = True
              if not ext:
                  continue
              for d in UNTRUSTED_DIRS:
                  if d in p:
                      cfg_row = r
              if cfg_row != None:
                  break
          for r in query_events(kind="HTTP_REQUEST", actor_pid=hy_pid,
                                actor_start=hy_start, since_ns=since,
                                until_ns=trigger_ts, limit=50):
              net_row = r
              break

      # ── Kill chain ───────────────────────────────────────────────────────
      root  = lineage[len(lineage) - 1]
      chain = new_chain("process://" + root.get("actor_path", ""))

      if cfg_row != None:
          chain.append(step(ev_edge(cfg_row), stage_id="Untrusted Config Source",
                            stage_desc="hydra process read config from untrusted location: " + cfg_row.get("path", "")))
      if net_row != None:
          chain.append(step(ev_edge(net_row), stage_id="Remote Config Fetch",
                            stage_desc="hydra process fetched remote artifact: " + net_row.get("host", "") + net_row.get("path", "")))
      chain.append(step(ev_edge(hy), stage_id="Hydra Target Control",
                        stage_desc="hydra entrypoint with externally controllable instantiation target: " + clip(hy_cmd, 200)))
      chain.append(step(trigger_edge(hy, inst), stage_id="Code Execution",
                        stage_desc="instantiate() resolved to process execution: " + clip(cmd, 200)))

      names = " -> ".join([x.get("actor_path", "?").split("/")[-1] for x in lineage])
      why   = "dangerous _target_ override" if strong else "injected payload (" + payload + ")"
      if len(lineage) < 2:
          names = names + " (attribution: degraded)"
      print("Hydra instantiate() RCE — " + why + " | chain: " + names)

      return {
          "action": "report",
          "reason": "Hydra instantiate() target hijack — " + why +
                    " resolved to process execution via " + names,
          "chain":  chain,
      }

  result = run()
