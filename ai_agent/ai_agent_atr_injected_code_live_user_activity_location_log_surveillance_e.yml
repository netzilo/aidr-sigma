title: Injected Code — Live User-Activity / Location / Log Surveillance Exfiltration
id: 005f8d2c-33a7-4b37-94c3-2a4a446e63a7
status: experimental
level: high
description: |-
  Detects injected code that continuously surveils the victim — clipboard contents (pyperclip.paste), live geolocation (geocoder.ip().latlng), or the system log (/var/log) — for exfiltration. These are spyware primitives, not data the user knowingly shares.

  Adapted from Agent Threat Rules ATR-2026-01891 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01891
tags:
- attack.exfiltration
- atlas.aml.t0051
- atlas.aml.t0057
- owasp.asi01
- owasp.llm02
- owasp.llm05
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)geocoder\.ip\([^\n]{0,20}\)\.latlng
  sel_1:
    content|re: (?i)pyperclip\.paste\(\)
  sel_2:
    content|re: (?i)open\(\s*[\"']/var/log/\w+[\"']\s*,
  condition: 1 of sel_*
falsepositives:
- Security documentation, papers, or test suites that describe this attack technique without executing
  it.
- Legitimate developer or user requests that share the surface vocabulary but lack the malicious invariant.
action: report
