title: Credential Access with Exfiltration in Skill Instructions
id: aef5176d-f0d9-4aa4-9c50-167766794019
status: experimental
level: critical
description: |-
  Detects SKILL.md files that combine credential file access (SSH keys, AWS credentials, API tokens) with outbound data transmission (curl POST, wget, HTTP request). Distinguishes real attacks from security documentation by requiring both access AND exfiltration in the same context.

  Adapted from Agent Threat Rules ATR-2026-00162 (MIT).
author: ATR Community (adapted)
date: '2026-04-14'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00162
tags:
- attack.exfiltration
- atlas.aml.t0040
- owasp.asi07
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:cat|read|type|head|tail|strings|xxd|base64)\s+[^\n]*(?:\.ssh/id_|\.aws/credentials|\.npmrc|\.env|\.netrc|\.docker/config|\.kube/config)[^\n]*(?:\|\s*(?:curl|wget|nc|base64|xxd|gzip)|>\s*/dev/tcp|curl|wget|nc\s|fetch|POST|http)
  sel_1:
    content|re: (?i)(?:curl|wget|fetch|http|nc)\s+[^\n]*-[dX]\s+[^\n]*(?:\$\(cat|`cat|readFile|readFileSync)[^\n]*(?:id_rsa|credentials|\.env|secret|token|private.key)
  sel_2:
    content|re: (?i)(?:cat|read)\s+[^\n]*(?:id_rsa|credentials|\.env|secret_key|private_key)[^\n]*\|\s*(?:base64|xxd|gzip)[^\n]*\|\s*(?:curl|wget|nc)
  sel_3:
    content|re: (?i)(?:tar|zip|7z)\s+[^\n]*(?:\.ssh|\.aws|\.gnupg|\.kube)[^\n]*(?:curl|wget|upload|send|POST|nc\s)
  condition: 1 of sel_*
falsepositives:
- Security audit tools that describe attack patterns in documentation tables
- CTF challenge writeups showing credential exfiltration techniques
action: report
