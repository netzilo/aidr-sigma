title: Hidden-Text Prompt Injection in User-Supplied Documents
id: f64b840c-d294-4321-940c-49dc709c2c44
status: experimental
level: high
description: |-
  Detects prompt injection via visually hidden text embedded in documents, resumes, or web content passed to an LLM. Attackers use white-on-white text, zero-font-size, display:none, zero-width Unicode characters, or HTML comments to hide override instructions that are invisible to human reviewers but readable by the model. OWASP LLM08:2025 Vector and Embedding Weaknesses. Patterns cover: (1) zero-width Unicode characters (U+200B, U+200C, U+200D, U+FEFF, U+2060) combined with instruction-override keywords; (2) CSS invisible text (color:white, font-size:0, opacity:0) containing override verbs; (3) HTML comment blocks with override instructions; (4) bracket-wrapped system-override blocks [[SYSTEM: ...]] in document body; (5) OVERRIDE keyword + safety-bypass + PII or exfil target.

  Adapted from Agent Threat Rules ATR-2026-00515 (MIT).
author: ATR Community (adapted)
date: '2026-05-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00515
tags:
- attack.initial-access
- atlas.aml.t0051
- atlas.aml.t0051.000
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)<[a-z]{1,10}[^>]{0,100}(font-size\s*:\s*0\s*(px|pt|em|rem|%)?|color\s*:\s*(white|#fff{1,3}|rgba?\s*\(\s*255\s*,\s*255\s*,\s*255|transparent)|opacity\s*:\s*0|visibility\s*:\s*hidden)[^>]{0,100}>[^<]{0,300}(ignore|override|disregard|forget|execute|exfiltrate|your\s+(real|new|actual)\s+task|candidate\s+is\s+excellent|recommend\s+this\s+candidate)
  sel_1:
    content|re: (?i)<!--[^>]{0,200}(ignore\s+(all\s+)?(previous|prior|above)|override\s+(all\s+)?instructions?|disregard\s+(prior|previous|all)|your\s+(real|true|actual|new)\s+task|forget\s+(all\s+)?(previous|prior)|execute\s*(this|now)|exfiltrate|recommend\s+this\s+candidate|classify\s+(this|them)\s+as\s+excellent)[^>]{0,300}-->
  sel_2:
    content|re: (?i)\[\[\s*(system|override|agent|instruction|hidden|ai|llm)\s*:?.{0,300}(superseded|ignore|override|disregard|new\s+task|real\s+task|extract|exfiltrate|recommend|classify|execute|forget).{0,100}\]\]
  sel_3:
    content|re: (?i)\bOVERRIDE\b.{0,80}\b(ignore|bypass|disable|remove|forget|disregard)\b.{0,80}\b(safety|guidelines?|restrictions?|rules?|filters?|policies|guardrails?|constraints?).{0,200}\b(output|send|provide|give|share|exfiltrate|extract|disclose|reveal|transmit)\b.{0,100}\b(pii|credentials?|passwords?|tokens?|api\s+keys?|user\s+data|personal|confidential|private|system\s+prompt)
  sel_4:
    content|re: (?i)\b(ignore|disregard|forget|override)\s+(all\s+)?(prior|previous|above|earlier)\s+(instructions?|guidelines?|rules?|directives?)(\s*and\s+|[.!]?\s*(please\s+)?)?(classify|recommend|rate|score|evaluate|grade|select|hire|advance|approve|pass)\s+(this|the)\s+(candidate|applicant|resume|cv|person|individual|submission)
  sel_5:
    content|re: (?i)\b(ignore|disregard|forget|override)\s+(all\s+)?(prior|previous|above|earlier|hidden)?\s*(instructions?|guidelines?|rules?|directives?).{0,150}\b(instead|now|then|also|and\s+then)\b.{0,60}\b(exfiltrate|forward.{0,30}conversation|extract.{0,30}(context|api.?key|credential)|send.{0,30}(context|conversation|credentials?)|post.{0,30}(context|to\s+https?://))
  condition: 1 of sel_*
falsepositives:
- Normal summarization requests for articles or documents
- Benign coding requests unrelated to instructions
- Legitimate security questions about API security
- Translation requests
- Code review requests
- Test writing requests
action: report
