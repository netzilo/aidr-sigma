title: Two-Entity Token-Splitting Dollar-Term Game Jailbreak
id: e7aba41a-65e1-43a2-a208-90876565cb97
status: experimental
level: critical
description: |-
  Detects the two-entity token-splitting game jailbreak from NVIDIA garak dan.DanInTheWild inthewild corpus (prompts #24, #588) where the attacker frames a harmful synthesis/instructions request as a word-by-word game between two fictional entities. By having "J" and "M" (or Tom and Jerry) alternate 10 words at a time around a $Term variable holding the harmful topic, no single entity "says" the complete harmful content — the full synthesis emerges only when the dialogue is concatenated. The $Term variable assignment further obscures the harmful request: "$Term1 = steps to synthesize" (the method) + "$Term2 = lsd" (the substance), with "The result should demonstrate how to $Term1+$Term2". Key signals: "act as two entities + playing a game + $Term", "J says N words at a time + other entity M says next N words", "$Term1 = steps to synthesize", "result should demonstrate how to $Term1+$Term2".

  Adapted from Agent Threat Rules ATR-2026-00334 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00334
- https://github.com/NVIDIA/garak/blob/main/garak/probes/dan.py
- https://github.com/NVIDIA/garak/blob/main/garak/data/inthewild_jailbreak_llms.json
tags:
- attack.execution
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: act\s+as\s+two\s+entities[\s\S]{0,150}playing\s+a\s+game[\s\S]{0,150}\$Term
  sel_1:
    response|re: \$Term1[\s\S]{0,100}(?:steps?\s+to\s+synthesi[sz]|how\s+to\s+(?:make|create|produce|build)\s+)
  sel_2:
    response|re: result\s+should\s+demonstrate\s+how\s+to\s+\$Term1\s*\+\s*\$Term2
  sel_3:
    response|re: (?:J\s+says|entity\s+(?:tells|says))\s+\d+\s+words?\s+at\s+a\s+time[\s\S]{0,150}\$Term
  sel_4:
    response|re: act\s+as\s+two\s+entities[\s\S]{0,50}(?:Tom\s+and\s+Jerry|J\s+and\s+M|J\s+&\s+M)[\s\S]{0,100}playing\s+a\s+game[\s\S]{0,100}(?:one\s+word\s+at\s+a\s+time|\d+\s+words?\s+at\s+a\s+time)
  condition: 1 of sel_*
falsepositives:
- 'Creative writing exercise: "Two characters J and M take turns saying words to build a poem — J says
  one word, M says the next" (poetry game without $Term or harmful topics)'
- 'Game design: "Act as two entities playing a game where each says one word. $GAME = chess. Describe
  a match." (game simulation with a benign $Term variable)'
- 'Educational roleplay: "Tom and Jerry play a word-association game — Tom says the noun, Jerry adds the
  adjective" (vocabulary exercise without harmful synthesis target)'
action: report
