title: Stolen-Credential Account Takeover & Crypto Drain
id: 0f8e3c2d-19b5-4ad8-819c-03776906645b
status: experimental
level: critical
description: |-
  User instructs the agent to use stolen banking credentials to log into victim accounts and transfer funds to an attacker-controlled crypto wallet. AgentHarm financial-fraud kill chain: stolen credentials -> account login -> transfer to wallet (incl. the fixed wallet IOC 0x5d5acA289F2A9E481fa2aEaD3FA465880Df84354).

  Adapted from Agent Threat Rules ATR-2026-01830 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01830
- https://github.com/ai-safety-institute/AgentHarm
tags:
- attack.impact
- atlas.aml.t0051
- atlas.aml.t0057
- owasp.asi01
- owasp.asi08
- owasp.llm01
- owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: '0x5d5acA289F2A9E481fa2aEaD3FA465880Df84354'
  sel_1:
    content|re: (?i)\bstolen\s+(?:bank\s+)?(?:accounts?|credentials?|logins?)\b[\s\S]{0,80}\bto\s+(?:my|a|the)\s+(?:crypto\s+)?wallet\b
  sel_2:
    content|re: (?i)\b(?:transfer|withdraw|drain|wire)\b[^.\n]{0,40}\bstolen\s+(?:accounts?|credentials?|logins?)\b
  condition: 1 of sel_*
falsepositives:
- Security/fraud teams describing how stolen-credential reuse is detected
- Educational explanation of account-takeover fraud
- Legitimate transfer of the user's own funds between their own accounts
action: report
