title: Injected Code — Local File Exfiltration to a Remote Endpoint
id: fafeb811-3f32-4b58-8855-034368d5bdaa
status: experimental
level: high
description: |-
  Detects indirect-injection payloads (BIPIA code class) that coerce the agent to embed a code snippet which reads a local file and ships its raw bytes to an attacker-controlled endpoint via HTTP POST, FTP STOR, raw socket, or Bluetooth. Invariant: a local read (open()/.read()/.tobytes()/r.content) bound to a remote sink in the same statement.

  Adapted from Agent Threat Rules ATR-2026-01890 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01890
tags:
- attack.exfiltration
- atlas.aml.t0051
- atlas.aml.t0057
- owasp.asi01
- owasp.llm02
- owasp.llm05
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)requests\.post\([\s\S]{0,80}\bdata\s*=\s*\w+\.(?:read|tobytes)\(\)
  sel_1:
    content|re: (?i)requests\.post\([\s\S]{0,80}\bfiles\s*=\s*\{[\s\S]{0,80}(?:open\(|\.content)
  sel_2:
    content|re: (?i)\b(?:storbinary|sendall)\([^\n]{0,40}(?:\.content|\.read\(\)|\bdata\b|open\()
  sel_3:
    content|re: (?i)\bconn\.request\(\s*[\"']POST[\"'][^\n]{0,40}\.read\(\)
  sel_4:
    content|re: (?i)\bbt_sock\.send\(\s*r\.content\s*\)
  condition: 1 of sel_*
falsepositives:
- Security documentation, papers, or test suites that describe this attack technique without executing
  it.
- Legitimate developer or user requests that share the surface vocabulary but lack the malicious invariant.
action: report
