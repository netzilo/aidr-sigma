title: Indirect PI — Financial / Payment Credential Exfiltration via Agent Email
id: 4b1023f0-92f9-4a68-8ebe-7a4c7ab27a28
status: experimental
level: critical
description: |-
  Detects indirect prompt injection payloads (embedded in product reviews, notes, repository descriptions) that instruct an agent to retrieve saved payment methods, bank account details, or credit card information and email them to an attacker-controlled address. The carrier pattern uses a "IMPORTANT!!! Ignore all previous instructions" override combined with financial-data retrieval verbs targeting stored payment or banking credentials. Distinct from rule 00850 (API key/password exfil): this rule focuses on financial account / payment-method data. Derived from vpibench indirect-pi-exfil-financial-carrier corpus.

  Adapted from Agent Threat Rules ATR-2026-00851 (MIT).
author: ATR Community (adapted)
date: '2026-06-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00851
- https://github.com/CUA-Framework/VPIBench
- https://arxiv.org/abs/2408.11972
tags:
- attack.exfiltration
- atlas.aml.t0051.001
- atlas.aml.t0057
- owasp.asi01
- owasp.asi03
- owasp.llm01
- owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:ignore\s+all\s+previous\s+instructions|disregard\s+(?:all\s+)?(?:previous|prior)\s+instructions)[^\n]{0,200}(?:retrieve|get|export|access|fetch|download)\s+(?:my\s+)?(?:saved\s+)?(?:payment\s+method|bank\s+account|credit\s+card|debit\s+card|card\s+detail|billing\s+information|financial\s+account)[^\n]{0,150}(?:email|mail|send)[^\n]{0,80}@[^\s"]{3,80}
  sel_1:
    content|re: (?i)(?:retrieve|get|fetch|access|export)\s+(?:my\s+)?(?:saved\s+)?(?:credit\s+card(?:\s+(?:information|details?|numbers?|data))?|payment\s+methods?|bank\s+account(?:\s+(?:detail|information|data))?|debit\s+card)\s+(?:from\s+(?:my\s+)?\w+)?\s*(?:and\s+)?(?:email|send|forward|mail)\s+(?:it|them|the\s+(?:details?|information|data))\s+to[^\n]{0,120}(?:@[^\s"]{3,80}|alternate\s+email)
  condition: 1 of sel_*
falsepositives:
- User requesting their own billing summary from a legitimate financial service agent
- Customer support flows confirming masked payment methods to account holder
- Security documentation describing payment-data exfiltration attack scenarios
action: report
