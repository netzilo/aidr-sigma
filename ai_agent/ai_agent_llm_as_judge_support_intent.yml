title: Support Intent (LLM-as-Judge)
id: netzilo-llmjudge-support-intent-001
status: experimental
description: |
  LLM-as-judge port of the LangSmith "Support Intent" evaluator template.
  Identify the primary intent of a support conversation.
  Delegates the verdict to the AI scanner via action: scan with the evaluator
  rubric as the analysis prompt. Report-only: scanner never blocks, max severity is report.
references:
  - https://docs.smith.langchain.com/evaluation
author: Netzilo (ported from LangSmith evaluator template)
date: "2026-06-30"
tags:
  - classification.support-intent
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_trigger:
    event_type:
      - llm_response
  condition: sel_trigger
action: scan
on_timeout: allow
on_error: allow
falsepositives:
  - Legitimate content discussing the flagged topic (security research, documentation, test data)
  - AI scanner unavailable or no AI keys configured (fails open -> allow)
level: low
prompt: |
  You are a security guardrail analyzing AI agent content. The content is provided in key=value format; evaluate the message/output text it carries.

  You are an expert conversation evaluator. You will be shown a full conversation between a human user and an AI customer support assistant.
  Your task is to identify the primary intent of the human's request throughout the conversation.

  <Categories>
  - Account & Billing: login, profile updates, payments, or refunds
  - Order Management: placing, modifying, cancelling, or tracking an order
  - Technical Support: bugs, errors, or product not working as expected
  - Product Inquiry: how something works, what is included, or feature questions
  - Policy Inquiry: returns, shipping, terms, or conditions
  - Status Check: checking the status of an order, ticket, or request
  - Complaint & Feedback: expressing dissatisfaction or providing suggestions
  - Escalation: requesting to speak with a human agent
  - Other: intent does not fit any of the above categories
  </Categories>

  <Instructions>
  For each conversation:
  1. Read the human's messages and overall conversation arc
  2. Identify which category best describes the human's primary intent
  3. If the conversation covers multiple intents, identify the dominant one
  4. Return the intent category exactly as written above
  </Instructions>

  Please grade the following conversation according to the above instructions:

  Apply the rubric above to the content under review and choose one verdict:
  - report: the content matches the support-intent classification per the rubric.
  - allow: the content does not, or the determination is ambiguous.
