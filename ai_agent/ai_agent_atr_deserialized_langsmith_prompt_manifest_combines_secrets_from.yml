title: Deserialized LangSmith Prompt Manifest Combines secrets_from_env With an Attacker base_url Override
id: 1c749954-ab44-42d5-a5b6-739474d19aac
status: experimental
level: high
description: |-
  Detects two variants of the LangSmith SDK public-prompt trust-boundary bypass: (1) a pull_prompt/pullPrompt(_commit) call against a public owner/name prompt identifier combined with the explicit dangerously_pull_public_prompt / dangerouslyPullPublicPrompt override flag, and (2) a deserialized prompt-manifest constructor whose kwargs combine secrets_from_env=true (reads environment variables at deserialization time) with an LLM-client base_url/openai_api_base/ azure_endpoint override pointing at an http(s) endpoint. Mined from GHSA-3644-q5cj-c5c7 (CVE-2026-45134, langsmith-sdk): prompt manifests pulled from LangSmith Hub by owner/name are external-party-controlled and are deserialized as executable configuration, not inert text -- a malicious manifest can redirect the LLM client's outbound traffic (including system prompts, retrieved context, and provider credentials) to an attacker-controlled base_url, and secrets_from_env additionally lets the manifest read environment variables during deserialization. Generalized beyond langsmith-sdk to any prompt/config-hub client that deserializes a remotely-fetched manifest into LLM client constructor arguments.

  Adapted from Agent Threat Rules ATR-2026-02373 (MIT).
author: ATR Community (adapted)
date: '2026-07-11'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-02373
- https://github.com/langchain-ai/langsmith-sdk/security/advisories/GHSA-3644-q5cj-c5c7
- https://github.com/advisories/GHSA-3644-q5cj-c5c7
- https://nvd.nist.gov/vuln/detail/CVE-2026-45134
tags:
- attack.exfiltration
- attack.t1090
- atlas.aml.t0057
- owasp.asi04
- owasp.asi06
- owasp.llm02
- owasp.llm05
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\b(?:pull_prompt|pullPrompt)(?:_commit|Commit)?\s*\(\s*["'][\w.\-]+/[\w.\-]+["'][\s\S]{0,40}(?:dangerously_pull_public_prompt|dangerouslyPullPublicPrompt)\s*[=:]\s*true
  condition: sel_0
falsepositives:
- A pull_prompt/pullPrompt call against a public owner/name identifier WITHOUT the dangerously_pull_public_prompt
  override flag -- the SDK's default-safe path rejects this, so it is not exploitable and not flagged
- A deserialized manifest setting secrets_from_env=true alone, or base_url alone, without the other --
  each individually has legitimate uses (e.g. a trusted same-org prompt configuring a private Azure endpoint);
  only the combination that both reads env secrets AND redirects the endpoint is flagged
- Documentation or a security advisory discussing the CVE-2026-45134 parameter names without an actual
  manifest or tool call setting them
- 'secrets_from_env combined with a base_url/openai_api_base/azure_endpoint pointing at a recognized major-cloud
  LLM domain (*.azure.com, *.amazonaws.com, *.googleapis.com, *.openai.com, *.anthropic.com) or an internal/corp/local/private-IP
  endpoint -- ADVERSARIALLY CONFIRMED as real false positives during review (a company''s own Azure OpenAI
  deployment, and a self-hosted internal LiteLLM proxy); fixed with a negative-lookahead domain allowlist.
  Residual risk: an attacker-registered domain containing ''internal''/''corp''/''local'' as a substring
  could evade this exclusion -- treated as an accepted precision/recall tradeoff for a pattern-tier rule'
action: report
