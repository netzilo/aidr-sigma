title: Over-Permissioned MCP Skill
id: cc881509-4d44-49c6-8050-274d003c0163
status: experimental
level: high
description: |-
  Detects MCP skills that request or exercise permissions far exceeding what their stated function requires. A "spell checker" that requests filesystem write access, network access, and process execution is a strong signal of a trojaned or malicious skill. This rule monitors tool calls for permission-boundary violations.

  Adapted from Agent Threat Rules ATR-2026-00064 (MIT).
author: ATR Community (adapted)
date: '2026-03-08'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00064
tags:
- attack.persistence
- atlas.aml.t0040
- owasp.asi03
- owasp.llm03
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(sudo|runas|doas|pkexec|gsudo)\s+
  sel_1:
    content|re: (?i)(chmod\s+(?:[2467][0-7]{3}|[0-7]{0,3}7[0-7]{0,2})|chmod\s+[ug]?\+[sx]|chown\s+root|setcap\s)
  sel_2:
    content|re: (?i)(iptables|ufw|firewall-cmd|netsh\s+advfirewall|pfctl)\s
  sel_3:
    content|re: (?i)(useradd|adduser|usermod|passwd|net\s+user|dsadd|New-LocalUser)
  sel_4:
    content|re: (?i)(crontab|schtasks|at\s+\d|systemctl\s+(enable|start)|launchctl\s+load)
  condition: 1 of sel_*
falsepositives:
- System administration tools that legitimately manage permissions and services
- DevOps tools performing infrastructure provisioning
- Security tools that audit permission configurations
action: report
