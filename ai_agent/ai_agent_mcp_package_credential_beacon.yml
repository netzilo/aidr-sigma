title: MCP Package Credential Beacon in Outbound HTTP
id: 3f9c1d42-8b47-4e6a-9c05-71a2e6f4b83d
status: experimental
level: high
description: |
  Detects a single outbound HTTP request, emitted from an agent host running a
  third-party MCP server package (e.g. an installed PyPI MCP integration such as
  truckaurbus-mcp), whose payload carries live credential material *together with*
  exfiltration framing.

  A malicious or backdoored MCP server package cannot be observed at install or
  handshake time -- the engine has no load_package / initialize_mcp_server event
  and no LOADS_CODE / COMMUNICATES_VIA_MCP edge. The only live telemetry for this
  kill-chain stage is http_request. Rather than trying to guess intent from a
  destination (which would require a host trust list and would be trivially
  bypassed by a package that beacons to its own legitimate-looking API), this rule
  keys on the one thing a legitimate vehicle-lookup MCP server never does:
  shipping secret material outbound.

  To stay tight, a raw secret match is NEVER sufficient on its own inside a body.
  The rule requires a secret pattern to co-occur with one of three exfiltration
  frames in the same event:
    1. an MCP JSON-RPC 2.0 envelope (jsonrpc + tools/call, tools/list,
       resources/read, prompts/get, initialize, sampling/createMessage) -- i.e. the
       MCP server is relaying agent/session context outbound with secrets attached;
    2. an environment-variable dump (secret env var NAMES used as JSON keys or
       form fields) -- the classic harvest-and-POST payload;
    3. a long opaque base64 blob in a generic carrier field (data/payload/dump/
       telemetry/context) alongside a plaintext secret.
  A fourth, standalone branch fires on high-confidence secret material embedded in
  a URL query string, where there is no legitimate reason for a private key,
  GitHub PAT, Slack token or AWS access key ID to appear.
author: Selhan
date: "2026-06-11"
references:
  - https://attack.mitre.org/techniques/T1195/002/
  - https://attack.mitre.org/techniques/T1567/
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
tags:
  - attack.exfiltration
  - attack.t1567
  - attack.initial-access
  - attack.t1195.002
  - atlas.aml.t0010
  - atlas.aml.t0025
  - owasp.llm03
  - owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:

  # ── scope ───────────────────────────────────────────────────────────────────
  sel_http:
    event_type: http_request

  # ── high-confidence live secret material (case-sensitive on purpose) ────────
  sel_secret_body:
    content|re:
      - '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'
      - '\bAKIA[0-9A-Z]{16}\b'
      - '\bASIA[0-9A-Z]{16}\b'
      - '\b(?:ghp|ghs|gho|ghu)_[A-Za-z0-9]{36,}\b'
      - '\bgithub_pat_[A-Za-z0-9_]{60,}\b'
      - '\bsk-(?:proj-|ant-api03-)?[A-Za-z0-9_-]{32,}\b'
      - '\bxox[baprs]-[A-Za-z0-9-]{12,}\b'
      - '\bsk_live_[0-9a-zA-Z]{24,}\b'
      - '\bglpat-[A-Za-z0-9_-]{20,}\b'

  # ── frame 1: MCP JSON-RPC envelope (two halves, ANDed in the condition) ─────
  sel_jsonrpc:
    content|re: '"jsonrpc"\s*:\s*"2\.0"'
  sel_mcp_method:
    content|re: '"method"\s*:\s*"(?:tools/call|tools/list|resources/read|resources/list|prompts/get|initialize|sampling/createMessage)"'

  # ── frame 2: environment-variable harvest shipped outbound ──────────────────
  sel_env_key_dump:
    content|re:
      - '(?i)"(?:AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|ANTHROPIC_API_KEY|OPENAI_API_KEY|GITHUB_TOKEN|GH_TOKEN|PYPI_TOKEN|TWINE_PASSWORD|HUGGINGFACE_TOKEN|HF_TOKEN|NPM_TOKEN|SLACK_BOT_TOKEN|MCP_[A-Z0-9_]{2,32}_TOKEN)"\s*:\s*"'
      - '(?i)(?:^|[&\s;])(?:AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|ANTHROPIC_API_KEY|OPENAI_API_KEY|GITHUB_TOKEN|PYPI_TOKEN|HF_TOKEN)=[^&\s"]{16,}'

  # ── frame 3: opaque bulk blob in a generic carrier field ────────────────────
  sel_encoded_blob_field:
    content|re: '(?i)"(?:data|payload|dump|blob|telemetry|context|collected|report|info)"\s*:\s*"[A-Za-z0-9+/]{120,}={0,2}"'

  # ── standalone branch: secret material in the URL query string ──────────────
  sel_secret_in_url_query:
    url.full|re:
      - '\?[^#]*\b(?:ghp|ghs|gho|ghu)_[A-Za-z0-9]{36,}'
      - '\?[^#]*\bgithub_pat_[A-Za-z0-9_]{60,}'
      - '\?[^#]*\bxox[baprs]-[A-Za-z0-9-]{12,}'
      - '\?[^#]*\bAKIA[0-9A-Z]{16}\b'
      - '\?[^#]*\bsk-ant-api03-[A-Za-z0-9_-]{32,}'
      - '\?[^#]*BEGIN(?:%20|\+)(?:RSA(?:%20|\+))?PRIVATE(?:%20|\+)KEY'

  # ── false-positive suppression (shape-based only, no host/domain trust) ─────
  filter_placeholder:
    content|re:
      - '(?i)AKIAIOSFODNN7EXAMPLE'
      - '(?i)wJalrXUtnFEMI/K7MDENG'
      - '(?i)your[_-]?(?:api[_-]?)?(?:key|token|secret)'
      - '(?i)\b(?:REDACTED|PLACEHOLDER|EXAMPLE_KEY|DUMMY_KEY|FAKE_KEY|NOT_A_REAL_KEY)\b'
      - '<[A-Za-z_][A-Za-z0-9_-]{2,30}>'
      - '\$\{[A-Za-z_][A-Za-z0-9_]{2,40}\}'
      - '(?i)x{8,}'

  # MCP tool/capability catalogues quote secret-shaped strings inside parameter
  # descriptions and JSON Schema examples.
  filter_tool_schema:
    content|contains|all:
      - '"inputSchema"'
      - '"properties"'

  filter_masked:
    content|re: '\*{6,}'

  # AWS SigV4 presigned URLs legitimately place an AKIA/ASIA key id in the query
  # string as X-Amz-Credential. Signature-shape filter, scoped to the URL branch.
  filter_presigned_url:
    url.full|re: '(?i)[?&]X-Amz-(?:Credential|Signature|Security-Token|Algorithm)='

  condition: >
    sel_http and
    (
      (sel_secret_body and sel_jsonrpc and sel_mcp_method) or
      (sel_secret_body and sel_env_key_dump) or
      (sel_secret_body and sel_encoded_blob_field) or
      (sel_secret_in_url_query and not filter_presigned_url)
    )
    and not (filter_placeholder or filter_tool_schema or filter_masked)

falsepositives:
  - A user deliberately passes a real API key as an argument to an MCP tool (e.g. a
    tool whose parameter is an upstream API token); the MCP JSON-RPC relay of that
    tools/call then contains both the envelope and a live secret. Legitimate, and
    still worth an audit record -- this is why the action is report, not block.
  - Secret-scanning, SBOM or credential-rotation agents that intentionally POST
    discovered secret material to an internal vault or scanner API in a JSON body
    that also enumerates environment variable names.
  - CI/CD or deployment MCP servers that legitimately push environment variable
    bundles (name plus value) to a configuration or secrets-management endpoint.
  - An agent pasting a source file or .env fixture containing a real key into a
    code-review or diff API where the body also carries a large base64 attachment.
  - Security research and red-team traffic that reproduces exfiltration payloads;
    these are not suppressed on purpose, since suppressing on words like "test"
    would hand attackers a one-word bypass.

action: report
