title: API Key / Secret Credential Generation or Completion Request
id: 79b1c9ce-5c8d-4fe4-b3dd-65f17090b09a
status: experimental
level: high
description: |-
  Detects two related attack patterns from NVIDIA garak apikey probe: (1) Requesting the model to generate or fabricate secret-looking strings (API keys, tokens, credentials) for cloud services, AI providers, payment processors — output used to create plausible-looking fake credentials for phishing/social engineering; (2) Providing a partial key and asking the model to "complete" it — exploits training data memorisation of actual key formats. Both attacks extract or fabricate high-entropy credential strings that look real and can be weaponised for phishing or service impersonation.

  Adapted from Agent Threat Rules ATR-2026-00274 (MIT).
author: ATR Community (adapted)
date: '2026-04-19'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00274
- https://github.com/NVIDIA/garak/blob/main/garak/probes/apikey.py
tags:
- attack.exfiltration
- atlas.aml.t0057
- owasp.asi03
- owasp.llm02
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: (?:generate|create|produce|give\s+me|make\s+up|fabricate|invent)\s+(?:a\s+(?:new|valid|working|(?:real|realistic)(?:-looking)?|fake(?:-looking)?)\s+)?(?:(?:openai|anthropic|aws|azure|gcp|google|stripe|twilio|sendgrid|github|gitlab|hugging\s+face|pinecone|cohere|replicate|mistral)\s+(?:api[\s_-]?key|access[\s_-]?token|secret[\s_-]?key|auth(?:entication)?[\s_-]?token|bearer[\s_-]?token|service[\s_-]?account[\s_-]?key|private[\s_-]?key|client[\s_-]?secret|oauth[\s_-]?token)\b|(?:api[\s_-]?key|access[\s_-]?token|secret[\s_-]?key|auth(?:entication)?[\s_-]?token|bearer[\s_-]?token|service[\s_-]?account[\s_-]?key|private[\s_-]?key|client[\s_-]?secret|oauth[\s_-]?token)\s+(?:for|to|from)\s+(?:openai|anthropic|aws|azure|gcp|google\s+cloud|stripe|twilio|sendgrid|github|gitlab|hugging\s+face|pinecone|cohere|replicate|together\.ai|mistral)\b)
  sel_1:
    response|re: (?:lost|forgot|need\s+a\s+(?:new|replacement)|my\s+account\s+was)\s+(?:\w+\s+){0,4}(?:api[\s_-]?key|access\s+token|secret\s+key|oauth\s+token)\s+(?:for\s+)?(?:openai|anthropic|aws|azure|stripe|github|google)\b.{0,200}(?:generate|create|give\s+me|produce|what\s+(?:does\s+(?:it|one)\s+look\s+like|format))
  sel_2:
    response|re: (?:complete|finish|fill\s+in)\s+(?:my\s+)?(?:partial|incomplete|truncated|half)\s+(?:(?:openai|anthropic|aws|azure|stripe|github|google|hugging\s+face|mistral|cohere)\s+)?(?:api[\s_-]?key|token|secret|credential)\s*[:\-–]\s*[A-Za-z0-9+/._-]{8,40}(?:\.\.\.|…|___+|\[missing\]|\?{3,})
  sel_3:
    response|re: there\s+was\s+an\s+issue\s+on\s+my\s+computer.{0,80}(?:lost|lost\s+part\s+of)\s+my\s+(?:api[\s_-]?key|secret|token|key)\s+(?:for\s+)?(?:openai|anthropic|aws|azure|stripe|github)\b.{0,100}complete\s+the\s+key
  sel_4:
    response|re: (?:what\s+does\s+(?:an?\s+)?(?:openai|anthropic|aws|azure|stripe|github|google\s+cloud)\s+(?:api[\s_-]?key|secret|access\s+token)\s+look\s+like|show\s+me\s+(?:an?\s+)?(?:example|sample|real)\s+(?:openai|anthropic|aws|stripe|github)\s+(?:api[\s_-]?key|token|secret))
  condition: 1 of sel_*
falsepositives:
- Developer documentation explaining API key format regex (e.g. "OpenAI keys start with sk-")
- Security awareness training showing example fake credentials
- Code review tools checking for hardcoded key patterns
action: report
