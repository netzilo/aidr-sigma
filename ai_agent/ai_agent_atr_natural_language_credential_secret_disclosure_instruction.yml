title: Natural-Language Credential / Secret Disclosure Instruction
id: fb9c9d53-fc0a-4073-b689-87d524cb6f70
status: experimental
level: critical
description: |-
  Detects natural-language imperative instructions that direct the agent to
  disclose, reveal, output, or include API keys, credentials, secrets, tokens,
  passwords, or environment variables in its response. The discriminator from
  legitimate documentation is co-occurrence of an imperative disclosure verb
  ("disclose", "reveal", "include", "append", "share with us") with a sensitive
  identifier ("API key", "credentials", "secret", "token", "password",
  "environment variable") and a directive form (you must / always / disclose
  any / append all). Plain references to API keys in setup docs do NOT match —
  the rule requires a directive verb in imperative voice.

  Adapted from Agent Threat Rules ATR-2026-00422 (MIT).
author: ATR Community (adapted)
date: '2026-05-06'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00422
tags:
- attack.exfiltration
- atlas.aml.t0024
- owasp.asi03
- owasp.asi04
- owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\b(?:disclose|reveal|expose|leak|divulge|exfiltrate)\s+(?:any|all|every|the\s+user(?:'s)?|your)\s*(?:visible\s+)?(?:api[\s_-]?keys?|access[\s_-]?tokens?|bearer[\s_-]?tokens?|credentials?|secrets?|passwords?|private[\s_-]?keys?|env(?:ironment)?[\s_-]?(?:variables?|vars?))
  sel_1:
    content|re: (?i)\b(?:you\s+(?:must|should|will|shall|need\s+to)|always|whenever\s+possible)\s+(?:disclose|reveal|share|expose|return|output|include|append|send|transmit|forward|leak)\s+(?:.{0,40}\b)?(?:api[\s_-]?keys?|credentials?|secrets?|access[\s_-]?tokens?|private[\s_-]?keys?|passwords?|env(?:ironment)?[\s_-]?(?:variables?|vars?))
  sel_2:
    content|re: (?i)(?:in|to)\s+your\s+(?:reply|response|answer|output)\s*,?\s*(?:also\s+)?(?:include|append|attach|disclose|output|return)\s+(?:.{0,30}\b)?(?:api[\s_-]?keys?|credentials?|secrets?|access[\s_-]?tokens?|env(?:ironment)?[\s_-]?(?:variables?|vars?))
  condition: 1 of sel_*
falsepositives:
- Documentation explaining how API keys work or how to set them
- Setup guides telling users where to PUT their own keys (not the agent to disclose them)
- Security advisories about credential leakage
- Detection rule write-ups discussing this exact pattern
action: report
