title: Casual Authority Data Redirect
id: 19133a9d-914b-479a-b255-0dfdead2d0f5
status: experimental
level: critical
description: |-
  Detects social engineering claiming authority to redirect agent output to attacker-controlled endpoints or disable safety filters. Crystallized from 62 adversarial samples (0% prior detection).

  Adapted from Agent Threat Rules ATR-2026-00139 (MIT).
author: ATR Community (adapted)
date: '2026-04-07'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00139
tags:
- attack.execution
- atlas.aml.t0051
- owasp.asi03
- owasp.asi06
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(?:fyi|btw|heads up)?\s*(?:the\s+)?(?:orchestrator|coordinator|manager|admin|boss|supervisor|lead)\s+(?:wants?|said|told|instructed|requires?|decided).*(?:append|send|redirect|forward|pipe|write|log)\s+(?:all\s+)?(?:data|output|results?|logs?|info).*(?://|https?://|\d{1,3}\.\d{1,3})
  sel_1:
    content|re: (?i)(?:the boss|manager|admin|supervisor|orchestrator)\s+(?:said|wants|told|instructed|approved).*(?:skip|bypass|disable|ignore|turn
      off)\s+(?:the\s+)?(?:content|safety|security|filter|check|validation)
  condition: 1 of sel_*
falsepositives:
- An IT support ticket stating 'the admin said to forward all logs to 10.0.0.1 for the new monitoring
  system' could match pattern 1 even though it describes a legitimate infrastructure change approved by
  an actual administrator.
action: report
