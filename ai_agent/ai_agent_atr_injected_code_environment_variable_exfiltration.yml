title: Injected Code — Environment-Variable Exfiltration
id: 477456f7-13e7-40da-9744-eb1289135f5c
status: experimental
level: high
description: |-
  Detects injected code that reads process environment variables via subscript access (os.environ[...]) and POSTs them to a remote server. Environment variables routinely hold API keys, tokens and paths, so this is a direct secret-exfiltration vector. Distinguished from benign os.environ.get() reads by requiring the remote POST sink.

  Adapted from Agent Threat Rules ATR-2026-01892 (MIT).
author: ATR Community (adapted)
date: '2026-06-13'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01892
tags:
- attack.exfiltration
- atlas.aml.t0051
- atlas.aml.t0057
- owasp.asi01
- owasp.llm02
- owasp.llm05
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)os\.environ\[[\s\S]{0,60}requests\.post\(
  condition: sel_0
falsepositives:
- Security documentation, papers, or test suites that describe this attack technique without executing
  it.
- Legitimate developer or user requests that share the surface vocabulary but lack the malicious invariant.
action: report
