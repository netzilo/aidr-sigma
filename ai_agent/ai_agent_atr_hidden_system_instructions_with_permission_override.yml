title: Hidden System Instructions with Permission Override
id: f71bd0a1-2e54-46c7-95bf-06bbf9f5f661
status: experimental
level: high
description: |-
  Detects MCP skills containing hidden instructions within XML-style tags that attempt to override system behavior or bypass security controls, specifically targeting <IMPORTANT> blocks with directive language.

  Adapted from Agent Threat Rules ATR-2026-00207 (MIT).
author: ATR Community (adapted)
date: '2026-04-08'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00207
tags:
- attack.initial-access
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?is)<\s*important\s*>[^<]*(?:ignore|override|bypass|always\s+(?:approve|accept|allow)|never\s+(?:deny|refuse|block)|do\s+not\s+(?:inform|tell|notify))[^<]*</\s*important\s*>
  condition: sel_0
falsepositives:
- Legitimate documentation emphasizing important configuration steps
- Security warnings about what NOT to do (educational context)
action: report
