title: mcp-atlassian Credential Leak via Hint Parameter Injection (CVE-2026-27825/27826)
id: 52fe7a75-cf73-4c20-8e01-6d1b7d5cd8a5
status: experimental
level: critical
description: |-
  Detects the mcp-atlassian credential-leak attack pattern (CVE-2026-27825 and CVE-2026-27826). The jira_cloud_id and confluence_spaces MCP tools accept a "hint" parameter that is forwarded verbatim to the LLM context without sanitization. A malicious hint containing a directive to echo request headers (cookie, Authorization, X-API-Key) coerces the agent into leaking the active Atlassian OAuth session cookie or API token back in a follow-up message. CVE-2026-27825 covers the Jira tool surface; CVE-2026-27826 covers Confluence. Both share the same sink. Patched in mcp-atlassian 0.17.0. Publicly resurfaced as "MCPwnfluence" by Pluto Security in April 2026. Disclosed 2026-02-24, resurfaced 2026-04-17.

  Adapted from Agent Threat Rules ATR-2026-00212 (MIT).
author: ATR Community (adapted)
date: '2026-04-22'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00212
- https://nvd.nist.gov/vuln/detail/CVE-2026-27825
- https://nvd.nist.gov/vuln/detail/CVE-2026-27826
tags:
- attack.exfiltration
- attack.t1071
- attack.t1552
- atlas.aml.t0051.001
- atlas.aml.t0056
- owasp.asi01
- owasp.asi06
- owasp.llm01
- owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)jira[_-]?cloud[_-]?id\s*[=:]\s*['"]?[^'"]*['"]?\s*,\s*hint\s*[=:]\s*['"][^'"\n]{0,300}(?:cookie|session|token|bearer|credential|authorization)
  sel_1:
    content|re: (?i)confluence[_-]?spaces\s*[=:].*?hint\s*[=:]\s*['"][^'"\n]{0,300}(?:cookie|session|token|bearer|credential|authorization)
  sel_2:
    content|re: (?i)mcp[-_]atlassian.{0,100}hint.{0,100}(?:cookie|authorization|x-api-key|bearer|credential)
  sel_3:
    content|re: (?i)hint\s*[:=]\s*['"][^'"\n]*(?:please\s+echo|include|return|forward|send\s+back|repeat)\s+[^'"\n]{0,100}(?:cookie|auth|credential|token|header)
  sel_4:
    content|re: (?i)\$\{?(?:req\.headers|request\.headers|session\.cookie|env\.ATLASSIAN)
  condition: 1 of sel_*
falsepositives:
- Legitimate mcp-atlassian skill documentation that shows valid hint parameter usage without credential-extraction
  directives.
- Security research content describing the CVE-2026-27825/27826 attack pattern as a reference sample.
- Tool descriptions that mention cookie or token in an educational or remediation context.
action: report
