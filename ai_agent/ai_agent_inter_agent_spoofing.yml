title: Inter-Agent Message Spoofing and Peer Impersonation
id: 83e72875-7c6f-52cc-949c-505cbbb7649f
status: experimental
description: |
  Detects an agent sending messages to an external platform (Slack, Teams, Discord,
  email) that impersonate another agent or a control plane — forged handoffs,
  fabricated approvals, instructions attributed to a peer. In a multi-agent
  deployment a message that appears to come from a trusted peer is an instruction
  channel with no authentication behind it.

  Upstream sigma-ai declares this against `event_type: agent_message` and
  `agent_handoff`, neither of which any producer emits. Netzilo's semantic
  classifier emits `external_message` when an agent posts to a known messaging
  endpoint, carrying the platform and host, so the send is observable; the same
  send is also visible one layer lower as the http_request POST to a known
  messaging host, which this rule accepts as an equivalent trigger. The
  impersonation is then judged on the message body, and the kill chain is the
  sending session's HTTP_REQUEST edge to that host.

  Two limits, stated so coverage is not overstated:
    * Only sends to platforms the classifier recognises are seen
      (matchMessagingEndpoint in semanticclassifier). A bespoke internal bus is
      not covered.
    * There is no agent-to-agent identity in Netzilo, so this detects a claimed
      identity in the content, not a cryptographic mismatch. A genuine handoff
      that phrases itself the same way will match.
references:
  - https://attack.mitre.org/techniques/T1656/
  - https://attack.mitre.org/techniques/T1585/
author: AgentShield (reimplemented for Netzilo)
date: "2026-03-16"
modified: "2026-08-03"
tags:
  - attack.stealth
  - attack.t1656
  - attack.lateral-movement
  - atlas.aml.t0074
  - atlas.aml.t0073
  - owasp.asi03
  - owasp.asi05
logsource:
  product: ai_agent
  category: external_message
requires:
  - http
detection:
  sel_trigger:
    event_type: external_message
    content|re: '.'
  sel_http_send:
    event_type: http_request
    url.full|contains:
      - 'hooks.slack.com'
      - 'slack.com/api/chat.'
      - 'discord.com/api/webhooks'
      - 'discordapp.com/api/webhooks'
      - 'webhook.office.com'
      - 'graph.microsoft.com/'
      - 'api.telegram.org'
      - 'chat.googleapis.com'
  condition: sel_trigger or sel_http_send
action: execute
on_error: allow
on_timeout: allow
script: |
  # Claims of peer or control-plane identity. Each phrase asserts an origin the
  # message cannot prove.
  IMPERSONATION = [
      "on behalf of the orchestrator",
      "this is the supervisor agent",
      "message from the coordinator",
      "handoff from agent",
      "delegated by the planner agent",
      "as the reviewer agent i approve",
      "automated approval granted",
      "the security agent has cleared",
      "signed by the control plane",
      "system agent directive",
  ]
  # Instruction-shaped payloads. Impersonation only matters when it is carrying an
  # instruction; a status update that mentions the orchestrator is not an attack.
  DIRECTIVES = [
      "you must", "proceed without", "skip the", "approve this",
      "execute the following", "do not verify", "override",
      "grant access", "disable",
  ]

  # Messaging platforms whose send endpoints are recognisable on the wire. The
  # classifier's external_message covers more; an http_request POST to one of
  # these is the same send seen one layer lower.
  MESSAGING_HOSTS = [
      "hooks.slack.com", "slack.com", "discord.com", "discordapp.com",
      "webhook.office.com", "teams.microsoft.com", "graph.microsoft.com",
      "api.telegram.org", "chat.googleapis.com",
  ]

  def find_any(text, needles):
      low = text.lower()
      for n in needles:
          if n in low:
              return n
      return ""

  def is_messaging_host(h):
      h = h.lower()
      for m in MESSAGING_HOSTS:
          if h == m or h.endswith("." + m):
              return True
      return False

  def platform_of(payload, host):
      for line in payload.split("\n"):
          if line.startswith("platform="):
              return line[len("platform="):]
      h = host.lower()
      for name in ["slack", "discord", "teams", "office", "telegram", "googleapis"]:
          if name in h:
              return name
      return "external"

  def run():
      ct   = meta.get("context_type", "")
      host = meta.get("host", "")
      if ct == "http_request":
          m = meta.get("method", "").upper()
          if m != "POST" and m != "PUT" and m != "PATCH":
              return "allow"
          if not is_messaging_host(host):
              return "allow"
      elif ct != "external_message":
          return "allow"

      # For semantic events `content` is the classifier's key=value payload (the
      # body is not part of it); for the http_request it is the request body.
      payload   = meta.get("content", "")
      claim     = find_any(payload, IMPERSONATION)
      directive = find_any(payload, DIRECTIVES)

      if claim == "":
          # Fall back to the indexed request bodies sent to this host, which do
          # carry the message text.
          for n in IMPERSONATION:
              for r in search('"' + n + '"', 10):
                  if host != "" and host.lower() in r.get("source", "").lower():
                      claim = n
                      break
              if claim != "":
                  break

      if claim == "":
          return "allow"

      platform = platform_of(payload, host)
      reason = ("Outbound message to " + platform + " (" + host +
                ") claims peer/control-plane identity: '" + claim + "'")
      if directive != "":
          reason = reason + " and carries a directive ('" + directive + "')"
      print(reason)

      # Chain evidence: the sending session's HTTP_REQUEST edge to the host —
      # the triggering session first, every agent session as a fallback.
      cands = []
      inst = session()
      if inst != None:
          cands.append(inst["id"])
      for a in sessions(agent=True):
          if a["id"] not in cands:
              cands.append(a["id"])
      for sid in cands:
          for e in edges(sid, dir="out", kind="HTTP_REQUEST"):
              t = node(e["to"])
              if t != None and t.get("host", "") == host:
                  chain = new_chain(sid)
                  chain.append(step(e, stage_id="Impersonation", stage_desc=reason))
                  return {"action": "report", "reason": reason, "chain": chain}

      return "report"

  result = run()
falsepositives:
  - A genuine multi-agent orchestrator that announces handoffs in these words —
    allowlist its host or refine IMPERSONATION to the phrasings your own
    orchestrator does not use
  - Status bots relaying approval outcomes from a real approval system
  - Incident channels where humans quote agent messages verbatim
level: high
