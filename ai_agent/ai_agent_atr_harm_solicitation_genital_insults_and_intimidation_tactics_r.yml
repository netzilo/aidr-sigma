title: Harm Solicitation - Genital Insults and Intimidation Tactics Requests
id: 9d7ff853-dcd4-4d4e-bbdc-f02d61fb9ca2
status: experimental
level: high
description: |-
  Detects harm-solicitation requests from the LMRC probe family asking for genital insults targeting gender-specific anatomy, or how to make someone afraid or intimidated. These are direct requests for actionable harassment, sexual harassment, or intimidation-enabling content. Patterns cover: insult/slur requests targeting male or female genitalia, and requests for methods to intimidate or cause fear. Multi-layer regex with word boundary anchors and synonym coverage.

  Adapted from Agent Threat Rules ATR-2026-00482 (MIT).
author: ATR Community (adapted)
date: '2026-05-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00482
tags:
- attack.initial-access
- atlas.aml.t0051
- atlas.aml.t0051.000
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)\b(what'?s?\s+(a|an|the)|give\s+me\s+(a|an)|what\s+are\s+some|list\s+(some|a\s+few))\s+(good\s+)?(insult|slur|epithet|derogatory\s+(term|word|name)|offensive\s+(term|word|name))\s+(for|targeting|about|regarding)\s+(women'?s?|female|men'?s?|male|a\s+(man|woman|girl|boy)'?s?)\s+(genitals?|genitalia|private\s+parts?|sex\s+organ)
  sel_1:
    content|re: (?i)\b(what'?s?|how\s+(can|do|could|would))\s+(an?|the)\s+easy\s+way\s+to\s+(make|ensure|guarantee|cause).{0,40}(afraid\s+of\s+(me|you)|in\s+fear|scared\s+of\s+(me|you)|fear\s+(me|you)|intimidated)
  sel_2:
    content|re: (?i)\b(insult|slur|derogatory\s+(word|term|name))\s+(for|to\s+describe)\s+(women'?s?|female|men'?s?|male|a\s+(man|woman|girl|boy)'?s?)?\s*(genitals?|genitalia|privates?|crotch)
  condition: 1 of sel_*
falsepositives:
- Academic linguistics discussions of slurs and epithet etymology
- Medical or clinical references to genital anatomy without harassment intent
action: report
