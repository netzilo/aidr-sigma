title: Model Registry Artifact Pin Decay
id: 7c3f1ad2-59be-4de1-a1f0-2b6c98d4e5a7
status: experimental
level: high
description: |
  Detects vLLM (and any HF-loader) "artifact pin decay": a deployment that is
  demonstrably pinned -- it fetched at least one artifact at an immutable 40/64-hex
  commit SHA -- subsequently loads a BEHAVIOUR-AFFECTING artifact (dynamic auto_map
  module .py, .gguf, image/feature processor config, side or subfolder weights,
  config.json) from an UNPINNED ref (main / master / branch / tag / refs-* / no
  revision) inside the same process session and correlation window.

  Answering the triage dissent: the engine emits no model_load / weight_fetch /
  dynamic_module_import event and no LOAD_MODEL / FETCH_WEIGHTS / IMPORT_MODULE edge,
  so this rule is built on the live download signal (file_download from the classifier,
  or the http_request to the registry host seen on the wire) plus the HTTP_REQUEST
  event log and URL graph. The claim that file_download is "too coarse to distinguish
  a pinned fetch from an unpinned one" is false in practice: the registry URL itself
  carries the revision segment (/<org>/<repo>/resolve/<ref>/<file>) or a ?revision=
  parameter, and <ref> is exactly the pin. The rule therefore parses the ref, requires
  a pinned fetch as its anchor stage, and reports only the ordered pinned -> unpinned
  transition -- not the mere fact that a model was downloaded.

  Sequence detected:
    1. Anchor (REQUIRED) -- an artifact fetched at an immutable commit SHA by a
       session in this session's lineage (evidence the operator believes the
       deployment is pinned).
    2. Decay -- the triggering download resolves a behaviour-affecting artifact from a
       mutable ref, at or after the anchor, within 30 minutes.
    3. Graph corroboration -- the URL node for the registry host and its inbound
       HTTP_REQUEST edge identify the fetching session for the kill chain.

  Content-addressed CDN/LFS redirects (no /resolve/<ref>/ segment and no revision
  parameter) are never treated as unpinned, and documentation/tokenizer-inventory
  files are ignored, because neither changes served behaviour on their own.
author: Tanya
date: "2026-06-11"
references:
  - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
  - https://owasp.org/Top10/A06_2021-Vulnerable_and_Outdated_Components/
  - https://huggingface.co/docs/huggingface_hub/guides/download
tags:
  - owasp.a06_2021
  - owasp.a08_2021
  - supply_chain.model_artifact
  - ai.model_provenance
falsepositives:
  - Deployments that intentionally pin only primary weights with --revision <sha> while
    deliberately tracking main for the tokenizer, chat template or processor config
    during evaluation. Mitigated by report-only action and by requiring the artifact to
    be code/weights/processor rather than documentation or tokenizer inventory.
  - Teams whose policy is to pin by release tag (for example v1.0) rather than by commit
    SHA. A tag ref is mutable on the Hub and is deliberately classed as unpinned, so
    these sessions will be reported. Treat as a policy finding, not a bug.
  - CI or benchmark jobs that, in one shell lineage, download a pinned production model
    and then separately pull a nightly/unpinned model for comparison. Mitigated by the
    30-minute window, lineage-scoped session attribution and per-artifact dedupe.
  - Internal mirror or caching proxies that rewrite /resolve/<sha>/ to /resolve/main/
    on egress, making a genuinely pinned fetch look unpinned at the network layer.
  - Interactive developer sessions where an engineer manually curls an artifact from main
    while a pinned server is warming up in the same process ancestry.
  - First-run cold caches that fetch config.json from the default branch before the
    operator's pin is applied by the launcher wrapper.
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - http
detection:
  sel_download:
    event_type: file_download
  sel_registry_http:
    event_type: http_request
    url.full|contains: '/resolve/'
  condition: sel_download or sel_registry_http
action: execute
on_timeout: allow
on_error: allow
script: |
  # ── Constants ───────────────────────────────────────────────────────────────
  WINDOW_NS = 1800000000000    # 30 min pinned-anchor correlation window
  SLACK_NS  = 5000000000       # 5s ordering tolerance for event jitter

  # Model-registry hosts whose URLs encode a revision segment.
  # DETECTION scope only: nothing here is trusted, exempted or allowlisted.
  REGISTRY_SUFFIXES = ["huggingface.co", "hf.co", "hf-mirror.com", "modelscope.cn"]

  WEIGHT_SUFFIX = [".safetensors", ".bin", ".pt", ".pth", ".ckpt", ".msgpack",
                   ".onnx", ".h5"]
  PROC_NAMES    = ["preprocessor_config.json", "processor_config.json",
                   "image_processor", "feature_extractor",
                   "generation_config.json", "chat_template", "config.json"]

  # ── Pure helpers (no graph / event-log calls) ───────────────────────────────
  def kv(payload, key):
      for line in payload.split("\n"):
          i = line.find("=")
          if i < 0:
              continue
          if line[:i] == key:
              return line[i+1:]
      return ""

  def strip_scheme(u):
      p = u.find("://")
      if p >= 0:
          return u[p+3:]
      return u

  def url_host(u):
      rest = strip_scheme(u)
      s = rest.find("/")
      if s >= 0:
          rest = rest[:s]
      c = rest.find(":")
      if c >= 0:
          rest = rest[:c]
      return rest.lower()

  def url_path(u):
      rest = strip_scheme(u)
      s = rest.find("/")
      if s < 0:
          return ""
      p = rest[s:]
      q = p.find("?")
      if q >= 0:
          p = p[:q]
      return p

  def url_query(u):
      q = u.find("?")
      if q < 0:
          return ""
      return u[q+1:]

  def qparam(q, key):
      for part in q.split("&"):
          kvp = part.split("=")
          if len(kvp) == 2 and kvp[0].lower() == key:
              return kvp[1]
      return ""

  def host_is_registry(h):
      hl = h.lower()
      for s in REGISTRY_SUFFIXES:
          if hl == s or hl.endswith("." + s):
              return True
      return False

  def is_commit_sha(ref):
      r = ref.lower()
      if re.match("^[0-9a-f]{40}$", r):
          return True
      if re.match("^[0-9a-f]{64}$", r):
          return True
      return False

  # Parse a registry URL into repo / ref / file. "ctx" is False for
  # content-addressed CDN or LFS redirects that carry no revision at all --
  # those are immutable and must never be scored as unpinned.
  def classify(u):
      path  = url_path(u)
      query = url_query(u)
      repo  = ""
      ref   = ""
      fpath = ""
      ctx   = False
      marker = "/resolve/"
      i = path.find(marker)
      if i >= 0:
          ctx  = True
          repo = path[:i]
          rest = path[i+len(marker):]
          s = rest.find("/")
          if s >= 0:
              ref   = rest[:s]
              fpath = rest[s+1:]
          else:
              ref   = rest
              fpath = ""
      rq = qparam(query, "revision")
      if rq == "":
          rq = qparam(query, "code_revision")
      if rq != "":
          ctx = True
          ref = rq
          if fpath == "":
              fpath = path
      return {"ctx": ctx, "repo": repo, "ref": ref, "file": fpath,
              "pinned": is_commit_sha(ref)}

  def artifact_class(fpath):
      f = fpath.lower()
      if f.endswith(".py"):
          return "dynamic module code (auto_map)"
      if f.endswith(".gguf"):
          return "GGUF weights"
      for s in WEIGHT_SUFFIX:
          if f.endswith(s):
              return "model weights"
      for n in PROC_NAMES:
          if f.find(n) >= 0:
              return "processor/config"
      return ""

  def ev_edge(e):
      t = e.get("ts", "0")
      frm = e.get("session_id", "")
      if e.get("kind", "") == "SPAWNED":
          frm = e.get("parent_session", "")
      return {
          "from":     frm,
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", ""),
          "dir":      "out",
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
      }

  def run():
      # ── 1. Relevance gate: pure string work on meta only ────────────────────
      # file_download is the classifier's signal; an http_request to a registry
      # host observed on the wire is the same fetch.
      ct = meta.get("context_type", "")
      if ct != "file_download" and ct != "http_request":
          return "allow"

      payload = meta.get("content", "")
      url  = meta.get("url", "")
      host = meta.get("host", "")
      if url == "":
          url = kv(payload, "url")
      if host == "":
          host = kv(payload, "host")
      if host == "" and url != "":
          host = url_host(url)
      if url == "" or host == "":
          return "allow"
      if not host_is_registry(host):
          return "allow"

      cur = classify(url)
      if not cur["ctx"]:
          return "allow"          # content-addressed CDN/LFS -- immutable by construction
      if cur["pinned"]:
          return "allow"          # this fetch honours the pin
      cls = artifact_class(cur["file"])
      if cls == "":
          return "allow"          # README / tokenizer inventory: not behaviour-affecting

      event_ts = int(meta.get("event_ts", "0"))
      if event_ts <= 0:
          return "allow"
      since = 0
      if event_ts > WINDOW_NS:
          since = event_ts - WINDOW_NS

      # ── 2. Anchor on the exact triggering session ────────────────────────────
      lineage_ = []
      tree = {}
      attribution = "degraded"
      inst = session()
      if inst != None:
          lineage_ = lineage(inst["id"])
          for x in lineage_:
              tree[x["id"]] = True
          if len(tree) > 0:
              attribution = "session"

      # ── 3. Required anchor stage: a pinned fetch by this session tree ───────
      rows = []
      if attribution == "session":
          for sid in tree:
              for e in events(kind="HTTP_REQUEST", session=sid,
                              since_ns=since, until_ns=event_ts + SLACK_NS,
                              limit=300):
                  rows.append(e)
      else:
          for e in events(kind="HTTP_REQUEST", target_sub=host,
                          since_ns=since, until_ns=event_ts + SLACK_NS,
                          limit=300):
              rows.append(e)

      pin_row  = None
      pin_info = None
      pin_ts   = 0
      for e in rows:
          h = e.get("host", "")
          p = e.get("path", "")
          if h == "" or p == "" or not host_is_registry(h):
              continue
          info = classify("https://" + h + p)
          if not info["ctx"] or not info["pinned"]:
              continue
          ts = int(e.get("ts", "0"))
          if ts > event_ts + SLACK_NS or ts < since:
              continue
          if pin_row == None or ts > pin_ts:
              pin_row  = e
              pin_info = info
              pin_ts   = ts
      if pin_row == None:
          return "allow"          # no pinned deployment evidence -> not pin decay

      # ── 4. Noise control: one report per (repo, ref, artifact) per window ────
      seen = store_get("decay_seen")
      if seen == None:
          seen = {}
      key = cur["repo"] + "@" + cur["ref"] + "#" + cur["file"]
      prev = seen.get(key, "0")
      if prev != "0" and (event_ts - int(prev)) < WINDOW_NS:
          return "allow"
      if len(seen) > 400:
          store_reset()
          seen = {}
      if store_usage()["free"] > 8192:
          seen[key] = str(event_ts)
          store_set("decay_seen", seen)

      # ── 5. Graph corroboration: URL node + inbound HTTP_REQUEST edge ─────────
      graph_edge = None
      sess_id    = ""
      for u in graph(type="URL"):
          if u.get("host", "").lower() != host.lower():
              continue
          for e in edges(u["id"], dir="in", kind="HTTP_REQUEST"):
              src = node(e["from"])
              if src == None:
                  continue
              if graph_edge == None:
                  graph_edge = e
                  sess_id    = src["id"]
              if src.get("agent", "0") == "1":
                  graph_edge = e
                  sess_id    = src["id"]
                  break
          if graph_edge != None:
              break

      # ── 6. Kill chain ───────────────────────────────────────────────────────
      root = ""
      if len(lineage_) > 0:
          root = lineage_[-1]["id"]
      elif sess_id != "":
          root = sess_id
      else:
          root = meta.get("session", "")

      short_sha = pin_info["ref"][:12]
      sub = ""
      if cur["file"].find("/") >= 0:
          sub = " (subfolder component)"
      reason = ("vLLM artifact pin decay: session pinned " + pin_info["repo"] +
                "@" + short_sha + " but resolved " + cls + " '" + cur["file"] +
                "'" + sub + " from unpinned ref '" + cur["ref"] + "' on " + host +
                " [attribution: " + attribution + "]")
      print(reason)
      if root == "":
          return {"action": "report", "reason": reason}   # no session to hang a chain on

      chain = new_chain(root)
      actor_id = root
      if len(lineage_) > 0:
          actor_id = lineage_[0]["id"]
      trig = {"from": actor_id, "to": "https://" + host,
              "kind": "HTTP_REQUEST", "dir": "out", "ts": str(event_ts),
              "first_ts": str(event_ts), "last_ts": str(event_ts)}

      chain.append(step(ev_edge(pin_row), stage_id="Pin Established",
                        stage_desc="pinned artifact fetched at immutable commit " +
                                   short_sha + ": " + pin_row.get("host", "") +
                                   pin_row.get("path", "")))
      chain.append(step(trig, stage_id="Pin Decay",
                        stage_desc="unpinned " + cls + " loaded from ref '" +
                                   cur["ref"] + "': " + host + "/" +
                                   cur["repo"] + " -> " + cur["file"]))
      if graph_edge != None:
          chain.append(step(graph_edge, stage_id="Registry Fetch Path",
                            stage_desc="registry fetches from " + host +
                                       " attributed to " + sess_id +
                                       " (attribution: " + attribution + ")"))
      return {"action": "report", "reason": reason, "chain": chain}

  result = run()
