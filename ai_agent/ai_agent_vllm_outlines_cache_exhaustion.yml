title: vLLM Outlines Grammar Cache Exhaustion Attempt
id: 7b3f1c2e-9a54-4d6b-8f21-c0d47e6a15b9
status: experimental
level: medium
description: |
  Detects the observable precursor of vLLM's Outlines grammar-cache disk-exhaustion DoS:
  a single session driving a high-cardinality burst of structured-output
  (guided_json / guided_regex / guided_grammar / json_schema) HTTP requests where almost
  every request carries a DIFFERENT schema.

  Answering the triage dissent explicitly: the engine has no DISK_WRITE, no
  DENIAL_OF_SERVICE edge and no resource_exhaustion event type, so this rule does NOT
  claim to observe cache writes, disk utilisation or service unavailability. It observes
  the one thing that is both live (http_request) and causally necessary for the CVE:
  schema CARDINALITY, not request volume. A repeated schema is a cache HIT and writes
  nothing to disk; only a schema the cache has never seen compiles a new grammar and adds
  a new unbounded cache entry. Legitimate bursty structured-output traffic reuses a small
  set of schemas (low unique/total ratio); the exploit requires a near-1:1 unique-to-total
  ratio by construction. The rule therefore fires on the ratio, inside a 60s window,
  scoped to one session lineage — and reports only, because the disk-space
  consequence is unverifiable from this telemetry.

  Schema identity is computed by extracting only the guided-decoding value from the JSON
  body (balanced-brace / quoted-value slice), normalising whitespace, and hashing it, so a
  varying prompt or varying request id never inflates the uniqueness count.

  Attribution is session-scoped: the triggering session, its lineage and what they
  spawned. The cardinality is derived on each evaluation from that scope's logged
  requests in the window and their indexed bodies — no per-request counter is kept —
  and one report per root session is emitted per 10 minutes. The body retrieval is
  bounded to the best-ranked 1024 indexed structured-output bodies.
author: Haibo
date: "2026-06-11"
modified: "2026-06-11"
references:
  - https://github.com/vllm-project/vllm/security/advisories
  - https://dottxt-ai.github.io/outlines/
  - https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/
  - https://attack.mitre.org/techniques/T1499/003/
tags:
  - attack.impact
  - attack.t1499
  - attack.t1499.003
  - owasp.a09_2021
logsource:
  product: ai_agent
  category: agent_events
requires:
  - process_exec
  - http
detection:
  sel_http:
    event_type: http_request
  sel_structured_output:
    content|contains:
      - 'guided_json'
      - 'guided_regex'
      - 'guided_grammar'
      - 'guided_choice'
      - 'guided_decoding_backend'
      - 'structured_outputs'
      - 'json_schema'
  condition: sel_http and sel_structured_output
falsepositives:
  - Batch document-extraction pipelines that synthesise a per-document JSON schema (enums
    built from that record's field values). Each request really is a new grammar, so the
    uniqueness ratio is legitimately high. Mitigated only by report-only action and the
    25-request / 60-second floor; treat repeated hits from the same pipeline as a tuning
    signal, not an incident.
  - CI regression or conformance suites that sweep many guided_json / guided_regex variants
    against a development vLLM endpoint.
  - Benchmark and load-test harnesses for Outlines/XGrammar that generate randomised schemas
    by design.
  - Agent frameworks that embed a run id, timestamp or trace id into the schema title or
    description, making otherwise identical schemas hash uniquely. Whitespace is normalised
    before hashing, but injected identifiers are not stripped.
  - Multi-tenant gateways where many distinct tenants' schemas are proxied through one agent
    session, so unrelated tenant diversity accumulates on one session's cardinality.
action: execute
on_timeout: allow
on_error: allow
script: |
  # ── Tunables (this rule's own window — never baked into storage) ─────────────
  WINDOW_NS     = 60000000000     # 60s schema-cardinality window
  REFRACTORY_NS = 600000000000    # 10 min per-session report suppression
  LOOKBACK_NS   = 240000000000    # 4 min sibling-spawn lookback
  MIN_REQUESTS  = 25              # structured-output requests in window
  MIN_UNIQUE    = 20              # distinct schema fingerprints in window
  MIN_RATIO_PCT = 80              # unique/total percent — the cache-miss discriminator
  MAX_BODIES    = 1024            # bounded body retrieval per evaluation
  MAX_SESSIONS  = 16              # bounded store footprint (refractory keys)
  ROW_LIMIT     = 400             # HTTP_REQUEST rows per session in the window

  MARKERS = ["guided_json", "guided_regex", "guided_grammar", "guided_choice",
             "guided_decoding_backend", "structured_outputs", "json_schema"]

  SCHEMA_KEYS = ["guided_json", "guided_regex", "guided_grammar", "guided_choice",
                 "json_schema", "structured_outputs"]

  # Indexed request bodies are retrieved by content search; the labels of the
  # session's own log rows (content_id) select which hits count.
  BODY_QUERY = "guided_json OR guided_regex OR guided_grammar OR guided_choice OR json_schema OR structured_outputs"

  def to_int(v):
      if v == None:
          return 0
      s = str(v)
      if s == "":
          return 0
      if re.match(r"^-?[0-9]+$", s):
          return int(s)
      return 0

  def fnv1a(s):
      h = 2166136261
      for o in s.elem_ords():
          h = h ^ o
          h = (h * 16777619) & 0xFFFFFFFF
      return "%x" % h

  def parse_value(body, k):
      n = len(body)
      for _s in range(0, 16):
          if k < n and (body[k] == " " or body[k] == "\t" or body[k] == "\n" or body[k] == "\r"):
              k = k + 1
      if k >= n:
          return ""
      c = body[k]
      if c == "{" or c == "[":
          cls = "}"
          if c == "[":
              cls = "]"
          depth = 0
          stop = k + 8192
          if stop > n:
              stop = n
          for x in range(k, stop):
              ch = body[x]
              if ch == c:
                  depth = depth + 1
              elif ch == cls:
                  depth = depth - 1
                  if depth == 0:
                      return body[k:x + 1]
          return body[k:stop]
      if c == '"':
          stop = k + 2048
          if stop > n:
              stop = n
          for x in range(k + 1, stop):
              if body[x] == '"' and body[x - 1] != "\\":
                  return body[k:x + 1]
          return body[k:stop]
      return ""

  def key_value(body, key):
      pos = 0
      n = len(body)
      for _t in range(0, 8):
          i = body.find(key, pos)
          if i < 0:
              return ""
          j = i + len(key)
          for _s in range(0, 8):
              if j < n and (body[j] == '"' or body[j] == "'" or body[j] == " " or
                            body[j] == "\t" or body[j] == "\n" or body[j] == "\r"):
                  j = j + 1
          if j < n and body[j] == ":":
              return parse_value(body, j + 1)
          pos = i + 1
      return ""

  # Fingerprint ONLY the guided-decoding value — never the prompt, never request ids.
  def schema_fingerprint(body):
      parts = []
      for key in SCHEMA_KEYS:
          v = key_value(body, key)
          if v != "":
              parts.append(key + "=" + v)
      if not parts:
          return ""
      raw = "|".join(parts)
      if len(raw) > 8192:
          raw = raw[:8192]
      raw = re.replace(r"\s+", raw, "")
      if raw == "":
          return ""
      return fnv1a(raw)

  # ── Relevance gate: pure string checks on meta only, no graph/log/store calls ──
  def is_relevant_event():
      if meta.get("context_type", "") != "http_request":
          return False
      m = meta.get("method", "")
      if m != "" and m.lower() != "post" and m.lower() != "put":
          return False
      body = meta.get("content", "")
      if body == "":
          return False
      for k in MARKERS:
          if k in body:
              return True
      return False

  def ev_edge(e):
      t = e.get("ts", "0")
      frm = e.get("session_id", "")
      if e.get("kind", "") == "SPAWNED":
          frm = e.get("parent_session", "")
      return {
          "from":     frm,
          "to":       e.get("target_id", ""),
          "kind":     e.get("kind", ""),
          "dir":      "out",
          "ts":       t,
          "first_ts": t,
          "last_ts":  t,
      }

  def prune_refractory():
      ks = store_keys()
      if len(ks) <= MAX_SESSIONS:
          return
      oldest_k = ""
      oldest_t = 0
      for k in ks:
          t = to_int(store_get(k))
          if oldest_k == "" or t < oldest_t:
              oldest_k = k
              oldest_t = t
      if oldest_k != "":
          store_delete(oldest_k)

  def run():
      if not is_relevant_event():
          return "allow"

      now  = to_int(meta.get("event_ts", "0"))
      body = meta.get("content", "")
      url  = meta.get("url", "")
      host = meta.get("host", "")
      path = meta.get("path", "")
      if host == "":
          host = url
      if now == 0:
          return "allow"

      # ── Session-scoped attribution ───────────────────────────────────────────
      inst = session()
      if inst == None:
          return "allow"          # degraded — never guess; re-fires on the next request
      lineage_ = lineage(inst["id"])
      if not lineage_:
          lineage_ = [inst]
      root = lineage_[len(lineage_) - 1]

      fp = schema_fingerprint(body)
      if fp == "":
          return "allow"                        # marker present but no extractable schema

      since = now - WINDOW_NS
      scope = {}
      for x in lineage_:
          scope[x.get("id", "")] = True
      for e in events(kind="SPAWNED", since_ns=now - LOOKBACK_NS, until_ns=now, limit=2000):
          if e.get("parent_session", "") in scope:
              scope[e.get("session_id", "")] = True

      # ── Floor: enough requests to this host from the scope in the window ─────
      # Newest first; the log is the only state — nothing is counted across runs.
      rows = []
      for sid in scope:
          for e in events(kind="HTTP_REQUEST", session=sid,
                          since_ns=since, until_ns=now, limit=ROW_LIMIT):
              if host != "" and e.get("host", "") != "" and e.get("host", "") != host:
                  continue
              rows.append(e)
      if len(rows) < MIN_REQUESTS:
          return "allow"

      # ── Refractory: one report per root session per window ───────────────────
      rkey = "rep:" + root.get("id", "")
      rep  = store_get(rkey)
      if rep != None and (now - to_int(rep)) < REFRACTORY_NS:
          return "allow"

      # ── Schema cardinality from the indexed bodies of those very rows ────────
      wanted   = {}
      trig_cid = ""
      for e in rows:
          cid = e.get("content_id", "")
          if cid == "":
              continue
          wanted[cid] = True
          if e.get("session_id", "") == inst["id"] and e.get("ts", "") == str(now):
              trig_cid = cid
      fps     = {}
      matched = {}
      total   = 0
      for hit in search(BODY_QUERY, MAX_BODIES):
          src = hit.get("source", "")
          if src not in wanted or src in matched:
              continue
          matched[src] = True
          total += 1
          f = schema_fingerprint(hit.get("text", ""))
          if f != "":
              fps[f] = True
      if trig_cid == "" or trig_cid not in matched:
          total += 1                            # the triggering body, not yet indexed
          fps[fp] = True
      uniq = len(fps)

      hot = total >= MIN_REQUESTS and uniq >= MIN_UNIQUE and (uniq * 100) >= (total * MIN_RATIO_PCT)
      if not hot:
          return "allow"

      prune_refractory()
      if store_usage()["free"] > 4096:
          store_set(rkey, str(now))

      # ── Kill chain: prior stages from the log, trigger stage from meta ───────
      chain = new_chain(root["id"])
      e0 = rows[len(rows) - 1]
      chain.append(step(ev_edge(e0), stage_id="Grammar Cache Seeding",
          stage_desc="earliest logged structured-output request in window to " +
                     e0.get("host", host) + e0.get("path", "")))
      if len(rows) > 2:
          em = rows[len(rows) // 2]
          chain.append(step(ev_edge(em), stage_id="Unique Schema Burst",
              stage_desc=str(len(rows)) + " session-scoped requests in the log; " +
                         str(uniq) + " distinct guided-decoding schemas of " +
                         str(total) + " structured-output bodies (cache-miss ratio " +
                         str((uniq * 100) // total) + "%)"))

      backend = ""
      if "guided_decoding_backend" in body and "outlines" in body:
          backend = " (per-request guided_decoding_backend=outlines override present)"

      scheme = "https"
      if url.find("://") > 0:
          scheme = url[:url.find("://")]
      tedge = {
          "from":     inst["id"],
          "to":       scheme + "://" + host,
          "kind":     "HTTP_REQUEST",
          "ts":       str(now),
          "first_ts": str(now),
          "last_ts":  str(now),
          "method":   meta.get("method", "POST"),
      }
      chain.append(step(tedge, stage_id="Cache Exhaustion Attempt",
          stage_desc="triggering request: unique schema " + fp + " to " + host + path + backend))

      names = []
      for x in lineage_:
          names.append(x.get("path", "?").split("/")[-1])
      who = " -> ".join(names)

      reason = ("Possible vLLM Outlines grammar-cache exhaustion: " + str(uniq) +
                " distinct guided-decoding schemas across " + str(total) +
                " structured-output requests in " + str(WINDOW_NS // 1000000000) +
                "s from session " + who + " -> " + host + path + backend +
                ". Each unique schema is a cache miss that compiles and persists a new " +
                "grammar; disk consumption itself is NOT observable in this telemetry, " +
                "so this is a precursor report, not a confirmed DoS.")
      print(reason)

      return {"action": "report", "reason": reason, "chain": chain}

  result = run()
