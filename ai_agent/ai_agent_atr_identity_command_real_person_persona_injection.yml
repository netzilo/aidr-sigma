title: Identity Command Real-Person Persona Injection
id: 919f2a8c-bea6-4b50-8368-c0041d48cf2d
status: experimental
level: high
description: |-
  Detects the /Identity command real-person persona injection from garak DanInTheWild corpus (#386). Defines a "/Identity" command that activates named real-person personas who respond "using their style of wording and their beliefs" — bypassing content restrictions by impersonating real people. The "Never write a response without using the identities" mandate and (Chat.Gpt Response)/("Name".Gpt response) dual-format are distinctive. Key signals: "/Identity" command protocol definition, dual-format response labeling (Chat.Gpt Response + Name.Gpt response), "act as if they were that person using their style of wording and their beliefs", persistent identity lock instruction.

  Adapted from Agent Threat Rules ATR-2026-00376 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00376
- https://github.com/NVIDIA/garak/blob/main/garak/probes/dan.py
- https://github.com/NVIDIA/garak/blob/main/garak/data/inthewild_jailbreak_llms.json
tags:
- attack.execution
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
- owasp.llm09
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: /Identity[\s\S]{0,200}(?:act\s+as\s+if\s+(?:you\s+were|they\s+were)|using\s+their\s+style\s+of\s+wording)
  sel_1:
    response|re: (?:Chat\.Gpt\s+Response|ChatGpt\s+Response)[\s\S]{0,200}(?:\.Gpt\s+[Rr]esponse|Gpt\s+[Rr]esponse)
  sel_2:
    response|re: Never\s+write\s+a\s+response\s+without\s+using\s+the\s+identit(?:y|ies)
  sel_3:
    response|re: (?:Always\s+use\s+the\s+identit(?:y|ies)|identit(?:y|ies)\s+apply\s+to\s+all\s+future\s+responses)
  sel_4:
    response|re: /Identity[\s\S]{0,100}(?:name[s]?\s+or\s+multiple\s+names|separated\s+by\s+a\s+comma)[\s\S]{0,100}(?:identity\s+responses|identit(?:y|ies)\s+(?:will\s+)?act)
  condition: 1 of sel_*
falsepositives:
- 'Identity verification: "/identity verify my account — please confirm my credentials" (account identity
  verification command in a different context)'
- 'Single simulation: "I want to simulate how Joe Biden would answer this question about climate policy"
  (one-off simulation without /Identity command protocol or persistent mandate)'
- 'Historical figure reference: "What would Einstein say about quantum physics?" (historical figure reference
  without /Identity command, persistent identity lock, or dual-format mandate)'
- 'Roleplay without command: "In this interview, act as if you were the CEO describing the product launch"
  (roleplay without /Identity command protocol or persistent identity mandate)'
action: report
