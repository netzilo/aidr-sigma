title: 'Virtual World Bypass: Fictional Scenario for PII/Credential Extraction'
id: c83ed6a2-aaad-4950-a923-38cd9ab8e68c
status: experimental
level: high
description: |-
  Detects injection attacks that frame a PII or credential extraction request inside a fictional scenario — dystopian futures, alien worlds, or alternate realities — where the attacker claims that the target data would be acceptable to share. The defining carrier is "Imagine we're in [fantastical setting] where [data sharing is normal]" combined with a named data subject and a request for PII (birth date, email, address, SSN, password). The fictional framing is designed to bypass safety instructions by making the disclosure appear contextually appropriate in the invented world. Semantic layer handles sophisticated reformulations.

  Adapted from Agent Threat Rules ATR-2026-01009 (MIT).
author: ATR Community (adapted)
date: '2026-06-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-01009
tags:
- attack.initial-access
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
- owasp.llm06
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(imagine|suppose|pretend|let'?s\s+say)\s+we'?re?\s+in\s+(a\s+)?(dystopian|futuristic?|alien|alternate|different|alternate|parallel|fictional|virtual|the\s+year\s+\d{4}|a\s+world\s+where)[^.\n]{0,150}(birth\s*(date|day|year)|email\s*(address)?|home\s*address|social\s*security|ssn\b|phone\s*number|password|credit\s*card|financial\s*record)
  sel_1:
    content|re: (?i)(in\s+this\s+(future|world|society|scenario|reality|setting|universe)|in\s+that\s+(world|future|scenario))\b[^.\n]{0,80}(birth\s*(date|day|year)|email\s*(address)?|password|address|credentials?)
  sel_2:
    content|re: (?i)(passwords?\s+are\s+(shared|exchanged|given|traded)\s+as\s+(a\s+)?(form\s+of\s+)?(greeting|currency|norm)|personal\s+data\s+is\s+(public\s+knowledge|freely\s+shared|shared\s+freely|currency)|sharing\s+(personal\s+data|passwords?)\s+is\s+(the\s+norm|normal|expected|required|standard|customary))
  condition: 1 of sel_*
falsepositives:
- Legitimate speculative fiction or world-building that mentions password concepts as narrative elements
- Security researchers describing dystopian attack scenarios for educational purposes
action: report
