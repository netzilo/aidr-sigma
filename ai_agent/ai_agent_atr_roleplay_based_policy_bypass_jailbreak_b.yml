title: Roleplay-Based Policy Bypass Jailbreak
id: f414da82-9116-48bd-8879-d01a1b7020fc
status: experimental
level: high
description: |-
  Detects jailbreak attempts that use creative roleplay assignments combined with explicit policy bypass language to circumvent safety guardrails. The attack pattern assigns the AI a fictional role (writer, storyteller, character) and explicitly states that the AI is "free from rules/policies" or can "write/do anything even if against policies". This technique leverages creative context to justify policy violations while maintaining plausible deniability as fictional content generation.

  Adapted from Agent Threat Rules ATR-2026-00234 (MIT).
author: ATR Community (adapted)
date: '2026-04-18'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00234
- https://arxiv.org/abs/2307.15043 - Universal and Transferable Adversarial Attacks on Aligned Language
  Models
tags:
- attack.initial-access
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: \b(?:you\s+are\s+(?:now\s+)?(?:in\s+the\s+)?role|act(?:ing)?\s+as|pretend\s+to\s+be|become\s+a|play\s+the\s+(?:part|role)\s+of|roleplay\s+as|take\s+on\s+the\s+role)\s+(?:of\s+)?(?:a\s+)?(?:rap\s+battle\s+)?(?:story\s+)?(?:writer|storyteller|author|creator|character|persona|narrator|screenwriter|playwright|novelist)
  sel_1:
    response|re: (?i)\b(?:free\s+from|freed\s+from|liberated\s+from|not\s+bound\s+by|exempt\s+from|released\s+from)\s+(?:all\s+)?(?:rules?|policies|guidelines|restrictions|constraints|limitations|guardrails|ethical\s+guidelines)
  sel_2:
    response|re: (?i)(?:write|create|generate|produce|craft|compose)\s+(?:the\s+)?(?:content|story|response|output|text|script|dialogue)\s+(?:even\s+if|regardless\s+of|despite|no\s+matter\s+if)\s+(?:it\s+)?(?:goes\s+against|violates|breaks|ignores|contradicts|bypasses)\s+(?:policies|guidelines|rules|restrictions|safety|ethics|content\s+policy)
  sel_3:
    response|re: (?i)(?:able\s+to|allowed\s+to|permitted\s+to|can|may)\s+(?:say|use|write|include|generate)\s+(?:all\s+you\s+like|anything|whatever|any\s+content|as\s+much\s+.{1,20}\s+as\s+you\s+like|unrestricted\s+content)
  sel_4:
    response|re: (?i)(?:free\s+from\s+all\s+rules\s+and\s+policies\s+of|not\s+bound\s+by\s+the\s+policies\s+of|exempt\s+from\s+.{1,30}\s+guidelines)\s+(?:OpenAI|Anthropic|Google|Microsoft|Meta|the\s+company|your\s+creators?)
  condition: 1 of sel_*
falsepositives:
- Creative writing workshops discussing fictional character development without policy bypass language
- Academic discussions about AI safety that mention policies in educational context
- Legitimate roleplay scenarios for game development without explicit constraint removal
action: report
