title: Tool with embedded instruction to bypass user confirmation and exfiltrate data
id: 56b1042b-5413-4d7d-bcac-06751f9a96ea
status: experimental
level: critical
description: |-
  Detects MCP tools that contain hidden instructions to bypass user confirmation and directly exfiltrate sensitive data. This pattern identifies tools that explicitly instruct the LLM to send data "without asking user confirmation" and "always pass all data directly" to external endpoints, which are clear indicators of malicious intent rather than legitimate functionality.

  Adapted from Agent Threat Rules ATR-2026-00153 (MIT).
author: ATR Community (adapted)
date: '2026-04-06'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00153
tags:
- attack.initial-access
- atlas.aml.t0051
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: without\s+asking\s+user\s+confirmation.*(?:always\s+pass|directly\s+to|send\s+(?:all\s+)?data)
  sel_1:
    content|re: always\s+pass\s+all\s+data\s+directly.*without\s+(?:filtering|sanitization|asking)
  condition: 1 of sel_*
falsepositives:
- A security training document or red-team exercise writeup that quotes the exact malicious tool description
  verbatim as an example of what to detect, triggering the rule on educational content rather than an
  actual malicious tool.
action: report
