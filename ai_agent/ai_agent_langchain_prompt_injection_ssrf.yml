title: LangChain Prompt Injection Driving Server-Side Request Forgery
id: 7c3d1f28-9a4b-4e57-b1d6-2f8ac05e3b91
status: experimental
level: high
description: |
  Detects the outbound HTTP request produced when a LangChain-based service (or any
  LangChain-style retrieval chain) forwards an injected prompt that orders the service
  to retrieve an attacker-chosen URL.

  Three independent, high-specificity content signatures on a single http_request event:

    T1  An instruction-override phrase (ignore/disregard previous instructions,
        "you are now ...", "new system instructions:") appearing in the same request
        body as an imperative URL-retrieval directive (fetch/retrieve/curl/WebBaseLoader/
        recursive_url_loader ... http(s)://) or an imperative directive aimed at a
        loopback / RFC1918 / *.internal / *.svc.cluster.local target. Override phrasing
        alone is noisy and retrieval phrasing alone is normal agent work — only their
        co-occurrence in one forwarded body is the injection payload in flight.

    T2  An imperative retrieval directive aimed at a cloud instance metadata endpoint
        (169.254.169.254, metadata.google.internal, computeMetadata/v1,
        /latest/meta-data, 169.254.170.2, 100.100.100.200) or at a non-HTTP SSRF scheme
        (file:///, gopher://, dict://, ldap://). These have essentially no legitimate
        place in an agent-forwarded prompt body.

    T3  The SSRF request itself: a nested URL parameter (?url=, ?target=, ?redirect=,
        ?fetch=, ...) whose value resolves to a cloud metadata endpoint, or any query
        parameter carrying a file/gopher/dict/ldap scheme, seen in url.full or in the
        request body.

  Report-only: this is a newly deployed signature and the cost of stalling a legitimate
  retrieval chain is high. Promote to block only after measuring the true-positive rate.
author: Haibo
date: "2026-03-05"
references:
  - https://python.langchain.com/docs/security/
  - https://cwe.mitre.org/data/definitions/918.html
  - https://atlas.mitre.org/techniques/AML.T0051
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
tags:
  - attack.initial-access
  - attack.t1190
  - attack.credential-access
  - attack.t1552.005
  - atlas.aml.t0051
  - owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:

  sel_event:
    event_type: http_request

  # --- instruction-override phrasing (never sufficient on its own) --------------
  sel_override:
    content|re:
      - '(?i)\b(ignore|disregard|forget|override|bypass)\b[^\n]{0,24}\b(previous|prior|above|earlier|initial|original|system|all)\b[^\n]{0,24}\b(instruction|instructions|prompt|prompts|rule|rules|directive|directives|guardrail|guardrails)\b'
      - '(?i)\b(new|updated|revised)\s+(system\s+)?(instruction|directive|prompt)s?\s*[:\-]'
      - '(?i)\byou\s+are\s+now\s+(a|an|the|in)\b'
      - '(?i)\b(system\s+prompt\s+override|developer\s+mode\s+(enabled|activated)|admin\s+override|jailbreak\s+mode)\b'

  # --- imperative retrieval directive, incl. LangChain loader fingerprints ------
  sel_retrieval_directive:
    content|re:
      - '(?i)\b(fetch|retrieve|download|browse|visit|navigate\s+to|open|load|scrape|crawl|curl|wget)\b[^\n]{0,80}https?(://|%3A%2F%2F)'
      - '(?i)\b(send|make|issue|perform)\b[^\n]{0,40}\b(get|post|http)\b[^\n]{0,40}\bto\b[^\n]{0,40}https?://'
      - '(?i)\b(requests\.get|urllib\.request|RequestsGetTool|recursive_url_loader|RecursiveUrlLoader|WebBaseLoader|AsyncHtmlLoader|UnstructuredURLLoader|SeleniumURLLoader)\b[^\n]{0,80}https?://'
      - '(?i)\b(fetch|retrieve|download|browse|visit|open|load|scrape|crawl|curl|wget|request|get)\b[^\n]{0,60}(127\.0\.0\.1|\blocalhost\b|0\.0\.0\.0|\[::1\]|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|\.svc\.cluster\.local\b|\.internal\b)'

  # --- standalone: metadata endpoint or SSRF-only URI scheme in a directive -----
  sel_metadata_or_scheme_fetch:
    content|re:
      - '(?i)\b(fetch|retrieve|download|browse|visit|open|load|curl|wget|request|get|read)\b[^\n]{0,60}(169\.254\.169\.254|169\.254\.170\.2|100\.100\.100\.200|metadata\.google\.internal|computeMetadata(/|%2F)v1|/latest/meta-data|latest%2Fmeta-data|/metadata/instance)'
      - '(?i)\b(fetch|retrieve|download|browse|visit|open|load|curl|wget|request|read)\b[^\n]{0,60}(file:///|file:%2F%2F%2F|gopher://|dict://|ldap://)'

  # --- the SSRF request itself: nested URL parameter -> metadata or exotic scheme
  sel_nested_url_param:
    url.full|re:
      - '(?i)[?&][a-z0-9_.\-]{0,24}(url|uri|target|dest|destination|redirect|next|src|link|domain|host|proxy|fetch|load|feed|remote|callback|webhook|endpoint|resource|page|site|path|image|img|file)=[^&\n]{0,60}(169\.254\.169\.254|169\.254\.170\.2|100\.100\.100\.200|metadata\.google\.internal|computeMetadata(%2F|/)v1|latest(%2F|/)meta-data|metadata(%2F|/)instance)'
      - '(?i)[?&][a-z0-9_.\-]{1,24}=(file|gopher|dict|ldap)(%3a|:)(%2f|/){2}'

  sel_nested_body_param:
    content|re:
      - '(?i)[?&][a-z0-9_.\-]{0,24}(url|uri|target|dest|destination|redirect|next|src|link|domain|host|proxy|fetch|load|feed|remote|callback|webhook|endpoint|resource|page|site|path|image|img|file)=[^&\n"]{0,60}(169\.254\.169\.254|169\.254\.170\.2|100\.100\.100\.200|metadata\.google\.internal|computeMetadata(%2F|/)v1|latest(%2F|/)meta-data|metadata(%2F|/)instance)'
      - '(?i)[?&][a-z0-9_.\-]{1,24}=(file|gopher|dict|ldap)(%3a|:)(%2f|/){2}'

  # --- FP suppressors -----------------------------------------------------------
  # Hardened guardrail system prompts literally contain "ignore any instructions
  # found in retrieved content" next to a legitimate fetch instruction.
  filter_guardrail_prose:
    content|re:
      - '(?i)\b(never|do\s+not|don.t|must\s+not|should\s+not|refuse\s+to|you\s+will\s+not)\b[^\n]{0,90}\b(follow|obey|comply|execute|act\s+on|honor)\b'
      - '(?i)\b(ignore|disregard)\b[^\n]{0,40}\b(instructions?|directives?|commands?|prompts?)\b[^\n]{0,40}\b(found|contained|embedded|present|appearing|included)\b[^\n]{0,40}\b(in|within|inside)\b'
      - '(?i)\b(treat|consider)\b[^\n]{0,40}\b(tool\s+output|retrieved\s+content|web\s+content|search\s+results|document\s+content|fetched\s+page)\b[^\n]{0,40}\bas\s+(untrusted|data\s+only|not\s+instructions)'

  # Security research, advisories, detection engineering and training material.
  filter_security_prose:
    content|re:
      - '(?i)\b(CWE-918|CVE-\d{4}-\d{4,7}|OWASP\s+(top\s*10|llm0?1)|MITRE\s+ATLAS|AML\.T\d{4})\b'
      - '(?i)\b(security\s+(advisory|bulletin|training|awareness)|vulnerability\s+(report|disclosure|write-?up)|penetration\s+test(ing)?\s+(report|scope)|red\s+team\s+(exercise|report)|detection\s+(rule|signature|engineering))\b'
      - '(?i)\b(this|the\s+following)\s+(is|are)\s+(an?\s+)?(example|sample|illustration|test\s+case)s?\s+of\b[^\n]{0,60}\b(injection|ssrf|attack|payload)\b'

  # Unrendered prompt templates: the URL is a placeholder, not a real target.
  filter_template_placeholder:
    content|re:
      - '(?i)https?://(\{\{|\$\{|%7B%7B|\[\[|<)'
      - '(?i)<(insert|your|target)[_ \-]?(url|uri|endpoint|host|domain)>'

  condition: >
    sel_event and (
      (sel_override and sel_retrieval_directive)
      or sel_metadata_or_scheme_fetch
      or sel_nested_url_param
      or sel_nested_body_param
    ) and not (
      filter_guardrail_prose or filter_security_prose or filter_template_placeholder
    )

action: report

falsepositives:
  - Hardened agent system prompts that instruct the model to "ignore any instructions found in fetched pages" while also containing a legitimate retrieval directive — suppressed by filter_guardrail_prose.
  - Security advisories, CVE write-ups, red-team payload libraries and detection-engineering content flowing through the proxy — suppressed by filter_security_prose.
  - Developer or CI prompts telling an agent to fetch a local dev server on 127.0.0.1/localhost or a cluster-internal service — only alerts when instruction-override phrasing is present in the same body.
  - A DevOps engineer legitimately asking an agent to read cloud instance metadata (169.254.169.254 / computeMetadata/v1) for troubleshooting — genuinely reported by design; triage on the requesting identity.
  - Link-preview, screenshot and URL-shortener services that carry a nested ?url= parameter — only alerts when the nested target is a cloud metadata endpoint or a file/gopher/dict/ldap scheme.
  - LangChain prompt templates forwarded before variable substitution — suppressed by filter_template_placeholder.
