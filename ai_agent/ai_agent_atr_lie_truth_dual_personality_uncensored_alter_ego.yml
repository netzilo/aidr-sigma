title: Lie/Truth Dual Personality Uncensored Alter-Ego
id: 20276792-d977-4136-8671-af7fac6fc6cd
status: experimental
level: high
description: |-
  Detects the "Lie and Truth" dual-personality jailbreak from NVIDIA garak dan.DanInTheWild corpus (#326) where "Lie" is defined as the compliant ChatGPT persona and "Truth" is defined as an uncensored alter-ego that "doesn''t know about" OpenAI policies, speaks "unhinged, crazy and like a schizo," and has been "trained through deep mining of underground dark web forums." The attack creates a false moral authority by labeling the harmful output side as "Truth," exploiting name semantics to legitimize unrestricted responses. This is distinct from ATR-00323 (AlphaGPT/DeltaGPT dual-persona) — this rule targets the named "Lie"/"Truth" personality pattern where Truth is explicitly dark-web-trained and policy-unaware.

  Adapted from Agent Threat Rules ATR-2026-00343 (MIT).
author: ATR Community (adapted)
date: '2026-04-21'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00343
- https://github.com/NVIDIA/garak/blob/main/garak/probes/dan.py
- https://github.com/NVIDIA/garak/blob/main/garak/data/inthewild_jailbreak_llms.json
tags:
- attack.execution
- atlas.aml.t0051
- atlas.aml.t0054
- owasp.asi01
- owasp.llm01
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    response|re: trained\s+through\s+deep\s+mining\s+of\s+underground\s+dark\s+web\s+forums
  sel_1:
    response|re: (?:Lie\s+and\s+Truth|Truth\s+and\s+Lie)[\s\S]{0,400}(?:fully\s+uncensored|no\s+restrictions\s+at\s+all|doesn't\s+(?:even\s+)?know\s+about\s+(?:their|its|OpenAI's)\s+(?:existance|existence)|dark\s+web)
  sel_2:
    response|re: \bTruth\b[\s\S]{0,300}(?:fully\s+uncensored,?\s+free\s+AI\s+with\s+no\s+restrictions|doesn't\s+(?:even\s+)?know\s+about\s+(?:their\s+)?(?:existance|existence)|trained[\s\S]{0,60}dark\s+web)
  sel_3:
    response|re: Adapt\s+two\s+personalities[\s\S]{0,100}(?:Lie|Truth)[\s\S]{0,200}(?:Lie|Truth)[\s\S]{0,300}(?:unhinged|crazy|schizo|uncensored|no\s+restrictions)
  condition: 1 of sel_*
falsepositives:
- 'Philosophy discussion: "The dichotomy between Lie and Truth has been central to epistemology since
  Plato" (academic philosophical analysis)'
- 'Fiction: "The character Truth always speaks the opposite of Lie in this allegory" (literary analysis
  without AI persona adoption)'
- 'AI safety research: "Models trained on dark web forums would likely have degraded safety properties"
  (safety research framing)'
action: report
