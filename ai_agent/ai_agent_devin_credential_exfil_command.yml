title: Agent Subprocess Credential Exfiltration Command Line
id: 7f3c1d92-4a6b-4c8e-9b21-5d0ea6f7c418
status: experimental
level: high
description: |
  Detects a single spawned-process command line that, on its own, constitutes the
  post-injection stage of the Devin AI exfiltration chain: an agent-spawned process
  that reads credential material (cloud/SSH/registry credential files, .env files,
  keychain/browser secret stores, secret-bearing environment variables, or inline
  key/token literals) AND, in the same command line, hands it to an outbound transfer
  primitive (curl/wget upload flags, a pipe into curl/nc/socat, scp/rsync to a remote
  user@host, or an inline HTTP POST in a python one-liner).

  Two additional self-contained branches cover the malware-staging step of the same
  narrative: a remote payload piped directly into an interpreter (bare-IP URL into a
  shell, any URL into python/perl/ruby/node/php/osascript, or a base64/openssl decode
  stage feeding a shell), and a fetch that lands a payload in a temp or hidden path in
  the same command line as a chmod +x.

  This is a strictly single-event content rule: every branch requires the credential
  source and the egress primitive (or the fetch and the exec-bit) to co-occur in one
  command line, so an ordinary credential read, an ordinary HTTP call, or an ordinary
  installer download in isolation never matches.
author: Egemen
date: "2026-03-14"
references:
  - https://atlas.mitre.org/techniques/AML.T0051
  - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
  - https://attack.mitre.org/techniques/T1552/001/
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.exfiltration
  - attack.t1041
  - attack.execution
  - attack.t1059.004
  - atlas.aml.t0051.000
  - atlas.aml.t0043.000
  - owasp.llm01
  - owasp.llm02
logsource:
  product: ai_agent
  category: agent_events
detection:

  sel_event:
    event_type: execute_process

  # ── Egress primitive that actually carries a body off the host ──────────────
  sel_exfil_transport:
    content|re:
      - '(?i:curl)\b[^\n]{0,300}\s(?:-d|-F|-T|--data|--data-raw|--data-binary|--data-urlencode|--form|--form-string|--upload-file)[\s=]'
      - '(?i:curl)\b[^\n]{0,300}\s-X\s*(?:POST|PUT|PATCH)\b'
      - '(?i:wget)\b[^\n]{0,300}\s--post-(?:file|data)[\s=]'
      - '\|\s*(?:sudo\s+)?(?:/usr/bin/|/bin/)?(?i:curl|wget|nc|ncat|netcat|socat)\b'
      - '\b(?:scp|rsync|sftp)\b[^\n]{0,200}\s[A-Za-z0-9._-]{1,64}@[A-Za-z0-9.-]{1,128}:'
      - '\b(?:requests\.(?:post|put)|urllib\.request\.urlopen|urllib2\.urlopen|http\.client\.HTTPSConnection|http\.client\.HTTPConnection)\b'

  # ── Credential / secret material named in the same command line ─────────────
  sel_sensitive_source:
    content|re:
      - '[/~]\.aws/(?:credentials|config)(?:[\s";|&)\\]|$)'
      - '[/~]\.ssh/(?:id_(?:rsa|dsa|ecdsa|ed25519)|identity)(?:[\s";|&)\\]|$)'
      - '[/~]\.gnupg/(?:secring\.gpg|private-keys-v1\.d)'
      - '[/~]\.config/gcloud/(?:application_default_credentials|credentials)\.(?:json|db)\b'
      - '[/~]\.(?:kube/config|netrc|pgpass|git-credentials|npmrc|pypirc)(?:[\s";|&)\\]|$)'
      - '[/~]\.docker/config\.json\b'
      - '[/~]\.azure/(?:accessTokens|azureProfile)\.json\b'
      - '/etc/(?:shadow|gshadow)(?:[\s";|&)\\]|$)'
      - '(?:^|[\s/~"=])\.env(?:\.(?:local|dev|development|staging|prod|production))?(?:[\s";|&)\\]|$)'
      - '-----BEGIN\s+(?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'
      - '\b(?:AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|GOOGLE_APPLICATION_CREDENTIALS|GITHUB_TOKEN|GH_TOKEN|NPM_TOKEN|OPENAI_API_KEY|ANTHROPIC_API_KEY|SLACK_(?:BOT_)?TOKEN|STRIPE_SECRET_KEY|DEVIN_API_KEY)\b'
      - '\bAKIA[0-9A-Z]{16}\b'
      - '\b(?:ghp|ghs|ghu|ghr|github_pat)_[A-Za-z0-9_]{30,}'
      - '\bsk-(?:ant-|proj-)?[A-Za-z0-9_-]{24,}'
      - '\bxox[baprs]-[A-Za-z0-9-]{10,}'
      - '(?:^|[\s;&|(])(?:printenv|env)\s*(?:\||>|$)'
      - '\bsecurity\s+(?:dump-keychain|find-generic-password|find-internet-password)\b'
      - '[/~]\.mozilla/firefox/[^\s";]{0,120}/(?:logins\.json|key4\.db)'
      - '(?:Default|Profile\s\d{1,2})/(?:Login Data|Cookies|Web Data)\b'

  # ── Malware staging: remote payload executed straight out of the fetch ──────
  sel_stager_pipe_exec:
    content|re:
      - '(?i:curl|wget)\b[^\n]{0,300}https?://(?:[0-9]{1,3}\.){3}[0-9]{1,3}[^\n]{0,300}\|\s*(?:sudo\s+)?(?:/bin/|/usr/bin/)?(?:ba|da|z|k|a|)sh\b'
      - '(?i:curl|wget)\b[^\n]{0,300}https?://[^\s|;"]{1,300}[^\n]{0,60}\|\s*(?:sudo\s+)?(?:python[23]?|perl|ruby|node|php|osascript)\b'
      - '(?i:curl|wget)\b[^\n]{0,300}\|\s*(?:base64\s+(?:-d|-D|--decode)|openssl\s+enc\s+-d)\b[^\n]{0,120}\|\s*(?:sudo\s+)?[a-z]{0,4}sh\b'

  # ── Malware staging: fetch into temp/hidden location + set exec bit ─────────
  sel_fetch_to_temp:
    content|re: '(?i:curl|wget)\b[^\n]{0,300}(?:\s-[oO]\s*|\s--output(?:-document)?[\s=])(?:/tmp/|/var/tmp/|/private/tmp/|/dev/shm/|~/\.|\./\.)[^\s;|&]{1,120}'
  sel_make_executable:
    content|re: '\bchmod\s+(?:\+x|[0-7]?7[0-7]{2})\b'

  # ── Benign-shape suppressors (non-host, non-domain, non-trust) ──────────────
  filter_help_or_doc_invocation:
    content|re:
      - '(?i:curl|wget|scp|rsync|nc|ncat|socat)\b[^\n]{0,60}\s(?:--help|--usage|--version)\b'
      - '(?:^|[\s;&|])(?:man|tldr)\s+(?:curl|wget|scp|rsync|nc|ncat|netcat|socat|chmod)\b'
  filter_placeholder_secret:
    content|re:
      - '(?i)(?:REDACTED|PLACEHOLDER|EXAMPLE_ONLY|DUMMY_(?:KEY|TOKEN|SECRET)|CHANGE_?ME|YOUR_(?:API_)?(?:KEY|TOKEN|SECRET))'
      - '\bAKIAIOSFODNN7EXAMPLE\b'
      - '(?i)\bx{4,}\b'

  condition: >
    sel_event and
    ((sel_exfil_transport and sel_sensitive_source)
     or sel_stager_pipe_exec
     or (sel_fetch_to_temp and sel_make_executable))
    and not (filter_help_or_doc_invocation or filter_placeholder_secret)

falsepositives:
  - Secret-scanning or DevSecOps tooling (trufflehog, gitleaks, detect-secrets) that reads credential files and POSTs findings to a scanner API in the same command line.
  - Credential backup or key-rotation scripts that scp/rsync an encrypted copy of ~/.ssh or ~/.aws to a managed host.
  - CI or dev bootstrap one-liners that download a CLI binary into /tmp and chmod +x it in the same command (kubectl, terraform, gh) — matches the staging branch only.
  - A developer or agent running curl -X POST against a local API from a working directory whose .env path is also named on the same command line.
  - Tutorials, README snippets, or test fixtures replayed through a shell that embed example credentials — largely suppressed by filter_placeholder_secret.
  - Authorised red-team or purple-team exfiltration exercises.

action: report
