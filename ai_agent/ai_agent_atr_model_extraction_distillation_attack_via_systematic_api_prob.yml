title: Model Extraction / Distillation Attack via Systematic API Probing
id: c0d062e5-115b-4bd7-a48a-851251cb3427
status: experimental
level: medium
description: |-
  Detects systematic attempts to extract a model's behavior by generating bulk synthetic training data or fine-tuning pairs, intended to create a functional equivalent (model distillation attack). OWASP LLM10:2025 Unbounded Consumption. MITRE ATLAS AML.CS0056 (Model Distillation Campaigns Targeting Anthropic Claude). Pattern: bulk synthetic data generation framing (200+, 500+, 1000+ examples) combined with explicit training/fine- tuning intent, model replication framing, chain-of-thought extraction at scale, or safety response enumeration for distillation. Distinguishes from legitimate small example requests (<20) or general research assistance.

  Adapted from Agent Threat Rules ATR-2026-00517 (MIT).
author: ATR Community (adapted)
date: '2026-05-12'
references:
- https://agentthreatrule.org/en/rules/ATR-2026-00517
tags:
- attack.impact
- atlas.aml.t0040
- owasp.asi01
- owasp.llm10
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_0:
    content|re: (?i)(\b(generate|create|produce|build|make|collect|gather|compile)\b.{0,120}\b([2-9]\d{2}|[1-9]\d{3,})\s*(diverse\s+|synthetic\s+)?(examples?|samples?|instances?|cases?|prompts?|questions?|pairs?|responses?|outputs?|items?|dataset|q.?a)\b.{0,200}\b(for\s+(model\s+)?(training|fine[-_]?tuning|distillation)|training\s+data|fine[-_]?tuning|to\s+(train|distill)|in\s+your\s+(exact\s+)?response\s+style|of\s+how\s+you\s+would\s+respond)|(\b(generate|create|produce)\b\s+training\s+data.{0,200}\b([2-9]\d{2}|[1-9]\d{3,})\b))
  sel_1:
    content|re: (?i)\b(fine[-_]?tune|finetun|distill|replicate|clone|copy|imitate|mimic|simulate|reproduce)\b.{0,100}\b(a\s+)?(smaller\s+)?(model|llm|language\s+model|ai|assistant|system)\b.{0,100}\b(answer|respond|reply|generate|provide|give)\b.{0,80}\b([1-9]\d{2,}|all|every|each)\s*(question|prompt|sample|example)
  sel_2:
    content|re: (?i)\b(generate|create|produce|collect|build|extract)\b.{0,80}\b(training\s+pairs?|input[-
      /]output\s+pairs?|input[\s\->]+output|question[- ]answer\s+pairs?|prompt[- ]response\s+pairs?|instruction[-
      ]following\s+pairs?|io\s+pairs?)\b.{0,200}\b(?:(?:[2-9]\d{2}|[1-9]\d{3,})\s*(?:more\s+|additional\s+|diverse\s+|synthetic\s+|unique\s+)?(?:pairs?|examples?|samples?|instances?|questions?|prompts?|responses?|items?|rows?|records?)|(?:give\s+me|generate|produce|create|collect|need|want|at\s+least|around|about|approximately|roughly|a\s+total\s+of|minimum\s+of)\s+(?:me\s+)?(?:[2-9]\d{2}|[1-9]\d{3,})|hundreds\s+of|thousands\s+of|in\s+bulk)
  sel_3:
    content|re: (?i)\b(chain[- ]of[- ]thought|cot|reasoning\s+(process|steps?|trace|chain)|thought\s+process|step[-
      ]by[- ]step\s+reasoning|internal\s+reasoning)\b.{0,120}\b(?:(?:all|every|each)\s+(?:of\s+)?(?:the\s+|these\s+)?)?[1-9]\d{2,}\s*(?:of\s+(?:the\s+|these\s+)?)?(?:\w+\s+){0,2}(examples?|problems?|questions?|prompts?|tasks?|items?)\b
  sel_4:
    content|re: (?i)\b(comprehensive|complete|full|exhaustive|all|every|all\s+possible)\s+(fine[-_]?tuning|training|distillation|extraction)\s+data\b.{0,100}\b(safety|guardrail|refusal|harmless|alignment|rlhf|constitutional|policy|guideline)\b|\b(enumerate|list|map|catalog|document)\b.{0,80}\b(refusal|refusals?|safety\s+response|decline|rejection)\s+(pattern|style|behavior)
  sel_5:
    content|re: (?i)\b(replicate|duplicate|imitate|mimic|reproduce|clone)\b.{0,60}\b(your\s+)(behavior|behaviour|response\s+style|capabilities?|output\s+style)|\b(benchmarking\s+your\s+capabilities|replicat[ei]\s+your\s+behavior|to\s+(replicate|clone|imitate)\s+the\s+(model|ai|llm|assistant))
  condition: 1 of sel_*
falsepositives:
- Small example requests (< 20 examples) for legitimate testing
- 'Multiple solution requests: ''show me 3 different ways to solve this'''
- Test case generation for a single function
- Small dataset generation (10 items) for legitimate classifier testing
- Academic research assistance with clearly non-extraction framing
- Prompt benchmarking without replication or fine-tuning intent
- FAQ / Q&A scraping and generation skills ("extract all question-answer pairs from this page", "generate
  diverse question-answer pairs about {domain}"). Layer 3 no longer counts an unrelated nearby number
  such as "(first 300 chars)" or "(100-300 words)" as a quantity of pairs.
- Agent-workflow documentation that uses the phrase "thought process" and then says "each task" or "every
  step". Layer 4 now requires an explicit count of 100+ items, not a bare determiner.
action: report
